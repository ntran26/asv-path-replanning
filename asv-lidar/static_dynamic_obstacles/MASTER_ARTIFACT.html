            { k: 'Rmax', tex: 'R_{\\max}', m: 'LiDAR maximum range', u: 'm', v: '16', g: 'Notation and conventions' }],
          example: '<p>Neighboring beams leave the sensor ' + M('\\Delta\\theta = 0.5^\\circ = 0.00873\\ \\mathrm{rad}') + ' apart, so on a surface facing the sensor their returns are ' + M('\\rho\\,\\Delta\\theta') + ' apart: ' + M(fx(sp2 * 100, 1) + '\\ \\mathrm{cm}') + ' at 2 m but ' + M(fx(sp16 * 100, 0) + '\\ \\mathrm{cm}') + ' at 16 m. A 1 m panel 10 m away is therefore covered by about ' + M('1 / (10 \\times 0.00873) \\approx ' + fx(1 / (10 * dth), 0)) + ' returns, and one 16 m away by about 7.</p>' }) +
        '<p>The noise that matters most here is not in the ranges but in the vessel\u2019s knowledge of itself. Every return is placed on the map using the estimated pose, which carries a noise of 0.03 m in position and 0.2\u00b0 in heading; the estimated surge and yaw rate carry 0.05 m/s and 1\u00b0/s. The source files give no separate range noise for the beams ' + APP.TBD('range noise') + '.</p>' +
        fig(nf[1], F.sensor(), 'The sensor\u2019s coverage, and why far objects are drawn with fewer, sparser points.', true) +
        '<h3>\u25b6 Scan viewer</h3>' + APP.widgetScanHTML() +

        H2('gate', 'Step 1: gating against the map') +
        '<p>Most returns are not interesting. The basin walls, people standing on the deck and anything beyond the water all show up in the scan, but the map already says where the water is. ' + T('gating', 'Gating') + ' throws away every return outside the known ' + T('navpoly') + ', which in the basin is the basin inset by 0.40 m, so wall returns fall outside it. What remains are the panels and the target.</p>' +
        EQ({ label: 'Method', title: 'Map gate', tex: '\\text{keep } \\mathbf{q}_j \\iff \\mathbf{q}_j \\in \\mathcal{P}_{\\mathrm{nav}}',
          words: 'a return is kept only if it lies on the water the vessel is allowed to use.',
          symbols: [{ k: 'qj', tex: '\\mathbf{q}_j', m: 'world position of the return of beam j', u: 'm', v: 'from step 3', g: gS },
            { k: 'Pnav', tex: '\\mathcal{P}_{\\mathrm{nav}}', m: 'navigable polygon: in the basin, the basin inset 0.40 m', u: '\u2014', v: '[0.4, 9.6] \u00d7 [0.4, 24.6] m', g: gS }],
          example: '<p>A wall return at ' + M('x = 9.98\\ \\mathrm{m}') + ' lies beyond the polygon edge at 9.6 m and is discarded; a panel return at ' + M('(7.5,\\ 10.7)\\ \\mathrm{m}') + ' is kept. Placing a return on the map needs the estimated pose, the same lifting as step 3.</p>' }) +
        fig(nf[2], F.gate(), 'Gating one scan, north to the right. Filled dots are kept; rings are discarded: wall returns, and anything seen on the deck.') +

        H2('segment', 'Step 2: segmentation by adaptive breakpoints') +
        '<p>The kept returns are still loose dots. ' + T('segmentation', 'Segmentation') + ' groups them into ' + T('cluster', 'clusters') + ', one per object, by walking around the scan in bearing order and asking of each pair of neighbors: are these two close enough to be the same surface? Where they are not, there is a ' + T('breakpoint') + '. The rule follows the adaptive breakpoint detector of Borges and Aldon (2004) ' + VERIFY() + ' ' + C('borges2004') + '.</p>' +
        EQ({ label: 'Method', title: 'Adaptive breakpoint', tex: '\\left\\lVert \\mathbf{q}_j - \\mathbf{q}_{j-1} \\right\\rVert \\le \\varepsilon + \\rho_j\\,\\Delta\\theta \\quad \\Rightarrow \\quad \\text{same cluster}',
          words: 'two neighboring returns belong together if they are closer than a fixed distance plus the spacing that neighboring beams have at that range; clusters with fewer than 4 points are dropped, and clusters meeting at the 0\u00b0/360\u00b0 seam are joined.',
          symbols: [{ k: 'epsBreak', tex: '\\varepsilon', m: 'base breakpoint distance (not PPO\u2019s clip range)', u: 'm', v: '0.35', g: gS },
            { k: 'rhoJ', tex: '\\rho_j', m: 'range of beam j', u: 'm', v: '2 or 16', g: gS }],
          example: '<p>The allowed gap is ' + M('0.35 + 2 \\times 0.00873 = ' + fx(0.35 + sp2, 3) + '\\ \\mathrm{m}') + ' at 2 m and ' + M('0.35 + 16 \\times 0.00873 = ' + fx(0.35 + sp16, 3) + '\\ \\mathrm{m}') + ' at 16 m. The range term grows because neighboring beams spread apart, and it grows faster on faces seen at a slant, where the spacing is ' + M('\\rho\\,\\Delta\\theta') + ' divided by the cosine of the angle of incidence. Without it, a distant angled panel would shatter into pieces too small to keep.</p>' }) +
        fig(nf[3], F.breakpoint(), 'The breakpoint test between neighboring returns.', true) +
        '<p>The threshold is a trade-off. Too small, and one object breaks into several clusters (over-segmentation), or into pieces under 4 points that are discarded. Too large, and a target passing close behind a panel joins it in one cluster (under-segmentation), which hides the target inside a static object.</p>' +
        '<h3>\u25b6 Segmentation widget</h3>' + APP.widgetSegHTML() +

        H2('egomotion', 'Step 3: placing returns on the map') +
        '<p>The vessel moves and turns between scans. To compare scans, every return has to be expressed in the fixed world frame rather than relative to the boat. This ' + T('egomotion') + ' uses the estimated pose and the sensor\u2019s position at the bow, half a hull length ahead of the reference point.</p>' +
        EQ({ label: 'Method', title: 'From range and bearing to a world point', tex: '\\begin{gathered} \\mathbf{q}_j = \\big(x_s + \\rho_j \\sin(\\hat{\\psi} + \\theta_j),\\ \\ y_s + \\rho_j \\cos(\\hat{\\psi} + \\theta_j)\\big) \\\\[4pt] x_s = \\hat{x} + \\tfrac{L}{2} \\sin\\hat{\\psi}, \\qquad y_s = \\hat{y} + \\tfrac{L}{2} \\cos\\hat{\\psi} \\end{gathered}',
          words: 'start at the sensor\u2019s estimated position and go the measured range along the compass bearing formed by the estimated heading plus the beam\u2019s angle off the bow.',
          symbols: [{ k: 'xsys', tex: 'x_s,\\ y_s', m: 'estimated sensor position, at the bow', u: 'm', v: '(5.0, 8.0) in the example', g: gS },
            { k: 'poseHat', tex: '\\hat{x},\\ \\hat{y},\\ \\hat{\\psi}', m: 'estimated position of the reference point and estimated heading', u: 'm, \u00b0', v: '\u03c8\u0302 = 10\u00b0 in the example', g: gS },
            { k: 'L', tex: 'L', m: 'length overall', u: 'm', v: '1.725', g: 'Vessel' },
            { k: 'sigPose', tex: '\\sigma_{\\mathrm{pose}}', m: 'pose noise (standard deviation): position; heading 0.2\u00b0', u: 'm', v: '0.03', g: gS }],
          example: '<p>With the sensor at ' + M('(5.0,\\ 8.0)') + ', ' + M('\\hat{\\psi} = 10^\\circ') + ' and a return at ' + M('\\rho = 5\\ \\mathrm{m}') + ', ' + M('\\theta = 30^\\circ') + ' to starboard:</p>' + MD('\\mathbf{q} = (5.0 + 5 \\sin 40^\\circ,\\ 8.0 + 5 \\cos 40^\\circ) = (' + fx(egoQ[0], 3) + ',\\ ' + fx(egoQ[1], 3) + ')') + '<p>A heading error of 0.2\u00b0 moves that point sideways by ' + M('5 \\times 0.00349 = ' + fx(5 * 0.2 * G.DEG * 100, 1) + '\\ \\mathrm{cm}') + ', and a point 16 m away by ' + fx(16 * 0.2 * G.DEG * 100, 1) + ' cm.</p>' }) +
        fig(nf[4], F.egomotion(), 'Lifting one return into the world frame, and what a heading error does to it.', true) +
        '<p>Pose error is why static objects can seem to move. With independent errors of 0.03 m and 0.2\u00b0 in two scans 0.5 s apart, a fixed point 10 m away appears to jump about ' + fx(Math.SQRT2 * Math.hypot(0.03, 10 * 0.2 * G.DEG) * 100, 1) + ' cm between them, an apparent speed of about ' + fx(Math.SQRT2 * Math.hypot(0.03, 10 * 0.2 * G.DEG) / 0.5, 2) + ' m/s. That is one reason, below, why speed alone cannot tell a panel from a slow vessel.</p>' +

        H2('associate', 'Step 4: association') +
        '<p>Each new cluster must be matched to the right ' + T('tracking', 'track') + ', the running record of an object. This is ' + T('association') + ': global nearest neighbor, done greedily ' + C('barshalom2001') + ' ' + VERIFY() + '. Every distance between a track\u2019s predicted position and a cluster is computed and sorted; going down the list, the smallest pair whose track and cluster are both still free is accepted, as long as it lies inside the ' + T('assocgate') + '.</p>' +
        EQ({ label: 'Method', title: 'Association gate', tex: 'g = \\max\\!\\left(2.5\\, U_{\\mathrm{nom}}\\, \\Delta t,\\ 0.30\\ \\mathrm{m}\\right) = 0.70\\ \\mathrm{m}, \\qquad \\text{accept } (i, j) \\text{ only if } d_{ij} \\le g',
          words: 'a cluster can only be matched to a track if it lies within 0.70 m of where the track was predicted to be, which is two and a half times the distance a vessel at cruise covers between scans.',
          symbols: [{ k: 'gGate', tex: 'g', m: 'association gate radius', u: 'm', v: '0.70', g: gT },
            { k: 'Unom', tex: 'U_{\\mathrm{nom}}', m: 'nominal speed, the cruise speed', u: 'm/s', v: '0.558', g: 'Guidance and control' },
            { k: 'dij', tex: 'd_{ij}', m: 'distance between track i\u2019s prediction and cluster j\u2019s centroid', u: 'm', v: '0.11 in the widget', g: gT }],
          example: '<p>' + M('2.5 \\times 0.558 \\times 0.5 = ' + fx(2.5 * 0.558 * 0.5, 4)) + ', larger than 0.30 m, so ' + M('g = 0.70\\ \\mathrm{m}') + '. A vessel at cruise moves 0.28 m per scan, so even a large prediction error stays inside the gate, while a panel 1 m away does not.</p>' }) +
        '<p>Bookkeeping follows. A cluster that matches no track starts a ' + T('tentative', 'tentative track') + ', confirmed once it has been hit twice; any track that goes 3 consecutive scans (1.5 s) without a match is dropped.</p>' +
        '<h3>\u25b6 Association widget</h3>' + APP.widgetAssocHTML() +

        H2('kalman', 'Step 5: the Kalman filter') +
        '<p>Centroids jump about from scan to scan, and a velocity computed from two of them would be wild. A ' + T('kalman') + ' ' + C('kalman1960') + ' does better by combining two imperfect sources of knowledge: a model of how a target moves, which predicts where it should be next, and each new measurement. Each is weighted by how uncertain it is, and the filter keeps track of that uncertainty as a ' + T('covariance') + ' matrix, which can be drawn as an uncertainty ellipse. One filter runs per track, assuming constant velocity between scans.</p>' +
        EQ({ label: 'Model', title: 'State, motion and measurement model', tex: '\\begin{gathered} \\mathbf{s}_k = \\begin{bmatrix} x \\\\ y \\\\ v_x \\\\ v_y \\end{bmatrix}, \\quad \\mathbf{F} = \\begin{bmatrix} 1 & 0 & \\Delta t & 0 \\\\ 0 & 1 & 0 & \\Delta t \\\\ 0 & 0 & 1 & 0 \\\\ 0 & 0 & 0 & 1 \\end{bmatrix}, \\quad \\mathbf{H} = \\begin{bmatrix} 1 & 0 & 0 & 0 \\\\ 0 & 1 & 0 & 0 \\end{bmatrix} \\\\[6pt] \\mathbf{Q} = \\sigma_a^{2} \\begin{bmatrix} \\Delta t^{4}/4 & 0 & \\Delta t^{3}/2 & 0 \\\\ 0 & \\Delta t^{4}/4 & 0 & \\Delta t^{3}/2 \\\\ \\Delta t^{3}/2 & 0 & \\Delta t^{2} & 0 \\\\ 0 & \\Delta t^{3}/2 & 0 & \\Delta t^{2} \\end{bmatrix}, \\qquad \\mathbf{R} = \\sigma_z^{2}\\, \\mathbf{I} \\end{gathered}',
          words: 'the track is a position and a velocity; F moves the position on by velocity times 0.5 s; H says that only the position is measured; Q allows for random accelerations the model ignores; R is the noise in each measured centroid.',
          symbols: [{ k: 'sk', tex: '\\mathbf{s}_k', m: 'track state at scan k: position and velocity', u: 'm, m/s', v: '\u2014', g: gT },
            { k: 'vxvy', tex: 'v_x,\\ v_y', m: 'estimated velocity components, east and north', u: 'm/s', v: '\u2014', g: gT },
            { k: 'Fkf', tex: '\\mathbf{F}', m: 'state transition: constant velocity over one scan', u: '\u2014', v: '\u0394t = 0.5 s', g: gT },
            { k: 'Hkf', tex: '\\mathbf{H}', m: 'measurement matrix: picks out the position', u: '\u2014', v: '\u2014', g: gT },
            { k: 'Qkf', tex: '\\mathbf{Q}', m: 'process-noise covariance (piecewise-constant white acceleration)', u: 'm\u00b2, m\u00b2/s, (m/s)\u00b2', v: 'see example', g: gT },
            { k: 'Rkf', tex: '\\mathbf{R}', m: 'measurement-noise covariance', u: 'm\u00b2', v: '0.0025 I', g: gT },
            { k: 'sigA', tex: '\\sigma_a', m: 'standard deviation of the random acceleration', u: 'm/s\u00b2', v: '0.10', g: gT },
            { k: 'sigZ', tex: '\\sigma_z', m: 'standard deviation of a measured centroid', u: 'm', v: '0.05', g: gT },
            { k: 'Ikf', tex: '\\mathbf{I}', m: 'identity matrix', u: '\u2014', v: '\u2014', g: gT }],
          example: '<p>With ' + M('\\sigma_a = 0.10\\ \\mathrm{m/s^2}') + ' and ' + M('\\Delta t = 0.5\\ \\mathrm{s}') + ' the entries of Q are ' + M('0.01 \\times 0.5^4/4 = 0.000156\\ \\mathrm{m^2}') + ', ' + M('0.01 \\times 0.5^3/2 = 0.000625\\ \\mathrm{m^2/s}') + ' and ' + M('0.01 \\times 0.5^2 = 0.0025\\ \\mathrm{(m/s)^2}') + '; R has ' + M('0.05^2 = 0.0025\\ \\mathrm{m^2}') + ' on its diagonal. A new track starts with velocity variance 0.5 (m/s)\u00b2: it could be moving at well over 1 m/s in any direction.</p>' }) +
        EQ({ label: 'Method', title: 'Predict', tex: '\\mathbf{s}_k^{-} = \\mathbf{F}\\, \\mathbf{s}_{k-1}, \\qquad \\mathbf{P}_k^{-} = \\mathbf{F}\\, \\mathbf{P}_{k-1} \\mathbf{F}^{\\top} + \\mathbf{Q}',
          words: 'move the estimate forward with its velocity, and let its uncertainty grow: the old uncertainty is carried forward and stretched by the motion, and Q adds room for unmodeled acceleration.',
          symbols: [{ k: 'sprior', tex: '\\mathbf{s}_k^{-}', m: 'predicted state before the scan-k measurement', u: 'm, m/s', v: '\u2014', g: gT },
            { k: 'Pkf', tex: '\\mathbf{P}_k', m: 'state covariance: the uncertainty of the estimate', u: 'm\u00b2, (m/s)\u00b2', v: 'see example', g: gT }],
          example: '<p>From a first measurement (position variance 0.0025 m\u00b2, velocity variance 0.5 (m/s)\u00b2), the predicted position variance half a second later is ' + M('0.0025 + 0.5^2 \\times 0.5 + 0.000156 = ' + fx(pr1.P11, 4) + '\\ \\mathrm{m^2}') + ', a standard deviation of ' + fx(Math.sqrt(pr1.P11), 2) + ' m: not knowing the velocity makes the next position uncertain by a third of a meter.</p>' }) +
        EQ({ label: 'Method', title: 'Update', tex: '\\begin{gathered} \\mathbf{K}_k = \\mathbf{P}_k^{-} \\mathbf{H}^{\\top} \\left( \\mathbf{H}\\, \\mathbf{P}_k^{-} \\mathbf{H}^{\\top} + \\mathbf{R} \\right)^{-1} \\\\[4pt] \\mathbf{s}_k = \\mathbf{s}_k^{-} + \\mathbf{K}_k \\left( \\mathbf{z}_k - \\mathbf{H}\\, \\mathbf{s}_k^{-} \\right), \\qquad \\mathbf{P}_k = \\left( \\mathbf{I} - \\mathbf{K}_k \\mathbf{H} \\right) \\mathbf{P}_k^{-} \\end{gathered}',
          words: 'compare the measured position with the predicted one, and move the estimate part of the way toward the measurement; how far depends on the gain, which is large when the prediction is uncertain and small when the measurement is; the uncertainty then shrinks.',
          symbols: [{ k: 'Kkf', tex: '\\mathbf{K}_k', m: 'Kalman gain: how strongly the measurement corrects position and velocity', u: '\u2014, 1/s', v: fx(up1.K1, 2) + ', ' + fx(up1.K2, 2) + ' (first update)', g: gT },
            { k: 'zkf', tex: '\\mathbf{z}_k', m: 'measurement: cluster centroid plus a learned offset to the hull center', u: 'm', v: '\u2014', g: gT }],
          example: '<p>At the first update the position gain is ' + M(fx(pr1.P11, 4) + ' / (' + fx(pr1.P11, 4) + ' + 0.0025) = ' + fx(up1.K1, 3)) + ': the uncertain prediction is almost ignored. The velocity gain is ' + fx(up1.K2, 2) + ' per second, so the velocity is set to nearly the measured displacement divided by 0.5 s. After about five scans the filter settles: gains ' + fx(ss.K1, 2) + ' and ' + fx(ss.K2, 2) + ' per second, position uncertainty ' + fx(sxs * 100, 1) + ' cm and velocity uncertainty ' + fx(sv, 3) + ' m/s on each axis.</p>',
          note: 'The measurement is the cluster centroid plus a learned offset to the hull center, because a cluster only shows the faces the sensor sees, so its centroid lies off the hull\u2019s middle.' }) +
        EQ({ label: 'Method', title: 'Speed and course from the velocity', tex: '\\hat{U}_{\\mathrm{TS}} = \\sqrt{v_x^{2} + v_y^{2}}, \\qquad \\hat{\\chi}_{\\mathrm{TS}} = \\operatorname{atan2}(v_x,\\ v_y)',
          words: 'the target\u2019s speed is the length of its estimated velocity, and its course is the compass direction of that velocity.',
          symbols: [{ k: 'UTShat', tex: '\\hat{U}_{\\mathrm{TS}}', m: 'estimated target speed', u: 'm/s', v: fx(Math.hypot(0.4, 0.05), 3), g: gT },
            { k: 'chiTShat', tex: '\\hat{\\chi}_{\\mathrm{TS}}', m: 'estimated target course, clockwise from north', u: '\u00b0', v: fx(chi, 1), g: gT }],
          example: '<p>For ' + M('(v_x,\\ v_y) = (-0.40,\\ 0.05)\\ \\mathrm{m/s}') + ': ' + M('\\hat{U} = \\sqrt{0.40^2 + 0.05^2} = ' + fx(Math.hypot(0.4, 0.05), 3) + '\\ \\mathrm{m/s}') + ' and ' + M('\\hat{\\chi} = \\operatorname{atan2}(-0.40,\\ 0.05) = ' + fx(chi, 1) + '^\\circ') + ': heading a little north of west.</p>' }) +
        fig(nf[5], F.kfCycle(), 'One cycle of the filter. Left: predict, measure, update. Right: the uncertainty of position and velocity on one axis is a tilted ellipse, which is why a position measurement also corrects the velocity.', true) +
        '<p>The two noise settings pull in opposite directions. A larger ' + M('\\sigma_a') + ' tells the filter the target may accelerate, so it follows changes quickly but passes on more measurement noise; a smaller one gives a smooth estimate that is slow to notice a change in speed. In the widget, switch on the speed change and compare ' + M('\\sigma_a') + ' of 0.03 and 0.5.</p>' +
        '<h3>\u25b6 Kalman filter widget</h3>' + APP.widgetKfHTML() +

        H2('motion', 'Step 6: static or moving?') +
        '<p>The tracker follows every object it sees, including the panels. Only a moving track should become the target the policy treats under the rules; a panel misread as a vessel would trigger a give-way or stand-on response to an obstacle. The obvious test, \u201cis its estimated speed above some threshold?\u201d, does not work. As the vessel passes a panel, the sensor sees different faces of it, so the centroid of its returns slides across the panel even though nothing moves. During development, a speed threshold promoted panels to \u201cvessels\u201d in 28\u201333 % of frames.</p>' +
        '<h3>\u25b6 The visible-face effect</h3>' + APP.widgetFaceHTML() +
        '<p>The study uses ' + T('freespace') + ' instead: compare a track\u2019s points now with its points 2 s (4 scans) earlier, and look for space that has changed state.</p>' +
        '<ul><li><b>Appear:</b> a current point lies where, 2 s ago, a beam passed straight through at least ' + M('\\tau_p') + ' beyond it, and no old return was within 0.30 m of it. Space that was empty is now occupied.</li>' +
        '<li><b>Vacate:</b> an old point lies where a current beam now passes through, with no current return within 0.30 m. Space that was occupied is now empty.</li></ul>' +
        '<p>A static solid can do neither, from any viewpoint: a beam aimed at a point on its surface must hit it, and a face that comes into view was hidden before, not empty. The beams within ' + M('\\tau_p') + ' to either side of the point must also pass it, so a small pose error cannot fake a pass-through.</p>' +
        fig(nf[6], F.freeGeom(), 'The two kinds of evidence, and why a static panel produces neither.', true) +
        EQ({ label: 'Method', title: 'Motion evidence', tex: '\\begin{gathered} \\tau_p = \\max\\!\\left(0.25\\ \\mathrm{m},\\ 5\\sqrt{2}\\, \\sigma_{\\mathrm{pose}}\\right) = 0.25\\ \\mathrm{m} \\\\[4pt] \\text{motion} \\iff N_{\\mathrm{app}} + N_{\\mathrm{vac}} \\ge 3 \\ \\ \\text{and} \\ \\ N_{\\mathrm{app}} + N_{\\mathrm{vac}} \\ge 0.10\\, N_{\\mathrm{cmp}} \\end{gathered}',
          words: 'a beam must have passed at least 0.25 m beyond a point to count as having seen through it; an update shows motion when at least 3 points, and at least a tenth of all points compared, appeared or vacated.',
          symbols: [{ k: 'taup', tex: '\\tau_p', m: 'pass-through margin, sized from the pose noise', u: 'm', v: '0.25', g: gM },
            { k: 'Napp', tex: 'N_{\\mathrm{app}},\\ N_{\\mathrm{vac}},\\ N_{\\mathrm{cmp}}', m: 'points that appeared, points that vacated, and all points compared (now and 2 s ago)', u: '\u2014', v: fsr.target.nA + ', ' + fsr.target.nV + ', ' + fsr.target.nC, g: gM }],
          example: '<p>' + M('5\\sqrt{2} \\times 0.03 = ' + fx(5 * Math.SQRT2 * 0.03, 3) + '\\ \\mathrm{m}') + ', below the 0.25 m floor, so ' + M('\\tau_p = 0.25\\ \\mathrm{m}') + '. In the widget\u2019s default case a target at 0.5 m/s gives ' + fsr.target.nA + ' appear and ' + fsr.target.nV + ' vacate points out of ' + fsr.target.nC + ' compared: ' + (fsr.target.nA + fsr.target.nV) + ' is at least 3 and at least ' + fx(0.1 * fsr.target.nC, 1) + ', so the update shows motion. The panel gives ' + fsr.panel.nA + ' and ' + fsr.panel.nV + ' out of ' + fsr.panel.nC + '.</p>' }) +
        '<p>One update is not a verdict. With ' + T('hysteresis') + ', a track is promoted to \u201cmoving\u201d after 2 consecutive motion updates (1 s) and demoted after 4 quiet ones (2 s). The design is deliberately biased toward under-detection, because calling a panel a vessel has rule consequences; the cost is that a very slow target may go unflagged for a while. Related ideas, free-space and ray-casting evidence in occupancy mapping and vehicle tracking, appear for example in Petrovskaya and Thrun (2009) ' + VERIFY() + ' ' + C('petrovskaya2009') + '.</p>' +
        fig(nf[7], F.hysteresis(), 'Promotion after two motion updates in a row, demotion after four quiet ones.', true) +
        '<h3>\u25b6 Free-space widget</h3>' + APP.widgetFreeHTML() +
        '<p>Static clusters then feed the LiDAR branch through sector pooling (below); the moving track feeds the target slot and the encounter module.</p>' +

        H2('encounter', 'From track to encounter') +
        '<p>The moving track\u2019s estimated position and velocity are everything the encounter module of ' + XS(2) + ' needs: the closest point of approach (' + XS(2, 'cpa') + '), the distance to the target\u2019s domain (' + XS(2, 'domain') + '), the collision risk index ' + C('waltz2023') + ' (' + XS(2, 'cri') + '), the class from the angle bands (' + XS(2, 'classes') + '), and engagement with its latch (' + XS(2, 'engage') + '). The ' + XS(2, 'widget') + ' closest-approach widget shows the geometry. What this section adds is the question of how perception errors flow into those quantities.</p>' +
        fig(nf[8], F.encounter(), 'The track feeds the encounter module, whose engagement logic is a three-state machine: idle, engaged, clearing.', true) +
        EQ({ label: 'Approximation', title: 'How velocity error becomes encounter error', tex: '\\sigma_{\\mathrm{DCPA}} \\approx \\mathrm{TCPA} \\cdot \\sigma_v, \\qquad \\sigma_c \\approx \\frac{\\sigma_v}{U_{\\mathrm{TS}}}\\ \\ \\text{(rad)}',
          words: 'an error in the estimated velocity is multiplied by the time left to the closest approach, so distant encounters have uncertain miss distances; and the slower the target, the less certain its direction, and with it the class.',
          symbols: [{ k: 'sigV', tex: '\\sigma_v', m: 'velocity uncertainty of the track, per axis (filter steady state)', u: 'm/s', v: fx(sv, 3), g: gT },
            { k: 'sigDCPA', tex: '\\sigma_{\\mathrm{DCPA}}', m: 'resulting uncertainty of the predicted miss distance', u: 'm', v: fx(20 * sv, 2) + ' at TCPA 20 s', g: gT },
            { k: 'sigC', tex: '\\sigma_c', m: 'resulting uncertainty of the heading-crossing angle', u: '\u00b0', v: fx(sv / 0.5 / G.DEG, 1) + ' at 0.5 m/s', g: gT },
            { k: 'UOS', tex: 'U_{\\mathrm{OS}},\\ U_{\\mathrm{TS}}', m: 'speeds of own ship and target', u: 'm/s', v: '0.5 (target)', g: 'Encounter geometry' }],
          example: '<p>Using the filter\u2019s own steady-state uncertainty, ' + M('\\sigma_v = ' + fx(sv, 3) + '\\ \\mathrm{m/s}') + ': at ' + M('\\mathrm{TCPA} = 20\\ \\mathrm{s}') + ' the miss distance is uncertain by about ' + fx(20 * sv, 2) + ' m, half the required 2.5 m; at 10 s, by ' + fx(10 * sv, 2) + ' m. For a target at 0.5 m/s the crossing angle is uncertain by about ' + M(fx(sv / 0.5, 3) + '\\ \\mathrm{rad} = ' + fx(sv / 0.5 / G.DEG, 1) + '^\\circ') + ', comparable to the \u00b110\u00b0 width of the head-on band. The 3\u00b0 bearing hysteresis, the two-step persistence and the latch exist to stop such noise from flipping the class.</p>',
          note: 'A first-order estimate: it treats the error as a velocity error held constant until the closest approach and uses the filter\u2019s stated noise; the visible-face shift of the centroid adds to it.' }) +

        H2('pooling', 'Sector pooling: the policy\u2019s view of static obstacles') +
        '<p>Static returns reach the policy as 27 numbers, one per ' + T('sector') + ' over \u00b1135\u00b0: 15 sectors of 6\u00b0 within 45\u00b0 of the bow, 8 of 11.25\u00b0 abeam and 4 of 22.5\u00b0 on the quarters. The aft 90\u00b0 is left to the tracker. Narrow sectors ahead give detail where the vessel is going; wider ones to the side summarize. ' + T('pooling', 'Pooling') + ' turns the ranges in a sector into one, and the way it is done matters.</p>' +
        fig(nf[9], F.sectors(), 'The 27 sectors of the LiDAR branch.') +

      const TT = runs.map(o => ({ m: o.m, T: S7.totals(o.R, w), out: o.R.outcome })), cls = m => m === st.man ? ' class="sel"' : '';
      q('[data-ro="thead"]').innerHTML = '<tr><th>Discounted sum</th>' + TT.map(o => '<th' + cls(o.m) + '>' + { comply: 'compliant', wrong: 'wrong way', slow: 'slow down', none: 'no action' }[o.m] + '</th>').join('') + '</tr>';
      q('[data-ro="tab"]').innerHTML = S7.TERMS.concat(['term']).map(kk => '<tr><td>' + TNAME[kk] + '</td>' + TT.map(o => '<td' + cls(o.m) + '>' + fx(o.T.per[kk], 1) + '</td>').join('') + '</tr>').join('') +
        '<tr class="tot"><td><b>Total</b></td>' + TT.map(o => '<td' + cls(o.m) + '><b>' + fx(o.T.total, 1) + '</b><br><span class="muted">' + o.out + '</span></td>').join('') + '</tr>';
      S7.TERMS.forEach(kk => { q('[data-ro="w-' + kk + '"]').textContent = w[kk]; });
    }
    root.querySelectorAll('[data-w]').forEach(el => on(offs, el, 'input', () => { w[el.dataset.w] = +el.value; render(); }));
    on(offs, q('[data-act="reset"]'), 'click', e => { e.preventDefault(); Object.assign(w, S7.W0); root.querySelectorAll('[data-w]').forEach(el => { el.value = S7.W0[el.dataset.w]; }); render(); });
    wireSeg(root, 'scene', v => { st.scene = v; render(); }, offs);
    wireSeg(root, 'man', v => { st.man = v; render(); }, offs);
    render();
    APP.onCleanup(() => offs.forEach(f => f()));
  };
})();

<script>

  // design rationale (from the project's development findings, as given in the brief)

    (o.xt || []).forEach(v => { s += txt(X(v), H - B + 14, fx(v, Math.abs(v) < 10 && v % 1 ? (Math.abs(v * 10) % 1 ? 2 : 1) : 0), 'lbl-s', 'middle'); });

    s += txt((W + L) / 2, H - 4, o.xl || '', 'lbl-s', 'middle');
    if (o.yl) s += txt(L - 4, 12, o.yl, 'lbl-s', 'start');
    const ly0 = o.legendY != null ? Y(o.legendY) : T + 10, lx0 = o.legendX != null ? X(o.legendX) : W - R - 120;
    (o.legend || []).forEach((lg, i) => { s += '<path d="M' + f1(lx0) + ' ' + f1(ly0 + i * 14) + 'h18" style="stroke: ' + lg.col + '" stroke-width="2.2"' + (lg.dash ? ' stroke-dasharray="' + lg.dash + '"' : '') + '/>' + txt(lx0 + 22, ly0 + 4 + i * 14, lg.lab, 'lbl-s', 'start'); });
    return s + '</svg>';
  }
  APP.plot7 = plot;

  const ctl = (id, label, min, max, step, val, unit) => '<div class="ctl-group"><label class="ctl-label" for="rx-' + id + '">' + label + '</label><input id="rx-' + id + '" data-p="' + id + '" data-u="' + (unit || '') + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"><span class="rangeval" data-ro="p-' + id + '"></span></div>';
  const chk = (id, label, val) => '<label class="check"><input type="checkbox" data-p="' + id + '"' + (val ? ' checked' : '') + '>' + label + '</label>';
  const ro2 = (label, val) => '<div class="ro"><span>' + label + '</span><span>' + val + '</span></div>';
  const qPf = (e, chi) => 0.7 * Math.exp(-4 * e * e) + 0.3 * (1 + Math.cos(chi * DEG)) / 2;
  const gU = (u, Ueff) => clip(Math.max(u, 0) / Ueff, 0, 1) * clip(1 - (u - 1.2 * UREF) / (0.5 * UREF), 0, 1);
  const E0 = r => Math.exp(-2.0 / r);

  const TABS = {
    pf: { label: 'Path following', rows: [3, 4, 15],
      ctrls: ctl('W', 'Width W<sub>loc</sub>', 3.5, 10, 0.5, 8, ' m') + ctl('ey', 'Cross-track e<sub>y</sub>', -5, 5, 0.05, 0.5, ' m') + ctl('u', 'Surge u', 0, 1, 0.01, 0.56, ' m/s') + ctl('chi', 'Course error \u03c7*', -90, 90, 1, 0, '\u00b0') +
        '<div class="ctl-group"><span class="ctl-label">Speed reference</span>' + seg('ueff', [['ref', 'U<sub>ref</sub>'], ['r2', 'R-2: 0.4 U<sub>ref</sub>'], ['r5', 'R-5: max(U<sub>TS</sub>, 0.2)']], 'ref') + '</div>',
      render(p) {
        const W = p.W, ey = clip(p.ey, -W / 2, W / 2), Ueff = p.ueff === 'r2' ? 0.4 * UREF : p.ueff === 'r5' ? 0.2 : UREF, g = gU(p.u, Ueff);
        const f = e => -(1 - g * qPf(clip(e / (W / 2), -1, 1), p.chi)), val = f(ey);
        return { plots: [
          plot({ x: [-W / 2, W / 2], y: [-1, 0.05], xt: [-W / 2, 0, W / 2], yt: [-1, -0.5, 0], xl: 'cross-track error e\u1d67 (m), across the channel', yl: 'r_pf', curves: [{ f, col: 'var(--decision)' }], marks: [{ x: ey, y: val }], label: 'Path term against cross-track error' }),
          plot({ x: [0, 1.0], y: [0, 1.05], xt: [0, 0.5, 1.0], yt: [0, 0.5, 1], xl: 'surge u (m/s)', yl: 'speed gate g_u', curves: [{ f: u => gU(u, Ueff), col: 'var(--testing)' }], vlines: [{ x: Ueff, lab: 'U_eff', left: true, ly: 0.12 }, { x: 1.2 * UREF, lab: '1.2 U_ref', ly: 0.12 }], marks: [{ x: p.u, y: g }], label: 'Speed gate against surge speed' }),
          plot({ x: [0, W / 2], y: [0, 1.05], xt: [0, W / 4, W / 2], yt: [0, 0.5, 1], xl: '|e\u1d67| (m), from the path to the wall', yl: 'shape', curves: [{ f: e => Math.exp(-4 * Math.pow(e / (W / 2), 2)), col: 'var(--decision)' }, { f: e => Math.exp(-0.05 * e), col: 'var(--ink-3)', dash: '5 4' }], legend: [{ col: 'var(--decision)', lab: 'Paper 3: exp(\u22124\u1ebd\u00b2)' }, { col: 'var(--ink-3)', lab: 'Paper 2: exp(\u22120.05 e\u1d67)', dash: '5 4' }], legendY: 0.3, legendX: 0.15 * W / 8, label: 'Path shape: Paper 3 against Paper 2' }),
        ], ro: ro2('\u1ebd = e\u1d67/(W<sub>loc</sub>/2)', fx(clip(ey / (W / 2), -1, 1), 2)) + ro2('quality q', fx(qPf(clip(ey / (W / 2), -1, 1), p.chi), 3)) + ro2('speed gate g<sub>u</sub>', fx(g, 3)) + ro2('r<sub>pf</sub>', fx(val, 3)) + ro2('weighted, \u00d73', fx(3 * val, 2)) };
      } },
    prog: { label: 'Progress', rows: [5, 15],
      ctrls: ctl('us', 'Speed along the path', -0.3, 1.0, 0.01, 0.55, ' m/s') + ctl('L', 'Path length L<sub>path</sub>', 10, 40, 1, 20, ' m') + '<div class="ctl-group">' + chk('r5', 'Carve-out R-5 active (\u03ba<sub>ex</sub> = 0)', false) + '</div>',
      render(p) {
        const f = us => clip(S7.NREF * us * K.dt / p.L, -1, 1), val = f(p.us);
        const disc = us => { if (us <= 0.01) return 0; const N = Math.ceil(p.L / (us * K.dt)), r = 1.5 * f(us); return r * (1 - Math.pow(GAM, N)) / (1 - GAM); };
        const undisc = us => us <= 0.01 ? 0 : 1.5 * (f(us) < 1 ? S7.NREF : p.L / (us * K.dt)), cap = p.L / (S7.NREF * K.dt);
        const N = p.us > 0.01 ? Math.ceil(p.L / (p.us * K.dt)) : Infinity;
        return { plots: [
          plot({ x: [-0.3, 1.0], y: [-1.05, 1.05], xt: [-0.3, 0, 0.5, 1], yt: [-1, 0, 1], xl: 'speed along the path (m/s)', yl: 'r_prog', curves: [{ f, col: 'var(--testing)' }], vlines: [{ x: cap, lab: 'cap', ly: -0.6 }], marks: [{ x: p.us, y: val }], label: 'Progress term against speed along the path' }),
          plot({ x: [0.1, 1.0], y: [0, 110], xt: [0.1, 0.5, 1.0], yt: [0, 50, 100], xl: 'speed held over the whole path (m/s)', yl: '\u03a3 progress \u00d71.5', curves: [{ f: undisc, col: 'var(--ink-3)', dash: '5 4' }, { f: disc, col: 'var(--testing)' }], marks: p.us > 0.1 ? [{ x: p.us, y: disc(p.us) }] : [], legend: [{ col: 'var(--ink-3)', lab: 'undiscounted', dash: '5 4' }, { col: 'var(--testing)', lab: 'discounted (\u03b3 = 0.951)' }], legendY: 52, legendX: 0.42, label: 'Total progress reward against speed' }),
        ], ro: ro2('r<sub>prog</sub> per step', fx(val, 3)) + ro2('weighted, \u00d71.5', fx(1.5 * val, 2)) + ro2('steps to finish', isFinite(N) ? N : 'never') + ro2('weighted \u03a3, whole path', p.us > 0.01 ? fx(undisc(p.us), 1) : '0') + ro2('the same, discounted', fx(disc(p.us), 1)) + ro2('cap speed (r<sub>prog</sub> = 1)', fx(cap, 3) + ' m/s') + ro2('existence per step', p.r5 ? '0 (R-5)' : '\u22120.25') };
      } },
    smooth: { label: 'Smoothness', rows: [14],
      ctrls: ctl('dad', '\u0394a<sub>\u03b4</sub> (rudder change)', -1, 1, 0.01, 0.15, '') + ctl('dan', '\u0394a<sub>n</sub> (throttle change)', 0, 1, 0.01, 0, '') + '<div class="ctl-group">' + chk('win', 'Within 4 steps of engagement (\u03c3<sub>t</sub> = 0.25)', false) + '</div>',
      render(p) {
        const s = p.win ? 0.25 : 1, f = d => -s * clip(Math.pow(d / 0.25, 2) + 0.5 * Math.pow(p.dan / 0.30, 2), 0, 1), val = f(p.dad);
        return { plots: [plot({ x: [-1, 1], y: [-1.05, 0.05], xt: [-1, -0.5, 0, 0.5, 1], yt: [-1, -0.5, 0], xl: 'change of the rudder command between steps', yl: 'r_smooth', curves: [{ f, col: 'var(--vessel)' }, { f: d => -clip(Math.pow(d / 0.25, 2) + 0.5 * Math.pow(p.dan / 0.30, 2), 0, 1), col: 'var(--ink-3)', dash: '4 3', w: 1.4 }], marks: [{ x: p.dad, y: val }], label: 'Smoothness term against rudder change' })],
          ro: ro2('r<sub>smooth</sub>', fx(val, 3)) + ro2('weighted, \u00d70.5', fx(0.5 * val, 3)) + ro2('saturates at |\u0394a<sub>\u03b4</sub>|', '0.25 (with no throttle change)') };
      } },
    obs: { label: 'Obstacles', rows: [6, 0],
      ctrls: ctl('dc', 'Clearance d<sub>clr</sub>', 0, 3, 0.01, 0.6, ' m') + ctl('doa', 'Decay length d<sub>oa</sub>', 0.2, 1.5, 0.05, 0.6, ' m') + ctl('cut', 'Cut-off', 1, 4, 0.1, 2.0, ' m'),
      render(p) {
        const e0 = Math.exp(-p.cut / p.doa), f = d => d >= p.cut ? 0 : -clip((Math.exp(-d / p.doa) - e0) / (1 - e0), 0, 1), un = d => -Math.exp(-d / p.doa), val = f(p.dc);
        return { plots: [plot({ x: [0, 3], y: [-1.05, 0.05], xt: [0, 1, 2, 3], yt: [-1, -0.5, 0], xl: 'hull-to-hull clearance to the nearest obstacle (m)', yl: 'r_obs', curves: [{ f, col: 'var(--panel)' }, { f: un, col: 'var(--ink-3)', dash: '5 4', w: 1.5 }], vlines: [{ x: p.cut, lab: 'cut-off' }], marks: [{ x: p.dc, y: val }], legend: [{ col: 'var(--panel)', lab: 'shifted (used)' }, { col: 'var(--ink-3)', lab: 'unshifted', dash: '5 4' }], label: 'Obstacle term against clearance' })],
          ro: ro2('r<sub>obs</sub>', fx(val, 3)) + ro2('weighted, \u00d711', fx(11 * val, 2)) + ro2('unshifted form, weighted', fx(11 * un(p.dc), 2)) + ro2('unshifted at 3 m, weighted', fx(11 * un(3), 3)) };
      } },
    bnd: { label: 'Boundary', rows: [7, 1],
      ctrls: ctl('db', 'Hull-to-boundary d<sub>bnd</sub>', 0, 1, 0.01, 0.15, ' m') + ctl('ds', 'Band d<sub>safe</sub>', 0.1, 1.0, 0.05, 0.35, ' m'),
      render(p) {
        const f = d => -Math.pow(Math.max(0, 1 - d / p.ds), 2), val = f(p.db);
        return { plots: [plot({ x: [0, 1], y: [-1.05, 0.05], xt: [0, 0.25, 0.5, 0.75, 1], yt: [-1, -0.5, 0], xl: 'distance from hull to boundary (m)', yl: 'r_bnd', curves: [{ f, col: 'var(--warn)' }], vlines: [{ x: p.ds, lab: 'd_safe' }], marks: [{ x: p.db, y: val }], label: 'Boundary term against distance' })],
          ro: ro2('r<sub>bnd</sub>', fx(val, 3)) + ro2('weighted, \u00d715', fx(15 * val, 2)) + ro2('compare: stopped on the path', '\u22123 per step') };
      } },
    dom: { label: 'Domain', rows: [0, 8],
      ctrls: ctl('al', 'Relative bearing \u03b1', 0, 359, 1, 0, '\u00b0') + ctl('dd', 'Center distance |p|', 0, 4, 0.01, 2.0, ' m'),
      render(p) {
        const R = G.Rdom(p.al), f = d => -Math.pow(Math.max(0, 1 - d / R), 2), val = f(p.dd);
        return { plots: [plot({ x: [0, 4], y: [-1.05, 0.05], xt: [0, 1, 2, 3, 4], yt: [-1, -0.5, 0], xl: 'center distance to the target (m)', yl: 'r_dom', curves: [{ f, col: 'var(--perception)' }], vlines: [{ x: R, lab: 'R_dom(\u03b1)' }], marks: [{ x: p.dd, y: val }], label: 'Domain term against distance' })],
          ro: ro2('R<sub>dom</sub>(\u03b1)', fx(R, 2) + ' m') + ro2('r<sub>dom</sub>', fx(val, 3)) + ro2('weighted, \u00d712.5', fx(12.5 * val, 2)) };
      } },
    rule: { label: 'Rule terms', rows: [8, 9, 10, 11, 12, 13, 16],
      ctrls(p) {
        const sub = p.sub || 'port', gate = ctl('rho', 'Gate \u03c1 (peak for v<sub>port</sub>)', 0, 1, 0.01, 0.8, '');
        const head2 = '<div class="ctl-group"><span class="ctl-label">Term</span>' + seg('sub', [['port', 'v<sub>port</sub>'], ['bow', 'v<sub>bow</sub>'], ['side', 'v<sub>side</sub>'], ['hold', 'v<sub>hold</sub>'], ['r8', 'v<sub>r8</sub>']], sub) + '</div>';
        if (sub === 'port') return head2 + ctl('dpsi', 'Heading turned the wrong way', 0, 60, 1, 25, '\u00b0') + gate + ctl('rr', 'Wrong-way yaw rate', 0, 10, 0.1, 0, '\u00b0/s');
        if (sub === 'bow') return head2 + ctl('dcpa', 'DCPA', 0, 3, 0.01, 1.0, ' m') + gate + ctl('bcpa', '\u03b2<sub>CPA</sub>, own ship off the target\u2019s bow', 0, 180, 1, 20, '\u00b0');
        if (sub === 'side') return head2 + ctl('ycpa', 'y<sub>CPA</sub> (+ starboard)', -3, 3, 0.01, 1.0, ' m') + gate;
        if (sub === 'hold') return head2 + ctl('du', 'Speed change |\u00fb \u2212 u<sub>e</sub>|', 0, 0.5, 0.01, 0.15, ' m/s') + gate + ctl('rdev', 'Yaw-rate deviation', 0, 5, 0.1, 0, '\u00b0/s');
        return head2 + ctl('tcpa', 'TCPA', 0, 25, 0.5, 6, ' s') + ctl('areq', 'Action required a<sub>req</sub>', 0, 1, 0.01, 0.8, '') + ctl('at', 'Action taken A<sub>t</sub>', 0, 1, 0.01, 0.2, '');
      },
      render(p) {
        const sub = p.sub || 'port', rho = p.rho == null ? 0.8 : p.rho; let o, val, wgt;
        if (sub === 'port') { wgt = 0.55; const f = d => rho * clip(Math.max((d - 5) / 20, (p.rr * DEG - 0.02) / 0.2), 0, 1); val = f(p.dpsi);

        else if (sub === 'bow') { wgt = 0.55; const sb = clip((Math.cos(p.bcpa * DEG) - Math.cos(67.5 * DEG)) / (1 - Math.cos(67.5 * DEG)), 0, 1), f = d => rho * sb * clip(1 - d / K.dreq, 0, 1); val = f(p.dcpa);

      bow: [Object.assign({}, o, { x: [0, 3], y: [0, 1.05], xt: [0, 1, 2.5], yt: [0, 0.5, 1], xl: 'DCPA (m), dead ahead of its bow, gate 1', yl: 'v_bow', curves: [{ f: d => clip(1 - d / 2.5, 0, 1), col: 'var(--target)' }] })],
      side: [Object.assign({}, o, { x: [-3, 3], y: [0, 1.05], xt: [-3, 0, 2.5], yt: [0, 0.5, 1], xl: 'y_CPA (m, + starboard), gate 1', yl: 'v_side', curves: [{ f: y => clip(y / 2.5, 0, 1), col: 'var(--target)' }] })],
      hold: [Object.assign({}, o, { x: [0, 0.5], y: [0, 3.1], xt: [0, 0.1, 0.3, 0.5], yt: [0, 1, 2, 3], xl: 'speed change (m/s), gate 1', yl: 'v_hold', curves: [{ f: du => clip(Math.pow(du / 0.1, 2), 0, 1) + clip((du - 0.1) / 0.1, 0, 2), col: 'var(--target)' }] })],
      r8: [Object.assign({}, o, { x: [0, 25], y: [0, 1.05], xt: [0, 5, 15, 25], yt: [0, 0.5, 1], xl: 'TCPA (s), a_req \u2212 A_t = 1', yl: 'v_r8', curves: [{ f: t => clip(1 - t / 15, 0, 1), col: 'var(--target)' }] })],
    };
    return '<div class="mini-plots">' + P[which].map(p => '<div class="mini-plot">' + plot(Object.assign({ label: 'Small plot of the term' }, p)) + '</div>').join('') + '</div>';
  };
})();
