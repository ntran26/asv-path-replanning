  // ---------- Figure: room against the sideways distance needed ----------
  function roomBars(rows) {
    const s = 46, w = 600, rowH = 118, h = rows.length * rowH + 8;
    let o = svgBox(w, h, 'For channels 8 and 6 meters wide: the room available on the starboard side compared with the sideways distance the pass needs.', 'max-width: 620px; margin: 0 auto');
    rows.forEach((r, i) => {
      const y = 22 + i * rowH, W = r.W, x0 = 40, X = xw => x0 + (xw - (5 - W / 2)) * s;
      const xp = 5 + 0.12 * W / 2, cx = X(xp), wallX = X(5 + W / 2), top = y + 12, bot = y + 84;
      o += FIG.text(x0, y + 2, 'Channel ' + W + ' m', 'lbl-b', 'start');
      o += FIG.text(w - 10, y + 2, r.A ? 'A = 1: the alteration fits' : 'A = 0: it does not fit', 'lbl-b', 'end');
      o += '<rect x="' + x0 + '" y="' + top + '" width="' + (W * s).toFixed(1) + '" height="' + (bot - top) + '" class="s-water"/>';
      o += '<path d="M' + x0 + ' ' + (top - 4) + 'V' + (bot + 4) + 'M' + wallX.toFixed(1) + ' ' + (top - 4) + 'V' + (bot + 4) + '" style="stroke: var(--ink-2)" stroke-width="3"/>';
      o += '<rect x="' + (wallX - K.cWall * s).toFixed(1) + '" y="' + top + '" width="' + (K.cWall * s).toFixed(1) + '" height="' + (bot - top) + '" style="fill: var(--panel-fill)" fill-opacity=".45"/>';
      o += FIG.text(wallX - K.cWall * s / 2, bot + 16, sb('c', 'wall', ' = 0.65 m'), 'lbl-s', 'middle');
      o += '<path d="M' + (cx - 0.001) + ' ' + top + 'V' + bot + '" style="stroke: var(--decision)" stroke-width="1.2" stroke-dasharray="5 4"/>';
      o += '<rect x="' + (cx - K.B / 2 * s).toFixed(1) + '" y="' + (top + 6) + '" width="' + (K.B * s).toFixed(1) + '" height="' + (bot - top - 12) + '" rx="11" class="s-own"/>';
      o += '<rect x="' + (cx + K.B / 2 * s).toFixed(1) + '" y="' + (top + 12) + '" width="' + (r.room * s).toFixed(1) + '" height="12" rx="3" style="fill: var(--decision-fill); stroke: var(--decision)"/>';
      o += FIG.text(cx + K.B / 2 * s + 6, top + 40, 'room ' + r.room.toFixed(2) + ' m', 'lbl-s', 'start');
      o += FIG.arrowS(cx, top + 54, cx + r.dy * s, top + 54, 'k-ink2 f-ink2', 7);
      o += FIG.text(cx + K.B / 2 * s + 6, top + 68, 'needed ' + r.dy.toFixed(2) + ' m', 'lbl-s', 'start');
    });
    return o + '</svg>';
  }

  // worked-example numbers, computed with the same code the widgets use
  function examples() {
    const os = { p: [0, 0], psi: 0, U: K.Uref }, ts = { p: [1, 10], psi: 180, U: K.Uref };
    const e = G.encounter(os, ts, 0);
    const vOS = G.hvec(0).map(c => c * K.Uref), vTS = G.hvec(250).map(c => c * 0.5);
    const cx = G.cpa([0, 0], vOS, [6, 7], vTS);
    const run = W => { const S = G.createSim('channel', W, 'cross_stbd'); let n = 0; while (!S.decision && !S.done && n < 3000) { S.step(0.05); n++; } return S.decision; };
    return { e, rel: { p: [6, 7], vOS, vTS, C: cx }, d8: run(8), d6: run(6) };
  }

  APP.section({
    n: 2, id: 's2', title: 'The collision regulations in brief', short: 'COLREGs in brief', subsystem: 'decision',
    learn: ['The handful of collision rules this study uses, in plain words, and how an encounter is sorted into one of five classes.',
      'How the geometry of two moving vessels becomes numbers: closest approach, ship domain, collision risk, when to act, and whether a turn still fits.'],
    build() {
      const X = examples(), e = X.e;
      const fWords = FIGN(), fRules = FIGN(), fAngles = FIGN(), fMap = FIGN(), fRel = FIGN(), fDom = FIGN(), fCri = FIGN(), fState = FIGN(), fRoom = FIGN();
      const alpha = e.alpha, R = e.Rdom;
      SYM('psip', { tex: '\\psi_p', meaning: 'path tangent: direction of the reference path at the own ship', unit: '\u00b0', group: 'Workspace and path' });
      SYM('UOS', { tex: 'U_{\\mathrm{OS}},\\ U_{\\mathrm{TS}}', meaning: 'speeds of the own ship and the target', unit: 'm/s', group: 'Encounter geometry' });
      SYM('sigma', { tex: '\\sigma', meaning: 'compliant turn sense: +1 starboard, \u22121 port, 0 hold course', unit: '\u2014', group: 'Encounter state and response' });
      SYM('latch', { tex: '\\psi_e,\\ u_e,\\ t_e', meaning: 'heading, surge speed and time latched at engagement', unit: '\u00b0, m/s, s', group: 'Encounter state and response' });
      return '' +
        H2('what', 'What the COLREGs are') +
        '<p>Roads have lanes, signs and traffic lights. Open water has none of these, so ships rely on a shared set of rules of the road: who keeps out of whose way, which way to turn, and how early to act. These are the International Regulations for Preventing Collisions at Sea (' + AB('COLREGs') + '), adopted by the ' + AB('IMO', 'International Maritime Organization') + ' in 1972 and amended since ' + C('imo1972') + '.</p>' +
        '<p>The rules were written for human mariners, in words such as \u201cearly\u201d, \u201csubstantial\u201d, \u201csafe distance\u201d and \u201cnarrow channel\u201d. Turning them into an algorithm forces choices about angles, distances and timing, and recent analyses identify those choices as a recurring source of error in collision-avoidance software ' + C(['garcia2022', 'hagen2023', 'sanchez2026']) + '. This study makes its choices explicit: it implements a subset of the rules as an adopted operating convention and judges the behavior with declared metrics, not as a legal certification (' + XS(1, 'objective') + ').</p>' +
        '<p>A little vocabulary first. In any rule-governed encounter one vessel is usually the ' + T('giveway', 'give-way vessel') + ', which must keep out of the way, and the other the ' + T('standon', 'stand-on vessel') + ', which must keep its course and speed so that the give-way vessel can predict it. The words for directions on board are shown below.</p>' +
        '<figure class="fig"><div class="frame">' + wordsFigure() + '</div><figcaption><b>' + fWords + '.</b> Directions on board. The ' + T('bow') + ' is the front, the ' + T('stern') + ' the back; ' + T('port') + ' is left and ' + T('starboard') + ' is right, looking forward. A ' + T('relbearing') + ' is measured clockwise from the bow. \u201cAbeam\u201d is level with the middle of the hull; the shaded stern arc lies more than 22.5\u00b0 ' + T('abaft', 'abaft the beam') + ', which Rule 13 uses to define overtaking. The ' + T('heading') + ' \u03c8 is where the bow points; the ' + T('course') + ' is where the vessel actually moves, which differs when the hull slips sideways.</figcaption></figure>' +

        H2('rules', 'The six rules used here') +
        '<p>The study uses selected requirements from six rules. Each card gives the rule in plain words, then how this study uses it. The rule texts are paraphrased; the authoritative wording is the convention itself ' + C('imo1972') + '.</p>' +
        '<div class="rules wide">' +
        '<div class="rule"><h3><span>Rule 8</span>Action to avoid collision</h3>' + rule8() + '<p>Act early and positively, with an alteration large enough for the other vessel to notice; a string of small changes should be avoided. The action should lead to passing at a safe distance. If necessary, a vessel shall slow down or take all way off by stopping or reversing (8(e)).</p><p class="here">Here: the reward asks for early, sufficient action and allows one large alteration without a smoothness penalty; slowing is a lawful answer when a turn does not fit.</p></div>' +
        '<div class="rule"><h3><span>Rule 9</span>Narrow channels</h3>' + rule9() + '<p>A vessel in a narrow channel keeps as near to its outer limit on the starboard side as is safe and practicable (9(a)). A vessel under 20 m long, or a sailing vessel, shall not impede a vessel that can navigate safely only within the channel (9(b)).</p><p class="here">Here: the path sits at a starboard station in channels, and 9(b) motivates the narrow-channel convention for crossings. A duty not to impede does not remove either vessel\u2019s duty to avoid collision once risk develops.</p></div>' +
        '<div class="rule"><h3><span>Rule 13</span>Overtaking</h3>' + rule13() + '<p>A vessel overtaking another keeps out of its way. A vessel is overtaking when it comes up on the other from more than 22.5\u00b0 abaft her beam.</p><p class="here">Here: the own ship passes on the target\u2019s port side when there is room; otherwise it holds astern of the slower vessel.</p></div>' +
        '<div class="rule"><h3><span>Rule 14</span>Head-on situation</h3>' + rule14() + '<p>When two power-driven vessels meet on reciprocal or nearly reciprocal courses, each alters course to starboard so that they pass port to port.</p><p class="here">Here: the head-on class, with the compliant turn to starboard.</p></div>' +
        '<div class="rule"><h3><span>Rules 15 and 16</span>Crossing; give-way vessel</h3>' + rule15() + '<p>When two power-driven vessels cross with a risk of collision, the one with the other on her own starboard side keeps out of the way and, if possible, avoids crossing ahead of her. The give-way vessel acts early and substantially to keep well clear.</p><p class="here">Here: the own ship gives way to a crossing target from either side, turning toward the target\u2019s side to pass astern, or slowing (' + XS(2, 'classes') + ').</p></div>' +
        '<div class="rule"><h3><span>Rule 17(a)(i)</span>Stand-on vessel</h3>' + rule17() + '<p>Where one of two vessels is to keep out of the way, the other keeps her course and speed.</p><p class="here">Here: when being overtaken, the own ship holds its course and speed. Active action by a stand-on vessel (Rules 17(a)(ii) and 17(b)) is out of scope.</p></div>' +
        '</div>' +
        '<p class="small muted ui"><b>' + fRules + '.</b> Schematic diagrams for the six rules, not to scale. The own ship is always drawn in the vessel color, the other vessel in the target color.</p>' +

        H2('angles', 'Two angles that describe an encounter') +
        '<p>Two angles capture where the other vessel is and which way it is going. The first says where to look; the second says how the two courses relate.</p>' +
        EQ({ label: 'Definition', title: 'Relative bearing', tex: '\\begin{gathered} \\alpha = \\left(\\beta_{\\mathrm{TS}} - \\psi\\right) \\bmod 360^\\circ \\\\[4pt] \\beta_{\\mathrm{TS}} = \\operatorname{atan2}\\!\\left(x_{\\mathrm{TS}} - x_{\\mathrm{OS}},\\ y_{\\mathrm{TS}} - y_{\\mathrm{OS}}\\right) \\end{gathered}',
          words: 'the direction of the target seen from the own ship, measured clockwise from the own bow.',
          symbols: [{ k: 'alpha', tex: '\\alpha', m: 'relative bearing of the target (0\u00b0 ahead, 90\u00b0 starboard)', u: '\u00b0', v: '45', g: 'Encounter geometry' },
            { k: 'beta', tex: '\\beta_{\\mathrm{TS}}', m: 'compass bearing of the line of sight from the own ship to the target', u: '\u00b0', v: '45', g: 'Encounter geometry' },
            { k: 'psi', tex: '\\psi', m: 'own-ship heading, clockwise from north', u: '\u00b0', v: '0', g: 'Vessel' },
            { k: 'xy', tex: 'x,\\ y', m: 'world coordinates, east and north', u: 'm', v: 'target 3 m east, 3 m north', g: 'Notation and conventions' }],
          example: '<p>A target 3 m east and 3 m north of the own ship lies on the compass bearing ' + M('\\operatorname{atan2}(3, 3) = 45^\\circ') + '. With the own ship heading north (' + M('\\psi = 0^\\circ') + '), ' + M('\\alpha = 45^\\circ') + ': ahead and to starboard, forward of the beam.</p>' }) +
        EQ({ label: 'Definition', title: 'Heading-crossing angle', tex: 'c = \\left(\\psi_{\\mathrm{TS}} - \\psi\\right) \\bmod 360^\\circ',
          words: 'how far the target\u2019s heading is turned from the own heading, clockwise; 180\u00b0 means the two vessels head in opposite directions.',
          symbols: [{ k: 'c', tex: 'c', m: 'heading-crossing angle (0\u00b0 same direction, 180\u00b0 reciprocal)', u: '\u00b0', v: '225', g: 'Encounter geometry' },
            { k: 'psiTS', tex: '\\psi_{\\mathrm{TS}}', m: 'target heading, clockwise from north', u: '\u00b0', v: '225', g: 'Encounter geometry' }],
          example: '<p>The own ship heads north (' + M('\\psi = 0^\\circ') + ') and the target heads south-west (' + M('\\psi_{\\mathrm{TS}} = 225^\\circ') + '): ' + M('c = 225^\\circ') + '. Together with ' + M('\\alpha = 45^\\circ') + ' from the previous example, this is a target crossing from starboard (next subsection).</p>' }) +
        '<figure class="fig"><div class="frame">' + anglesFigure() + '</div><figcaption><b>' + fAngles + '.</b> The two angles. \u03b1 is measured at the own ship, from its bow to the ' + T('relbearing', 'line of sight') + '; ' + T('crossingangle', 'c') + ' compares the two headings.</figcaption></figure>' +
        '<p><b>Measured from the path, not the bow.</b> For classification the formulation measures both angles from the ' + T('pathtangent') + ' ' + M('\\psi_p') + ' instead of the own heading ' + M('\\psi') + '. The reason is stability. Suppose the own ship heads north and meets a target heading south dead ahead: ' + M('\\alpha = 0^\\circ') + ', ' + M('c = 180^\\circ') + ', head-on. It alters 30\u00b0 to starboard. Measured from its new heading, the target now appears at ' + M('\\alpha \\approx 330^\\circ') + ' with ' + M('c = 150^\\circ') + ', which by the numbers is a crossing from port, and the class would flip in the middle of the maneuver. Measured from the path, nothing has changed. Two more guards keep the class steady: a 3\u00b0 ' + T('hysteresis') + ' band on the bearing limits, and ' + T('persistence', 'persistence') + ': a new class must hold for two decision steps (1 s) before it is accepted.</p>' +

        H2('classes', 'Five encounter classes') +
        '<p>With the two angles and the two speeds, every encounter falls into one of five classes, or none. The tests run in a fixed order: the near-parallel classes (overtaking and being overtaken) first, then head-on, then crossing.</p>' +
        '<figure class="fig"><div class="frame">' + APP.acMap({ id: 'acm-static', style: 'max-width: 420px; margin: 0 auto' }) + '</div><figcaption><b>' + fMap + '.</b> The classification map. Each point is one combination of relative bearing and crossing angle, both measured from the path tangent. Hatched regions need a speed difference as well: the overtaking vessel must be faster by more than ' + M('0.15\\,U_{\\mathrm{ref}} \\approx 0.084\\ \\mathrm{m/s}') + '. Where the two hatched regions overlap, the faster vessel decides the class. Everything outside the colored regions is class \u201cnone\u201d.</figcaption></figure>' +
        '<div class="tbl-wrap wide"><table><thead><tr><th>Class</th><th>Relative bearing \u03b1</th><th>Crossing angle c</th><th>Also needed</th><th>What is asked</th><th class="num">Turn sense \u03c3</th></tr></thead><tbody>' +
        '<tr><td><b>Head-on</b></td><td>\u221210\u00b0 to 10\u00b0</td><td>170\u00b0 to 190\u00b0</td><td>\u2014</td><td>Rule 14: alter to starboard, pass port to port</td><td class="num">+1</td></tr>' +
        '<tr><td><b>Crossing from starboard</b></td><td>10\u00b0 to 112.5\u00b0</td><td>190\u00b0 to 292.5\u00b0</td><td>\u2014</td><td>Rules 15 and 16: give way; turn toward the target\u2019s side and pass astern, or slow</td><td class="num">+1</td></tr>' +
        '<tr><td><b>Crossing from port</b></td><td>247.5\u00b0 to 350\u00b0</td><td>67.5\u00b0 to 170\u00b0</td><td>\u2014</td><td>Narrow-channel convention: give way here too; turn toward the target\u2019s side and pass astern, or slow</td><td class="num">\u22121 ' + VERIFY('Table 4') + '</td></tr>' +
        '<tr><td><b>Overtaking</b></td><td>Own ship within the target\u2019s stern arc, 112.5\u00b0 to 247.5\u00b0 off the target\u2019s bow</td><td>\u221267.5\u00b0 to 67.5\u00b0</td><td>' + M('U_{\\mathrm{OS}} > U_{\\mathrm{TS}} + 0.15\\,U_{\\mathrm{ref}}') + '</td><td>Rule 13: keep out of the way; pass on the target\u2019s port side if there is room, otherwise hold astern</td><td class="num">\u22121</td></tr>' +
        '<tr><td><b>Being overtaken</b></td><td>112.5\u00b0 to 247.5\u00b0 (target in the own stern arc)</td><td>\u221267.5\u00b0 to 67.5\u00b0</td><td>' + M('U_{\\mathrm{TS}} > U_{\\mathrm{OS}} + 0.15\\,U_{\\mathrm{ref}}') + '</td><td>Rule 17(a)(i): stand on, hold course and speed</td><td class="num">0</td></tr>' +
        '<tr><td><b>None</b></td><td colspan="3">Anything else</td><td>No encounter response</td><td class="num">0</td></tr>' +
        '</tbody></table></div>' +
        '<p>The last column is the ' + T('turnsense') + ' ' + M('\\sigma') + ': the direction of alteration the adopted rules ask for. It is stored with the encounter at engagement and read by the reward terms (Section 7), so there is no global rule that turning to port is bad. Overtaking <i>requires</i> a port-side pass.</p>' +
        '<h3>The narrow-channel convention</h3>' +
        '<p>In open water, Rules 15 and 17 give the two vessels in a crossing different roles: the vessel that sees the other on its starboard side gives way, and the other stands on. This study adopts a different, explicit operating convention for crossings: the own ship gives way to a crossing target from <i>either</i> side.</p>' +
        '<div class="tbl-wrap"><table><thead><tr><th>Target crossing from</th><th>Open-water roles (Rules 15 and 17)</th><th>This study (narrow-channel convention)</th></tr></thead><tbody>' +
        '<tr><td>Starboard</td><td>Own ship gives way</td><td>Own ship gives way</td></tr>' +
        '<tr><td>Port</td><td>Target gives way; own ship stands on</td><td>Own ship gives way</td></tr>' +
        '</tbody></table></div>' +
        '<p>The convention is motivated by the conditional duty in Rule 9(b), under which a small craft shall not impede a vessel that can navigate safely only within a narrow channel. It is not presented as the general open-water role assignment, nor as a consequence of vessel length alone; frameworks for Rule 9 in confined waters are discussed by ' + APP.Cn('hansen2022') + ', and the wider literature is surveyed by ' + APP.Cn('burmeister2021') + '. Among the classical comparators (Section 4), one velocity-obstacle controller uses the open-water roles and a second uses this convention, so the convention\u2019s effect can be isolated.</p>' +
        SYM('crossside', { tex: '\\alpha_p,\\ c_p', meaning: 'relative bearing and crossing angle measured from the path tangent (used for classification)', unit: '\u00b0', group: 'Encounter geometry' }) +

        H2('cpa', 'The closest point of approach') +
        '<p>Two people crossing a plaza on straight lines will, at some moment, be closest to each other. How close they get, and how soon, says most of what matters about the risk of bumping into each other. For vessels these two numbers are the distance at the closest point of approach (' + AB('DCPA') + ') and the time to it (' + AB('TCPA') + '), computed from the relative position and ' + T('relmotion', 'relative velocity') + ' as if both kept their present velocities.</p>' +
        EQ({ label: 'Paper Eq. 3', title: 'Closest point of approach', tex: '\\begin{gathered} \\mathrm{TCPA} = -\\frac{\\mathbf{p}\\cdot\\mathbf{v}}{|\\mathbf{v}|^{2}}, \\qquad \\mathrm{DCPA} = \\left|\\,\\mathbf{p} + \\mathbf{v}\\,\\mathrm{TCPA}\\,\\right| \\\\[4pt] \\mathbf{p} = \\mathbf{p}_{\\mathrm{TS}} - \\mathbf{p}_{\\mathrm{OS}}, \\qquad \\mathbf{v} = \\mathbf{v}_{\\mathrm{TS}} - \\mathbf{v}_{\\mathrm{OS}} \\end{gathered}',
          words: 'seen from the own ship, the target slides along a straight line with velocity v; TCPA is when it is nearest, and DCPA is how near it gets. If the relative speed is essentially zero (|v|\u00b2 < 10\u207b\u00b9\u00b2), DCPA is the present range and TCPA is 0.',
          symbols: [{ k: 'p', tex: '\\mathbf{p}', m: 'relative position of the target (target minus own ship)', u: 'm', v: '(1, 10)', g: 'Encounter geometry' },
            { k: 'v', tex: '\\mathbf{v}', m: 'relative velocity (target minus own ship)', u: 'm/s', v: '(0, \u22121.116)', g: 'Encounter geometry' },
            { k: 'vv', tex: '\\mathbf{v}_{\\mathrm{OS}},\\ \\mathbf{v}_{\\mathrm{TS}}', m: 'velocities of the own ship and the target', u: 'm/s', v: '(0, 0.558), (0, \u22120.558)', g: 'Encounter geometry' },
            { k: 'tcpa', tex: '\\mathrm{TCPA}', m: 'time to the closest point of approach (negative once past)', u: 's', v: fx(e.tcpa, 2), g: 'Encounter geometry' },
            { k: 'dcpa', tex: '\\mathrm{DCPA}', m: 'distance at the closest point of approach, center to center', u: 'm', v: fx(e.dcpa, 2), g: 'Encounter geometry' }],
          example: '<p>The own ship heads north at cruise speed, ' + M('\\mathbf{v}_{\\mathrm{OS}} = (0,\\ 0.558)\\ \\mathrm{m/s}') + '. A target 1 m east and 10 m north heads south at the same speed, ' + M('\\mathbf{v}_{\\mathrm{TS}} = (0, -0.558)') + '. Then ' + M('\\mathbf{p} = (1, 10)') + ', ' + M('\\mathbf{v} = (0, -1.116)') + ', ' + M('\\mathbf{p}\\cdot\\mathbf{v} = -11.16') + ' and ' + M('|\\mathbf{v}|^2 = 1.245') + ', so ' + M('\\mathrm{TCPA} = 11.16/1.245 = ' + fx(e.tcpa, 2) + '\\ \\mathrm{s}') + '. At that moment ' + M('\\mathbf{p} + \\mathbf{v}\\,\\mathrm{TCPA} = (1, 0)') + ': the target passes ' + M('\\mathrm{DCPA} = ' + fx(e.dcpa, 2) + '\\ \\mathrm{m}') + ' to starboard, center to center. With a hull 0.50 m wide, that is 0.5 m between the hulls.</p>' }) +
        '<figure class="fig"><div class="frame">' + relMotionFigure(X.rel) + '</div><figcaption><b>' + fRel + '.</b> Relative motion for a crossing target, 6 m east and 7 m north, heading 250\u00b0 at 0.5 m/s; own ship heading north at 0.558 m/s. Subtracting the own velocity from the target\u2019s gives the relative velocity; the target\u2019s relative track (dashed) passes the own ship at DCPA = ' + X.rel.C.dcpa.toFixed(2) + ' m after TCPA = ' + X.rel.C.tcpa.toFixed(1) + ' s. Arrows show 5 s of travel. To scale, 1 m grid.</figcaption></figure>' +

        H2('domain', 'Ship domain and required passing distance') +
        '<p>People keep a personal space around themselves, larger in front, where they are heading, than behind or to the side. A navigator does the same with a ' + T('domain') + ': a zone around the vessel that other vessels should stay out of. Here it is an egg-shaped ellipse around the own ship, reaching further ahead than astern.</p>' +
        EQ({ label: 'Paper Eq. 4', title: 'Domain radius in a given direction', tex: 'R_{\\mathrm{dom}}(\\alpha) = \\left[\\left(\\frac{\\cos\\alpha}{a}\\right)^{2} + \\left(\\frac{\\sin\\alpha}{b}\\right)^{2}\\right]^{-1/2}, \\qquad a = \\begin{cases} a_f & \\cos\\alpha \\ge 0 \\\\ a_a & \\cos\\alpha < 0 \\end{cases}',
          words: 'the distance from the own ship\u2019s center to the edge of its domain in the direction \u03b1: 3.14 m straight ahead, 1.57 m straight astern and 1.25 m abeam, blending smoothly in between.',
          symbols: [{ k: 'Rdom', tex: 'R_{\\mathrm{dom}}(\\alpha)', m: 'domain radius in the direction of relative bearing \u03b1', u: 'm', v: '1.642 at 45\u00b0', g: 'Encounter geometry' },
            { k: 'af', tex: 'a_f', m: 'domain semi-axis ahead', u: 'm', v: '3.14', g: 'Encounter geometry' },
            { k: 'aa', tex: 'a_a', m: 'domain semi-axis astern', u: 'm', v: '1.57', g: 'Encounter geometry' },
            { k: 'b', tex: 'b', m: 'domain semi-axis abeam', u: 'm', v: '1.25', g: 'Encounter geometry' }],
          example: '<p>At ' + M('\\alpha = 45^\\circ') + ', ' + M('\\cos\\alpha = \\sin\\alpha = 0.7071') + ' and the forward semi-axis applies: ' + M('(0.7071/3.14)^2 + (0.7071/1.25)^2') + ' ' + M('= 0.0507 + 0.3200 = 0.3707') + ', so ' + M('R_{\\mathrm{dom}} = 1/\\sqrt{0.3707} = 1.642\\ \\mathrm{m}') + '.</p>' }) +
        EQ({ label: 'Paper Eq. 5', title: 'Distance to the domain, and the required passing distance', tex: 'd_{\\mathrm{dom}} = \\max\\!\\left(0,\\ |\\mathbf{p}| - R_{\\mathrm{dom}}(\\alpha)\\right), \\qquad d_{\\mathrm{req}} = 2b = 2.5\\ \\mathrm{m}',
          words: 'how far the target\u2019s center is from the edge of the own ship\u2019s domain (zero once it is inside), and the center-to-center passing distance the study requires.',
          symbols: [{ k: 'ddom', tex: 'd_{\\mathrm{dom}}', m: 'distance from the target to the own ship\u2019s domain edge', u: 'm', v: '3.36', g: 'Encounter geometry' },
            { k: 'range', tex: '|\\mathbf{p}|', m: 'range: present distance between the centers', u: 'm', v: '5', g: 'Encounter geometry' },
            { k: 'dreq', tex: 'd_{\\mathrm{req}}', m: 'required passing distance, center to center', u: 'm', v: '2.5', g: 'Encounter geometry' }],
          example: '<p>A target 5 m away at ' + M('\\alpha = 45^\\circ') + ' is ' + M('d_{\\mathrm{dom}} = 5 - 1.642 = 3.36\\ \\mathrm{m}') + ' outside the domain. The required passing distance is twice the abeam semi-axis: ' + M('d_{\\mathrm{req}} = 2 \\times 1.25 = 2.5\\ \\mathrm{m}') + ', about five hull widths between centers.</p>' }) +
        '<figure class="fig"><div class="frame">' + domainFigure() + '</div><figcaption><b>' + fDom + '.</b> The ship domain (shaded) and the required passing distance (dashed circle), drawn to scale around the 1.725 \u00d7 0.50 m hull; 1 m grid. The source of the domain\u2019s shape is not given in the source files ' + TBD('domain source') + '.</figcaption></figure>' +

        H2('cri', 'The collision risk index') +
        '<p>DCPA and TCPA are two numbers; a single \u201chow worried should we be\u201d number between 0 and 1 is easier to use. The collision risk index (' + AB('CRI') + ') combines how close the pass will be, how soon it comes, how close the target already is, and whether the target is pointed at the own ship. The form follows ' + APP.Cn('waltz2023') + '.</p>' +
        EQ({ label: 'Paper Eq. 6', title: 'Collision risk index', tex: '\\begin{gathered} \\mathrm{CRI} = \\begin{cases} 1 & d_{\\mathrm{dom}} = 0 \\\\ \\min\\{1,\\ \\max(\\mathrm{CR}_{\\mathrm{CPA}},\\ \\mathrm{CR}_{\\mathrm{ED}})\\} & \\text{otherwise} \\end{cases} \\\\[6pt] \\mathrm{CR}_{\\mathrm{CPA}} = e^{-\\mathrm{DCPA}_{\\mathrm{dom}}/4\\,\\mathrm{m}}\\; e^{-|\\mathrm{TCPA}|/T_s}\\; f_{\\mathrm{bow}}, \\qquad \\mathrm{CR}_{\\mathrm{ED}} = e^{-d_{\\mathrm{dom}}/5\\,\\mathrm{m}} \\\\[6pt] T_s = \\begin{cases} 20\\ \\mathrm{s} & \\mathrm{TCPA} \\ge 0 \\\\ 6\\ \\mathrm{s} & \\mathrm{TCPA} < 0 \\end{cases} \\qquad f_{\\mathrm{bow}} = \\begin{cases} 1 + 0.3\\,(1 - \\varphi/45^\\circ) & \\varphi < 45^\\circ \\\\ 1 & \\text{otherwise} \\end{cases} \\end{gathered}',
          words: 'risk is 1 once the target is inside the domain; otherwise it is the larger of a closest-approach part, which falls with the predicted miss distance and with time, and a present-distance part, which falls with how far away the target is now.',
          symbols: [{ k: 'cri', tex: '\\mathrm{CRI}', m: 'collision risk index', u: '\u2014', v: fx(e.risk.value, 3), g: 'Collision risk' },
            { k: 'crcpa', tex: '\\mathrm{CR}_{\\mathrm{CPA}}', m: 'closest-approach part of the risk', u: '\u2014', v: fx(e.risk.crCPA, 3), g: 'Collision risk' },
            { k: 'cred', tex: '\\mathrm{CR}_{\\mathrm{ED}}', m: 'present-distance part of the risk', u: '\u2014', v: fx(e.risk.crED, 3), g: 'Collision risk' },
            { k: 'dcpadom', tex: '\\mathrm{DCPA}_{\\mathrm{dom}}', m: 'DCPA measured to the domain edge, ' + M('\\max(0,\\ \\mathrm{DCPA} - R_{\\mathrm{dom}}(\\alpha))'), u: 'm', v: fx(e.dcpaDom, 2), g: 'Collision risk' },
            { k: 'Ts', tex: 'T_s', m: 'time scale: 20 s before the closest approach, 6 s after', u: 's', v: '20', g: 'Collision risk' },
            { k: 'fbow', tex: 'f_{\\mathrm{bow}}', m: 'bow factor: raises risk when the own ship is near the target\u2019s bow', u: '\u2014', v: fx(e.risk.fbow, 3), g: 'Collision risk' },
            { k: 'phi', tex: '\\varphi', m: 'bearing of the own ship off the target\u2019s bow', u: '\u00b0', v: fx(e.phi, 2), g: 'Collision risk' }],
          example: '<p>Continue the head-on example of Eq. 3 (target 1 m east, 10 m north, heading south). The target lies at ' + M('\\alpha = ' + fx(alpha, 2) + '^\\circ') + ', where ' + M('R_{\\mathrm{dom}} = ' + fx(R, 3) + '\\ \\mathrm{m}') + '. Its range is ' + M('|\\mathbf{p}| = ' + fx(e.range, 2) + '\\ \\mathrm{m}') + ', so ' + M('d_{\\mathrm{dom}} = ' + fx(e.dDom, 3) + '\\ \\mathrm{m}') + ', and ' + M('\\mathrm{DCPA}_{\\mathrm{dom}} = \\max(0,\\ 1.00 - ' + fx(R, 3) + ') = 0') + '. The own ship is ' + M('\\varphi = ' + fx(e.phi, 2) + '^\\circ') + ' off the target\u2019s bow, so ' + M('f_{\\mathrm{bow}} = 1 + 0.3(1 - ' + fx(e.phi, 2) + '/45) = ' + fx(e.risk.fbow, 3)) + '. Then ' + M('\\mathrm{CR}_{\\mathrm{CPA}} = 1 \\times e^{-' + fx(e.tcpa, 3) + '/20} \\times ' + fx(e.risk.fbow, 3) + ' = ' + fx(e.risk.crCPA, 3)) + ' and ' + M('\\mathrm{CR}_{\\mathrm{ED}} = e^{-' + fx(e.dDom, 3) + '/5} = ' + fx(e.risk.crED, 3)) + ', so ' + M('\\mathrm{CRI} = ' + fx(e.risk.value, 3)) + '. The coming close pass dominates, not the present distance.</p>' }) +
        '<figure class="fig"><div class="frame">' + criPlot() + '</div><figcaption><b>' + fCri + '.</b> The closest-approach part of the risk against TCPA, for three values of ' + M('\\mathrm{DCPA}_{\\mathrm{dom}}') + ' (bow factor 1). Risk builds slowly as the closest approach nears (time scale 20 s) and fades quickly once it is past (6 s).</figcaption></figure>' +

        H2('engage', 'When to act: engagement and the latch') +
        '<p>Risk alone does not say when to start maneuvering. The formulation uses an explicit trigger, ' + T('engagement') + ': the moment at which this target becomes an encounter that needs a response.</p>' +
        EQ({ label: 'Paper Eq. 7', title: 'Engagement', tex: '\\text{engage} \\iff \\text{class} \\ne \\text{none} \\;\\wedge\\; 0 < \\mathrm{TCPA} \\le T_{\\mathrm{eng}} \\;\\wedge\\; \\mathrm{DCPA} < \\kappa_{\\mathrm{eng}}\\, d_{\\mathrm{req}}',
          words: 'an encounter engages when the target has a class, the closest approach is still ahead and at most 25 s away, and the predicted pass is closer than 3.75 m.',
          symbols: [{ k: 'Teng', tex: 'T_{\\mathrm{eng}}', m: 'engagement horizon', u: 's', v: '25', g: 'Encounter state and response' },
            { k: 'keng', tex: '\\kappa_{\\mathrm{eng}}', m: 'engagement factor on ' + M('d_{\\mathrm{req}}'), u: '\u2014', v: '1.5 (so 3.75 m)', g: 'Encounter state and response' },
            { k: 'krel', tex: '\\kappa_{\\mathrm{rel}}', m: 'clearing factor on ' + M('d_{\\mathrm{req}}'), u: '\u2014', v: '2.5 (so 6.25 m)', g: 'Encounter state and response' },
            { k: 'Nclr', tex: 'N_{\\mathrm{clr}}', m: 'consecutive clear steps needed for release', u: 'steps', v: '6 (3 s)', g: 'Encounter state and response' }],
          example: '<p>In the head-on example the class is head-on, ' + M('0 < ' + fx(e.tcpa, 2) + '\\ \\mathrm{s} \\le 25\\ \\mathrm{s}') + ' and ' + M(fx(e.dcpa, 2) + '\\ \\mathrm{m} < 1.5 \\times 2.5 = 3.75\\ \\mathrm{m}') + ': it engages. Had the target been 4 m to the east instead of 1 m, DCPA would be 4 m and it would not engage, because it already passes clear. A target on the same line 40 m away would not engage yet either, since its TCPA of about 36 s exceeds 25 s; it would engage once TCPA fell to 25 s.</p>' }) +
        '<p>At engagement the formulation ' + T('latch', 'latches') + ' the class, the crossing side, the turn sense ' + M('\\sigma') + ', and the heading ' + M('\\psi_e') + ', surge speed ' + M('u_e') + ' and time ' + M('t_e') + ' at that moment. Latching keeps the class fixed while the own ship maneuvers, and the latched heading and speed are the reference against which the reward measures how much it has altered course or slowed (Section 7).</p>' +
        '<figure class="fig wide"><div class="frame">' + stateFigure() + '</div><figcaption><b>' + fState + '.</b> The encounter state machine, evaluated every 0.5 s. \u201cClearing\u201d means the closest approach has passed, or the predicted pass has opened beyond ' + M('\\kappa_{\\mathrm{rel}}\\, d_{\\mathrm{req}} = 6.25\\ \\mathrm{m}') + '. Release needs ' + M('N_{\\mathrm{clr}} = 6') + ' consecutive steps with TCPA < 0 and the range above ' + M('d_{\\mathrm{req}}') + '.</figcaption></figure>' +

        H2('widget', '\u25b6 Closest-approach widget') +
        '<p>Drag the target, or the tip of its velocity arrow, and watch Eqs. 3 to 7 update. The own ship sits at the center heading north, which is also the path direction here, so the angles measured from the bow and from the path coincide. The widget takes one snapshot of the true states: it skips the tracker, the hysteresis and the two-step persistence.</p>' +
        APP.widgetCpaHTML() +

        H2('room', 'When the turn does not fit: room, admissibility and stopping') +
        '<p>The last piece connects the rules to the walls. Before an alteration can be judged encounter-consistent, the formulation asks three geometric questions: how much further sideways the pass needs to be, how much room there is on the compliant side, and whether stopping would let the target pass clear. These are the tests behind ' + XS(1, 'problem') + '\u2019s figure and the overview animation.</p>' +
        EQ({ label: 'Paper Eq. 8', title: 'Lateral deficit', tex: '\\Delta y_{\\mathrm{req}} = \\max\\!\\left(0,\\ d_{\\mathrm{req}} - \\mathrm{DCPA}\\right)',
          words: 'how much more sideways separation the pass needs to reach the required passing distance; zero if the target already passes wide enough.',
          symbols: [{ k: 'dyreq', tex: '\\Delta y_{\\mathrm{req}}', m: 'lateral deficit', u: 'm', v: fx(X.d8.dyReq, 2), g: 'Encounter state and response' },
            { k: 'dreq', tex: 'd_{\\mathrm{req}}', m: 'required passing distance', u: 'm', v: '2.5', g: 'Encounter geometry' },
            { k: 'dcpa', tex: '\\mathrm{DCPA}', m: 'distance at the closest point of approach, center to center', u: 'm', v: fx(X.d8.dcpa, 2), g: 'Encounter geometry' }],
          example: '<p>In the crossing of ' + XS(1, 'problem') + '\u2019s figure, the target is headed almost through the own ship: at the decision ' + M('\\mathrm{DCPA} = ' + fx(X.d8.dcpa, 2) + '\\ \\mathrm{m}') + ', so ' + M('\\Delta y_{\\mathrm{req}} = 2.5 - ' + fx(X.d8.dcpa, 2) + ' = ' + fx(X.d8.dyReq, 2) + '\\ \\mathrm{m}') + '. In a head-on meeting where both vessels already keep to their starboard stations of a 10 m channel, the pass is 1.2 m wide and ' + M('\\Delta y_{\\mathrm{req}} = 1.3\\ \\mathrm{m}') + '.</p>' }) +
        EQ({ label: 'Paper Eq. 10', title: 'Room on one side', tex: 'R_{\\mathrm{side}} = \\min_{s \\,\\in\\, \\text{passage}} d_{\\mathrm{side}}(s) \\;-\\; \\frac{B}{2} \\;-\\; c_{\\mathrm{wall}}',
          words: 'the smallest sideways distance to the map boundary on the chosen side, checked along the stretch of path the own ship covers before the closest approach, less half the beam and a wall clearance.',
          symbols: [{ k: 'Rside', tex: 'R_{\\mathrm{side}}', m: 'room on one side for a sideways move', u: 'm', v: fx(X.d8.room, 2) + ' (8 m channel)', g: 'Encounter state and response' },
            { k: 'dside', tex: 'd_{\\mathrm{side}}(s)', m: 'beam-on distance from the own ship to the map boundary, at along-path position s', u: 'm', v: '3.52', g: 'Encounter state and response' },
            { k: 'salong', tex: 's', m: 'along-path position; the passage runs from now to ' + M('s + \\max(\\mathrm{TCPA}, 0)\\,\\hat{u}'), u: 'm', v: '\u2014', g: 'Workspace and path' },
            { k: 'B', tex: 'B', m: 'hull beam', u: 'm', v: '0.50', g: 'Vessel' },
            { k: 'cwall', tex: 'c_{\\mathrm{wall}}', m: 'wall clearance kept in the room test', u: 'm', v: '0.65', g: 'Encounter state and response' }],
          example: '<p>In an 8 m channel the path sits 0.12 \u00d7 4 = 0.48 m to starboard of the centerline, so the starboard wall is 4 \u2212 0.48 = 3.52 m away from the own ship: ' + M('R_{\\mathrm{stbd}} = 3.52 - 0.25 - 0.65 = 2.62\\ \\mathrm{m}') + '. In a 6 m channel, ' + M('3 - 0.36 - 0.25 - 0.65 = 1.74\\ \\mathrm{m}') + '. Both assume channel width is measured wall to wall ' + VERIFY('no inset in channels') + '.</p>' }) +
        EQ({ label: 'Paper Eq. 11', title: 'Is the turn admissible?', tex: 'A_{\\mathrm{side}} = \\begin{cases} 1 & R_{\\mathrm{side}} - \\Delta y_{\\mathrm{req}} \\ge +0.15\\ \\mathrm{m} \\\\ 0 & R_{\\mathrm{side}} - \\Delta y_{\\mathrm{req}} \\le -0.15\\ \\mathrm{m} \\\\ \\text{unchanged} & \\text{otherwise} \\end{cases} \\qquad A = \\begin{cases} A_{\\mathrm{stbd}} & \\sigma = +1 \\\\ A_{\\mathrm{port}} & \\sigma = -1 \\\\ 1 & \\sigma = 0 \\end{cases}',
          words: 'the compliant turn is admissible when the room on that side exceeds the sideways distance needed; a 0.15 m dead band stops the answer from flickering, and the first value is simply whether the room covers the need.',
          symbols: [{ k: 'Aside', tex: 'A_{\\mathrm{side}}', m: 'admissibility of a sideways move on one side, 1 or 0', u: '\u2014', v: X.d8.A + ' (8 m), ' + X.d6.A + ' (6 m)', g: 'Encounter state and response' },
            { k: 'A', tex: 'A', m: 'turn admissible on the compliant side', u: '\u2014', v: '\u2014', g: 'Encounter state and response' },
            { k: 'sigma', tex: '\\sigma', m: 'compliant turn sense', u: '\u2014', v: '+1', g: 'Encounter state and response' }],
          example: '<p>8 m channel: ' + M(fx(X.d8.room, 2) + ' - ' + fx(X.d8.dyReq, 2) + ' = ' + fx(X.d8.room - X.d8.dyReq, 2) + '\\ \\mathrm{m} \\ge 0.15') + ', so ' + M('A = 1') + ': alter to starboard. 6 m channel: ' + M(fx(X.d6.room, 2) + ' - ' + fx(X.d6.dyReq, 2) + ' = ' + fx(X.d6.room - X.d6.dyReq, 2) + '\\ \\mathrm{m} \\le -0.15') + ', so ' + M('A = 0') + ': the alteration does not fit.</p>' }) +
        '<figure class="fig"><div class="frame">' + roomBars([{ W: 8, room: X.d8.room, dy: X.d8.dyReq, A: X.d8.A }, { W: 6, room: X.d6.room, dy: X.d6.dyReq, A: X.d6.A }]) + '</div><figcaption><b>' + fRoom + '.</b> Room on the starboard side (bar) against the sideways distance the pass needs (arrow), for the crossing of ' + XS(1, 'problem') + ', drawn to scale across each channel, with the own ship on its path (dashed). The shaded strip by the wall is the wall clearance.</figcaption></figure>' +
        EQ({ label: 'Paper Eq. 12', title: 'Would stopping clear?', tex: '\\begin{gathered} D_{\\mathrm{stop}} = \\min_{\\tau}\\ \\left|\\,\\mathbf{p}_{\\mathrm{TS}}(\\tau) - \\mathbf{p}_{b}(\\tau)\\,\\right|, \\qquad S = 1 \\iff D_{\\mathrm{stop}} \\ge d_{\\mathrm{clr}} \\\\[4pt] d_{\\mathrm{clr}} = \\frac{L}{2} + \\frac{B}{2} + 2(0.15) + d_{\\mathrm{safe}} = 1.76\\ \\mathrm{m} \\end{gathered}',
          words: 'let the target hold its course and speed while the own ship brakes along its heading; if the two centers never come closer than 1.76 m, stopping clears.',
          symbols: [{ k: 'Dstop', tex: 'D_{\\mathrm{stop}}', m: 'closest center distance while the own ship brakes and after it has stopped', u: 'm', v: fx(X.d6.stopDist, 2) + ' (6 m channel)', g: 'Encounter state and response' },
            { k: 'pb', tex: '\\mathbf{p}_b(\\tau)', m: 'own-ship position along its braking profile ' + M('s_b(\\tau)'), u: 'm', v: '\u2014', g: 'Encounter state and response' },
            { k: 'tau', tex: '\\tau', m: 'time since the start of the stop', u: 's', v: '\u2014', g: 'Encounter state and response' },
            { k: 'dclr', tex: 'd_{\\mathrm{clr}}', m: 'clearance a stop must leave', u: 'm', v: '1.76', g: 'Encounter state and response' },
            { k: 'L', tex: 'L', m: 'hull length overall', u: 'm', v: '1.725', g: 'Vessel' },
            { k: 'dsafe', tex: 'd_{\\mathrm{safe}}', m: 'safety band (the reward\u2019s boundary band)', u: 'm', v: '0.35', g: 'Encounter state and response' },
            { k: 'S', tex: 'S', m: 'stopping clears, 1 or 0', u: '\u2014', v: String(X.d6.Sstop), g: 'Encounter state and response' }],
          example: '<p>The clearance is half the hull length, half the beam, a 0.15 m hull margin on each vessel and the 0.35 m safety band: ' + M('0.8625 + 0.25 + 0.30 + 0.35 = 1.76\\ \\mathrm{m}') + '. In the 6 m channel, stopping keeps the target at least ' + M(fx(X.d6.stopDist, 2) + '\\ \\mathrm{m} \\ge 1.76\\ \\mathrm{m}') + ' away, so ' + M('S = 1') + ': with ' + M('A = 0') + ', taking way off is the encounter-consistent answer (Rule 8(e)). In a head-on meeting stopping rarely clears: the target keeps coming, and the stop merely freezes the own ship in its path.</p>',
          note: 'Two braking profiles are used. The reward\u2019s slowdown credit uses a full-astern stop, the maneuver of the runtime safety layer; the observation\u2019s \u201cslowdown clears\u201d flag uses coasting at zero propeller speed. The overview animation uses its own simplified braking.' }) +
        '<p>These tests do not choose the response for the policy. They feed its observation (the turn-admissible and slowdown-clears flags) and gate the reward terms that credit a lawful slowdown or holding astern (Section 7). Whether trained policies switch from turning to slowing where these tests say they should, as the width sweep narrows the channel, is reported in the paper.</p>';
    },
    mount(el) { APP.mountCpa(el.querySelector('#cpa-widget')); },
    takeaways: ['Six rules are used (8, 9, 13, 14, 15/16 and 17(a)(i)); encounters fall into five classes by relative bearing, crossing angle and speed, each with a compliant turn sense, and crossings follow a narrow-channel convention in which the own ship gives way from either side.',
      'The closest point of approach, the asymmetric ship domain and the collision risk index turn two moving vessels into a few numbers, and Eq. 7 decides when an encounter engages and its class is latched.',
      'Three geometric tests (sideways distance needed, room on the compliant side, and whether a stop would clear) connect the rules to the walls: where the turn no longer fits, slowing or holding astern becomes the encounter-consistent response.'],
  });
})();

</script>
<script>
/* ====== MODULE: cpa.js ====== */
/* ===================================================================
   WIDGET — ▶ Closest-approach widget (Section 2). Own ship at the
   origin heading north (= path direction). Drag the target or its
   velocity-arrow tip; everything follows Eqs. 3-7 via GEOM.encounter.
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, K = G.K;
  const V = { x0: -9, x1: 9, y0: -7, y1: 15, s: 22, pad: 8 };
  const X = x => V.pad + (x - V.x0) * V.s, Y = y => V.pad + (V.y1 - y) * V.s;
  const WPX = (V.x1 - V.x0) * V.s + 2 * V.pad, HPX = (V.y1 - V.y0) * V.s + 2 * V.pad;
  const NAME = { none: 'None', headon: 'Head-on', cross_stbd: 'Crossing from starboard', cross_port: 'Crossing from port', overtaking: 'Overtaking', overtaken: 'Being overtaken' };
  const ASK = { none: 'No encounter response', headon: 'Alter to starboard (Rule 14)', cross_stbd: 'Give way: turn toward the target\u2019s side (starboard) and pass astern, or slow', cross_port: 'Give way (convention): turn toward the target\u2019s side (port) and pass astern, or slow', overtaking: 'Pass on the target\u2019s port side, or hold astern (Rule 13)', overtaken: 'Stand on: hold course and speed (Rule 17(a)(i))' };
  const PRESETS = {
    headon: { p: [0.6, 9], psi: 180, U: 0.558 }, cross_stbd: { p: [5, 6], psi: 250, U: 0.5 }, cross_port: { p: [-5, 6], psi: 110, U: 0.5 },
    overtaking: { p: [0.4, 5], psi: 0, U: 0.28 }, overtaken: { p: [-1.2, -5], psi: 0, U: 0.9 }, none: { p: [4, 8], psi: 45, U: 0.7 },
  };
  const f = (x, n) => (x == null || !isFinite(x) ? '\u2014' : (Math.abs(x) < 5e-13 ? 0 : x).toFixed(n));
  const path = pts => pts.map((q, i) => (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ' ' + Y(q[1]).toFixed(1)).join('') + 'Z';

  APP.widgetCpaHTML = function () {
    const { M } = APP;
    const ro = (k, label) => '<div class="ro"><span>' + label + '</span><span data-ro="' + k + '">\u2014</span></div>';
    const presetBtns = Object.keys(PRESETS).map(k => '<button type="button" data-p="' + k + '" aria-pressed="false">' + (k === 'none' ? 'No encounter' : NAME[k]) + '</button>').join('');
    // static layer
    let st = '<rect x="0" y="0" width="' + WPX + '" height="' + HPX + '" style="fill: var(--water)"/>';
    for (let g = Math.ceil(V.x0); g <= V.x1; g++) st += '<path d="M' + X(g) + ' ' + Y(V.y0) + 'V' + Y(V.y1) + '" style="stroke: var(--water-2)" stroke-width="' + (g % 5 ? 0.8 : 1.6) + '"/>';
    for (let g = Math.ceil(V.y0); g <= V.y1; g++) st += '<path d="M' + X(V.x0) + ' ' + Y(g) + 'H' + X(V.x1) + '" style="stroke: var(--water-2)" stroke-width="' + (g % 5 ? 0.8 : 1.6) + '"/>';
    const wedge = (a0, a1, op) => { const R = 9.5, pts = [[0, 0]]; for (let a = a0; a <= a1 + 1e-9; a += 2.5) { const h = G.hvec(a); pts.push([R * h[0], R * h[1]]); } return '<path d="' + path(pts) + '" style="fill: var(--decision)" fill-opacity="' + op + '"/>'; };
    const bandLbl = (a, r, t) => { const h = G.hvec(a); return '<text x="' + X(r * h[0]).toFixed(1) + '" y="' + Y(r * h[1]).toFixed(1) + '" class="lbl-s" text-anchor="middle" style="fill: var(--decision)">' + t + '</text>'; };
    const ray = a => { const h = G.hvec(a); return '<path d="M' + X(0) + ' ' + Y(0) + 'L' + X(9.5 * h[0]).toFixed(1) + ' ' + Y(9.5 * h[1]).toFixed(1) + '" style="stroke: var(--decision)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="5 4"/>'; };
    st += '<g data-layer="bands">' + wedge(-10, 10, 0.16) + wedge(112.5, 247.5, 0.08) + ray(10) + ray(-10) + ray(112.5) + ray(247.5) +
      bandLbl(0, 12.6, 'head-on \u00b110\u00b0') + bandLbl(58, 8.2, 'crossing from starboard') + bandLbl(302, 8.2, 'crossing from port') + bandLbl(180, 6.2, 'stern arc') + '</g>';
    const ring = (r, dash, lbl, a) => { const h = G.hvec(a); return '<circle cx="' + X(0) + '" cy="' + Y(0) + '" r="' + (r * V.s) + '" fill="none" style="stroke: var(--ink-2)" stroke-width="1.2" stroke-dasharray="' + dash + '"/>' +
      '<text x="' + X((r + 0.15) * h[0]).toFixed(1) + '" y="' + Y((r + 0.15) * h[1]).toFixed(1) + '" class="lbl-s">' + lbl + '</text>'; };
    st += '<g data-layer="rings"><path d="' + path(FIG.domainPts([0, 0], 0, 96)) + '" style="fill: var(--decision-fill); stroke: var(--decision)" fill-opacity=".5" stroke-width="1.4"/>' +
      ring(K.dreq, '6 4', 'd<tspan dy="3.5" font-size="76%">req</tspan><tspan dy="-3.5"> = 2.5 m</tspan>', 222) + ring(K.kEng * K.dreq, '2 4', 'DCPA limit 3.75 m', 214) + '</g>';
    st += '<path d="' + path(G.hullPts([0, 0], 0)) + '" class="s-own"/>';
    st += '<text x="' + X(0.45) + '" y="' + Y(-0.9) + '" class="lbl-b">Own ship</text>';
    st += '<g aria-hidden="true">' + FIG.arrowS(WPX - 24, 44, WPX - 24, 18, 'k-ink2 f-ink2', 7) + '<text x="' + (WPX - 24) + '" y="58" class="lbl-b" text-anchor="middle">N</text></g>';
    const svg = '<svg class="cpa-svg" viewBox="0 0 ' + WPX + ' ' + HPX + '" role="group" aria-label="Closest-approach widget: own ship at the center heading north; drag the target or the tip of its velocity arrow.">' + st +
      '<g data-layer="dyn"></g>' +
      '<g class="handle" data-h="body" tabindex="0" role="button"><circle class="ring" r="17" fill="transparent" style="stroke: var(--target)" stroke-opacity=".0" stroke-width="2"/></g>' +
      '<g class="handle" data-h="tip" tabindex="0" role="button"><circle class="ring" r="9" style="fill: var(--surface); stroke: var(--target)" stroke-width="2"/></g>' +
      '</svg>';
    return '<div class="widget wide" id="cpa-widget">' +
      '<div class="w-head"><div class="w-title"><span class="play-mark" aria-hidden="true">\u25b6</span>Closest-approach widget</div><div class="w-sub">Eqs. 3 to 7, live</div></div>' +
      '<div class="w-body">' +
      '<div class="controls"><div class="ctl-group"><span class="ctl-label">Start from</span><div class="seg" role="group" data-ctl="preset">' + presetBtns + '</div></div></div>' +
      '<div class="controls"><div class="ctl-group"><label class="check"><input type="checkbox" data-opt="bands" checked>Bearing bands</label><label class="check"><input type="checkbox" data-opt="rings" checked>Domain and distances</label><label class="check"><input type="checkbox" data-opt="rel" checked>Relative track</label><label class="check"><input type="checkbox" data-opt="ghost">Positions at the closest approach</label></div></div>' +
      '<div class="cpa-layout"><div>' + svg +
      '<div class="controls" style="margin-top:.8rem">' +
      '<div class="ctl-group"><label for="cpa-uos" class="ctl-label">Own speed</label><input id="cpa-uos" type="range" min="0" max="1.116" step="0.01" value="0.558"><span class="rangeval" data-ro="uos"></span></div>' +
      '<div class="ctl-group"><label for="cpa-uts" class="ctl-label">Target speed</label><input id="cpa-uts" type="range" min="0" max="1.3" step="0.01" value="0.5"><span class="rangeval" data-ro="uts"></span></div>' +
      '<div class="ctl-group"><label for="cpa-psi" class="ctl-label">Target heading</label><input id="cpa-psi" type="range" min="0" max="359" step="1" value="180"><span class="rangeval" data-ro="psits"></span></div>' +
      '</div></div>' +
      '<div class="readout">' +
      '<div class="ro-grid" style="grid-template-columns: 1fr">' +
      '<div class="ro-h">Angles and class</div>' + ro('alpha', 'Relative bearing ' + M('\\alpha')) + ro('c', 'Crossing angle ' + M('c')) + ro('cls', 'Class') + ro('sigma', 'Turn sense ' + M('\\sigma')) +
      '<div class="ro-h">Closest approach (Eq. 3) and domain (Eqs. 4, 5)</div>' + ro('tcpa', M('\\mathrm{TCPA}')) + ro('dcpa', M('\\mathrm{DCPA}')) + ro('range', 'Range ' + M('|\\mathbf{p}|')) + ro('rdom', M('R_{\\mathrm{dom}}(\\alpha)')) + ro('ddom', M('d_{\\mathrm{dom}}')) + ro('dcpadom', M('\\mathrm{DCPA}_{\\mathrm{dom}}')) +
      '<div class="ro-h">Risk (Eq. 6)</div>' + ro('cri', M('\\mathrm{CRI}')) + ro('crcpa', M('\\mathrm{CR}_{\\mathrm{CPA}}')) + ro('cred', M('\\mathrm{CR}_{\\mathrm{ED}}')) + ro('fbow', M('f_{\\mathrm{bow}}') + ' (' + M('\\varphi') + ')') +

      '</div></div></div>' +
      '<div class="w-foot"><p>Drag the target to move it; drag the round handle at its arrow tip to change its heading and speed. With a handle focused, the arrow keys move the target (hold Shift for larger steps) or turn and speed it up. Arrows show 5 s of travel; grid lines every 1 m, heavier every 5 m.</p><p>The target hull is drawn with the own ship\u2019s dimensions. One snapshot of true states: no tracker, no hysteresis, no two-step persistence.</p></div>' +
      '</div>';
  };

  APP.mountCpa = function (root) {
    const q = s => root.querySelector(s), qa = s => Array.from(root.querySelectorAll(s));
    const svg = q('svg.cpa-svg'), dyn = q('[data-layer="dyn"]'), hb = q('[data-h="body"]'), ht = q('[data-h="tip"]');
    const st = Object.assign({ p: [0.6, 9], psi: 180, U: 0.558, Uos: 0.558, bands: true, rings: true, rel: true, ghost: false, preset: 'headon' }, {});
    const ro = k => q('[data-ro="' + k + '"]');

    let pending = false;

    function world(e) {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const l = pt.matrixTransform(svg.getScreenCTM().inverse());

    const clampP = p => [Math.max(V.x0 + 0.6, Math.min(V.x1 - 0.6, p[0])), Math.max(V.y0 + 0.6, Math.min(V.y1 - 0.6, p[1]))];

      pending = false;

        const v = e.vrel, n = Math.hypot(v[0], v[1]), u = [v[0] / n, v[1] / n];
        const a = [st.p[0] - u[0] * 30, st.p[1] - u[1] * 30], b = [st.p[0] + u[0] * 30, st.p[1] + u[1] * 30];
        const cpaPt = [st.p[0] + v[0] * e.tcpa, st.p[1] + v[1] * e.tcpa];
        d += '<path d="M' + X(a[0]).toFixed(1) + ' ' + Y(a[1]).toFixed(1) + 'L' + X(b[0]).toFixed(1) + ' ' + Y(b[1]).toFixed(1) + '" style="stroke: var(--target)" stroke-width="1.3" stroke-dasharray="6 4" stroke-opacity=".8"/>';
        d += '<path d="M' + X(0) + ' ' + Y(0) + 'L' + X(cpaPt[0]).toFixed(1) + ' ' + Y(cpaPt[1]).toFixed(1) + '" style="stroke: var(--decision)" stroke-width="2.4"/>';
        d += '<circle cx="' + X(cpaPt[0]).toFixed(1) + '" cy="' + Y(cpaPt[1]).toFixed(1) + '" r="4.5" class="f-dec"/>';

        d += '<path d="' + path(G.hullPts(po, 0)) + '" class="s-own" opacity=".35"/><path d="' + path(G.hullPts(pt, st.psi)) + '" class="s-tgt" opacity=".35"/>';
        d += '<path d="M' + X(po[0]).toFixed(1) + ' ' + Y(po[1]).toFixed(1) + 'L' + X(pt[0]).toFixed(1) + ' ' + Y(pt[1]).toFixed(1) + '" style="stroke: var(--ink-2)" stroke-width="1.2" stroke-dasharray="3 3"/>';
      }
      d += FIG.arrowS(X(0), Y(0), X(vO[0] * 5), Y(vO[1] * 5), 's-ves f-ves', 8);
      d += '<path d="' + path(G.hullPts(st.p, st.psi)) + '" class="s-tgt"/>';
      const tip = [st.p[0] + vT[0] * 5, st.p[1] + vT[1] * 5];
      d += FIG.arrowS(X(st.p[0]), Y(st.p[1]), X(tip[0]), Y(tip[1]), 's-trg f-trg', 8);
      d += '<text x="' + (X(st.p[0]) + 14).toFixed(1) + '" y="' + (Y(st.p[1]) + 22).toFixed(1) + '" class="lbl-b" style="fill: var(--target)">Target</text>';
      dyn.innerHTML = d;
      hb.setAttribute('transform', 'translate(' + X(st.p[0]).toFixed(1) + ' ' + Y(st.p[1]).toFixed(1) + ')');
      const tipDraw = st.U < 0.02 ? [st.p[0] + 0.9 * G.hvec(st.psi)[0], st.p[1] + 0.9 * G.hvec(st.psi)[1]] : tip;
      ht.setAttribute('transform', 'translate(' + X(tipDraw[0]).toFixed(1) + ' ' + Y(tipDraw[1]).toFixed(1) + ')');
      hb.setAttribute('aria-label', 'Target position ' + f(st.p[0], 1) + ' m east, ' + f(st.p[1], 1) + ' m north. Arrow keys move it.');
      ht.setAttribute('aria-label', 'Target heading ' + Math.round(st.psi) + ' degrees, speed ' + f(st.U, 2) + ' meters per second. Left and right turn, up and down change speed.');
      q('[data-layer="bands"]').style.display = st.bands ? '' : 'none';
      q('[data-layer="rings"]').style.display = st.rings ? '' : 'none';
      // readouts
      ro('alpha').textContent = f(e.alpha, 1) + '\u00b0';
      ro('c').textContent = f(e.c, 1) + '\u00b0';
      ro('cls').innerHTML = '<b style="color: var(--decision)">' + NAME[e.cls] + '</b>';
      ro('sigma').textContent = e.sigma > 0 ? '+1 (starboard)' : e.sigma < 0 ? '\u22121 (port)' : '0 (hold)';
      ro('tcpa').textContent = f(e.tcpa, 2) + '\u2009s';
      ro('dcpa').textContent = f(e.dcpa, 2) + '\u2009m';
      ro('range').textContent = f(e.range, 2) + '\u2009m';
      ro('rdom').textContent = f(e.Rdom, 3) + '\u2009m';
      ro('ddom').textContent = f(e.dDom, 2) + '\u2009m';
      ro('dcpadom').textContent = f(e.dcpaDom, 2) + '\u2009m';
      ro('cri').textContent = f(e.risk.value, 3) + (e.dDom <= 0 ? ' (inside the domain)' : '');
      ro('crcpa').textContent = f(e.risk.crCPA, 3);
      ro('cred').textContent = f(e.risk.crED, 3);
      ro('fbow').textContent = f(e.risk.fbow, 3) + ' (' + f(e.phi, 1) + '\u00b0)';
      ro('e1').innerHTML = pill(e.cond.cls); ro('e2').innerHTML = pill(e.cond.tcpa); ro('e3').innerHTML = pill(e.cond.dcpa); ro('eng').innerHTML = pill(e.engage);
      ro('ask').textContent = ASK[e.cls];
      ro('map').innerHTML = APP.acMap({ id: 'acm-mini', size: 200, small: true, marker: [e.alpha, e.c], active: e.cls === 'none' ? null : e.cls, label: 'Classification map with the current encounter marked' });
      ro('uos').textContent = f(st.Uos, 2) + '\u2009m/s'; ro('uts').textContent = f(st.U, 2) + '\u2009m/s'; ro('psits').textContent = Math.round(st.psi) + '\u00b0';
      q('#cpa-uos').value = st.Uos; q('#cpa-uts').value = st.U; q('#cpa-psi').value = Math.round(st.psi) % 360;
      qa('[data-ctl="preset"] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === st.preset)));
    }
    const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(render); } };
    const touched = () => { st.preset = null; };

    // dragging
    const handlers = [];
    const on = (el, ev, fn, o) => { el.addEventListener(ev, fn, o); handlers.push([el, ev, fn, o]); };
    let drag = null;
    [[hb, 'body'], [ht, 'tip']].forEach(([el, kind]) => {
      on(el, 'pointerdown', e => {
        e.preventDefault(); el.setPointerCapture(e.pointerId); el.focus({ preventScroll: true });
        const w = world(e); drag = { kind, off: kind === 'body' ? [st.p[0] - w[0], st.p[1] - w[1]] : [0, 0], id: e.pointerId };
      });
      on(el, 'pointermove', e => {
        if (!drag || drag.id !== e.pointerId) return;
        const w = world(e);
        if (drag.kind === 'body') st.p = clampP([w[0] + drag.off[0], w[1] + drag.off[1]]);
        else {
          const dv = [(w[0] - st.p[0]) / 5, (w[1] - st.p[1]) / 5], U = Math.hypot(dv[0], dv[1]);
          st.U = Math.min(1.3, U < 0.02 ? 0 : U);
          if (U >= 0.02) st.psi = G.bearing(dv[0], dv[1]);
        }
        touched(); schedule();
      });
      const end = e => { if (drag && drag.id === e.pointerId) drag = null; };
      on(el, 'pointerup', end); on(el, 'pointercancel', end);
      on(el, 'keydown', e => {
        const big = e.shiftKey, k = e.key;
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) return;
        e.preventDefault();
        if (kind === 'body') {
          const d = big ? 0.5 : 0.1;
          const dx = k === 'ArrowLeft' ? -d : k === 'ArrowRight' ? d : 0, dy = k === 'ArrowUp' ? d : k === 'ArrowDown' ? -d : 0;
          st.p = clampP([st.p[0] + dx, st.p[1] + dy]);
        } else {
          if (k === 'ArrowLeft') st.psi = G.wrap360(st.psi - (big ? 15 : 5));
          if (k === 'ArrowRight') st.psi = G.wrap360(st.psi + (big ? 15 : 5));
          if (k === 'ArrowUp') st.U = Math.min(1.3, st.U + 0.05);
          if (k === 'ArrowDown') st.U = Math.max(0, st.U - 0.05);
        }
        touched(); schedule();
      });
      on(el, 'focus', () => { const r = el.querySelector('.ring'); if (kind === 'body') r.setAttribute('stroke-opacity', '1'); });
      on(el, 'blur', () => { const r = el.querySelector('.ring'); if (kind === 'body') r.setAttribute('stroke-opacity', '0'); });
    });
    on(q('#cpa-uos'), 'input', e => { st.Uos = +e.target.value; touched(); schedule(); });
    on(q('#cpa-uts'), 'input', e => { st.U = +e.target.value; touched(); schedule(); });
    on(q('#cpa-psi'), 'input', e => { st.psi = +e.target.value; touched(); schedule(); });
    qa('[data-opt]').forEach(c => on(c, 'change', () => { st[c.dataset.opt] = c.checked; schedule(); }));
    qa('[data-ctl="preset"] button').forEach(b => on(b, 'click', () => {
      const p = PRESETS[b.dataset.p]; st.p = p.p.slice(); st.psi = p.psi; st.U = p.U; st.Uos = K.Uref; st.preset = b.dataset.p; schedule();
    }));
    render();
    APP.onCleanup(() => handlers.forEach(([el, ev, fn, o]) => el.removeEventListener(ev, fn, o)));
  };
})();
