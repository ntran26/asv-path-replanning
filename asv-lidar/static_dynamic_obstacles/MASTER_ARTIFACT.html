    for (let W = 3; W <= 10.5; W += 0.5) s += '<path d="M' + f1(X(W)) + ' ' + y + 'v5" style="stroke: var(--ink-3)"/>' + (W % 1 === 0 ? txt(X(W), y + 18, W + ' m', 'lbl-s') : '');
    const lab = (W, top, a, b) => '<path d="M' + f1(X(W)) + ' ' + (top + 18) + 'V' + (y + 4) + '" style="stroke: var(--decision)" stroke-width="2"/>' +
      txt(X(W) + 6, top, a, 'lbl-b', 'start', ' style="fill: var(--decision)"') + txt(X(W) + 6, top + 13, b, 'lbl-s', 'start');
    s += lab(3.80, 20, 'W = 3.80 m', 'below it, the head-on alteration does not fit');
    s += lab(4.26, 60, 'W = 4.26 m', 'below it, overtaking does not');
    s += lab(7.60, 60, 'W = 7.60 m', 'below it, crossing does not');
    [10, 8, 7, 6, 5, 4.5, 4, 3.5].forEach(W => { s += '<circle cx="' + f1(X(W)) + '" cy="' + (y + 34) + '" r="5" style="fill: var(--testing)"/>'; });
    s += txt(X(6.75), y + 58, 'planned width sweep: 10, 8, 7, 6, 5, 4.5, 4 and 3.5 m', 'lbl-s');
    return s + '</svg>';
  };
})();

</script>
<script>
/* ====== MODULE: sec8.js ====== */
/* ===================================================================
   SECTION 8 — Scenarios, curriculum and data sets
   (facts §6, the curriculum brief; baseline-v3)
   =================================================================== */
(function () {
  'use strict';
  const { M, T, AB, C, FIGN, H2, EQ, VERIFY, TBD, XS } = APP;
  const G = window.GEOM, K = G.K, S8 = window.SIM8, F = APP.F8, U = S8.U;
  const fx = (x, n) => (Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n);
  const fig = (n, svg, cap, wide) => '<figure class="fig' + (wide ? ' wide' : '') + '"><div class="frame' + (wide ? ' scroll-sm' : '') + '">' + svg + '</div>' + (wide ? '<span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span>' : '') + '<figcaption><b>' + n + '.</b> ' + cap + '</figcaption></figure>';
  const tbl = (head, rows, cls) => '<div class="tbl-wrap' + (cls ? ' ' + cls : '') + '"><table class="cmp"><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  const gS = 'Scenario generation', gF = 'Feasibility and solvability', gD = 'Curriculum and data sets';

  APP.section({
    n: 8, id: 's8', title: 'Scenarios, curriculum and data sets', short: 'Scenarios, curriculum and data sets', subsystem: 'testing',
    learn: ['How every episode is generated from a seed, from the workspace to an encounter solved backward, and how each draw is checked before it is used.',
      'How training is staged in seven steps, and how the training, validation and test sets are kept apart so that choosing and testing policies never share an episode.'],
    build() {
      const nf = Array.from({ length: 9 }, () => FIGN());
      // worked numbers
      const legA = [3.0, 2], legB = [6.5, 22], psiEx = Math.atan2(3.5, 20) * 180 / Math.PI, lenEx = Math.hypot(3.5, 20);
      const wsH = S8.makeWS('basin'), eH = { cls: 'headon', c: 180, k: 1.0, T0: 15, d0: 0.8, side: -1, s0: 0 }, RH = S8.checks(wsH, eH);
      const dcf0 = S8.dcf(0, 0, 1.7, -1), dcf30a = S8.dcf(0, 30, 1.5, -1), dcf30b = S8.dcf(0, 30, 1.5, 1);
      const g14 = 0.4 * 14 * U;
      const wsL = S8.makeWS('basin', { start: legA, goal: legB }), midL = S8.pathPt(wsL, wsL.len / 2), stL = G.stbd(wsL.psiP), segL = G.polySegs(wsL.nav, 'nav');
      const clrS = G.rayCast(midL, stL, segL).t, clrP = G.rayCast(midL, stL.map(c => -c), segL).t;
      const wsP = S8.makeWS('basin'); wsP.panels = [S8.panelAt(wsP, 0.5, 0)]; const aP = S8.feasible(wsP);
      return '' +
        H2('overview', 'There is no dataset') +
        '<p>A book of crosswords holds a fixed number of puzzles; a crossword generator holds none, yet give it a puzzle number and it builds the same puzzle every time. This study works like the generator. No episode is recorded: every one is produced from a single integer, its ' + T('scenseed') + ', by a deterministic ' + T('generator') + '. The same seed always gives the same basin or channel, the same path, panels, target spawn and target course.</p>' +
        '<p>A data set is therefore a range of seeds plus a sampling rule, and three things follow. Any episode can be rebuilt exactly. The ' + T('trainset') + ', the ' + T('valset') + ' and the ' + T('testset') + ' can be shown not to share an episode, because their seed ranges do not overlap (' + XS(8, 'datasets') + '). And the whole suite can be regenerated from a hash, years later.</p>' +
        EQ({ label: 'Model', title: 'The generator', tex: '\\text{scenario} = \\mathcal{G}(\\text{seed},\\ \\text{stage},\\ \\text{class},\\ \\text{geometry})',
          words: 'a scenario is a deterministic function of its seed, the curriculum stage, its encounter class and its geometry; the same arguments always give the same scene.',
          symbols: [{ k: 'calG', tex: '\\mathcal{G}', m: 'scenario generator, a deterministic function', u: '\u2014', v: '\u2014', g: gS },
            { k: 'seed', tex: '\\text{seed}', m: 'scenario seed, an integer (not the training seed of Section 5)', u: '\u2014', v: '5 (figure below)', g: gS },
            { k: 'stage', tex: '\\text{stage}', m: 'curriculum stage, 1 to 7', u: '\u2014', v: '5', g: gS }],
          example: '<p>In training, the class and the geometry are themselves drawn from the seed under the stage\u2019s rules (' + XS(8, 'curriculum') + '), so the seed and the stage fix everything. In the figure, seed 5 at stage 5 gives one scene and seed 8 another; seed 5 again gives the first scene exactly.</p>' }) +
        fig(nf[0], F.generator(), 'The generator, not the dataset. The scenes are drawn by this explainer\u2019s illustrative sampler, which follows the generator\u2019s rules where the facts state them; its seeds do not reproduce the study\u2019s scenes.', true) +

        H2('workspace', 'The workspace: basin legs and channels') +
        '<p>' + XS(1, 'workspace') + ' introduced the two workspaces. Here are the draws behind them. In the basin, the start and the goal sit on fixed lines across the basin and slide sideways at random, so every episode has its own straight but slanted ' + T('leg') + '.</p>' +
        EQ({ label: 'Model', title: 'Basin leg', tex: 'y_{\\mathrm{start}} = 2\\ \\mathrm{m},\\quad y_{\\mathrm{goal}} = 22\\ \\mathrm{m},\\quad x_{\\mathrm{start}},\\ x_{\\mathrm{goal}} \\sim \\mathcal{U}(2.5,\\ 7.5)\\ \\mathrm{m}, \\qquad \\psi_p = \\operatorname{atan2}(x_{\\mathrm{goal}} - x_{\\mathrm{start}},\\ 20\\ \\mathrm{m})',
          words: 'the start and goal lie 20 m apart along the basin, each placed at random between 2.5 and 7.5 m across it, so the leg leans by up to about 14\u00b0 from north.',
          symbols: [{ k: 'xsg', tex: 'x_{\\mathrm{start}},\\ x_{\\mathrm{goal}}', m: 'east coordinates of the start and goal', u: 'm', v: '3.0, 6.5', g: gS },
            { k: 'ysg', tex: 'y_{\\mathrm{start}},\\ y_{\\mathrm{goal}}', m: 'north coordinates of the start and goal', u: 'm', v: '2, 22', g: gS },
            { k: 'Unif', tex: '\\mathcal{U}(a,\\ b)', m: 'a uniform random draw between a and b', u: '\u2014', v: '\u2014', g: 'Notation and conventions' },
            { k: 'psip', tex: '\\psi_p', m: 'path tangent', u: '\u00b0', v: fx(psiEx, 1), g: 'Workspace and path' }],
          example: '<p>With ' + M('x_{\\mathrm{start}} = 3.0') + ' and ' + M('x_{\\mathrm{goal}} = 6.5\\ \\mathrm{m}') + ': ' + M('\\psi_p = \\operatorname{atan2}(3.5,\\ 20) = ' + fx(psiEx, 1) + '^\\circ') + ' and the leg is ' + M('\\sqrt{3.5^2 + 20^2} = ' + fx(lenEx, 2) + '\\ \\mathrm{m}') + ' long. The largest slant, ' + M('\\operatorname{atan}(5/20) = 14.0^\\circ') + ', comes from opposite corners of the draw. The navigable polygon is the basin inset by 0.40 m.</p>' }) +
        '<p>Because the leg slants, the water on either side of it differs, and differs along it. In the example, the leg\u2019s midpoint has ' + fx(clrP, 1) + ' m of water to port and ' + fx(clrS, 1) + ' m to starboard. That is why Section 7 scales the cross-track error by the room on the side the vessel is on (' + XS(7, 'observation') + ').</p>' +
        EQ({ label: 'Model', title: 'Channel path offset', tex: 'e_0 = \\xi\\, \\frac{W}{2}, \\qquad \\xi \\in [-0.30,\\ +0.30], \\qquad \\bar{\\xi} = +0.12',
          words: 'in a channel the path runs parallel to the walls, offset from the centerline by up to 0.30 of the half-width either way, on average 0.12 of it to starboard.',
          symbols: [{ k: 'e0', tex: 'e_0', m: 'lateral offset of the channel path from the centerline, + to starboard', u: 'm', v: '+0.36 (mean, W = 6 m)', g: gS },
            { k: 'xi', tex: '\\xi', m: 'path offset as a fraction of the channel half-width', u: '\u2014', v: '+0.12 (mean)', g: gS },
            { k: 'W', tex: 'W', m: 'channel width', u: 'm', v: '6', g: 'Workspace and path' }],
          example: '<p>In a 6 m channel the half-width is 3 m, so the path lies between ' + M('-0.90') + ' and ' + M('+0.90\\ \\mathrm{m}') + ' from the centerline, ' + M('+0.36\\ \\mathrm{m}') + ' on average: a ' + T('stbdstation') + '. Channels are used only for head-on, crossing and overtaking encounters. The facts give the range as a uniform draw on [\u22120.30, 0.30] and also give the mean as +0.12, which cannot both hold for one uniform draw ' + VERIFY('offset distribution') + '.</p>' }) +
        fig(nf[1], F.workspace(), 'Top: fourteen legs drawn from the basin distribution, with one highlighted; arrows measure the water to port and to starboard at its midpoint. Bottom: a 6 m channel with the band of path offsets and the mean starboard station. North is to the right in both.', true) +

        H2('encounter', 'The encounter, solved backward') +
        '<p>A stage director does not hope that two actors will meet; the director marks the spot where they must meet and counts back the steps each one takes. The generator does the same. It does not place a target and wait for an encounter to happen: it first chooses the encounter\u2019s outcome, then solves backward for where the target must start. This is the ' + T('backsolve') + '.</p>' +
        '<p>The class is drawn first (' + XS(8, 'curriculum') + '). Then four numbers describe the outcome: the ' + T('crossingangle') + ' ' + M('c') + ', the speed ratio ' + M('k') + ', the time to the closest point of approach ' + M('T_0') + ' and the miss distance there, ' + M('d_0') + '.</p>' +
        EQ({ label: 'Model', title: 'Drawing the outcome', tex: 'c \\sim \\text{band(class)}, \\qquad k = \\frac{U_{\\mathrm{TS}}}{U_{\\mathrm{OS}}} \\sim \\mathcal{U}(k_{\\min},\\ k_{\\max}), \\qquad T_0 \\sim \\mathcal{U}(T_{\\min},\\ T_{\\max}), \\qquad d_0 \\sim \\mathcal{U}(0,\\ d_{\\max})',
          words: 'for the drawn class, the crossing angle, the speed ratio, the time to the closest approach and the miss distance there are each drawn uniformly inside that class\u2019s band.',
          symbols: [{ k: 'c', tex: 'c', m: 'heading-crossing angle', u: '\u00b0', v: '180 (head-on)', g: 'Encounter geometry' },
            { k: 'kratio', tex: 'k', m: 'speed ratio U_TS / U_OS (not the step count k of Section 5)', u: '\u2014', v: '1.0', g: gS },
            { k: 'T0', tex: 'T_0', m: 'time from the target\u2019s appearance to the closest point of approach', u: 's', v: '15', g: gS },
            { k: 'd0', tex: 'd_0', m: 'miss distance at the closest point of approach, center to center', u: 'm', v: '0.8', g: gS }],
          example: '<p>A head-on draw might give ' + M('c = 180^\\circ') + ', ' + M('k = 1.0') + ', ' + M('T_0 = 15\\ \\mathrm{s}') + ' and ' + M('d_0 = 0.8\\ \\mathrm{m}') + ': a target at cruise speed on a reciprocal course, meeting the own ship 15 s after it appears and passing 0.8 m away center to center if neither turns.</p>' }) +
        tbl(['Class', M('c'), M('k = U_{\\mathrm{TS}}/U_{\\mathrm{OS}}'), M('T_0') + ' (s)', M('d_0') + ' (m)'], [
          ['head-on', '170\u2013190\u00b0', '0.70\u20131.30', '12.3\u201317.0', 'U[0, 2.0]'],
          ['crossing', '67.5\u2013175\u00b0 (from port) or 185\u2013292.5\u00b0 (from starboard); 60 % from port in training', '0.60\u20131.40', '7.9\u201314.8', 'U[0, 2.5]'],
          ['overtaking', '\u221267.5\u00b0 to 67.5\u00b0', '0.40\u20130.55', '19.7\u201331.5', 'U[0, 2.0]'],
          ['being overtaken', '\u221267.5\u00b0 to 67.5\u00b0', '1.50\u20132.20', '9.9\u201315.8', 'U[0, 2.0], floored above the contact-free distance + 0.35'],
          ['null', '\u221220\u00b0 to 20\u00b0', '0.85\u20131.15', TBD('null ' + 'T\u2080'), '\u2265 4 (no encounter)'],
        ]) +
        '<p>Why draw ' + M('d_0') + ' at all? Without it, the backward solve would put the target dead on the own ship\u2019s track every time. Every encounter would then need the largest possible alteration, and a policy would learn to always alter rather than when to alter. The zero branch of the Rule 8 term, where the target is already clear and no action is owed (' + M('a_{\\mathrm{req}} = 0') + ', ' + XS(7, 'colregs') + '), would never fire.</p>' +
        EQ({ label: 'Method', title: 'Backward solve for the spawn', tex: '\\begin{gathered} \\psi_{\\mathrm{TS}} = \\psi_{\\mathrm{OS}} + c, \\qquad \\mathbf{v}_{\\mathrm{rel}} = U_{\\mathrm{OS}}\\, \\hat{\\mathbf{h}}_{\\mathrm{OS}} - U_{\\mathrm{TS}}\\, \\hat{\\mathbf{h}}_{\\mathrm{TS}}, \\qquad \\hat{\\mathbf{n}} = \\pm \\frac{(v_{\\mathrm{rel},y},\\ -v_{\\mathrm{rel},x})}{\\lVert \\mathbf{v}_{\\mathrm{rel}} \\rVert} \\\\[4pt] \\mathbf{p}_{\\mathrm{TS}}(T_0) = \\mathbf{p}_{\\mathrm{OS}}(0) + U_{\\mathrm{OS}}\\, T_0\\, \\hat{\\mathbf{h}}_{\\mathrm{OS}} + d_0\\, \\hat{\\mathbf{n}}, \\qquad \\mathbf{p}_{\\mathrm{TS}}(0) = \\mathbf{p}_{\\mathrm{TS}}(T_0) - U_{\\mathrm{TS}}\\, T_0\\, \\hat{\\mathbf{h}}_{\\mathrm{TS}} \\end{gathered}',
          words: 'put the own ship where it will be after T\u2080 seconds, step sideways by d\u2080 across the relative motion, and from that point run the target backward along its own heading for T\u2080 seconds: that is where it must start.',
          symbols: [{ k: 'hOS', tex: '\\hat{\\mathbf{h}}_{\\mathrm{OS}},\\ \\hat{\\mathbf{h}}_{\\mathrm{TS}}', m: 'unit heading vectors of own ship and target', u: '\u2014', v: '(0, 1), (0, \u22121)', g: gS },
            { k: 'vrelbs', tex: '\\mathbf{v}_{\\mathrm{rel}}', m: 'own-ship velocity minus target velocity (the opposite sign to v in Eq. 3)', u: 'm/s', v: '(0, 1.116)', g: gS },
            { k: 'nhat', tex: '\\hat{\\mathbf{n}}', m: 'unit vector across the relative motion; its sign picks the side on which the target passes', u: '\u2014', v: '(\u22121, 0)', g: gS },
            { k: 'pOSt', tex: '\\mathbf{p}_{\\mathrm{OS}}(t),\\ \\mathbf{p}_{\\mathrm{TS}}(t)', m: 'positions of own ship and target, t seconds after the target appears', u: 'm', v: '\u2014', g: gS },
            { k: 'UOS', tex: 'U_{\\mathrm{OS}},\\ U_{\\mathrm{TS}}', m: 'speeds of own ship and target', u: 'm/s', v: '0.558, 0.558', g: 'Encounter geometry' },
            { k: 'psiTS', tex: '\\psi_{\\mathrm{TS}}', m: 'target heading', u: '\u00b0', v: '180', g: 'Encounter geometry' }],
          example: '<p>Own ship at (5, 2) m heading north at 0.558 m/s, with the head-on draw above and the target passing to port. After 15 s the own ship is at ' + M('(5,\\ 2 + 0.558 \\times 15) = (5,\\ 10.37)') + '. Then ' + M('\\mathbf{v}_{\\mathrm{rel}} = (0,\\ 0.558) - (0,\\ -0.558) = (0,\\ 1.116)') + ', so ' + M('\\hat{\\mathbf{n}} = \\pm(1,\\ 0)') + ', and to port ' + M('\\hat{\\mathbf{n}} = (-1,\\ 0)') + '. The target is at ' + M('(4.2,\\ 10.37)') + ' at the closest approach and started at ' + M('(4.2,\\ 10.37 + 8.37) = (' + fx(RH.S.pTS0[0], 2) + ',\\ ' + fx(RH.S.pTS0[1], 2) + ')') + ', ' + fx(RH.range0, 2) + ' m away. Check with Eq. 3: from the spawn, ' + M('\\mathbf{p} = (-0.8,\\ 16.74)') + ' and ' + M('\\mathbf{v} = (0,\\ -1.116)') + ' give ' + M('\\mathrm{TCPA} = 16.74 \\times 1.116 / 1.116^2 = ' + fx(RH.cpa.tcpa, 1) + '\\ \\mathrm{s}') + ' and ' + M('\\mathrm{DCPA} = ' + fx(RH.cpa.dcpa, 2) + '\\ \\mathrm{m}') + ', exactly the drawn outcome.</p>' }) +
        '<p>Two constraints keep the draws honest. The first concerns being overtaken. An overtaker that never gives way will hit the own ship if the drawn miss distance is smaller than the hulls allow, so the miss distance has a ' + T('contactfree') + ':</p>' +
        EQ({ label: 'Method', title: 'Contact-free floor (being overtaken)', tex: 'd_0 \\ge d_{\\mathrm{cf}}(c,\\ k) + 0.35\\ \\mathrm{m}',
          words: 'the miss distance must exceed, by 0.35 m, the smallest miss distance at which the two hulls, on their straight tracks, would not touch.',
          symbols: [{ k: 'dcf', tex: 'd_{\\mathrm{cf}}(c,\\ k)', m: 'contact-free miss distance: the smallest at which the hulls on straight tracks never touch', u: 'm', v: fx(dcf0, 2) + ' (parallel)', g: gS }],
          example: '<p>On parallel courses (' + M('c = 0^\\circ') + ') the hulls slide past side by side, so ' + M('d_{\\mathrm{cf}} = B = ' + fx(dcf0, 2) + '\\ \\mathrm{m}') + ' and the floor is ' + M(fx(dcf0 + 0.35, 2) + '\\ \\mathrm{m}') + '. At ' + M('c = 30^\\circ') + ' and ' + M('k = 1.5') + ', the angled hulls need ' + fx(Math.min(dcf30a, dcf30b), 2) + ' to ' + fx(Math.max(dcf30a, dcf30b), 2) + ' m, depending on the side, so the floor rises to about 1.8 m. These values are computed here from the hull outlines ' + VERIFY('the study\u2019s floor function') + '. Since baseline-v2, no draw sits below the floor: the Rule 17(b) last-moment case is out of scope.</p>' }) +
        '<p>The second concerns crossings. One crossing in five is labelled unescapable; such episodes are kept and reported, not silently dropped. How the label is decided is not given in the facts files ' + TBD('unescapable label') + '.</p>' +
        '<p>Finally, every draw is validated, and rejected and resampled if it fails. The realized geometry is re-classified, and the class must come out as the one that was drawn. The spawn range is checked, and the target\u2019s track must stay inside the water.</p>' +
        '<h3>\u25b6 Backward solve</h3>' + APP.widgetBsHTML() +

        H2('obstacles', 'Static obstacles and the feasibility check') +
        '<p>Up to three 1.0 m ' + T('panel', 'panels') + ' are then placed along 25 to 70 % of the path, with lateral offsets; how many depends on the curriculum stage. In the ' + T('decoupled', 'decoupled scenarios') + ' of stages 1 to 5, the panels are kept away from the stretch of path where the encounter happens, so that they do not decide it.</p>' +
        EQ({ label: 'Method', title: 'The CPA guard', tex: '\\lvert s_j - s_{\\mathrm{CPA}} \\rvert \\ge \\kappa_g\\, T_0\\, U_{\\mathrm{OS}}, \\qquad \\kappa_g = \\begin{cases} 0.4 & \\text{stages 1 to 5} \\\\ 0.2 & \\text{stage 6} \\\\ \\text{none} & \\text{stage 7} \\end{cases}',
          words: 'no panel may stand within the distance the own ship covers in 0.4 T\u2080 on either side of where it will be at the closest approach; the guard is halved in stage 6 and removed in stage 7.',
          symbols: [{ k: 'sj', tex: 's_j', m: 'along-path position of panel j', u: 'm', v: '\u2014', g: gS },
            { k: 'sCPA', tex: 's_{\\mathrm{CPA}}', m: 'own ship\u2019s along-path position at the closest point of approach', u: 'm', v: '10.4', g: gS },
            { k: 'kg', tex: '\\kappa_g', m: 'CPA-guard factor on the time to CPA', u: '\u2014', v: '0.4', g: gS }],
          example: '<p>With ' + M('T_0 = 14\\ \\mathrm{s}') + ': ' + M('0.4 \\times 14 \\times 0.558 = ' + fx(g14, 1) + '\\ \\mathrm{m}') + ' each side, so a ' + fx(2 * g14, 1) + ' m stretch of a 20 m leg, almost a third of it, stays free of panels. In stage 6 the stretch halves to ' + fx(g14, 1) + ' m. In stage 7 it is gone, and the panels may stand right beside the encounter. That is the ' + T('cpaguard') + '.</p>' }) +
        '<p>Every layout must then admit a route. The check runs on a grid of 0.25 m cells. Walls are grown by 0.40 m and panels by 0.45 m, an ' + T('inflation') + ' that lets the hull be treated as a point. An ' + T('astar') + ' then looks for the shortest route from start to goal ' + C('hart1968') + '.</p>' +
        EQ({ label: 'Method', title: 'Static feasibility', tex: 'f(\\mathbf{x}) = g(\\mathbf{x}) + h(\\mathbf{x}), \\qquad \\text{accept} \\iff L_{A^*} \\le 2.25\\, L_{\\mathrm{path}}',
          words: 'A* always grows its search from the cell with the smallest length so far plus a straight-line estimate of what remains; a layout is kept only if a route exists and is at most 2.25 times as long as the straight leg.',
          symbols: [{ k: 'fA', tex: 'f(\\mathbf{x}),\\ g(\\mathbf{x}),\\ h(\\mathbf{x})', m: 'A*: estimated total length through cell x, length from the start to x, and straight-line estimate from x to the goal (A*\u2019s own letters)', u: 'm', v: '\u2014', g: gF },
            { k: 'LAstar', tex: 'L_{A^*}', m: 'length of the route found by A*', u: 'm', v: fx(aP.len, 2), g: gF },
            { k: 'Lpath', tex: 'L_{\\mathrm{path}}', m: 'length of this episode\u2019s path', u: 'm', v: '20', g: 'Reward' },
            { k: 'Dgrid', tex: '\\Delta_g', m: 'grid cell size of the feasibility and solvability checks', u: 'm', v: '0.25', g: gF }],
          example: '<p>For a 20 m leg the limit is ' + M('2.25 \\times 20 = 45\\ \\mathrm{m}') + '. One panel standing on the line adds little: in the widget, A* goes around it in ' + fx(aP.len, 2) + ' m. Because the straight-line estimate never overstates the remaining length, A* returns a shortest route on the grid. A layout fails when the inflated panels and walls close the passage; in a narrow channel, two panels staggered across it can be enough. The generator then draws the panels again, up to 20 times, and then removes one. Every rejection is counted in a ledger, so a hard layout is one that is shown to be solvable, and an impossible one never reaches training.</p>' }) +
        fig(nf[2], F.filter(), 'The feasibility filter. It keeps difficulty designed rather than accidental.', true) +
        '<h3>\u25b6 Static layouts and the A* check</h3>' + APP.widgetAstarHTML() +

        H2('families', 'Decoupled and coupled scenarios') +
        '<p>The results distinguish two families of scenarios, and the difference is when the panels are placed. In a ' + T('decoupled') + ', the encounter comes first and the panels are kept clear of the stretch where it happens (the CPA guard above). Obstacle avoidance and collision avoidance then happen one after the other. In a ' + T('coupled') + ', three panels are laid out first in a structured pattern, and the encounter is generated with them in place and without the CPA guard. The vessel may then have to resolve both at once, perhaps meeting the target beside a panel.</p>' +
        '<p>Coupled layouts use a leg whose start and goal lie between 2 and 8 m across the basin (a slant of up to 14.1\u00b0). Their three panels follow one of three ' + T('motif', 'motifs') + ', placed along 28 to 85 % of the leg, at least 0.9 m from the walls and 0.4 m apart:</p>' +
        '<ul><li><b>Gate + on-path</b> (40 %): two panels either side of the leg, 1.3 to 2.7 m from it, and one near the path further on.</li><li><b>Slalom</b> (30 %): three panels on alternating sides.</li><li><b>Side + on-path</b> (30 %): one on the path, and one on each side 1.2 to 3.2 m off.</li></ul>' +
        fig(nf[3], F.motifs(), 'The three motifs of the coupled layouts.', true) +
        '<p>The target of a coupled scenario starts inside the basin and keeps a speed between 0.20 and 1.10 m/s. It stops short of the wall, and its straight track clears every panel by 0.30 m. In stage 7, 30 % of these targets change speed once during the episode, a single step in speed with bounded acceleration. In training, every target holds its course and never gives way.</p>' +
        '<h3>\u25b6 Decoupled and coupled, side by side</h3>' + APP.widgetDcHTML() +

        H2('spacetime', 'Space-time solvability') +
        '<p>A static route is not enough once the target moves: a gate can be open now and blocked when the own ship gets there. Picture ink poured at the start that spreads at a fixed rate in every direction: the ink marks the ' + T('reachset') + ' of an ideal point vessel. A sponge the size of the target\u2019s safety zone moves along the target\u2019s track and soaks up any ink it touches. If ink ever reaches the goal, some trajectory exists. Every target episode of stages 6 and 7, and every coupled validation episode, must pass this test of ' + T('spacetime') + '.</p>' +
        EQ({ label: 'Method', title: 'Forward reachability', tex: '\\begin{gathered} \\mathcal{R}_{k+1} = \\big(\\mathcal{R}_k \\oplus \\mathcal{D}(\\mathbf{0},\\ 0.55\\ \\mathrm{m})\\big) \\cap \\mathcal{F} \\setminus \\mathcal{D}\\big(\\mathbf{p}_{\\mathrm{TS}}(t_{k+1}),\\ 1.3\\ \\mathrm{m}\\big), \\qquad \\mathcal{R}_0 = \\{\\text{start cell}\\} \\\\[4pt] \\text{solvable} \\iff \\exists\\, k \\le 180:\\ \\mathcal{R}_k \\cap \\mathcal{D}(\\mathbf{p}_{\\mathrm{goal}},\\ 0.5\\ \\mathrm{m}) \\ne \\varnothing \\end{gathered}',
          words: 'every half second, the set of cells the own ship could occupy grows by 0.55 m in every direction, loses the cells that are blocked and the cells within 1.3 m of where the target is at that moment; the episode is solvable if the set ever reaches within 0.5 m of the goal.',
          symbols: [{ k: 'Rk', tex: '\\mathcal{R}_k', m: 'reachable set after k half-second steps', u: '\u2014', v: '\u2014', g: gF },
            { k: 'Fset', tex: '\\mathcal{F}', m: 'free cells of the inflated A* grid', u: '\u2014', v: '\u2014', g: gF },
            { k: 'Dset', tex: '\\mathcal{D}(\\mathbf{x},\\ r)', m: 'disc of radius r around point x', u: 'm', v: 'r = 0.55, 1.3, 0.5', g: gF },
            { k: 'oplus', tex: '\\oplus', m: 'growing a set by a disc (dilation)', u: '\u2014', v: '\u2014', g: gF },
            { k: 'Upt', tex: 'U_{\\mathrm{pt}}', m: 'speed of the ideal point vessel', u: 'm/s', v: '1.1', g: gF }],
          example: '<p>The growth per step is ' + M('U_{\\mathrm{pt}}\\, \\Delta t = 1.1 \\times 0.5 = 0.55\\ \\mathrm{m}') + ', and an episode ends after 180 steps (90 s). The model is optimistic about the vessel: it moves at twice cruise speed and has no turning radius. It is conservative about separation, keeping 1.3 m from the target\u2019s center. So only draws that no controller could solve are removed, and they are drawn again. In a 3.5 m channel, the inflated walls leave ' + M('3.5 - 2 \\times 0.40 = 2.7\\ \\mathrm{m}') + ' of free width and the target\u2019s disc is 2.6 m wide. A head-on target then leaves at most a hand\u2019s width to slip past, and whether a grid cell survives beside it decides the verdict.</p>' }) +
        '<h3>\u25b6 Space-time reachability</h3>' + APP.widgetReachHTML() +

        H2('curriculum', 'The curriculum: seven stages') +
        '<p>Driving lessons start in an empty car park, move to quiet streets, and only then to traffic, and the lesson plan is fixed in advance. Training follows such a ' + T('curriculum') + ' ' + C('bengio2009') + '. Its seven stages switch on at fixed timesteps, not when performance passes a threshold, so every learner sees the same schedule (' + XS(5, 'protocol') + ').</p>' +
        EQ({ label: 'Model', title: 'Stage boundaries', tex: 'N_i = f_i\\, N_{\\mathrm{base}}, \\qquad f = (0.064,\\ 0.144,\\ 0.256,\\ 0.40,\\ 0.60,\\ 0.80), \\qquad N_{\\mathrm{base}} = 2.5 \\times 10^{6}',
          words: 'stages 2 to 7 begin at fixed fractions of a 2.5 million-step base budget; training then continues in stage 7 to 3.0 million steps.',
          symbols: [{ k: 'Ni', tex: 'N_i', m: 'environment step at which stage i + 1 begins', u: 'steps', v: '640,000 (stage 4)', g: gD },
            { k: 'fi', tex: 'f_i', m: 'fraction of the base budget at which the next stage begins', u: '\u2014', v: '0.256', g: gD },
            { k: 'Nbase', tex: 'N_{\\mathrm{base}}', m: 'base budget over which the stage boundaries are set', u: 'steps', v: '2.5 \u00d7 10\u2076', g: gD }],
          example: '<p>The boundaries fall at 0.16, 0.36, 0.64, 1.00, 1.50 and 2.00 M steps. For stage 4, ' + M('0.256 \\times 2.5 \\times 10^{6} = 640{,}000') + '. Stage 7 runs from 2.0 M to the end at 3.0 M, so it lasts a third of the run. At 0.5 s per step, 3.0 M steps are ' + M('1.5 \\times 10^{6}\\ \\mathrm{s}') + ' of simulated sailing, about 17 days, shared across 10 parallel simulators.</p>' }) +
        EQ({ label: 'Model', title: 'Episode-type shares', tex: 'P(\\text{type}) = \\{\\text{head-on } 0.20,\\ \\text{crossing } 0.22,\\ \\text{overtaking } 0.16,\\ \\text{being overtaken } 0.14,\\ \\text{null } 0.11,\\ \\text{no target } 0.17\\}',
          words: 'within a stage, each episode\u2019s type is drawn from these fixed shares, limited to the types the stage admits.',
          symbols: [{ k: 'Pcls', tex: 'P(\\text{type})', m: 'share of training episodes of each type', u: '\u2014', v: '0.22 (crossing)', g: gD }],
          example: '<p>The shares add up to ' + M('0.20 + 0.22 + 0.16 + 0.14 + 0.11 + 0.17 = 1.00') + '. In 1,000 episodes of stage 5, about 220 are crossings, about 130 of them from port, since 60 % of crossings come from port in training. A null episode has a target that passes far away (' + M('d_0 \\ge 4\\ \\mathrm{m}') + '), which teaches the policy that not every vessel demands a response.</p>' }) +
        tbl(['Stage', 'From', 'Episode types', 'Panels', 'Channels', 'Three-obstacle layouts'], [
          ['1', '0', 'no target', '0\u20131', 'basin only', '\u2014'],
          ['2', '0.16 M', 'no target', '0\u20133', 'basin only', '\u2014'],
          ['3', '0.36 M', 'head-on, crossing (both sides), null, no target; longer times to CPA', '0\u20131', '7\u201310 m (15 %)', '\u2014'],
          ['4', '0.64 M', 'all six', '0\u20132', '4.5\u201310 m (25 %)', '\u2014'],
          ['5', '1.00 M', 'all six', '0\u20133, weighted to 3 (0.10, 0.20, 0.30, 0.40)', '3.5\u201310 m (25 %)', '\u2014'],
          ['6', '1.50 M', 'all six', '1\u20133, weighted to 3 (0.2, 0.3, 0.5)', '3.5\u201310 m', '25 % of episodes; CPA guard halved'],
          ['7', '2.00 M', 'all six', '1\u20133, weighted to 3', '3.5\u201310 m', '45 % of episodes; CPA guard removed; 30 % of their targets change speed once'],
        ]) +
        '<p>Three details carry the design. Stage 3 introduces encounters with the longer half of each range of times to the closest approach, which leaves more time to react; stage 4 opens the full range. Stage 3 also teaches head-on and crossing encounters together, on purpose. Teaching head-on alone first had taught \u201cgive way means turn to starboard\u201d, which then had to be unlearned for crossings from port, where the turn the rules ask for is to port (' + XS(2, 'classes') + '). Stages 1 to 5 are decoupled. Stages 6 and 7 train on more, and more evenly spread, three-obstacle layouts in the three motifs: these are the coupled scenarios.</p>' +
        '<p>Two further settings run through every stage: 15 % of episodes start slow, from rest or at up to half of cruise speed, and training targets always hold their course and never give way. As the stages add targets and panels, the simulator slows down, because each one costs ray casting and contact checks.</p>' +
        '<h3>\u25b6 The curriculum, stage by stage</h3>' + APP.widgetCurHTML() +

        H2('datasets', 'Three data sets, kept apart') +
        '<p>An examiner who has seen the exam questions in advance cannot grade fairly. The same holds for policies. The training set teaches, the validation set chooses which saved ' + T('checkpoint') + ' represents each run, and the test set is the held-out evidence. They must never share an episode. Because episodes are generated, keeping them apart reduces to keeping their seeds apart.</p>' +
        tbl(['Set', 'Seeds', 'Size', 'How drawn', 'Used for', 'Seen'], [
          ['<b>Training set</b>', '0\u201399,999', 'unbounded: a fresh draw every episode', 'curriculum stage of the moment', 'gradient updates', 'continuously'],
          ['<b>Validation set</b>', '200,000\u2013209,999 (decoupled part); own block from 350,000 (coupled part)', '270: 120 decoupled + 150 coupled', 'fixed lists', 'checkpoint selection, and all diagnostics', 'every 200,000 steps'],
          ['<b>Test set</b> (test set v4)', '300,000\u2013309,999 (decoupled part, from the frozen benchmark); dedicated test blocks (coupled part)', '1,000: 664 decoupled + 336 coupled', T('stratified') + ', near-duplicates trimmed, fairness-checked', 'the paper\u2019s tables', 'once per policy'],
          [T('frozenbench', 'Frozen benchmark'), '300,000\u2013309,999', '800 (8 cells \u00d7 100)', 'basin and channel encounters', 'source of the test set\u2019s decoupled part; continuity with earlier tables', '\u2014'],
          [T('robustset', 'Robustness set'), 'the same scenarios', '700 + 200', 'a ' + T('reactive') + ' (700); in head-ons, a ' + T('noncompliant') + ' (200)', 'robustness to target behavior', '\u2014'],
          ['Width sweep (planned)', '400,000\u2013409,999', 'channels of 10, 8, 7, 6, 5, 4.5, 4 and 3.5 m', '\u2014', 'how the response changes with room', '\u2014'],
          ['Perception degradation (planned)', '500,000\u2013509,999', 'pose drift, detection dropout, occlusion, velocity-estimate noise, separately and jointly', '\u2014', 'robustness to sensing', '\u2014'],
        ], 'wide') +
        EQ({ label: 'Model', title: 'Seed of an episode', tex: '\\text{seed}(\\text{ns},\\ i) = \\text{lo}_{\\text{ns}} + \\big(i \\bmod (\\text{hi}_{\\text{ns}} - \\text{lo}_{\\text{ns}} + 1)\\big)',
          words: 'the i-th episode drawn from a namespace takes the i-th seed of that namespace\u2019s range, wrapping around at its end.',
          symbols: [{ k: 'seedfn', tex: '\\text{seed}(\\text{ns},\\ i)', m: 'scenario seed of the i-th episode from namespace ns', u: '\u2014', v: '200,007', g: gD },
            { k: 'lohi', tex: '\\text{lo}_{\\text{ns}},\\ \\text{hi}_{\\text{ns}}', m: 'first and last seed of namespace ns', u: '\u2014', v: '200,000, 209,999', g: gD },
            { k: 'iep', tex: 'i', m: 'index of an episode within its namespace', u: '\u2014', v: '7', g: gD }],
          example: '<p>For the validation set\u2019s decoupled part, ' + M('i = 7') + ' gives ' + M('200{,}000 + (7 \\bmod 10{,}000) = 200{,}007') + '. In training, episode ' + M('i = 123{,}456') + ' gives ' + M('0 + (123{,}456 \\bmod 100{,}000) = 23{,}456') + '. A test in the code asserts that no two ' + T('namespace', 'namespaces') + ' overlap: the machine-checkable form of \u201cthe test set was not used in training\u201d.</p>' }) +
        fig(nf[4], F.namespaces(), 'Seed namespaces on one number line. The bands are drawn wider than to scale where they would be too thin to see.', true) +
        '<h3>The validation set: choosing checkpoints</h3>' +
        '<p>The validation set has 270 fixed episodes. 120 are decoupled, 20 of each of the six episode types, drawn with the stage-5 generator. 150 are coupled three-obstacle layouts, all space-time solvable: 20 have no target, and each of the five encounter types (head-on, crossing from port, crossing from starboard, overtaking, being overtaken) has 20 constant-speed and 6 varying-speed episodes.</p>' +
        fig(nf[5], F.valset(), 'Composition of the validation set.', true) +
        EQ({ label: 'Method', title: 'Selection score', tex: '\\text{score} = P(\\text{goal}) - 2\\, P(\\text{collision})',
          words: 'the fraction of validation episodes that reach the goal, minus twice the fraction that end in a collision; every 200,000 steps the current policy is run on all 270 with the safety layer off, and the checkpoint is kept if the score improves.',
          symbols: [{ k: 'score', tex: '\\text{score}', m: 'checkpoint selection score', u: '\u2014', v: '0.82 (hypothetical)', g: gD },
            { k: 'Psel', tex: 'P(\\text{goal}),\\ P(\\text{collision})', m: 'fractions of the 270 validation episodes that reach the goal, and that end in a collision', u: '\u2014', v: '0.86, 0.02 (hypothetical)', g: gD }],
          example: '<p>With hypothetical numbers, not results: a checkpoint that reaches the goal in 90 % of episodes and collides in 6 % scores ' + M('0.90 - 2 \\times 0.06 = 0.78') + '. One that reaches the goal in 86 % and collides in 2 % scores ' + M('0.86 - 0.04 = 0.82') + ' and is kept. The factor of 2 is the whole selection rule: a policy that reaches the goal by taking risks scores worse than a careful one. The comparators of Section 4 are tuned with the same form of score (' + XS(4, 'fair') + ').</p>' }) +
        fig(nf[6], F.selection(), 'Best-on-validation selection, illustrated with an invented curve. Each training run, one learner with one seed, is represented by its best checkpoint, not its last. The score that decides is the ' + T('selscore') + '.', true) +
        '<h3>The test set: the evidence</h3>' +
        '<p>Test set v4 has 1,000 held-out episodes. 664 are decoupled: basin and channel encounters of every type, drawn from the frozen benchmark, with constant-velocity, reactive and non-compliant targets. 336 are coupled three-obstacle layouts with constant- and varying-speed targets. Two steps prepare it.</p>' +
        '<ul><li><b>Trimming.</b> Twins, the same scenario with only the target\u2019s behavior changed, are collapsed. Then the scenario whose nearest neighbor in its own cell is closest is removed, again and again, until 1,000 remain (' + T('neardup') + ').</li>' +
        '<li><b>The fairness check.</b> Every episode must be solvable with 0.2 m clearance throughout, by some maneuver started after the onboard perception first tracks the target, even with perfect knowledge of the target\u2019s future motion. The 67 episodes that were not solvable were replaced by fresh episodes of the same kind that pass. ' + XS(9) + ' shows the ' + T('fairness') + ' in detail.</li></ul>' +
        '<p>The version records a ' + T('manifest') + ', a hash over every scenario, so that each table can be traced to the exact episodes behind it. The test set is run once per selected policy; its values are reported in the paper.</p>' +
        fig(nf[7], F.testset(), 'Preparing test set v4.', true) +
        '<h3>Planned studies</h3>' +
        '<p>Two further series are planned. The width sweep repeats encounters in channels of 10, 8, 7, 6, 5, 4.5, 4 and 3.5 m. The widths at which each alteration stops fitting are derived from the hull beam, the required separation and the wall clearance, not chosen: 3.80 m for head-on, 4.26 m for overtaking and 7.60 m for crossing. The derivation itself is not given in the facts files ' + TBD('width-threshold derivation') + '. The sweep\u2019s widths fall on both sides of every threshold: 4 m lies between the head-on and overtaking thresholds, and 3.5 m lies below both, where only a speed reduction is left. Width is a geometric experimental variable here, not a legal definition of a narrow channel. The perception-degradation series adds pose drift, detection dropout, occlusion and velocity-estimate noise, separately and together.</p>' +
        fig(nf[8], F.widths(), 'Derived width thresholds and the planned sweep widths.', true);
    },
    mount(el) {
      APP.mountBs(el.querySelector('#bs-widget'));
      APP.mountAstar(el.querySelector('#astar-widget'));
      APP.mountDc(el.querySelector('#dc-widget'));
      APP.mountReach(el.querySelector('#reach-widget'));
      APP.mountCur(el.querySelector('#cur-widget'));
    },
    takeaways: ['Scenarios are generated, not collected: a seed and the curriculum stage fix the workspace, path, panels and target, with the encounter solved backward from its chosen outcome and every draw checked for class, water, contact and feasibility.',
      'Training runs through seven stages switched at fixed timesteps over 3 M steps: stages 1\u20135 are decoupled, and stages 6\u20137 add coupled three-obstacle layouts in three motifs, with the CPA guard halved and then removed, and some targets changing speed.',
      'The training, validation (270 episodes) and test (test set v4, 1,000 episodes) sets come from disjoint seed ranges; checkpoints are chosen by goal rate minus twice the collision rate on the validation set, and the test set is run once per policy.'],
  });
})();
