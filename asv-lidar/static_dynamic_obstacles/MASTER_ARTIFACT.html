  // ---------- Figure: the velocity obstacle (static, crossing from starboard) ----------
  function voPrimerFigure() {
    const U0 = 0.558, Rv = 1.925, Th = 20, d = [6.70, 6.70], vt = [-U0, 0];
    const w = 660, h = 300;
    let s = svgBox(w, h, 'Left: the own ship heading north and a target crossing from starboard, with the circle of combined radius around the target. Right: in velocity space, the cone of own velocities that lead to contact within 20 s, with its tip at the target velocity.', 'max-width: 700px; margin: 0 auto');
    // left: world
    const v = FIG.view({ x0: -2, x1: 10, y0: -1.5, y1: 10, s: 24, pad: 10 });
    s += '<g>' + '<rect width="' + v.W + '" height="' + v.H + '" rx="10" class="s-water"/>';
    s += FIG.circle(v, d, Rv, '', ' style="fill: var(--target-fill); stroke: var(--target)" fill-opacity=".45" stroke-dasharray="3 3"');
    s += FIG.hull(v, d, 270, 's-tgt') + FIG.arrow(v, d, [d[0] + vt[0] * 5, d[1] + vt[1] * 5], 's-trg f-trg', 8);
    s += FIG.hull(v, [0, 0], 0, 's-own') + FIG.arrow(v, [0, 0], [0, U0 * 5], 'k-ink2 f-ink2', 8);
    s += FIG.line(v, [[0, 0], d], '', ' style="stroke: var(--ink-3)" stroke-dasharray="4 4"');
    s += FIG.wtext(v, [0, 0], 'Own ship', 'lbl-s', 'start', 12, 18) + FIG.wtext(v, d, 'Target', 'lbl-s', 'middle', 0, -22);
    s += FIG.wtext(v, [d[0], d[1] - Rv], 'combined radius', 'lbl-s', 'middle', 0, 16, ' style="fill: var(--target)"');
    s += '</g>';
    // right: velocity space
    const ox = 330, K1 = 150, VC = [ox + 160, 150];
    const VX = x => VC[0] + x * K1, VY = y => VC[1] - y * K1;
    s += '<rect x="' + ox + '" y="0" width="330" height="300" rx="10" style="fill: var(--surface); stroke: var(--rule)"/>';
    s += '<path d="M' + (ox + 10) + ' ' + VC[1] + 'H' + (ox + 320) + 'M' + VC[0] + ' 10V290" style="stroke: var(--ink-3)"/>';
    const dl = Math.hypot(d[0], d[1]), th = Math.atan2(d[1], d[0]), ph = Math.asin(Rv / dl);
    const c1 = [d[0] / Th, d[1] / Th], c1l = dl / Th, r1 = Rv / Th;
    const up = [Math.cos(th + ph), Math.sin(th + ph)], um = [Math.cos(th - ph), Math.sin(th - ph)];
    const Pp = [up[0] * c1l * Math.cos(ph), up[1] * c1l * Math.cos(ph)], Pm = [um[0] * c1l * Math.cos(ph), um[1] * c1l * Math.cos(ph)];
    const pts = [Pp, [up[0] * 1.6, up[1] * 1.6], [um[0] * 1.6, um[1] * 1.6], Pm];
    const a2 = Math.atan2(Pm[1] - c1[1], Pm[0] - c1[0]), a1 = Math.atan2(Pp[1] - c1[1], Pp[0] - c1[0]), an = Math.atan2(-c1[1], -c1[0]);
    const norm = x => ((x % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI), d21 = norm(a1 - a2), sweep = norm(an - a2) < d21 ? d21 : -(2 * Math.PI - d21);
    for (let i = 1; i < 20; i++) { const a = a2 + sweep * i / 20; pts.push([c1[0] + r1 * Math.cos(a), c1[1] + r1 * Math.sin(a)]); }
    s += '<defs><clipPath id="vo1clip"><rect x="' + ox + '" y="0" width="330" height="300" rx="10"/></clipPath></defs>';
    s += '<path clip-path="url(#vo1clip)" d="' + pts.map((p, i) => (i ? 'L' : 'M') + f1(VX(p[0] + vt[0])) + ' ' + f1(VY(p[1] + vt[1]))).join('') + 'Z" style="fill: var(--target-fill); stroke: var(--target)" fill-opacity=".75" stroke-width="1.6"/>';
    s += '<path clip-path="url(#vo1clip)" d="M' + f1(VX(vt[0])) + ' ' + f1(VY(vt[1])) + 'L' + f1(VX(vt[0] + Pp[0])) + ' ' + f1(VY(vt[1] + Pp[1])) + 'M' + f1(VX(vt[0])) + ' ' + f1(VY(vt[1])) + 'L' + f1(VX(vt[0] + Pm[0])) + ' ' + f1(VY(vt[1] + Pm[1])) + '" style="stroke: var(--target)" stroke-dasharray="3 3" fill="none"/>';
    s += '<circle cx="' + VX(0) + '" cy="' + VY(0) + '" r="' + (U0 * K1).toFixed(1) + '" fill="none" style="stroke: var(--ink-3)" stroke-dasharray="4 4"/>';
    s += '<circle cx="' + VX(vt[0]) + '" cy="' + VY(vt[1]) + '" r="4.5" class="f-trg"/>' + FIG.text(VX(vt[0]) - 4, VY(vt[1]) + 18, 'target velocity (apex)', 'lbl-s', 'middle', ' style="fill: var(--target)"');
    const vA = [0, U0], vB = [U0 * Math.sin(40 * D2R), U0 * Math.cos(40 * D2R)];
    s += '<circle cx="' + VX(vA[0]) + '" cy="' + VY(vA[1]) + '" r="6" style="fill: var(--target); stroke: var(--surface)" stroke-width="2"/>' + FIG.text(VX(vA[0]) - 10, VY(vA[1]) - 6, 'hold course: inside', 'lbl-s', 'end');
    s += '<circle cx="' + VX(vB[0]) + '" cy="' + VY(vB[1]) + '" r="6" style="fill: var(--perception); stroke: var(--surface)" stroke-width="2"/>' + FIG.text(VX(vB[0]) + 10, VY(vB[1]) + 4, 'turn 40\u00b0 to', 'lbl-s', 'start') + FIG.text(VX(vB[0]) + 10, VY(vB[1]) + 18, 'starboard:', 'lbl-s', 'start') + FIG.text(VX(vB[0]) + 10, VY(vB[1]) + 32, 'outside', 'lbl-s', 'start');
    s += FIG.text(ox + 318, VC[1] - 6, 'east', 'lbl-s', 'end') + FIG.text(VC[0] + 6, 20, 'north', 'lbl-s', 'start');
    s += FIG.text(ox + 12, 290, 'Dashed circle: speeds up to 0.558 m/s', 'lbl-s', 'start');
    return s + '</svg>';
  }

    const col = (x, title, steps, color) => {
      let o = FIG.text(x + bw / 2, 20, title, 'lbl-b', 'middle', ' style="font-size: 14px"');
      steps.forEach((st, i) => {
        const y = 32 + i * (bh + gap);
        o += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="7" style="fill: ' + (st[2] ? 'var(--decision-fill)' : 'var(--surface)') + '; stroke: ' + (st[2] ? 'var(--decision)' : 'var(--rule)') + '"/>';
        o += FIG.text(x + 12, y + 17, (i + 1) + '. ' + st[0], 'lbl-b', 'start') + FIG.text(x + 12, y + 33, st[1], 'lbl-s', 'start');
        if (i < steps.length - 1) o += FIG.arrowS(x + bw / 2, y + bh, x + bw / 2, y + bh + gap, 'k-ink3 f-ink3', 6);
      });
      return o;
    };
    s += col(10, 'LOS-PID + dynamic window', [
      ['Candidates', '9 yaw rates \u00d7 3 speeds \u00d7 2 holds, + 2 LOS-PID = 56'],
      ['Predict through the vessel model', 'closed loop, up to 16 s: delay, lag, inertia'],
      ['Admissible?', 'keep 0.20 m from scan points, boundary, targets'],
      ['Score the rest', 'G = heading + clearance + velocity + path', true],
      ['Pick the best, or fall back', 'latest first violation, then most clearance'],
    ]);
    s += col(370, 'COLREGs velocity obstacle', [
      ['Candidates', '\u221290\u00b0 \u2026 +90\u00b0 in 5\u00b0 steps + LOS course, 5 speeds'],
      ['Own-ship turn model', '6\u00b0/s after a 1 s lag; speed eases to the new value'],
      ['Hard velocity obstacle', 'reject contact within 20 s (targets), 10 s (static)'],
      ['Classify the encounter', 'open-water roles by bearing and speed'],
      ['Side constraint (give way, live)', 'relative velocity to starboard of the sight line', true],
      ['Stand on (Rule 17)', 'hold while the preferred choice stays clear > 12 s', true],
      ['Lowest cost J', 'course change, speed loss, proximity, switching'],
      ['Fallback', 'drop the rule before accepting a collision'],
    ]);
    s += FIG.text(10, h - 8, 'Shaded steps are where the rules or the tuned objective enter.', 'lbl-s', 'start');
    return s + '</svg>';
  }

    s += note(251, 'Narrow-channel variant: the own') + note(266, 'ship gives way to a crossing') + note(281, 'target from either side.');
    return s + '</svg>';
  }

  APP.section({
    n: 4, id: 's4', title: 'Classical methods', short: 'Classical methods', subsystem: 'decision',
    learn: ['The hand-designed controllers the learned policies are compared against, built from four basic ideas: potential fields, line-of-sight guidance, PID control and velocity obstacles.',
      'How the two comparators, a dynamic window on top of LOS-PID and a COLREGs-aware velocity obstacle, choose a command every half second, and what each knows, assumes and cannot do.'],
    build() {
      const fA = FIGN(), fL = FIGN(), fP = FIGN(), fV = FIGN(), fPipe = FIGN(), fSec = FIGN();
      const los1 = CL.los([1, 0], { a: [0, -10], b: [0, 10] }, 0, 2.5), los2 = CL.los([1, 0], { a: [0, -10], b: [0, 10] }, 3, 2.5);
      const eP = los1.chid, Pt = K.Kp * eP, Dt = -K.Kd * (-3), aPD = Pt + Dt;
      const aYaw = CL.yawTrack(4.5, 2), nSp = K.spr * 0 + (0.279 / K.spr + 6 * (0.279 - 0.558));
      const J1 = CL.voCost(30, 0.558, 0, 0, 0.558), J2 = CL.voCost(0, 0.279, 0, 0, 0.558);
      const crossA = 5 * 0.483 - 5 * 0.837, crossB = 5 * 0.483 - 5 * 0.279;
      const Gex = 1.0 * (1 - 10 / 180) + 1.0 * (0.9 / 1.5) + 0.5 * (0.5 / 0.558) + 0.6 * (1 - 0.4 / 2);
      return '' +
        H2('fair', 'Same sensors, same actuators, different logic') +
        '<p>A learned policy is only as impressive as what it is compared with. Paper 3 measures its policies against hand-designed controllers, the ' + T('comparator', 'comparators') + '. To keep the comparison fair, every comparator uses the same perception as the learned policies (the LiDAR scan, the tracker and the map boundary) and the same actuator limits. They differ only in the avoidance logic.</p>' +
        '<p>Each comparator is tuned on the ' + T('devset') + ' by ' + T('coorddescent') + ', much as you might tune an old radio: turn one knob until the sound is best, then the next, and go round again until no knob helps. The score counts goals and penalizes collisions twice as hard.</p>' +
        EQ({ label: 'Method', title: 'Tuning score', tex: '\\text{score} = f_{\\mathrm{goal}} - 2\\,f_{\\mathrm{coll}}',
          words: 'reaching the goal earns one point per episode and a collision costs two, so a setting that avoids one collision may give up two goals and still score the same.',
          symbols: [{ k: 'fgoal', tex: 'f_{\\mathrm{goal}},\\ f_{\\mathrm{coll}}', m: 'fraction of development episodes that reach the goal, and that end in a collision', u: '\u2014', v: 'counted per setting', g: 'Comparator tuning' }],
          example: '<p>With hypothetical numbers: a setting that reaches the goal in 90 of 100 development episodes and collides in 5 scores ' + M('0.90 - 2 \\times 0.05 = 0.80') + '. A more cautious setting with 85 goals and 1 collision scores ' + M('0.85 - 0.02 = 0.83') + ' and is kept.</p>' }) +

        H2('apf', 'Primer: artificial potential fields') +
        '<p>Picture a marble on a rubber sheet. The goal is a dip that pulls the marble toward it; each obstacle is a bump that pushes it away; the marble rolls along the combined slope. An ' + AB('APF') + ' steers a vessel the same way: the goal attracts, obstacles repel, and the vessel follows the sum of the forces ' + C('khatib1986') + '. It is fast and simple, but it has a well-known trap. Between two close obstacles the pushes can cancel the pull, and the vessel stops in a ' + T('localmin') + ' short of a gap it could in fact pass through. It also knows no rules.</p>' +
        '<p>An APF, combined with LOS guidance, was the comparator in the previous paper ' + C('tran2026') + '. It is background here: Paper 3 does not use it as a comparator.</p>' +
        '<figure class="fig"><div class="frame">' + apfFigure() + '</div><figcaption><b>' + fA + '.</b> A potential field and its trap. Arrows show the direction of the combined force; the path from the start stops below the gap, where the obstacles\u2019 pushes cancel the goal\u2019s pull. <span class="tag illus">Illustrative</span>Field shape and gains are made up for the picture; they are not Paper 2\u2019s settings.</figcaption></figure>' +

        H2('los', 'Primer: line-of-sight guidance') +
        '<p>Cycling along the white line at the edge of a road, you do not stare at the line under your front wheel. You look a few meters ahead on the line and steer toward that point. ' + AB('LOS') + ' guidance does exactly this ' + C('fossen2021') + ': it aims at a point a ' + T('lookahead') + ' ' + M('\\Delta = 2.5\\ \\mathrm{m}') + ' ahead on the path. A long look-ahead gives a gentle, slow return to the path; a short one gives a sharp return that tends to overshoot. Subtracting the measured sideslip turns the desired direction of motion into the heading the bow must point along.</p>' +
        EQ({ label: 'Method', title: 'Line-of-sight guidance', tex: '\\chi_d = \\chi_{\\mathrm{path}} + \\operatorname{atan2}(-e_y,\\ \\Delta) - \\hat{\\beta}',
          words: 'steer along the path, turned toward it by the angle that points at a spot \u0394 ahead on the path, and corrected for the sideways slip.',
          symbols: [{ k: 'chid', tex: '\\chi_d', m: 'desired heading from line-of-sight guidance', u: '\u00b0', v: fx(los1.chid, 1), g: 'Guidance and control' },
            { k: 'chipath', tex: '\\chi_{\\mathrm{path}}', m: 'direction of the path segment, clockwise from north', u: '\u00b0', v: '0 (north)', g: 'Guidance and control' },
            { k: 'ey', tex: 'e_y', m: 'cross-track error, positive when the boat is to starboard of the path', u: 'm', v: '1.0', g: 'Guidance and control' },
            { k: 'Delta', tex: '\\Delta', m: 'look-ahead distance', u: 'm', v: '2.5', g: 'Guidance and control' },
            { k: 'betahat', tex: '\\hat{\\beta}', m: 'measured sideslip (drift angle), capped at \u00b120\u00b0', u: '\u00b0', v: '0, then 3', g: 'Guidance and control' }],
          example: '<p>The boat is 1.0 m to starboard of a north-going path. The correction is ' + M('\\operatorname{atan2}(-1.0,\\ 2.5) = ' + fx(los1.corr, 1) + '^\\circ') + ', so with no sideslip ' + M('\\chi_d = 0^\\circ ' + fx(los1.corr, 1) + '^\\circ = ' + fx(los1.chid, 1) + '^\\circ') + ': steer 21.8\u00b0 to port. If the hull is also sliding 3\u00b0 to starboard, the bow must point 3\u00b0 further to port to make good the same line: ' + M('\\chi_d = ' + fx(los2.chid, 1) + '^\\circ') + '.</p>' }) +
        '<figure class="fig"><div class="frame">' + losFigure() + '</div><figcaption><b>' + fL + '.</b> Line-of-sight geometry for the worked example, to scale: the boat 1.0 m to starboard of the path aims at the point 2.5 m ahead of its projection on the path.</figcaption></figure>' +
        '<h3>\u25b6 Line-of-sight widget</h3>' +
        '<p>Drag the boat, or its heading handle, and change the look-ahead. The dashed line predicts the next 40 s with the full heading controller and the vessel model of Section 3.</p>' +
        APP.widgetLosHTML() +

        H2('pid', 'Primer: PID control') +
        '<p>Holding a car in its lane, you turn the wheel in proportion to how far off you are; that is the proportional part. If the car is already swinging back quickly, you ease off early; that is the derivative part. If a steady crosswind keeps pushing you aside, you end up holding a little extra steering that builds up over time; that is the integral part. A ' + AB('PID') + ' controller adds the three. The comparators use one to turn the desired heading from LOS guidance into a rudder command.</p>' +
        EQ({ label: 'Method', title: 'Heading PID', tex: '\\begin{gathered} e = \\chi_d - \\psi \\\\[4pt] a_\\delta = \\operatorname{clip}\\!\\left(K_p\\,e - K_d\\,r + I,\\ -1,\\ 1\\right) \\end{gathered}',
          words: 'the rudder command grows with the heading error, is eased by the yaw rate the boat already has, and carries a small, capped memory of past error.',
          symbols: [{ k: 'eh', tex: 'e', m: 'heading error: desired heading minus heading', u: '\u00b0', v: fx(eP, 1), g: 'Guidance and control' },
            { k: 'adelta', tex: 'a_\\delta', m: 'rudder command, between \u22121 and 1 (full rudder); positive turns to starboard in these laws', u: '\u2014', v: fx(aPD, 3), g: 'Rudder, propeller and servo' },
            { k: 'Kpid', tex: 'K_p,\\ K_d,\\ K_i', m: 'proportional, derivative and integral gains', u: '1/\u00b0, 1/(\u00b0/s), 1/(\u00b0\u00b7s)', v: '1/35, 1/18, 1/600', g: 'Guidance and control' },
            { k: 'Iint', tex: 'I', m: 'integral term: the error accumulated over time, times the integral gain; active only while |e| < 10\u00b0, capped at 0.15', u: '\u2014', v: '0', g: 'Guidance and control' },
            { k: 'r', tex: 'r', m: 'yaw rate', u: '\u00b0/s', v: '\u22123', g: 'Vessel' }],
          example: '<p>Continuing the LOS example with the boat pointing north: ' + M('e = ' + fx(eP, 1) + '^\\circ') + ', so the proportional part is ' + M(fx(eP, 1) + '/35 = ' + fx(Pt, 3)) + ', 62 % of full rudder to port. Suppose the boat is already turning to port at ' + M('r = -3^\\circ/\\mathrm{s}') + ': the derivative part adds ' + M('+3/18 = ' + fx(Dt, 3)) + ', easing the command to ' + M('a_\\delta = ' + fx(aPD, 3)) + '. The integral stays at zero because the error is larger than 10\u00b0.</p>',
          note: '<b>Sign.</b> For these laws to steer the right way, a positive ' + M('a_\\delta') + ' must turn the boat to starboard. Section 3\u2019s rudder equations, as written, turn it to port for a positive ' + M('\\delta') + '; one of the two conventions needs checking ' + VERIFY('rudder sign convention') + '. The widgets follow the control laws.' }) +
        '<p>Two inner loops sit below the heading PID. The dynamic window approach asks for a yaw rate rather than a heading, and every comparator asks for a speed. Both loops use ' + T('feedforward') + ': they first compute the command that should produce the ' + T('setpoint') + ', then correct it by the error.</p>' +
        EQ({ label: 'Method', title: 'Yaw-rate and speed loops', tex: '\\begin{gathered} a_\\delta = \\frac{r_d}{10.4^\\circ/\\mathrm{s}} + 0.08\\,(r_d - r) \\\\[4pt] n = \\frac{u_d}{s_n} + 6\\,(u_d - u) \\end{gathered}',

            { k: 'ud', tex: 'u_d', m: 'desired speed', u: 'm/s', v: '0.279', g: 'Guidance and control' },
            { k: 'sn', tex: 's_n', m: 'steady speed per rpm-unit (0.558 m/s at 6)', u: 'm/s', v: fx(K.spr, 3), g: 'Guidance and control' },
            { k: 'n', tex: 'n', m: 'propeller command in rpm-units', u: 'rpm-units', v: fx(nSp, 2), g: 'Rudder, propeller and servo' },
            { k: 'u', tex: 'u', m: 'surge speed', u: 'm/s', v: '0.558', g: 'Vessel' }],
          example: '<p>Asked for ' + M('r_d = 4.5^\\circ/\\mathrm{s}') + ' while turning at 2\u00b0/s: ' + M('a_\\delta = 4.5/10.4 + 0.08 \\times 2.5 = ' + fx(aYaw, 3)) + ', 63 % of full rudder to starboard. Asked to slow from 0.558 to 0.279 m/s, the propeller command is</p>' + MD('n = 0.279/0.093 + 6\\,(0.279 - 0.558) = ' + fx(nSp, 2) + '\\ \\text{rpm-units}') + '<p>below the 3 that would hold 0.279 m/s, so the boat decelerates; the command rises toward 3 as the speed drops. The 10.4\u00b0/s in the feedforward is the stated yaw rate at full rudder (' + XS(3, 'params') + ').</p>' }) +
        '<figure class="fig wide"><div class="frame">' + pidFigure() + '</div><figcaption><b>' + fP + '.</b> The heading loop. P reacts to the error, I to the accumulated error, D to how fast the heading is changing, measured here by the yaw rate.</figcaption></figure>' +

        H2('vo', 'Primer: velocity obstacles') +
        '<p>Crossing a street, you do not only ask whether a car is in your way now. You ask whether, walking at the speed and in the direction you intend, you would meet it. A ' + AB('VO') + ' makes that question geometric ' + C('fiorini1998') + '. It is the set of own-ship velocities that would bring the two vessels into contact within a time horizon, if the other vessel keeps its velocity. Drawn in the space of velocities, it is a ' + T('collisioncone') + ' whose tip sits at the other vessel\u2019s velocity: any velocity inside leads to contact, any velocity outside is safe for that horizon.</p>' +
        '<figure class="fig wide"><div class="frame">' + voPrimerFigure() + '</div><figcaption><b>' + fV + '.</b> A target crossing from starboard on a collision course. Left, the encounter. Right, the same situation in velocity space: holding course at cruise lies inside the cone; turning 40\u00b0 to starboard at the same speed lies outside. The 20 s horizon cuts the cone short of its apex, because a very slow approach cannot reach contact within 20 s. Hulls are approximated by circles for the drawing.</figcaption></figure>' +

        H2('dwa', 'LOS-PID with a dynamic window') +
        '<p>Before changing lanes, a driver imagines a handful of moves, discards the ones that would hit something, and takes the best of the rest. The dynamic window approach, or ' + AB('DWA') + ', does the same ' + C('fox1997') + '. Its name comes from the ' + T('dynwindow') + ': only commands the vessel can actually follow in the next few seconds are considered. The first comparator steers with LOS-PID until anything comes within 9 m (a track, a scan point ahead, or the boundary within a hull length). Then, at every 0.5 s decision, it runs five steps.</p>' +
        '<p><b>1. Candidates.</b> Yaw-rate set-points ' + M('r_d') + ' from \u22129 to +9\u00b0/s in steps of 2.25\u00b0/s, at speeds of 1.0, 0.5 and 0 times the nominal speed ' + M('U_{\\mathrm{nom}}') + ', each held for 3 or 6 s: 54 candidates, plus plain LOS-PID at two speeds, 56 in all.</p>' +
        '<p><b>2. A dynamic window through the real dynamics.</b> Each candidate is simulated in closed loop on the vessel model, with its delay, lag and inertia, for up to 16 s. It is not treated as an ideal arc, because this hull needs about 5 s to build a turn. After the hold time, the prediction hands back to LOS-PID.</p>' +
        '<p><b>3. Admissibility.</b> A candidate is inadmissible if the predicted hull comes within 0.20 m of a scan point or of the boundary during its first 5.5 m of travel, or within 0.20 m of a tracked target, predicted at constant velocity, within 10 s.</p>' +
        '<p><b>4. Objective.</b> Every admissible candidate is scored, and the highest score wins.</p>' +
        EQ({ label: 'Method', title: 'DWA objective', tex: 'G = 1.0\\,S_h + 1.0\\,S_c + 0.5\\,S_v + 0.6\\,S_p - 0.25\\,S_s',
          words: 'reward ending up pointing where LOS guidance wants, keeping clear of obstacles, keeping speed and staying near the path; penalize switching away from the previous choice.',
          symbols: [{ k: 'G', tex: 'G', m: 'DWA objective, maximized over admissible candidates', u: '\u2014', v: fx(Gex, 3), g: 'Dynamic window approach' },
            { k: 'Sdwa', tex: 'S_h,\\ S_c,\\ S_v,\\ S_p,\\ S_s', m: 'heading, clearance, velocity, path and smoothness terms', u: '\u2014', v: 'see below', g: 'Dynamic window approach' }],
          example: '<p>The four scored terms are defined in the next block. Take a candidate that ends 10\u00b0 off the LOS heading, keeps at least 0.9 m of clearance, averages 0.5 m/s and stays 0.4 m from the path on average, with no switch from the last choice:</p>' + MD('G = ' + fx(1 - 10 / 180, 3) + ' + ' + fx(0.9 / 1.5, 3) + ' + 0.5 \\times ' + fx(0.5 / 0.558, 3) + ' + 0.6 \\times ' + fx(1 - 0.4 / 2, 3) + ' = ' + fx(Gex, 3)) }) +
        EQ({ label: 'Method', title: 'The four scored terms', tex: '\\begin{aligned} S_h &= 1 - \\frac{|\\psi_{\\mathrm{LOS,end}} - \\hat{\\psi}_{\\mathrm{end}}|}{\\pi} & S_c &= \\frac{\\min(d_{\\min},\\ 1.5\\ \\mathrm{m})}{1.5\\ \\mathrm{m}} \\\\[4pt] S_v &= \\frac{\\bar{U}}{U_{\\mathrm{nom}}} & S_p &= 1 - \\frac{\\overline{|e_y|}}{2\\ \\mathrm{m}} \\end{aligned}',
          words: 'heading compares the predicted final heading with what LOS guidance would ask for at that spot; clearance credits up to 1.5 m of room; velocity credits average speed; path credits staying near the path. Smoothness measures the change from the last choice.',
          symbols: [{ k: 'psiLend', tex: '\\psi_{\\mathrm{LOS,end}},\\ \\hat{\\psi}_{\\mathrm{end}}', m: 'LOS heading at the predicted end point, and the predicted heading there', u: 'rad', v: '10\u00b0 apart', g: 'Dynamic window approach' },
            { k: 'dmin', tex: 'd_{\\min}', m: 'smallest predicted clearance to obstacles', u: 'm', v: '0.9', g: 'Dynamic window approach' },
            { k: 'Ubar', tex: '\\bar{U}', m: 'mean predicted speed', u: 'm/s', v: '0.5', g: 'Dynamic window approach' },
            { k: 'Unom', tex: 'U_{\\mathrm{nom}}', m: 'nominal speed, the cruise speed', u: 'm/s', v: '0.558', g: 'Guidance and control' },
            { k: 'eybar', tex: '\\overline{|e_y|}', m: 'mean absolute cross-track error over the prediction', u: 'm', v: '0.4', g: 'Dynamic window approach' }],
          example: '<p>For the candidate above: ' + M('S_h = 1 - 10/180 = ' + fx(1 - 10 / 180, 3)) + ', ' + M('S_c = 0.9/1.5 = 0.600') + ', ' + M('S_v = 0.5/0.558 = ' + fx(0.5 / 0.558, 3)) + ' and ' + M('S_p = 1 - 0.4/2 = 0.800') + '. How the smoothness term measures the change is not given in the source files ' + TBD('smoothness measure') + '.</p>' }) +
        '<p><b>5. Fallback.</b> If no candidate is admissible, the one whose first violation comes latest is taken, and among ties the one with the most clearance.</p>' +
        '<div class="callout"><span class="h">Knows obstacles, not rules</span><p>Nothing in the five steps mentions the collision regulations. The dynamic window avoids whatever it sees, in whichever direction scores best. That makes it the \u201cno COLREGs\u201d reference: it shows what avoidance looks like without rules.</p></div>' +
        '<figure class="fig wide"><div class="frame">' + pipelineFigure() + '</div><figcaption><b>' + fPipe + '.</b> The two comparators\u2019 decision pipelines, run every 0.5 s. The COLREGs velocity obstacle is described in ' + XS(4, 'colregsvo') + '.</figcaption></figure>' +

        H2('dwawidget', '\u25b6 Dynamic window widget') +
        '<p>All 56 candidates are predicted through the vessel model and drawn: inadmissible ones dashed and crossed out where they first break the 0.20 m margin, admissible ones colored by their score, the winner thick. Move the weights to see the choice change; drag the panel or the target to change the scene.</p>' +
        APP.widgetDwaHTML() +

        H2('colregsvo', 'The COLREGs velocity obstacle') +
        '<p>The second comparator adds the rules to velocity obstacles, following ' + APP.Cn('kuwata2014') + '. It runs eight steps at every decision.</p>' +
        '<p><b>1. Candidates.</b> Course offsets from \u221290\u00b0 to +90\u00b0 in 5\u00b0 steps about the present heading, plus the LOS course, each at 1, 0.75, 0.5, 0.25 and 0 times ' + M('U_{\\mathrm{nom}}') + ': up to 190 candidates.</p>' +
        '<p><b>2. Own-ship motion model.</b> Each candidate is a turn toward the new course at 6\u00b0/s after a 1 s lag, with the speed approaching its new value exponentially (time constants 60 s when slowing, 20 s when speeding up), sampled every 0.25 s. This is a simpler model than the one the dynamic window uses.</p>' +
        '<p><b>3. The hard velocity obstacle.</b> A candidate is rejected if, holding it, the own hull comes within 0.20 m of a target\u2019s hull within 20 s (the target at constant velocity), or within 0.15 m of a scan point or 0.05 m of the boundary within 10 s.</p>' +
        '<p><b>4. Classification with open-water roles.</b> The encounter is classified from the target\u2019s relative bearing ' + M('\\alpha') + ', measured here from \u2212180\u00b0 to +180\u00b0 and positive to starboard, and from the two speeds. The roles are those of open water, not the narrow-channel convention this study adopts (' + XS(2, 'classes') + ').</p>' +
        '<div class="tbl-wrap"><table><thead><tr><th>Class</th><th>Condition</th><th>Own-ship role</th></tr></thead><tbody>' +
        '<tr><td>Being overtaken</td><td>' + M('|\\alpha| \\ge 112.5^\\circ') + '</td><td>stand on</td></tr>' +
        '<tr><td>Overtaking</td><td>own ship at least 112.5\u00b0 off the target\u2019s bow, and faster</td><td>give way</td></tr>' +
        '<tr><td>Head-on</td><td>' + M('|\\alpha| \\le 22.5^\\circ') + ' and headings within 22.5\u00b0 of reciprocal</td><td>give way</td></tr>' +
        '<tr><td>Crossing, target to starboard</td><td>otherwise, ' + M('\\alpha > 0') + '</td><td>give way</td></tr>' +
        '<tr><td>Crossing, target to port</td><td>otherwise, ' + M('\\alpha < 0') + '</td><td>stand on</td></tr>' +
        '</tbody></table></div>' +
        '<figure class="fig"><div class="frame">' + sectorFigure() + '</div><figcaption><b>' + fSec + '.</b> The open-water classification drawn around the own ship. The stern sector and the two crossing sectors are decided by bearing alone; head-on and overtaking also use the headings and speeds.</figcaption></figure>' +
        '<p><b>5. The COLREGs constraint.</b> In the classes where the own ship gives way, and while the encounter is ' + T('liveenc', 'live') + ' (closing, with a predicted miss under 2.5 m within 20 s), every candidate must also make the relative velocity pass to starboard of the line of sight. In the words of the rules: alter to starboard and pass astern.</p>' +
        EQ({ label: 'Method', title: 'The starboard constraint', tex: '(\\mathbf{p}_{\\mathrm{TS}} - \\mathbf{p}_{\\mathrm{OS}}) \\times (\\mathbf{v}_{\\mathrm{OS}} - \\mathbf{v}_{\\mathrm{TS}}) < 0',
          words: 'the own ship\u2019s velocity relative to the target must point to the starboard side of the line from the own ship to the target.',
          symbols: [{ k: 'ptsos', tex: '\\mathbf{p}_{\\mathrm{OS}},\\ \\mathbf{p}_{\\mathrm{TS}}', m: 'positions of the own ship and the target (east, north)', u: 'm', v: '(0, 0), (5, 5)', g: 'Notation and conventions' },
            { k: 'vv', tex: '\\mathbf{v}_{\\mathrm{OS}},\\ \\mathbf{v}_{\\mathrm{TS}}', m: 'velocities of the own ship and the target', u: 'm/s', v: 'see example', g: 'Encounter geometry' },
            { k: 'wrel', tex: '\\mathbf{v}_{\\mathrm{OS}} - \\mathbf{v}_{\\mathrm{TS}}', m: 'velocity of the own ship relative to the target (the opposite sign of Section 2\u2019s relative velocity)', u: 'm/s', v: 'see example', g: 'Velocity obstacles' }],
          example: '<p>In two dimensions the cross product ' + M('\\mathbf{a} \\times \\mathbf{b} = a_x b_y - a_y b_x') + ' is negative when ' + M('\\mathbf{b}') + ' points clockwise, that is to starboard, of ' + M('\\mathbf{a}') + '. The own ship heads north at 0.558 m/s; the target is at (5, 5) m heading west at 0.558 m/s. Holding course, the relative velocity is (0.558, 0.558) m/s, exactly along the line of sight: a collision course, and a cross product of zero. Turned 30\u00b0 to starboard, the own velocity is (0.279, 0.483) m/s and the relative velocity (0.837, 0.483) m/s:</p>' + MD('5 \\times 0.483 - 5 \\times 0.837 = ' + fx(crossA, 2) + ' < 0') + '<p>which is allowed. Turned 30\u00b0 to port instead, the relative velocity is (0.279, 0.483) m/s and the product is ' + M('+' + fx(crossB, 2)) + ': forbidden, even though that turn might also avoid contact.</p>' }) +
        '<p><b>6. Standing on (Rule 17).</b> When the own ship is the stand-on vessel, it holds course and speed as long as the preferred candidate stays clear for more than 12 s. Only then does it act.</p>' +
        '<p><b>7. Cost.</b> Among the candidates still allowed, the one with the lowest cost is chosen.</p>' +
        EQ({ label: 'Method', title: 'COLREGs-VO cost', tex: 'J = 1.0\\,\\frac{|\\chi - \\chi_{\\mathrm{LOS}}|}{\\pi} + 0.5\\,\\frac{\\max(0,\\ U_{\\mathrm{pref}} - U)}{U_{\\mathrm{pref}}} + 1.0\\,J_{\\mathrm{prox}} + 0.3\\,\\frac{|\\chi - \\chi_{\\mathrm{prev}}|}{\\pi}',
          words: 'prefer candidates close to the LOS course, near the preferred speed, away from static obstacles, and close to the previous choice.',
          symbols: [{ k: 'J', tex: 'J', m: 'COLREGs-VO cost, minimized over allowed candidates', u: '\u2014', v: fx(J1, 3), g: 'Velocity obstacles' },
            { k: 'chi', tex: '\\chi,\\ U', m: 'course and speed of a candidate', u: '\u00b0, m/s', v: '30, 0.558', g: 'Velocity obstacles' },
            { k: 'chiLOS', tex: '\\chi_{\\mathrm{LOS}},\\ \\chi_{\\mathrm{prev}}', m: 'LOS course, and the course chosen at the previous decision', u: '\u00b0', v: '0, 0', g: 'Velocity obstacles' },
            { k: 'Upref', tex: 'U_{\\mathrm{pref}}', m: 'preferred speed', u: 'm/s', v: '0.558 ' + VERIFY('taken as U_nom'), g: 'Velocity obstacles' },
            { k: 'Jprox', tex: 'J_{\\mathrm{prox}}', m: 'static-proximity term: grows near static obstacles', u: '\u2014', v: '0 in open water; form ' + TBD(''), g: 'Velocity obstacles' }],
          example: '<p>In open water with nothing static nearby: turning 30\u00b0 to starboard at full speed costs ' + M('J = 30/180 + 0.3 \\times 30/180 = ' + fx(J1, 3)) + '; holding course at half speed costs ' + M('J = 0.5 \\times 0.5 = ' + fx(J2, 3)) + '. The turn is cheaper, so if both are allowed the comparator turns.</p>' }) +
        '<p><b>8. Fallback.</b> If no candidate satisfies both the velocity obstacle and the COLREGs constraint, the constraint is dropped rather than accepting a collision, as Kuwata and colleagues do. If nothing is safe even then, the candidate whose first contact comes latest is taken.</p>' +
        '<p><b>The narrow-channel variant.</b> A second version of this comparator uses the narrow-channel convention adopted in this study instead of the open-water roles: it gives way to a crossing target from either side. Comparing the two versions isolates what the convention itself changes.</p>' +

        H2('vowidget', '\u25b6 Velocity obstacle widget') +
        '<p>The right panel is velocity space: the point you drag is the own ship\u2019s velocity. The shaded cone is forbidden by collision; the hatched half-plane, when it appears, is forbidden by the COLREGs constraint. The dots are the comparator\u2019s candidates, colored the same way, and the star is the one it would pick. Try crossing from port under both conventions.</p>' +
        APP.widgetVoHTML() +

        H2('compare', 'What each method knows, assumes and cannot do') +
        '<div class="tbl-wrap wide"><table class="cmp"><thead><tr><th>Method</th><th>Knows</th><th>Assumes</th><th>Cannot do</th></tr></thead><tbody>' +
        '<tr><td><b>APF</b> (Paper 2\u2019s comparator, background)</td><td>the goal and the obstacles around it</td><td>that following the summed forces leads somewhere safe</td><td>escape a local minimum between close obstacles; apply any rule</td></tr>' +
        '<tr><td><b>LOS-PID</b></td><td>the path and its own heading, yaw rate and sideslip</td><td>that the path is clear</td><td>avoid anything; it only follows the path</td></tr>' +
        '<tr><td><b>LOS-PID + DWA</b></td><td>scan points, the map boundary and tracked targets, and the full vessel model</td><td>targets keep constant velocity for 10 s; a good move is among its 56 candidates</td><td>apply the collision regulations: it knows obstacles, not rules</td></tr>' +
        '<tr><td><b>COLREGs-VO</b></td><td>the same obstacles and tracks, plus the open-water roles</td><td>targets keep constant velocity for 20 s; the own ship turns at 6\u00b0/s after a 1 s lag</td><td>use the narrow-channel convention; keep the side constraint when no compliant candidate is safe (it drops it)</td></tr>' +
        '<tr><td><b>COLREGs-VO, narrow-channel variant</b></td><td>the same, with the convention of this study</td><td>the same</td><td>keep the side constraint when no compliant candidate is safe</td></tr>' +
        '</tbody></table></div>' +
        '<p>How these comparators and the learned policies perform against each other is reported in the paper.</p>';
    },
    mount(el) {
      APP.mountLos(el.querySelector('#los-widget'));
      APP.mountDwa(el.querySelector('#dwa-widget'));
      APP.mountVo(el.querySelector('#vo-widget'));
    },
    takeaways: ['Line-of-sight guidance turns a path into a desired heading by aiming 2.5 m ahead, and a PID loop turns heading error into rudder; potential fields and velocity obstacles are the two classic ideas for avoidance, and potential fields can trap a vessel between close obstacles.',
      'The dynamic window comparator predicts 56 candidate commands through the full vessel model, rejects any that come within 0.20 m of something, and scores the rest; it knows obstacles, not rules.',
      'The COLREGs velocity obstacle rejects candidates that lead to contact, requires give-way passes to starboard of the line of sight while an encounter is live, stands on under Rule 17, and drops the rule before accepting a collision; a variant applies the narrow-channel convention instead.'],
  });
})();

</script>
<script>
/* ====== MODULE: w5.js ====== */
/* ===================================================================
   SECTION 5 WIDGETS — discount, PPO clipping, TQC quantiles, network
   =================================================================== */
(function () {
  'use strict';
  const f1 = x => (Math.round(x * 10) / 10).toString();
  const fx = (x, n) => (Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n).replace('-', '\u2212');
  const seg = (ctl, items, on) => '<div class="seg" role="group" data-ctl="' + ctl + '">' + items.map(([k, t]) => '<button type="button" data-v="' + k + '" aria-pressed="' + (k === on ? 'true' : 'false') + '">' + t + '</button>').join('') + '</div>';
  const ro = (k, label) => '<div class="ro"><span>' + label + '</span><span data-ro="' + k + '">\u2014</span></div>';
  const txt = (x, y, s, cls, anchor, extra) => '<text x="' + f1(x) + '" y="' + f1(y) + '" class="' + (cls || 'lbl-s') + '" text-anchor="' + (anchor || 'start') + '"' + (extra || '') + '>' + s + '</text>';
  const sub = (b, s) => b + '<tspan dy="3.5" font-size="76%">' + s + '</tspan><tspan dy="-3.5">\u200b</tspan>';
  function wireSeg(root, ctl, fn, offs) {
    const el = root.querySelector('[data-ctl="' + ctl + '"]');
    const h = e => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); fn(b.dataset.v); };
    el.addEventListener('click', h); offs.push(() => el.removeEventListener('click', h));
  }
  function on(offs, el, ev, fn) { el.addEventListener(ev, fn); offs.push(() => el.removeEventListener(ev, fn)); }

  /* ================= discount ================= */
  const G0 = 0.951, DT = 0.5;
  APP.widgetDiscHTML = function () {
    const M = APP.M;
    return '<div class="widget wide" id="disc-widget">' +
      '<div class="w-head"><div class="w-title"><span class="play-mark" aria-hidden="true">\u25b6</span>How far ahead do rewards still count?</div><div class="w-sub">change the discount and the time to the goal</div></div>' +
      '<div class="w-body">' +
      '<div class="controls"><div class="ctl-group"><label class="ctl-label" for="disc-g">Discount ' + M('\\gamma') + ' per 0.5 s</label><input id="disc-g" type="range" min="0.8" max="0.995" step="0.001" value="' + G0 + '"><span class="rangeval" data-ro="g">0.951</span></div>' +
      '<div class="ctl-group"><label class="ctl-label" for="disc-t">Goal reached in</label><input id="disc-t" type="range" min="0" max="40" step="0.5" value="10"><span class="rangeval" data-ro="t">10 s</span></div>' +
      '<button type="button" class="btn" data-act="reset">Back to 0.951</button></div>' +
      '<div class="disc-svg" data-svg="disc"></div>' +
      '<div class="readout ro-grid">' + ro('hz', 'Effective horizon ' + M('\\Delta t/(1-\\gamma)')) + ro('half', 'Weight halves after') + ro('w', 'Weight of the goal step') +
      ro('goal', 'A +100 goal is worth now') + ro('coll', 'A \u2212300 collision then is worth') + ro('phys', 'Same discount per 0.1 s') + '</div>' +
      '</div>' +
      '<div class="w-foot"><p>Each bar is the weight ' + M('\\gamma^k') + ' that a reward ' + M('k') + ' decisions ahead receives in the return. The goal (+100) and collision (\u2212300) rewards are the study\u2019s terminal rewards (Section 7); the small rewards along the way are left out here.</p></div></div>';
  };
  APP.mountDisc = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s), offs = [];
    const box = q('[data-svg="disc"]'), eg = q('#disc-g'), et = q('#disc-t');
    let W = 660, K = 80;
    const H = 230, L = 44, R = 12, T = 14, B = 34;
    const X = k => L + (k + 0.5) * (W - L - R) / (K + 1), Y = w => T + (1 - w) * (H - T - B);
    function render() {
      const narrow = box.clientWidth > 0 && box.clientWidth < 520;
      W = narrow ? 400 : 660; K = narrow ? 60 : 80;
      const g = +eg.value, tg = +et.value, kg = Math.round(tg / DT);
      const hz = DT / (1 - g), half = DT * Math.log(0.5) / Math.log(g);
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart of the discount weight for rewards up to 40 s ahead.">';
      for (let yv = 0; yv <= 1.001; yv += 0.25) s += '<path d="M' + L + ' ' + f1(Y(yv)) + 'H' + (W - R) + '" style="stroke: var(--rule-2)"/>' + txt(L - 6, Y(yv) + 4, yv.toFixed(2), 'lbl-s', 'end');
      const bw = (W - L - R) / (K + 1) * 0.72;
      for (let k = 0; k <= K; k++) {
        const w = Math.pow(g, k), hit = k === kg;
        s += '<rect x="' + f1(X(k) - bw / 2) + '" y="' + f1(Y(w)) + '" width="' + f1(bw) + '" height="' + f1(Y(0) - Y(w)) + '" style="fill: ' + (hit ? 'var(--decision)' : 'var(--testing)') + '" fill-opacity="' + (hit ? 1 : 0.55) + '"/>';
      }
      const kh = hz / DT;
      if (kh <= K) { const xh = X(kh - 0.5); s += '<path d="M' + f1(xh) + ' ' + T + 'V' + f1(Y(0)) + '" style="stroke: var(--ink-2)" stroke-dasharray="4 4"/>' + txt(xh + 5, T + 12, 'effective horizon ' + fx(hz, 1) + ' s', 'lbl-s', 'start'); }
      s += '<path d="M' + L + ' ' + f1(Y(0)) + 'H' + (W - R) + '" style="stroke: var(--ink-3)"/>';
      for (let ts = 0; ts <= K * DT; ts += narrow ? 10 : 5) s += txt(X(ts / DT), H - B + 16, ts + ' s', 'lbl-s', 'middle');
      s += txt((W + L) / 2, H - 4, narrow ? 'time ahead (one bar per 0.5 s)' : 'time ahead (each bar is one 0.5 s decision)', 'lbl-s', 'middle');
      if (kg <= K) s += txt(X(kg), Y(Math.pow(g, kg)) - 6, 'goal', 'lbl-b', 'middle', ' style="fill: var(--decision)"');
      box.innerHTML = s + '</svg>';
      const set = (k, t) => { q('[data-ro="' + k + '"]').textContent = t; };
      const wg = Math.pow(g, kg);
      set('g', g.toFixed(3)); set('t', (tg % 1 ? tg.toFixed(1) : tg) + ' s');
      set('hz', fx(hz, 1) + ' s (' + fx(hz / DT, 1) + ' decisions)'); set('half', fx(half, 1) + ' s'); set('w', fx(wg, 3));
      set('goal', fx(100 * wg, 1)); set('coll', fx(-300 * wg, 1)); set('phys', fx(Math.pow(g, 0.2), 4));
    }
    on(offs, eg, 'input', render); on(offs, et, 'input', render);
    on(offs, q('[data-act="reset"]'), 'click', () => { eg.value = G0; render(); });
    on(offs, window, 'resize', render);
    render();
    APP.onCleanup(() => offs.forEach(f => f()));
  };

  /* ================= PPO clipping ================= */
  APP.widgetClipHTML = function () {
    const M = APP.M;

      s += '<circle cx="228" cy="360" r="13" style="fill: var(--surface); stroke: var(--ink-2)" stroke-width="1.6"/>' + txt(228, 365, '\u00d7', 'lbl-b', 'middle') + txt(228, 394, pres ? 'gate open' : 'gate: 0', 'lbl-s', 'middle', pres ? '' : ' style="fill: var(--target)"');
      const aS = 'stroke: var(--ink-3); stroke-width: 1.4';
      ['lidar', 'boundary', 'ego', 'path'].forEach((k, j) => { s += arrow(188, ys[k] + hs[k] / 2, 260, 82 + j * 20, aS); });
      s += arrow(188, 420, 260, 164, aS, true) + txt(214, 262, 'previous action', 'lbl-s', 'middle', ' transform="rotate(-74 214 262)"');
      s += arrow(188, 316, 216, 350, aS) + arrow(188, 384, 216, 370, aS) + arrow(241, 360, 260, 360, aS);
      // features
      s += '<rect x="444" y="176" width="86" height="118" rx="8" style="fill: var(--surface-2); stroke: var(--ink-3)"/>' + txt(487, 230, 'Features', 'lbl-b', 'middle') + txt(487, 248, '160', 'lbl-s', 'middle');
      s += arrow(412, 120, 442, 206, aS) + arrow(412, 360, 442, 266, aS + (pres ? '' : '; opacity: .5'));
      s += txt(436, 150, '128', 'lbl-s', 'end') + txt(436, 330, '32', 'lbl-s', 'end');
      const hc = 'fill: var(--vessel-fill); stroke: var(--vessel)';
      const rec = L === 'rppo', hx = rec ? 640 : 580, hw = W - 10 - hx;
      if (rec) {
        s += '<rect x="552" y="62" width="70" height="60" rx="8" style="fill: var(--testing-fill); stroke: var(--testing)"/>' + txt(587, 88, 'LSTM', 'lbl-b', 'middle') + txt(587, 106, '256', 'lbl-s', 'middle');
        s += '<rect x="552" y="348" width="70" height="60" rx="8" style="fill: var(--testing-fill); stroke: var(--testing)"/>' + txt(587, 374, 'LSTM', 'lbl-b', 'middle') + txt(587, 392, '256', 'lbl-s', 'middle');
        s += arrow(530, 210, 550, 100, aS) + arrow(530, 262, 550, 372, aS) + arrow(622, 92, hx - 2, 92, aS) + arrow(622, 378, hx - 2, 378, aS);
      } else s += arrow(530, 206, hx - 2, 92, aS) + arrow(530, 262, hx - 2, 378, aS);
      const headBox = (y, title, l1, l2) => '<rect x="' + hx + '" y="' + y + '" width="' + hw + '" height="104" rx="8" style="' + hc + '"/>' + txt(hx + hw / 2, y + 30, title, 'lbl-b', 'middle') + txt(hx + hw / 2, y + 54, l1, 'lbl-s', 'middle') + txt(hx + hw / 2, y + 76, l2, 'lbl-s', 'middle');
      s += headBox(40, 'Actor head', '256 \u2192 256, ReLU', 'action (2)');
      s += headBox(326, L === 'sac' || L === 'tqc' ? 'Critic heads \u00d7 2' : 'Critic head', '256 \u2192 256, ReLU', L === 'tqc' ? '25 quantiles each' : L === 'ppo' || rec ? 'value V(s)' : 'Q(s, a) each');
      if (L === 'sac' || L === 'tqc') s += arrow(hx + hw / 2, 146, hx + hw / 2, 324, 'stroke: var(--vessel); stroke-width: 1.4', true) + txt(hx + hw / 2 + 6, 240, 'action a', 'lbl-s', 'start');
      s += txt(hx + hw / 2, 28, 'rudder, propulsion', 'lbl-s', 'middle');
      q('[data-svg="net"]').innerHTML = s + '</svg>';
      const b = BR[st.sel];
      q('[data-ro="info"]').innerHTML = '<b>' + b.name + ' (' + b.n + ' values).</b> ' + b.text + (st.sel === 'target' && !pres ? ' <b>The presence bit is 0 now, so the target-slot encoder\u2019s input is gated to zero.</b>' : '') +
        '<br><b>' + ({ ppo: 'PPO', rppo: 'Recurrent PPO', sac: 'SAC', tqc: 'TQC' })[L] + '.</b> ' + hd.note + (L === 'rppo' ? APP.VERIFY('LSTM placement') + '.' : '') + ' Actor output: ' + hd.actor + '. Critic output: ' + hd.critic + '.';
      q('[data-svg="net"]').querySelectorAll('[data-br]').forEach(g => {
        const pick = () => { st.sel = g.dataset.br; render(); };
        g.addEventListener('click', pick); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
    }
    wireSeg(root, 'learner', v => { st.learner = v; render(); }, offs);
    on(offs, q('[data-opt="present"]'), 'change', e => { st.present = e.target.checked; if (!st.present) st.sel = 'target'; render(); });
    render();
    APP.onCleanup(() => offs.forEach(f => f()));
  };
})();

<script>
/* ====== MODULE: sec5.js ====== */
/* ===================================================================
   SECTION 5 — Reinforcement learning
   Settings from the facts file, Section 3 (learners and training protocol);
   the objective, horizon and terminal rewards from the formulation file.
   =================================================================== */
(function () {
  'use strict';
  const { M, MD, T, AB, C, FIGN, H2, EQ, VERIFY, TBD, XS } = APP;
  const fx = (x, n) => (Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n);
  const f1 = x => (Math.round(x * 10) / 10).toString();
  const g = 0.951, lam = 0.95, eps = 0.2;

  // ---------- registry additions ----------
  APP.SYMGROUPS.push('Reinforcement learning', 'Neural networks and memory', 'Policy optimization', 'Soft actor\u2013critic and TQC');
  Object.assign(APP.ABBR, {
    MDP: 'Markov decision process', GAE: 'generalized advantage estimation', LSTM: 'long short-term memory',
    ReLU: 'rectified linear unit', KL: 'Kullback\u2013Leibler (divergence)', SB3: 'Stable-Baselines3',
  });
  Object.assign(APP.TERMS, {
    agent: ['agent', 'The decision-maker in reinforcement learning. Here, the policy network that commands the boat.'],
    environment: ['environment', 'Everything the agent acts on and senses. Here, the simulator: vessel model, basin, obstacles, target and sensors.'],
    rlstate: ['state', 'Everything needed to predict what happens next. The agent does not see the state itself, only an observation of it.'],
    observation: ['observation', 'What the agent receives at each step. Here, 70 numbers built from the vessel\u2019s own LiDAR, map and estimated pose (Section 7).'],
    rlaction: ['action', 'What the agent sends back at each step. Here, a rudder command and a propulsion command, each between \u22121 and 1.'],
    reward: ['reward', 'A number the environment returns after each step, scoring how good that step was.'],
    rlreturn: ['return', 'The sum of all future rewards, each discounted by how far ahead it lies.'],
    discount: ['discount factor', 'The factor \u03b3 (below 1) by which a reward shrinks for every step it lies in the future.'],
    valuefn: ['value function', 'The return an agent can expect, on average, from a given state (V) or from a given state and action (Q).'],
    advantage: ['advantage', 'How much better an action is than the policy\u2019s average from that state: Q minus V.'],
    bellman: ['Bellman equation', 'The link between the value of a state and the value of the next one: reward now plus discounted value next.'],
    bootstrapping: ['bootstrapping (in RL)', 'Using the current value estimate of the next state inside the learning target, instead of waiting for the true outcome.'],
    exploration: ['exploration', 'Trying actions that are not the current best guess, to discover whether something better exists.'],
    exploitation: ['exploitation', 'Taking the action currently believed to be best.'],
    neuralnet: ['neural network', 'A function built from layers of weighted sums and simple nonlinear steps, whose many weights are adjusted during learning.'],
    gradient: ['gradient', 'The direction in which a small change of the parameters increases a quantity fastest. Learning follows the gradient in small steps.'],
    policygrad: ['policy gradient', 'Learning by adjusting the policy directly, so that actions that turned out better than expected become more likely.'],
    actorcritic: ['actor\u2013critic', 'A learner with two parts: the actor (the policy) proposes actions and the critic (a value function) judges them.'],
    onpolicy: ['on-policy', 'Learning only from experience collected by the current policy; the data is discarded after each update.'],
    offpolicy: ['off-policy', 'Learning from experience collected by earlier versions of the policy, stored in a replay buffer and reused.'],
    replay: ['replay buffer', 'A store of past transitions (state, action, reward, next state) from which an off-policy learner samples.'],
    surrogate: ['surrogate objective', 'A stand-in for the true objective that is easy to optimize on one batch of data and agrees with it for small changes.'],
    partialobs: ['partial observability', 'When one observation does not contain everything needed to act well, for example a target briefly hidden from view.'],
    entropy: ['entropy', 'A measure of how spread out, or random, a probability distribution is.'],
    temperature: ['temperature (SAC)', 'The weight \u03b1 on entropy in SAC\u2019s objective: how much randomness is worth compared with reward.'],
    targetnet: ['target network', 'A slowly updated copy of a critic, used to compute learning targets so that the targets do not chase themselves.'],
    overestimation: ['over-estimation bias', 'The tendency of learned values to come out too high, because picking the best-looking action favors estimates with upward errors.'],
    quantile: ['quantile', 'A value below which a given fraction of outcomes lies; 25 evenly spaced quantiles sketch a whole distribution.'],
    hyperparameter: ['hyperparameter', 'A setting of the learning algorithm itself, such as the learning rate or batch size, chosen before training.'],
    minibatch: ['minibatch', 'The small random subset of data used for one gradient step.'],
    epoch: ['epoch', 'One pass over all the data collected for an update.'],
  });
  const R = (cite, text, extra) => Object.assign({ cite, text }, extra || {});
  Object.assign(APP.REFS, {
    sutton2018: R('Sutton and Barto, 2018', 'Sutton, R. S., and Barto, A. G. (2018). <i>Reinforcement Learning: An Introduction</i>, 2nd ed., MIT Press.'),
    schulman2016: R('Schulman et al., 2016', 'Schulman, J., Moritz, P., Levine, S., Jordan, M. I., and Abbeel, P. (2016). High-dimensional continuous control using generalized advantage estimation. <i>International Conference on Learning Representations (ICLR)</i>. arXiv:1506.02438.'),
    schulman2017: R('Schulman et al., 2017', 'Schulman, J., Wolski, F., Dhariwal, P., Radford, A., and Klimov, O. (2017). Proximal policy optimization algorithms. arXiv:1707.06347.'),
    haarnoja2018: R('Haarnoja et al., 2018', 'Haarnoja, T., Zhou, A., Abbeel, P., and Levine, S. (2018). Soft actor-critic: Off-policy maximum entropy deep reinforcement learning with a stochastic actor. <i>Proceedings of the 35th International Conference on Machine Learning</i>, PMLR 80, 1861\u20131870.'),
    haarnoja2018b: R('Haarnoja et al., 2018b', 'Haarnoja, T., Zhou, A., Hartikainen, K., Tucker, G., Ha, S., Tan, J., Kumar, V., Zhu, H., Gupta, A., Abbeel, P., and Levine, S. (2018). Soft actor-critic algorithms and applications. arXiv:1812.05905.', { verify: true }),
    kuznetsov2020: R('Kuznetsov et al., 2020', 'Kuznetsov, A., Shvechikov, P., Grishin, A., and Vetrov, D. (2020). Controlling overestimation bias with truncated mixture of continuous distributional quantile critics. <i>Proceedings of the 37th International Conference on Machine Learning</i>, PMLR 119, 5556\u20135566.'),
    hochreiter1997: R('Hochreiter and Schmidhuber, 1997', 'Hochreiter, S., and Schmidhuber, J. (1997). Long short-term memory. <i>Neural Computation, 9</i>(8), 1735\u20131780.'),
    raffin2021: R('Raffin et al., 2021', 'Raffin, A., Hill, A., Gleave, A., Kanervisto, A., Ernestus, M., and Dormann, N. (2021). Stable-Baselines3: Reliable reinforcement learning implementations. <i>Journal of Machine Learning Research, 22</i>(268), 1\u20138.'),
  });

  // ---------- drawing helpers ----------
  const svgBox = (w, h, label, style) => '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + APP.esc(label) + '" style="' + (style || 'max-width: ' + w + 'px; margin: 0 auto') + '">';
  const sb = (base, s, rest) => base + '<tspan dy="3.5" font-size="76%">' + s + '</tspan><tspan dy="-3.5">' + (rest || '\u200b') + '</tspan>';
  const txt = (x, y, s, cls, anchor, extra) => FIG.text(x, y, s, cls || 'lbl-s', anchor || 'middle', extra);
  const box = (x, y, w, h, title, sub, style, sub2) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8" style="' + (style || 'fill: var(--surface); stroke: var(--rule)') + '"/>' +
    txt(x + w / 2, y + (sub ? (sub2 ? h / 2 - 10 : h / 2 - 3) : h / 2 + 5), title, 'lbl-b') + (sub ? txt(x + w / 2, y + (sub2 ? h / 2 + 6 : h / 2 + 13), sub) : '') + (sub2 ? txt(x + w / 2, y + h / 2 + 21, sub2) : '');
  const arr = (x1, y1, x2, y2, col, dash) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 7, c = col || 'var(--ink-2)';
    const p1 = [x2 - h * Math.cos(a - 0.45), y2 - h * Math.sin(a - 0.45)], p2 = [x2 - h * Math.cos(a + 0.45), y2 - h * Math.sin(a + 0.45)];
    return '<path d="M' + f1(x1) + ' ' + f1(y1) + 'L' + f1(x2) + ' ' + f1(y2) + '" style="stroke: ' + c + '" stroke-width="1.6" fill="none"' + (dash ? ' stroke-dasharray="4 3"' : '') + '/><path d="M' + f1(x2) + ' ' + f1(y2) + 'L' + f1(p1[0]) + ' ' + f1(p1[1]) + 'L' + f1(p2[0]) + ' ' + f1(p2[1]) + 'Z" style="fill: ' + c + '"/>'; };
  const pathArr = (d, x2, y2, ang, col, dash) => { const h = 7, c = col || 'var(--ink-2)', p1 = [x2 - h * Math.cos(ang - 0.45), y2 - h * Math.sin(ang - 0.45)], p2 = [x2 - h * Math.cos(ang + 0.45), y2 - h * Math.sin(ang + 0.45)];
    return '<path d="' + d + '" style="stroke: ' + c + '" stroke-width="1.6" fill="none"' + (dash ? ' stroke-dasharray="4 3"' : '') + '/><path d="M' + f1(x2) + ' ' + f1(y2) + 'L' + f1(p1[0]) + ' ' + f1(p1[1]) + 'L' + f1(p2[0]) + ' ' + f1(p2[1]) + 'Z" style="fill: ' + c + '"/>'; };
  const DEC = 'fill: var(--decision-fill); stroke: var(--decision)', VES = 'fill: var(--vessel-fill); stroke: var(--vessel)', PER = 'fill: var(--perception-fill); stroke: var(--perception)', TST = 'fill: var(--testing-fill); stroke: var(--testing)', NEU = 'fill: var(--surface-2); stroke: var(--ink-3)';

  // ---------- figures ----------
  function loopFigure() {
    const w = 620, h = 250;
    let s = svgBox(w, h, 'The agent-environment loop: the agent sends an action, the environment returns an observation and a reward, every 0.5 s.');
    s += box(20, 66, 190, 104, 'Agent', 'the policy network', DEC, 'decides every 0.5 s');
    s += '<rect x="380" y="30" width="220" height="186" rx="10" style="' + VES + '"/>' + txt(490, 56, 'Environment', 'lbl-b') + txt(490, 74, 'vessel model, basin, obstacles,') + txt(490, 90, 'the other vessel, sensors');
    s += '<rect x="410" y="110" width="160" height="58" rx="7" style="fill: var(--surface); stroke: var(--ink-3)" stroke-dasharray="4 3"/>' + txt(490, 134, sb('state s', 't'), 'lbl-b') + txt(490, 152, 'hidden from the agent');
    s += arr(210, 92, 378, 92, 'var(--decision)') + txt(294, 82, sb('action a', 't'), 'lbl-b', 'middle', ' style="fill: var(--decision)"') + txt(294, 108, 'rudder, propulsion');
    s += arr(378, 150, 212, 150, 'var(--perception)') + txt(294, 140, sb('observation o', 't+1'), 'lbl-b', 'middle', ' style="fill: var(--perception)"') + txt(294, 166, '70 numbers from its sensors');
    s += pathArr('M378 200H115V172', 115, 172, -Math.PI / 2, 'var(--target)') + txt(294, 194, sb('reward r', 't'), 'lbl-b', 'middle', ' style="fill: var(--target)"') + txt(294, 216, 'one number: how good was that step?');
    return s + '</svg>';
  }

  function bellmanFigure() {
    const w = 660, h = 180;
    let s = svgBox(w, h, 'Values of states approaching the goal: each is 0.951 times the next, when the rewards on the way are zero.');
    const n = 6, x0 = 52, dx = 92, y = 104;
    s += '<path d="M30 ' + y + 'H' + (x0 + n * dx) + '" style="stroke: var(--ink-3)" stroke-dasharray="5 5"/>';
    for (let i = 0; i < n; i++) {
      const k = n - i, x = x0 + i * dx, V = 100 * Math.pow(g, k - 1);
      s += '<circle cx="' + x + '" cy="' + y + '" r="16" style="' + DEC + '"/>' + txt(x, y + 5, sb('s', k === 1 ? 'T\u22121' : 'T\u2212' + k), 'lbl-s');
      s += txt(x, y - 30, 'V = ' + fx(V, 1), 'lbl-b');
      if (i < n - 1) s += pathArr('M' + (x + dx - 18) + ' ' + (y + 24) + 'Q' + (x + dx / 2) + ' ' + (y + 52) + ' ' + (x + 20) + ' ' + (y + 24), x + 20, y + 24, Math.atan2(-14, -10), 'var(--ink-3)') + txt(x + dx / 2, y + 58, '\u00d7 0.951', 'lbl-s');
    }
    const gx = x0 + n * dx;
    s += '<path d="M' + gx + ' ' + (y + 18) + 'V' + (y - 30) + '" style="stroke: var(--ink)" stroke-width="2"/><path d="M' + gx + ' ' + (y - 30) + 'L' + (gx + 26) + ' ' + (y - 22) + 'L' + gx + ' ' + (y - 14) + 'Z" style="fill: var(--decision)"/>';
    s += txt(gx, y + 36, 'goal: +100', 'lbl-b') + txt(gx, y + 52, 'episode ends');
    s += pathArr('M' + (gx - 8) + ' ' + (y + 22) + 'Q' + (gx - dx / 2 + 6) + ' ' + (y + 52) + ' ' + (gx - dx + 20) + ' ' + (y + 24), gx - dx + 20, y + 24, Math.atan2(-14, -10), 'var(--ink-3)');
    s += txt(20, 24, 'Stepping back from the goal, one decision at a time (rewards on the way taken as zero):', 'lbl-s', 'start');
    return s + '</svg>';
  }
  function exploreFigure() {
    const w = 580, h = 220, L = 40, R = 16, Tp = 20, B = 40;
    const X = a => L + (a + 1) / 2 * (w - L - R), mu = 0.3;
    const pdf = (a, sd) => Math.exp(-0.5 * Math.pow((a - mu) / sd, 2)) / (sd * Math.sqrt(2 * Math.PI));
    const ymax = pdf(mu, 0.1), Y = v => Tp + (1 - v / ymax) * (h - Tp - B);
    let s = svgBox(w, h, 'Two bell curves over the rudder command: a wide one for exploring and a narrow one for exploiting, both centered on the same preferred command.');
    s += '<path d="M' + L + ' ' + (h - B) + 'H' + (w - R) + '" style="stroke: var(--ink-3)"/>';
    [-1, -0.5, 0, 0.5, 1].forEach(a => { s += txt(X(a), h - B + 16, a); });
    s += txt((w + L) / 2, h - 6, sb('rudder command a', '\u03b4', ' (negative: port, positive: starboard)'));
    [[0.5, 'var(--testing)', 'early in training: wide, explores'], [0.1, 'var(--decision)', 'later: narrow, exploits']].forEach(([sd, col, lab], j) => {
      let d = ''; for (let i = 0; i <= 200; i++) { const a = -1 + 2 * i / 200; d += (i ? 'L' : 'M') + f1(X(a)) + ' ' + f1(Y(pdf(a, sd))); }
      s += '<path d="' + d + '" style="stroke: ' + col + '" stroke-width="2.6" fill="none"/>';
      s += txt(j ? X(mu) + 34 : X(-0.97), j ? Y(ymax * 0.8) : Y(ymax * 0.33), lab, 'lbl-b', 'start', ' style="fill: ' + col + '"');
    });
    s += '<path d="M' + f1(X(mu)) + ' ' + Tp + 'V' + (h - B) + '" style="stroke: var(--ink-3)" stroke-dasharray="3 3"/>' + txt(X(mu) - 6, Tp + 10, 'preferred command', 'lbl-s', 'end');
    return s + '</svg>';
  }
  function smallNetFigure() {
    const w = 560, h = 250, layers = [4, 5, 5, 2], xs = [70, 210, 350, 490];
    const ys = n => Array.from({ length: n }, (_, i) => 146 + (i - (n - 1) / 2) * 34);
    let s = svgBox(w, h, 'A small neural network: four inputs, two hidden layers of five units, and two outputs, every unit connected to every unit in the next layer.');
    for (let l = 0; l < layers.length - 1; l++) ys(layers[l]).forEach(y1 => ys(layers[l + 1]).forEach(y2 => { s += '<path d="M' + xs[l] + ' ' + f1(y1) + 'L' + xs[l + 1] + ' ' + f1(y2) + '" style="stroke: var(--ink-3)" stroke-opacity=".45"/>'; }));
    layers.forEach((n, l) => ys(n).forEach(y => { s += '<circle cx="' + xs[l] + '" cy="' + f1(y) + '" r="11" style="' + (l === 0 ? PER : l === layers.length - 1 ? VES : DEC) + '"/>'; }));
    s += txt(xs[0], 26, 'inputs', 'lbl-b') + txt(xs[0], 42, 'observation values');
    s += txt((xs[1] + xs[2]) / 2, 26, 'hidden layers', 'lbl-b') + txt((xs[1] + xs[2]) / 2, 42, 'weighted sum, then ReLU');
    s += txt(xs[3], 26, 'outputs', 'lbl-b') + txt(xs[3], 42, 'actions or a value');
    s += txt(w / 2, h - 8, 'Every line is one weight; learning adjusts all of them together.');
    return s + '</svg>';
  }
  function actorCriticFigure() {
    const w = 640, h = 250;
    let s = svgBox(w, h, 'Actor-critic: the actor chooses actions from observations, the environment returns rewards, the critic turns rewards into an advantage that tells the actor how much better or worse than expected its action was.');
    s += box(40, 20, 180, 66, 'Actor', 'policy: proposes', DEC);
    s += box(40, 160, 180, 66, 'Critic', 'value: judges', TST);
    s += box(440, 90, 170, 66, 'Environment', 'simulator', VES);
    s += arr(220, 40, 438, 100, 'var(--decision)') + txt(330, 52, 'action', 'lbl-b', 'middle', ' style="fill: var(--decision)"');
    s += arr(438, 122, 222, 72, 'var(--perception)') + txt(360, 124, 'observation', 'lbl-b', 'middle', ' style="fill: var(--perception)"');
    s += arr(438, 146, 222, 190, 'var(--target)') + txt(360, 190, 'reward', 'lbl-b', 'middle', ' style="fill: var(--target)"');
    s += arr(130, 158, 130, 88, 'var(--testing)') + txt(140, 118, 'advantage:', 'lbl-b', 'start', ' style="fill: var(--testing)"') + txt(140, 134, 'better or worse than expected?', 'lbl-s', 'start');
    s += txt(130, 244, 'learns to predict the return', 'lbl-s');
    return s + '</svg>';
  }

  function onOffFigure() {
    const w = 680, h = 270;
    let s = svgBox(w, h, 'On-policy learning collects a fresh batch with the current policy, learns from it for a few passes, and discards it. Off-policy learning stores every step in a replay buffer and keeps sampling from it.');
    s += txt(12, 22, 'On-policy (PPO, recurrent PPO)', 'lbl-b', 'start');
    s += box(12, 36, 130, 56, 'Current policy', '', DEC) + box(180, 36, 150, 56, 'Collect fresh data', '512 steps \u00d7 10 sims') + box(368, 36, 150, 56, 'Learn from it', '10 passes over it', NEU) + box(556, 36, 112, 56, 'Discard', 'start again');
    s += arr(142, 64, 178, 64) + arr(330, 64, 366, 64) + arr(518, 64, 554, 64) + pathArr('M612 92V112H77V94', 77, 94, -Math.PI / 2, 'var(--ink-3)', true);
    s += txt(344, 128, 'stable: always learns from its own recent behavior; each step used for one update round only', 'lbl-s');

  APP.section({
    n: 5, id: 's5', title: 'Reinforcement learning', short: 'Reinforcement learning', subsystem: 'decision',
    learn: ['Reinforcement learning built up from zero: the agent\u2013environment loop, returns and discounting, values and policies, and how neural networks learn them.',
      'How the four learners in this study, PPO, recurrent PPO, SAC and TQC, differ, and how they are trained on equal terms.'],
    build() {
      const fLoop = FIGN(), fBell = FIGN(), fExp = FIGN(), fNet = FIGN(), fAC = FIGN(), fOO = FIGN(), fOcc = FIGN(), fLstm = FIGN(), fSac = FIGN(), fProt = FIGN();
      const H = 1 / (1 - g), w20 = Math.pow(g, 20), w10 = Math.pow(g, 10);
      const Vex = 0.9 * 100 * w20 + 0.1 * (-300) * w10;
      const gl = g * lam, gae = 1.0 + gl * 0.5 + gl * gl * (-0.2);
      const h553 = 0.8 * Math.tanh(0.85);
      const ent = sd => 0.5 * Math.log(2 * Math.PI * Math.E * sd * sd);
      const ysoft = g * (46 - 0.05 * (-1.0)), half = Math.log(0.5) / Math.log(1 - 0.005);
      const tq = APP.tqcExample();
      const days = 3e6 * 0.5 / 86400;
      APP.SYM('rlO', { tex: 'o_t', meaning: 'observation received at step t: 70 values from the vessel\u2019s own sensors (Section 7)', unit: '\u2014', group: 'Reinforcement learning' });
      return '' +
        H2('loop', 'The agent and its environment') +
        '<p>Nobody learns to ride a bicycle from a table of correct handlebar angles. You try, wobble, and slowly find out which moves keep you upright and moving forward. ' + AB('RL', 'Reinforcement learning') + ' turns that kind of learning into mathematics ' + C('sutton2018') + '.</p>' +
        '<p>There are two parties. The ' + T('agent') + ' decides; here it is the policy network that commands the boat. The ' + T('environment') + ' is everything else: the simulated basin, the vessel model of ' + XS(3) + ', the obstacles, the other vessel and the sensors. Every ' + M('\\Delta t = 0.5\\ \\mathrm{s}') + ' they exchange four things:</p>' +
        '<ul><li>The environment is in a ' + T('rlstate', 'state') + ' ' + M('s_t') + ': everything needed to predict what happens next, including things the boat cannot know, such as the other vessel\u2019s exact velocity.</li>' +
        '<li>The agent receives an ' + T('observation') + ' ' + M('o_t') + ' instead: here 70 numbers built from its own LiDAR, the map and its estimated pose (' + XS(7) + ').</li>' +
        '<li>It chooses an ' + T('rlaction', 'action') + ' ' + M('a_t = [a_\\delta,\\ a_n]') + ': a rudder and a propulsion command, each between \u22121 and 1.</li>' +
        '<li>The environment moves on by one step and returns a ' + T('reward') + ' ' + M('r_t') + ': +100 for reaching the goal, \u2212300 for a collision, and small terms along the way (' + XS(7) + ').</li></ul>' +
        '<p>An ' + T('episode') + ' runs from the start until the goal, a collision, or a timeout after ' + M('T = 180') + ' decisions (90 s). This whole set-up, states, actions, rewards and the rules for moving between states, is called a Markov decision process, or ' + AB('MDP') + '. Because the agent sees observations rather than states, its version is only partly observable, which matters for recurrent PPO later.</p>' +
        '<figure class="fig"><div class="frame scroll-sm">' + loopFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fLoop + '.</b> The agent\u2013environment loop, repeated every 0.5 s.</figcaption></figure>' +
        '<div class="callout"><span class="h">A note on letters</span><p>Reinforcement learning reuses some letters that earlier sections have already given a maritime meaning. In this section ' + M('r_t') + ' is a reward, not the yaw rate ' + M('r') + '; ' + M('\\alpha') + ' is SAC\u2019s temperature, not the relative bearing; ' + M('\\delta_t^V') + ' is a prediction error, not the rudder angle; and ' + M('\\sigma') + ', ' + M('\\tau') + ', ' + M('\\theta') + ' and ' + M('\\lambda') + ' carry their learning meanings. Each symbol table says which is meant.</p></div>' +

        H2('return', 'Return and discount') +
        '<p>A bird in the hand is worth two in the bush: a reward now counts for more than the same reward later, and rewards far in the future hardly count at all. The agent\u2019s goal is to make the ' + T('rlreturn', 'return') + ' as large as possible on average, the sum of all future rewards with each one shrunk by a ' + T('discount') + ' for every step it lies ahead.</p>' +
        EQ({ label: 'Method', title: 'Return and effective horizon', tex: '\\begin{gathered} G_t = \\sum_{k=0}^{T-t-1} \\gamma^{k}\\, r_{t+k} \\\\[4pt] T_{\\gamma} = \\frac{\\Delta t}{1-\\gamma} \\approx 10\\ \\mathrm{s} \\end{gathered}',
          words: 'add up every reward still to come, each shrunk by a factor \u03b3 for every half-second it lies in the future; the weights add up to about 20 steps, so roughly the next 10 s dominate.',
          symbols: [{ k: 'Gt', tex: 'G_t', m: 'return from decision step t', u: '\u2014', v: fx(100 * w20, 1) + ' (example)', g: 'Reinforcement learning' },
            { k: 'gamma', tex: '\\gamma', m: 'discount factor per 0.5 s decision (0.99 per 0.1 s physics step)', u: '\u2014', v: '0.951', g: 'Reinforcement learning' },
            { k: 'rlR', tex: 'r_t', m: 'reward received at decision step t (not the yaw rate r)', u: '\u2014', v: '+100 at the goal, \u2212300 at a collision', g: 'Reinforcement learning' },
            { k: 'kahead', tex: 'k', m: 'number of decisions ahead', u: '\u2014', v: '20', g: 'Reinforcement learning' },
            { k: 'Tep', tex: 'T', m: 'episode length in decisions, at most 180 (90 s)', u: '\u2014', v: '\u2264 180', g: 'Reinforcement learning' },
            { k: 'Tgamma', tex: 'T_{\\gamma}', m: 'effective horizon of the discount', u: 's', v: fx(0.5 * H, 1), g: 'Reinforcement learning' },
            { k: 'dt', tex: '\\Delta t', m: 'decision period', u: 's', v: '0.5', g: 'Notation and conventions' }],
          example: '<p>Reaching the goal 20 decisions (10 s) from now, with nothing else on the way, adds ' + M('100 \\times 0.951^{20} = ' + fx(100 * w20, 1)) + ' to the return. A collision the same 10 s ahead adds ' + M('-300 \\times ' + fx(w20, 3) + ' = ' + fx(-300 * w20, 1)) + '. The weights add up to ' + M('1/(1-0.951) = ' + fx(H, 1)) + ' steps, so ' + M('T_\\gamma = ' + fx(H, 1) + ' \\times 0.5\\ \\mathrm{s} = ' + fx(0.5 * H, 1) + '\\ \\mathrm{s}') + '. The value 0.951 is ' + M('0.99^5') + ': the same discount as 0.99 per 0.1 s physics step.</p>' }) +
        '<h3>\u25b6 Discount widget</h3>' + APP.widgetDiscHTML() +

        H2('values', 'Policies, values and the Bellman equation') +
        '<p>A <b>policy</b> ' + M('\\pi(a \\mid s)') + ' is the agent\u2019s rule for acting: the probability of choosing action ' + M('a') + ' in state ' + M('s') + '. Here the policy is a neural network, written ' + M('\\pi_\\theta') + ' after its adjustable numbers ' + M('\\theta') + ' (' + T('policy') + ').</p>' +
        '<p>A chess player looking at a board has a feel for how good the position is before any move is made. A ' + T('valuefn') + ' is that feel, made exact: the return the agent can expect from here if it keeps following its policy. The action value ' + M('Q') + ' asks the same question for a particular first move, and the ' + T('advantage') + ' says how much better that move is than the policy\u2019s usual choice.</p>' +
        EQ({ label: 'Method', title: 'Value functions and advantage', tex: '\\begin{gathered} V^{\\pi}(s) = \\mathbb{E}_{\\pi}\\!\\left[ G_t \\mid s_t = s \\right] \\qquad Q^{\\pi}(s,a) = \\mathbb{E}_{\\pi}\\!\\left[ G_t \\mid s_t = s,\\ a_t = a \\right] \\\\[4pt] A^{\\pi}(s,a) = Q^{\\pi}(s,a) - V^{\\pi}(s) \\end{gathered}',
          words: 'V is the return to expect from here, on average; Q is the same if the first action is a; the advantage A is how much better a is than usual.',
          symbols: [{ k: 'pipol', tex: '\\pi(a \\mid s)', m: 'policy: probability of choosing action a in state s', u: '\u2014', v: 'the trained network', g: 'Reinforcement learning' },
            { k: 'rlS', tex: 's_t,\\ s', m: 'state of the environment (at step t)', u: '\u2014', v: 'hidden', g: 'Reinforcement learning' },
            { k: 'rlA', tex: 'a_t,\\ a', m: 'action: rudder and propulsion commands', u: '\u2014', v: 'two values in [\u22121, 1]', g: 'Reinforcement learning' },
            { k: 'Vpi', tex: 'V^{\\pi}(s)', m: 'state value under policy \u03c0', u: '\u2014', v: fx(Vex, 1), g: 'Reinforcement learning' },
            { k: 'Qpi', tex: 'Q^{\\pi}(s,a)', m: 'action value under policy \u03c0', u: '\u2014', v: '20', g: 'Reinforcement learning' },
            { k: 'Adv', tex: 'A^{\\pi}(s,a)', m: 'advantage of action a over the policy\u2019s average', u: '\u2014', v: fx(20 - Vex, 1), g: 'Reinforcement learning' },
            { k: 'Expect', tex: '\\mathbb{E}_{\\pi}[\\,\\cdot\\,]', m: 'expected value: the average over the randomness of the policy and the environment', u: '\u2014', v: '\u2014', g: 'Reinforcement learning' }],
          example: '<p>With hypothetical odds: suppose that from some state the policy reaches the goal after 10 s nine times in ten and collides after 5 s once in ten, and ignore the small rewards on the way. Then</p>' + MD('V = 0.9 \\times 100 \\times 0.951^{20} + 0.1 \\times (-300) \\times 0.951^{10} = ' + fx(0.9 * 100 * w20, 1) + ' - ' + fx(30 * w10, 1) + ' = ' + fx(Vex, 1)) + '<p>If a particular turn made now has ' + M('Q = 20') + ', its advantage is ' + M('A = 20 - ' + fx(Vex, 1) + ' = +' + fx(20 - Vex, 1)) + ': better than the policy\u2019s usual choice.</p>' }) +
        '<p>Values are linked from one step to the next: the value of where you are is what you collect on the next step plus the discounted value of where you land. This is the ' + T('bellman') + '.</p>' +
        EQ({ label: 'Method', title: 'Bellman equation', tex: 'V^{\\pi}(s_t) = \\mathbb{E}_{\\pi}\\!\\left[\\, r_t + \\gamma\\, V^{\\pi}(s_{t+1}) \\,\\right]',
          words: 'the value of this state equals the reward of the next step plus \u03b3 times the value of the state that follows, averaged over what might happen.',
          symbols: [{ k: 'Vpi', tex: 'V^{\\pi}(s_t)', m: 'value of the state at step t', u: '\u2014', v: '95.1', g: 'Reinforcement learning' },
            { k: 'gamma', tex: '\\gamma', m: 'discount per decision', u: '\u2014', v: '0.951', g: 'Reinforcement learning' }],
          example: '<p>One decision before the goal the value is 100: the goal reward, after which the episode ends. Two decisions before, with a step reward of zero, it is ' + M('0 + 0.951 \\times 100 = 95.1') + '; three before, ' + M('0.951 \\times 95.1 = ' + fx(100 * g * g, 1)) + '. Learning can therefore work one step at a time, using its own estimate of the next value inside its target; this is ' + T('bootstrapping') + '. It is also why a timeout carries no terminal reward: the episode is cut short rather than ended by the task, so the learner estimates what would have followed.</p>' }) +
        '<figure class="fig wide"><div class="frame scroll-sm">' + bellmanFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fBell + '.</b> The Bellman equation run backwards from the goal: each state\u2019s value is 0.951 times the next one\u2019s when the step rewards are zero.</figcaption></figure>' +

        H2('explore', 'Learning by trial, with neural networks') +
        '<p>Choosing a restaurant, you can go to your favorite (' + T('exploitation') + ') or try somewhere new (' + T('exploration') + '). Never trying anything new, you may miss the best place in town; always trying something new, you eat a lot of bad meals. A learner faces the same trade-off. The four learners here explore by making their policy random around its best guess: for each command the network outputs the center of a bell curve, and during training the action is drawn from that curve. Narrowing the curve over time shifts from exploring to exploiting.</p>' +
        '<figure class="fig"><div class="frame">' + exploreFigure() + '</div><figcaption><b>' + fExp + '.</b> A stochastic policy for the rudder command. <span class="tag illus">Illustrative</span>The widths are made up for the picture.</figcaption></figure>' +
        '<p>The observation is 70 continuous numbers, so no table could list a value or an action for every possible situation. Instead, both the policy and the value are represented by a ' + T('neuralnet') + ': a function built from layers, each taking a weighted sum of its inputs and passing it through a simple bend. Learning means nudging all the weights, a little at a time, in the direction that improves an objective: the ' + T('gradient') + '.</p>' +
        EQ({ label: 'Method', title: 'One layer of a network', tex: '\\mathbf{y} = \\operatorname{ReLU}(\\mathbf{W}\\mathbf{x} + \\mathbf{b}), \\qquad \\operatorname{ReLU}(z) = \\max(0,\\ z)',
