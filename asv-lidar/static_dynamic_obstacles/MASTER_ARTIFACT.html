  APP.section({
    n: 3, id: 's3', title: 'The vessel and its dynamics', short: 'The vessel and its dynamics', subsystem: 'vessel',
    learn: ['How the model boat moves: two frames of reference, and three coupled equations for its forward, sideways and turning motion.',
      'What each force term means physically, which parameters were identified, how the simulator integrates the equations, and why every training episode uses a slightly different vessel.'],
    build() {
      const X = examples();
      const fFr = FIGN(), fMass = FIGN(), fDrag = FIGN(), fTurn = FIGN(), fMunk = FIGN(), fRud = FIGN(), fThr = FIGN(), fAn = FIGN(), fSteps = FIGN(), fDR = FIGN();
      const U = X.U, rud = X.rud;
      SYM('r', { tex: 'r', meaning: 'yaw rate, positive clockwise (turning to starboard)', unit: 'rad/s (plots in \u00b0/s)', group: 'Vessel' });
      return '' +
        H2('boat', 'The boat and its two frames') +
        '<p>The own ship is a Bluefin model-scale ' + AB('ASV') + ', the same vessel used in the basin trials of the authors\u2019 previous paper ' + C('tran2026') + '. It is 1.725 m long overall, 0.50 m wide and draws 0.193 m of water, and it weighs 64.55 kg. One propeller pushes it forward and a ' + T('rudder') + ' at the stern, which swings up to 40\u00b0 either way, steers it. The 360\u00b0 two-dimensional LiDAR sits at the bow, 0.8625 m ahead of the ' + T('refpoint') + ' whose motion the model describes.</p>' +
        '<p>Think of pushing a shopping trolley across a car park. The car park has fixed directions, north and east, and that is how you would mark the trolley\u2019s position on a map. But you push the trolley in its own terms: forward, sideways, and turning. A vessel model uses both viewpoints. The ' + T('worldframe') + ' is fixed to the water, with x pointing east and y north. The ' + T('bodyframe') + ' is fixed to the hull and turns with it: ' + T('surge') + ' is motion along the centerline, ' + T('sway') + ' is motion across it, and ' + T('yaw') + ' is turning. The heading ' + M('\\psi') + ' is a compass angle: 0\u00b0 is north, and it grows clockwise.</p>' +
        '<p>The model has three ' + AB('DOF') + ', surge, sway and yaw; heave, roll and pitch are left out. Its state is seven numbers: the surge speed ' + M('u') + ', the sway speed ' + M('v') + ' (positive toward starboard), the yaw rate ' + M('r') + ' (positive clockwise), the heading ' + M('\\psi') + ', the actual rudder angle ' + M('\\delta') + ', and the position ' + M('(x, y)') + '.</p>' +
        '<figure class="fig"><div class="frame">' + framesFigure() + '</div><figcaption><b>' + fFr + '.</b> The hull and its two frames, drawn to scale with a 0.5 m grid. The world frame is fixed to the water; the body frame rides on the hull, with surge forward, sway to starboard and the yaw rate clockwise. Here the heading is 30\u00b0.</figcaption></figure>' +
        EQ({ label: 'Model', title: 'Kinematics: from body speeds to motion on the map', tex: '\\begin{aligned} \\dot{x} &= u\\sin\\psi + v\\cos\\psi \\\\ \\dot{y} &= u\\cos\\psi - v\\sin\\psi \\\\ \\dot{\\psi} &= r \\end{aligned}',
          words: 'to see where the boat goes on the map, rotate its forward and sideways speeds by the heading; the heading itself changes at the yaw rate.',
          symbols: [{ k: 'u', tex: 'u', m: 'surge speed: forward speed through the water', u: 'm/s', v: '0.558 (cruise)', g: 'Vessel' },
            { k: 'vsway', tex: 'v', m: 'sway speed, positive toward starboard', u: 'm/s', v: '0.05', g: 'Vessel' },
            { k: 'r', tex: 'r', m: 'yaw rate, positive clockwise (turning to starboard)', u: 'rad/s', v: '\u2014', g: 'Vessel' },
            { k: 'psi', tex: '\\psi', m: 'own-ship heading, clockwise from north', u: '\u00b0', v: '30', g: 'Vessel' },
            { k: 'xydot', tex: '\\dot{x},\\ \\dot{y}', m: 'velocity over the water, east and north', u: 'm/s', v: '0.322, 0.458', g: 'Vessel' }],
          example: '<p>At cruise, ' + M('u = 0.558\\ \\mathrm{m/s}') + ', heading ' + M('\\psi = 30^\\circ') + ' and no sideslip: ' + M('\\dot{x} = 0.558 \\sin 30^\\circ = 0.279\\ \\mathrm{m/s}') + ' east and ' + M('\\dot{y} = 0.558 \\cos 30^\\circ = 0.483\\ \\mathrm{m/s}') + ' north. Add a sideslip of ' + M('v = 0.05\\ \\mathrm{m/s}') + ' to starboard: ' + M('\\dot{x} = 0.279 + 0.043 = 0.322') + ' and ' + M('\\dot{y} = 0.483 - 0.025 = 0.458\\ \\mathrm{m/s}') + '. The boat now moves along 35.1\u00b0 while pointing at 30\u00b0: its ' + T('course') + ' differs from its heading by a ' + T('driftangle') + ' of 5.1\u00b0.</p>' }) +

        H2('newton', 'Newton\u2019s second law, three times') +
        '<p>Force equals mass times acceleration, once for each direction of motion and once more for turning, where torque equals inertia times angular acceleration. Two complications make a boat different from a block on a table. The surrounding water moves with the hull, so the effective masses are larger than the boat\u2019s own mass. And the equations are written in the body frame, which turns with the hull, so extra terms appear whenever it is turning. The form follows ' + APP.Cn('fossen2021') + ', with hydrodynamic terms in the style of the ' + AB('MMG') + ' standard method ' + C('yasukawa2015') + '; the model is the one published with the previous paper ' + C('tran2026') + ', with the identified parameters of this study.</p>' +
        EQ({ label: 'Model', title: 'Kinetics: three coupled equations', tex: '\\begin{aligned} m_{11}\\,\\dot{u} &= T(n, u) + X_{\\mathrm{damp}} + X_{\\mathrm{rud}} + m_{22}\\,v\\,r \\\\ m_{22}\\,\\dot{v} &= Y_{\\mathrm{damp}} + Y_{\\mathrm{rud}} - m_{11}\\,u\\,r \\\\ m_{33}\\,\\dot{r} &= N_{\\mathrm{damp}} + N_{\\mathrm{drift}} + N_{\\mathrm{Munk}} + N_{\\mathrm{rud}} \\end{aligned}',
          words: 'in each direction, effective mass times acceleration equals the sum of the forces: propeller thrust, hull damping and rudder force, plus coupling terms that appear because the hull is turning; the third line does the same for turning, with moments.',
          symbols: [{ k: 'accel', tex: '\\dot{u},\\ \\dot{v},\\ \\dot{r}', m: 'surge and sway accelerations, and yaw acceleration', u: 'm/s\u00b2, rad/s\u00b2', v: '\u2014', g: 'Vessel dynamics' },
            { k: 'thrust', tex: 'T(n, u)', m: 'propeller thrust (Section 3.8)', u: 'N', v: fx(X.cruise.T, 3), g: 'Rudder, propeller and servo' },
            { k: 'XYdamp', tex: 'X_{\\mathrm{damp}},\\ Y_{\\mathrm{damp}}', m: 'hull damping forces, surge and sway', u: 'N', v: fx(X.cruise.Xdamp, 3) + ', 0', g: 'Vessel dynamics' },
            { k: 'XYNrud', tex: 'X_{\\mathrm{rud}},\\ Y_{\\mathrm{rud}},\\ N_{\\mathrm{rud}}', m: 'rudder forces and moment (Section 3.7)', u: 'N, N\u00b7m', v: '0 (rudder amidships)', g: 'Rudder, propeller and servo' },
            { k: 'Ndamp', tex: 'N_{\\mathrm{damp}},\\ N_{\\mathrm{drift}},\\ N_{\\mathrm{Munk}}', m: 'yaw damping, drift moment and Munk moment', u: 'N\u00b7m', v: '0 (straight)', g: 'Vessel dynamics' },
            { k: 'm11', tex: 'm_{11},\\ m_{22},\\ m_{33}', m: 'effective masses forward and sideways, effective yaw inertia (Section 3.3)', u: 'kg, kg\u00b7m\u00b2', v: '68.21, 127.29, 10.23', g: 'Vessel dynamics' }],
          example: '<p>Straight running at 6 rpm-units and ' + M('u = 0.558\\ \\mathrm{m/s}') + ' with the rudder amidships: thrust ' + M('T = ' + fx(X.cruise.T, 3) + '\\ \\mathrm{N}') + ' and drag ' + M('X_{\\mathrm{damp}} = ' + fx(X.cruise.Xdamp, 3) + '\\ \\mathrm{N}') + ' cancel, and ' + M('v = r = 0') + ' removes every other term, so ' + M('\\dot{u} \\approx 0') + ': this is the steady cruise. Now open the throttle to 12 rpm-units: ' + M('T = 16.06\\ \\mathrm{N}') + ', the net force is ' + M(fx(X.n12.X, 2) + '\\ \\mathrm{N}') + ' and ' + M('\\dot{u} = ' + fx(X.n12.X, 2) + '/68.21 = ' + fx(X.n12.X / P.m11, 3) + '\\ \\mathrm{m/s^2}') + '. The boat speeds up until drag catches up with the new thrust.</p>' }) +
        '<div class="tbl-wrap"><table><thead><tr><th>Term</th><th>Where it comes from</th><th>Explained in</th></tr></thead><tbody>' +
        '<tr><td>' + M('m_{11},\\ m_{22},\\ m_{33}') + '</td><td>the hull plus the water it drags along</td><td>' + XS(3, 'addedmass') + '</td></tr>' +
        '<tr><td>' + M('X_{\\mathrm{damp}},\\ Y_{\\mathrm{damp}},\\ N_{\\mathrm{damp}},\\ N_{\\mathrm{drift}}') + '</td><td>hull resistance</td><td>' + XS(3, 'damping') + '</td></tr>' +
        '<tr><td>' + M('m_{22}\\,v\\,r,\\ -m_{11}\\,u\\,r') + '</td><td>the turning body frame</td><td>' + XS(3, 'coupling') + '</td></tr>' +
        '<tr><td>' + M('N_{\\mathrm{Munk}}') + '</td><td>an elongated hull at an angle to the flow</td><td>' + XS(3, 'munk') + '</td></tr>' +
        '<tr><td>' + M('X_{\\mathrm{rud}},\\ Y_{\\mathrm{rud}},\\ N_{\\mathrm{rud}}') + '</td><td>the rudder</td><td>' + XS(3, 'rudder') + '</td></tr>' +
        '<tr><td>' + M('T(n, u)') + '</td><td>the propeller</td><td>' + XS(3, 'propeller') + '</td></tr>' +
        '<tr><td>' + M('\\delta') + '</td><td>the rudder servo, with delay and lag</td><td>' + XS(3, 'servo') + '</td></tr>' +
        '</tbody></table></div>' +

        H2('addedmass', 'Added mass: the water that moves with the hull') +
        '<p>Walk briskly through waist-deep water and you feel heavier than on land: every time you speed up, you also have to shove water out of the way. Now try to step sideways, broadside on. Much more water has to move, and you feel heavier still. A hull behaves the same way. Its ' + T('addedmass') + ' is small for forward motion, because a slender bow parts the water easily, and large for sideways motion, where the whole length of the hull pushes water. For this hull the sideways effective mass is almost twice the boat\u2019s own mass ' + C('fossen2021') + '.</p>' +
        EQ({ label: 'Model', title: 'Effective masses', tex: '\\begin{aligned} m_{11} &= m + X_{\\dot{u}}^{\\mathrm{add}} = 68.21\\ \\mathrm{kg} \\\\ m_{22} &= m + Y_{\\dot{v}}^{\\mathrm{add}} = 127.29\\ \\mathrm{kg} \\\\ m_{33} &= I_z + J_z = 10.23\\ \\mathrm{kg\\,m^2} \\end{aligned}',
          words: 'each effective mass is the boat\u2019s own mass or inertia plus the water it must accelerate with it: a little extra forward, almost as much again sideways.',
          symbols: [{ k: 'm', tex: 'm', m: 'mass of the vessel', u: 'kg', v: '64.55', g: 'Vessel' },
            { k: 'addm', tex: 'X_{\\dot{u}}^{\\mathrm{add}},\\ Y_{\\dot{v}}^{\\mathrm{add}}', m: 'added mass for surge and for sway', u: 'kg', v: '3.662, 62.74', g: 'Vessel dynamics' },
            { k: 'IzJz', tex: 'I_z,\\ J_z', m: 'rigid-body yaw inertia and added yaw inertia (only their sum is given)', u: 'kg\u00b7m\u00b2', v: 'sum 10.23', g: 'Vessel dynamics' },
            { k: 'm11', tex: 'm_{11},\\ m_{22},\\ m_{33}', m: 'effective masses and yaw inertia', u: 'kg, kg\u00b7m\u00b2', v: '68.21, 127.29, 10.23', g: 'Vessel dynamics' }],
          example: '<p>Push the hull sideways with 10 N. It accelerates at ' + M('10/127.29 = 0.079\\ \\mathrm{m/s^2}') + ', about half the ' + M('10/64.55 = 0.155\\ \\mathrm{m/s^2}') + ' it would reach without the water. Pushed forward with the same 10 N, it accelerates at ' + M('10/68.21 = 0.147\\ \\mathrm{m/s^2}') + '.</p>' }) +
        '<figure class="fig"><div class="frame">' + massFigure() + '</div><figcaption><b>' + fMass + '.</b> The same boat is about 6 % heavier going forward and almost twice as heavy going sideways, because of the water it must move with it. Bars to scale; the sketches below them are illustrative.</figcaption></figure>' +

        H2('damping', 'Damping: resistance that grows with speed') +
        '<p>Hold a flat hand out of a car window: at twice the speed the push is roughly four times as large. Water resists a hull in the same way, so most ' + T('damping') + ' terms grow with the square of speed. The hull slips forward easily and resists sliding sideways strongly, like a skate on ice, and turning or sliding also costs some forward speed.</p>' +
        EQ({ label: 'Model', title: 'Hull damping and the drift moment', tex: '\\begin{aligned} X_{\\mathrm{damp}} &= -X_{uu}\\,u|u| - X_{vv}\\,v^2 - X_{rr}\\,(L\\,r)^2 \\\\ Y_{\\mathrm{damp}} &= -Y_{v}\\,u\\,v - Y_{vv}\\,v|v| \\\\ N_{\\mathrm{damp}} &= -N_{r}\\,u\\,r - N_{rr}\\,r|r|, \\qquad N_{\\mathrm{drift}} = -N_{uv}\\,u\\,v \\end{aligned}',
          words: 'drag opposes forward speed, sideways speed and turning, mostly with the square of speed; sliding sideways and turning also cost forward speed; and sliding sideways while moving forward creates a moment, the drift moment.',
          symbols: [{ k: 'Xuu', tex: 'X_{uu}', m: 'quadratic surge drag', u: 'N/(m/s)\u00b2', v: '12.89', g: 'Vessel dynamics' },
            { k: 'Xvv', tex: 'X_{vv},\\ X_{rr}', m: 'surge drag from sway and from yaw cross-flow', u: 'N/(m/s)\u00b2', v: '50.64, 0.058', g: 'Vessel dynamics' },
            { k: 'Yv', tex: 'Y_{v},\\ Y_{vv}', m: 'speed-dependent and quadratic sway damping', u: 'N/(m/s)\u00b2', v: '0.924, 220.98', g: 'Vessel dynamics' },
            { k: 'Nr', tex: 'N_{r}', m: 'speed-dependent yaw damping', u: 'N\u00b7m/((m/s)(rad/s))', v: '1.038', g: 'Vessel dynamics' },
            { k: 'Nrr', tex: 'N_{rr}', m: 'quadratic yaw damping', u: 'N\u00b7m/(rad/s)\u00b2', v: '0.0173', g: 'Vessel dynamics' },
            { k: 'Nuv', tex: 'N_{uv}', m: 'drift-induced yaw moment coefficient', u: 'N\u00b7m/(m/s)\u00b2', v: '\u221283.97', g: 'Vessel dynamics' },
            { k: 'L', tex: 'L', m: 'hull length overall', u: 'm', v: '1.725', g: 'Vessel' }],
          example: '<p>At cruise the forward drag is ' + M('X_{\\mathrm{damp}} = -12.89 \\times 0.558^2 = ' + fx(X.cruise.Xdamp, 2) + '\\ \\mathrm{N}') + '. Slide the same hull sideways at 0.1 m/s while it cruises and the sway damping is</p>' + MD('Y_{\\mathrm{damp}} = -0.924 \\times 0.558 \\times 0.1 - 220.98 \\times 0.1^2 = ' + fx(X.Yd, 2) + '\\ \\mathrm{N}') + '<p>whereas moving forward at 0.1 m/s costs only ' + M('12.89 \\times 0.1^2 = 0.13\\ \\mathrm{N}') + ': about seventeen times less. A gentler slide, 0.05 m/s of sway at cruise, already produces a drift moment of</p>' + MD('N_{\\mathrm{drift}} = 83.97 \\times 0.558 \\times 0.05 = ' + fx(X.Nd, 2) + '\\ \\mathrm{N\\,m}') }) +
        '<figure class="fig"><div class="frame">' + dragFigure() + '</div><figcaption><b>' + fDrag + '.</b> Quadratic drag for moving forward and for sliding sideways, from the identified coefficients. At 0.3 m/s the sideways drag is about 20 N, the forward drag about 1 N.</figcaption></figure>' +

        H2('coupling', 'Turning couples surge and sway') +
        '<p>A car cornering on ice slides toward the outside of the bend, and a passenger feels pushed outward. Nothing is pushing, in fact: the car\u2019s own frame is turning under the passenger. Because the vessel\u2019s equations are written in the turning body frame, the same effect appears as ' + T('coriolis') + ' ' + C('fossen2021') + '. In a turn, forward motion becomes a sideways push toward the outside, and the resulting sideways motion eats into the forward speed.</p>' +
        EQ({ label: 'Model', title: 'Coupling terms of the turning frame', tex: 'X_{C} = m_{22}\\,v\\,r, \\qquad Y_{C} = -m_{11}\\,u\\,r',
          words: 'while turning, forward speed produces a sideways force toward the outside of the turn, and sideways speed produces a forward or backward force.',
          symbols: [{ k: 'XCYC', tex: 'X_C,\\ Y_C', m: 'Coriolis and centripetal forces in surge and sway (the last terms of the first two kinetics lines)', u: 'N', v: fx(X.XC, 2) + ', ' + fx(X.YC, 2), g: 'Vessel dynamics' }],
          example: '<p>At cruise, turning to starboard at 5\u00b0/s (' + M('r = 0.0873\\ \\mathrm{rad/s}') + '), the sway term pushes the hull to port, which is outward in a starboard turn:</p>' + MD('Y_C = -68.21 \\times 0.558 \\times 0.0873 = ' + fx(X.YC, 2) + '\\ \\mathrm{N}') + '<p>Once the hull slides outward at ' + M('v = -0.08\\ \\mathrm{m/s}') + ', the surge term slows it down:</p>' + MD('X_C = 127.29 \\times (-0.08) \\times 0.0873 = ' + fx(X.XC, 2) + '\\ \\mathrm{N}') + '<p>In the model, a full-rudder turn at cruise settles with the hull sliding outward at about ' + fx(Math.abs(X.tc6.vss), 2) + ' m/s and the forward speed down from 0.558 to about ' + fx(X.tc6.uss, 2) + ' m/s.</p>' }) +
        '<figure class="fig"><div class="frame">' + turnFigure() + '</div><figcaption><b>' + fTurn + '.</b> In a turn the bow points inside the circle while the hull as a whole slides outward, and the boat loses speed.</figcaption></figure>' +

        H2('munk', 'The Munk moment: why an angled hull wants to turn further') +
        '<p>Hold a long balloon or a pencil in a stream at a slight angle: the flow presses on the upstream side of the front and the downstream side of the back, and the pair of pushes twists it across the current. Any elongated body moving at an angle to its own axis feels this ' + T('munk') + '. It is a real, destabilizing moment, and it completes the coupling terms of the turning frame so that the model conserves energy ' + C('fossen2021') + '. Its size is set by the difference between the sideways and forward effective masses, so no new parameter is needed.</p>' +
        EQ({ label: 'Model', title: 'Munk moment', tex: 'N_{\\mathrm{Munk}} = (m_{11} - m_{22})\\,u\\,v \\approx -59.1\\,u\\,v',
          words: 'moving forward while sliding sideways produces a moment that turns the hull further away from its direction of motion.',
          symbols: [{ k: 'Nmunk', tex: 'N_{\\mathrm{Munk}}', m: 'Munk moment', u: 'N\u00b7m', v: fx(X.Nm, 2), g: 'Vessel dynamics' },
            { k: 'Ndrift', tex: 'N_{\\mathrm{drift}}', m: 'drift moment of the hull (Section 3.4)', u: 'N\u00b7m', v: fx(X.Nd, 2), g: 'Vessel dynamics' }],
          example: '<p>At cruise with a slide of ' + M('v = 0.05\\ \\mathrm{m/s}') + ' to starboard:</p>' + MD('N_{\\mathrm{Munk}} = -59.08 \\times 0.558 \\times 0.05 = ' + fx(X.Nm, 2) + '\\ \\mathrm{N\\,m}') + '<p>This turns the bow to port, away from the direction of motion. The hull\u2019s ' + T('driftmoment') + ' for the same slide is ' + M('+' + fx(X.Nd, 2) + '\\ \\mathrm{N\\,m}') + '. It wins, so together they leave ' + M('+' + fx(X.Nm + X.Nd, 2) + '\\ \\mathrm{N\\,m}') + ' turning the bow back toward the direction of motion, much as the feathers of a dart keep it pointing where it flies.</p>' }) +
        '<figure class="fig"><div class="frame">' + munkFigure() + '</div><figcaption><b>' + fMunk + '.</b> An elongated hull at an angle to the flow: the pressure on the front and back forms a couple that turns it further across the flow.</figcaption></figure>' +

        H2('rudder', 'The rudder: a small wing') +
        '<p>Put a flat hand out of the car window and tilt it: the air pushes it up, and the more you tilt, the harder it pushes. A rudder is a small underwater wing at the stern. Angling it to the water flowing past creates a sideways force on the stern, and because the stern is far from the middle of the boat, that force turns the whole hull. The force grows with the ' + T('angleofattack') + ' and with the square of the speed of the water reaching the rudder, which is a little slower than the hull speed because of the ' + T('wakefraction', 'wake') + ', plus a small contribution from the ' + T('propellerrace') + '. The formulas follow the MMG standard method ' + C('yasukawa2015') + '.</p>' +
        EQ({ label: 'Model', title: 'Rudder inflow and normal force', tex: '\\begin{aligned} u_R &= \\max\\!\\left(0.05,\\ (1 - w_R)\\,u + k_{\\mathrm{race}}\\sqrt{n/12}\\right) \\\\ v_R &= v + l_R\\,r \\\\ \\alpha_R &= \\delta - \\operatorname{atan2}(v_R,\\ u_R) \\\\ F_N &= \\tfrac{1}{2}\\,\\rho\\,A_R\\,f_\\alpha\\,u_R^2\\,\\sin\\alpha_R \\end{aligned}',
          words: 'the water reaches the rudder slightly slowed by the hull and slightly boosted by the propeller; its angle of attack is the rudder angle minus the angle of that inflow; and the force normal to the rudder grows with the inflow speed squared and the sine of the angle of attack.',
          symbols: [{ k: 'uRvR', tex: 'u_R,\\ v_R', m: 'water speed at the rudder along and across the hull', u: 'm/s', v: fx(rud.uR, 4) + ', 0', g: 'Rudder, propeller and servo' },
            { k: 'alphaR', tex: '\\alpha_R', m: 'effective angle of attack of the rudder', u: '\u00b0', v: '40', g: 'Rudder, propeller and servo' },
            { k: 'FN', tex: 'F_N', m: 'rudder normal force', u: 'N', v: fx(rud.FN, 3), g: 'Rudder, propeller and servo' },
            { k: 'delta', tex: '\\delta', m: 'actual rudder angle; in these equations positive turns the boat to port', u: '\u00b0', v: '40', g: 'Vessel' },
            { k: 'wR', tex: 'w_R', m: 'wake fraction at the rudder', u: '\u2014', v: '0.22', g: 'Rudder, propeller and servo' },
            { k: 'krace', tex: 'k_{\\mathrm{race}}', m: 'propeller-race inflow at the rudder', u: 'm/s', v: '0.0135', g: 'Rudder, propeller and servo' },
            { k: 'lR', tex: 'l_R', m: 'lever for the yaw-rate part of the inflow', u: 'm', v: '\u22120.777', g: 'Rudder, propeller and servo' },
            { k: 'rho', tex: '\\rho', m: 'water density', u: 'kg/m\u00b3', v: '1000', g: 'Rudder, propeller and servo' },
            { k: 'AR', tex: 'A_R,\\ f_\\alpha', m: 'rudder area and lift slope', u: 'm\u00b2, \u2014', v: '0.0091, 2.693', g: 'Rudder, propeller and servo' },
            { k: 'n', tex: 'n', m: 'propeller speed in rpm-units (6 cruise, 12 nominal field setting)', u: 'rpm-units', v: '6', g: 'Rudder, propeller and servo' }],
          example: '<p>Cruising straight at 6 rpm-units with the rudder hard over at 40\u00b0, the water reaches the rudder at</p>' + MD('u_R = 0.78 \\times 0.558 + 0.0135\\sqrt{0.5} = ' + fx(rud.uR, 3) + '\\ \\mathrm{m/s}') + '<p>and, with no sway or yaw yet, ' + M('\\alpha_R = 40^\\circ') + '. The normal force is</p>' + MD('F_N = \\tfrac12 \\times 1000 \\times 0.0091 \\times 2.693 \\times ' + fx(rud.uR, 3) + '^2 \\times \\sin 40^\\circ = ' + fx(rud.FN, 2) + '\\ \\mathrm{N}') + '<p>about the weight of 160 g.</p>' }) +
        EQ({ label: 'Model', title: 'Rudder force and moment on the hull', tex: '\\begin{aligned} X_{\\mathrm{rud}} &= -X_{\\delta}\\,|F_N|\\,|\\sin\\delta| \\\\ Y_{\\mathrm{rud}} &= -(1 + a_H)\\,k_R\\,F_N\\cos\\delta \\\\ N_{\\mathrm{rud}} &= -\\ell\\,k_R\\,F_N\\cos\\delta \\end{aligned}',
          words: 'the rudder force slightly slows the boat, pushes it sideways (enlarged by the hull\u2019s interaction with the rudder) and turns it through a lever arm.',
          symbols: [{ k: 'Xdelta', tex: 'X_{\\delta}', m: 'rudder-induced drag coefficient', u: '\u2014', v: '0.117', g: 'Rudder, propeller and servo' },
            { k: 'kR', tex: 'k_R', m: 'rudder effectiveness', u: '\u2014', v: '2.176', g: 'Rudder, propeller and servo' },
            { k: 'aH', tex: 'a_H', m: 'hull interaction factor on the rudder side force', u: '\u2014', v: '0.444', g: 'Rudder, propeller and servo' },
            { k: 'ell', tex: '\\ell', m: 'lever arm of the rudder moment', u: 'm', v: '1.207', g: 'Rudder, propeller and servo' },
            { k: 'XYNrud', tex: 'X_{\\mathrm{rud}},\\ Y_{\\mathrm{rud}},\\ N_{\\mathrm{rud}}', m: 'rudder forces and moment', u: 'N, N\u00b7m', v: fx(rud.Xrud, 3) + ', ' + fx(rud.Yrud, 2) + ', ' + fx(rud.Nrud, 2), g: 'Rudder, propeller and servo' }],
          example: '<p>Continuing the example, the three rudder terms are</p>' + MD('X_{\\mathrm{rud}} = -0.117 \\times ' + fx(rud.FN, 3) + ' \\times \\sin 40^\\circ = ' + fx(rud.Xrud, 3) + '\\ \\mathrm{N}') + MD('Y_{\\mathrm{rud}} = -1.444 \\times 2.176 \\times ' + fx(rud.FN, 3) + ' \\times \\cos 40^\\circ = ' + fx(rud.Yrud, 2) + '\\ \\mathrm{N}') + MD('N_{\\mathrm{rud}} = -1.207 \\times 2.176 \\times ' + fx(rud.FN, 3) + ' \\times \\cos 40^\\circ = ' + fx(rud.Nrud, 2) + '\\ \\mathrm{N\\,m}') + '<p>Divided by ' + M('m_{33} = 10.23') + ', the moment starts the yaw rate changing at ' + M(fx(rud.Nrud / P.m33, 3) + '\\ \\mathrm{rad/s^2}') + ', or ' + fx(Math.abs(rud.Nrud / P.m33 * R2D), 1) + '\u00b0/s every second, toward port.</p>',
          note: '<b>Sign convention.</b> In these equations a positive rudder angle produces a negative yaw moment, so it turns the boat to port ' + VERIFY('rudder sign convention') + '. To keep the pictures readable, the plots and sliders in this section show rudder angles in degrees to starboard.' }) +
        '<figure class="fig"><div class="frame">' + rudderFigure(X) + '</div><figcaption><b>' + fRud + '.</b> Left: the rudder as a wing, with the inflow, the angle of attack and the normal force (schematic). Right: the normal force at cruise inflow for every angle of attack the rudder can reach; the model\u2019s sine law has no stall.</figcaption></figure>' +

        H2('propeller', 'The propeller: thrust grows with the square of its speed') +
        '<p>A desk fan pushes harder the faster it spins, and the push grows faster than the spin: twice the speed gives about four times the push. The propeller model says exactly that. Its command is given in ' + T('rpmunits') + ': the command scale runs from 0 to 24, 12 is the nominal field setting, and 6 is the cruise used in all training. The policy commands 0 to 12 around that cruise and never reverses; the propeller\u2019s reverse thrust is reserved for the runtime safety layer, which uses it only as a brake (Section 9).</p>' +
        EQ({ label: 'Model', title: 'Propeller thrust', tex: 'T(n, u) = T_{12}\\left(\\frac{n}{12}\\right)^{2}\\left(1 + t_b\\,e^{-u/u_b}\\right)',
          words: 'thrust is proportional to the square of the propeller setting, with an optional low-speed factor that is zero here.',
          symbols: [{ k: 'thrust', tex: 'T(n, u)', m: 'propeller thrust', u: 'N', v: fx(X.cruise.T, 3), g: 'Rudder, propeller and servo' },
            { k: 'T12', tex: 'T_{12}', m: 'thrust at 12 rpm-units', u: 'N', v: '16.06', g: 'Rudder, propeller and servo' },
            { k: 'n', tex: 'n', m: 'propeller speed in rpm-units', u: 'rpm-units', v: '6', g: 'Rudder, propeller and servo' },
            { k: 'tbub', tex: 't_b,\\ u_b', m: 'low-speed thrust factor and its speed scale', u: '\u2014, m/s', v: '0 ' + VERIFY('t_b = 0 nominal') + ', ' + TBD('u_b'), g: 'Rudder, propeller and servo' }],
          example: '<p>With ' + M('t_b = 0') + ', thrust at cruise is ' + M('T = 16.06 \\times (6/12)^2 = ' + fx(X.cruise.T, 3) + '\\ \\mathrm{N}') + '. In steady straight running it balances the drag ' + M('X_{uu} u^2') + ', so ' + M('u = \\sqrt{4.015/12.89} = 0.558\\ \\mathrm{m/s}') + ', the cruise speed. At 12 rpm-units, ' + M('u = \\sqrt{16.06/12.89} = 1.116\\ \\mathrm{m/s}') + '. Because both thrust and drag grow with a square, the steady speed is proportional to the setting. These are the speeds stated for the vessel, which is why ' + M('t_b = 0') + ' is taken as the nominal value.</p>' }) +
        '<figure class="fig"><div class="frame">' + thrustFigure() + '</div><figcaption><b>' + fThr + '.</b> Thrust meets drag. Each horizontal line is the thrust at one propeller setting; where it crosses the drag curve the boat runs at a steady speed: 0.279, 0.558, 0.837 and 1.116 m/s at 3, 6, 9 and 12 rpm-units.</figcaption></figure>' +

        H2('servo', 'The rudder servo: a delay and a lag') +
        '<p>Turning the tap of a shower whose pipe is long, you first wait while the old water still flows through, then the temperature changes gradually. The rudder ' + T('servo') + ' behaves alike. After a new command it waits for a ' + T('transportdelay') + ' of 0.73 s, then the rudder swings toward the command with a ' + T('firstorderlag') + ' of time constant 0.90 s (0.895 s in the parameter table). A ' + T('ratelimit') + ' also exists, but the fitted limit is effectively never reached; the delay and the lag dominate.</p>' +
        EQ({ label: 'Model', title: 'Rudder servo', tex: '\\begin{gathered} \\delta_c = 40^\\circ\\,a_\\delta \\\\[4pt] \\delta_{k+1} = \\delta_k + \\operatorname{clip}\\!\\left(\\left(\\delta_c(t_k - t_d) - \\delta_k\\right)\\left(1 - e^{-h/\\tau}\\right),\\ \\pm\\dot{\\delta}_{\\max}\\,h\\right) \\end{gathered}',
          words: 'each update step, the rudder closes a fixed fraction of the gap between its present angle and the command given t_d earlier, never faster than the rate limit.',
          symbols: [{ k: 'deltac', tex: '\\delta_c', m: 'commanded rudder angle', u: '\u00b0', v: '40', g: 'Rudder, propeller and servo' },
            { k: 'adelta', tex: 'a_\\delta', m: 'rudder part of the policy\u2019s action, between \u22121 and 1 (Section 7)', u: '\u2014', v: '1', g: 'Rudder, propeller and servo' },
            { k: 'td', tex: 't_d', m: 'transport delay of the rudder servo', u: 's', v: '0.730', g: 'Rudder, propeller and servo' },
            { k: 'tauServo', tex: '\\tau', m: 'time constant of the rudder servo lag', u: 's', v: '0.895', g: 'Rudder, propeller and servo' },
            { k: 'dratemax', tex: '\\dot{\\delta}_{\\max}', m: 'rudder rate limit (effectively non-binding)', u: '\u00b0/s', v: TBD('value'), g: 'Rudder, propeller and servo' },
            { k: 'h', tex: 'h', m: 'update and integration step (0.05 s in the widgets)', u: 's', v: '0.05', g: 'Simulation and randomization' }],
          example: '<p>Command a step to 40\u00b0 at ' + M('t = 0') + '. Nothing happens until ' + M('t = 0.73\\ \\mathrm{s}') + '. Then every 0.05 s the rudder closes ' + M('1 - e^{-0.05/0.895} = 5.4\\,\\%') + ' of the remaining gap, so its first step is ' + M('40^\\circ \\times 0.054 = 2.2^\\circ') + '. It is at 63 % of the command (25\u00b0) after ' + M('t_d + \\tau = 0.73 + 0.895 = 1.63\\ \\mathrm{s}') + ' and at 90 % (36\u00b0) after ' + M('t_d + \\tau \\ln 10 = 0.73 + 2.06 = 2.79\\ \\mathrm{s}') + '. The boat\u2019s turn cannot start in earnest before the rudder does.</p>' }) +
        '<h3>\u25b6 Rudder step response</h3>' +
        '<p>Change the delay and the lag and watch the actual rudder angle chase the command. The lower plot shows what the same command does to the yaw rate of the nominal vessel at cruise.</p>' +
        APP.widgetRstepHTML() +

        H2('params', 'Identified parameters and the resulting behavior') +
        '<p>The table collects the identified parameter values of the nominal vessel. Together with the equations above, they are the complete model.</p>' +
        paramTable() +
        '<h3>What the model does</h3>' +
        '<ul><li><b>Speed.</b> Steady speed is 0.558 m/s at 6 rpm-units, the cruise used in all training, and 1.116 m/s at 12.</li>' +
        '<li><b>Turning.</b> The yaw rate at full rudder is about 10.4\u00b0/s ' + VERIFY('propeller setting for this figure') + '. Integrated with the nominal parameters listed here, a full-rudder turn settles at about ' + fx(X.tc12.rss, 1) + '\u00b0/s at 12 rpm-units and ' + fx(X.tc6.rss, 1) + '\u00b0/s at 6, after peaking at about ' + fx(X.p12.pk, 1) + ' and ' + fx(X.p6.pk, 1) + '\u00b0/s in the first seconds.</li>' +
        '<li><b>Building a turn.</b> It takes several seconds, set by the delay, the lag and the yaw inertia. At cruise the yaw rate peaks about ' + fx(X.p6.tp, 1) + ' s after a full-rudder command.</li>' +
        '<li><b>Turning circle.</b> Computed with the nominal model, the full-rudder ' + T('turningcircle') + ' at cruise has an ' + T('advance') + ' of ' + fx(X.tc6.advance, 1) + ' m, a ' + T('tacticaldiam') + ' of ' + fx(X.tc6.tactical, 1) + ' m and a steady diameter of ' + fx(X.tc6.steadyDiam, 1) + ' m. That is wider than the 10 m basin, and it is almost the same at 12 rpm-units (' + fx(X.tc12.steadyDiam, 1) + ' m), because every force in the model grows with the square of speed.</li>' +
        '<li><b>Zig-zag.</b> In a 20\u00b0/20\u00b0 ' + T('zigzag') + ' at cruise, the heading overshoots the switching angle by about ' + fx(X.zz.overshoots[0], 1) + '\u00b0 the first time and ' + fx(X.zz.overshoots[1], 1) + '\u00b0 the second (' + T('overshoot', 'overshoot angles') + ').</li></ul>' +
        '<figure class="fig"><div class="frame">' + anatomyFigure(X) + '</div><figcaption><b>' + fAn + '.</b> Anatomy of a full-rudder turn to starboard at cruise, computed with the nominal model. Top: the command jumps to 40\u00b0 and the rudder follows after the delay (shaded) with the servo lag. Bottom: the yaw rate overshoots and then settles as the hull slides outward and loses speed.</figcaption></figure>' +

        H2('integration', 'Integrating the equations') +
        '<p>The kinetics give rates of change; the simulator must turn them into motion over time. Picture walking across a field in fog, re-checking your compass after every few steps: the shorter the steps, the closer you stay to the right line. The ' + T('rk4') + ' (' + AB('RK4') + ') is a smarter walker. For each step it checks the direction four times, at the start, twice in the middle and at the end, and moves with a weighted average, which keeps it accurate with fairly long steps.</p>' +
        EQ({ label: 'Method', title: 'One Runge\u2013Kutta step', tex: '\\begin{gathered} \\mathbf{k}_1 = \\mathbf{f}(\\mathbf{s}_k), \\qquad \\mathbf{k}_2 = \\mathbf{f}\\!\\left(\\mathbf{s}_k + \\tfrac{h}{2}\\,\\mathbf{k}_1\\right) \\\\[4pt] \\mathbf{k}_3 = \\mathbf{f}\\!\\left(\\mathbf{s}_k + \\tfrac{h}{2}\\,\\mathbf{k}_2\\right), \\qquad \\mathbf{k}_4 = \\mathbf{f}\\!\\left(\\mathbf{s}_k + h\\,\\mathbf{k}_3\\right) \\\\[4pt] \\mathbf{s}_{k+1} = \\mathbf{s}_k + \\tfrac{h}{6}\\left(\\mathbf{k}_1 + 2\\,\\mathbf{k}_2 + 2\\,\\mathbf{k}_3 + \\mathbf{k}_4\\right) \\end{gathered}',
          words: 'sample the rates of change at the start, twice at the midpoint and at the end of the step, and advance the state by their weighted average.',
          symbols: [{ k: 'svec', tex: '\\mathbf{s}', m: 'state vector of the vessel (u, v, r, \u03c8, x, y)', u: 'mixed', v: '\u2014', g: 'Simulation and randomization' },
            { k: 'fvec', tex: '\\mathbf{f}', m: 'rates of change from the kinematics and kinetics', u: 'mixed', v: '\u2014', g: 'Simulation and randomization' },
            { k: 'kvec', tex: '\\mathbf{k}_1, \\ldots, \\mathbf{k}_4', m: 'the four samples of the rates within one step', u: 'mixed', v: '\u2014', g: 'Simulation and randomization' },
            { k: 'h', tex: 'h', m: 'integration sub-step', u: 's', v: '0.05', g: 'Simulation and randomization' }],
          example: '<p>A 0.5 s decision contains five 0.1 s ' + T('physicsstep', 'physics steps') + ', each split into two 0.05 s ' + T('substep', 'sub-steps') + ': ten Runge\u2013Kutta steps and forty evaluations of the equations of motion per decision. The contact checks run at every physics step.</p>' }) +
        '<p>Two details matter for the policy. Surge is clipped at zero after every step, so the vessel does not go astern. And the propeller\u2019s reverse thrust, used only by the runtime safety layer, acts only as a braking force that removes forward momentum. The widgets in this section integrate the same equations with the same 0.05 s steps.</p>' +
        '<figure class="fig wide"><div class="frame">' + stepsFigure() + '</div><figcaption><b>' + fSteps + '.</b> Time steps nested inside one decision. The policy acts every 0.5 s; the vessel and contact checks advance every 0.1 s; the equations are integrated in 0.05 s sub-steps, each sampled four times.</figcaption></figure>' +

        H2('randomization', 'A slightly different vessel every episode') +
        '<p>A driving school that put every learner in a different car each lesson would produce drivers who can handle cars in general, not just one car. ' + T('domrand', 'Domain randomization') + ' does the same for the policy ' + C('tobin2017') + ': each training episode draws a new vessel, so the policy cannot rely on the exact numbers of the nominal model, which a real boat never matches perfectly.</p>' +
        '<p>Drawing each parameter independently would be a mistake here. The identification cannot fully separate some parameters: a slightly stronger rudder with slightly more yaw damping turns much like a weaker rudder with less. So the draw starts from two ' + T('bootstrap', 'bootstrap solutions') + ' of the identification, each a complete and consistent parameter set, and blends them.</p>' +
        EQ({ label: 'Method', title: 'Drawing a vessel for one episode', tex: '\\theta = \\lambda\\,\\theta_A + (1 - \\lambda)\\,\\theta_B, \\qquad 0 \\le \\lambda \\le 1',
          words: 'take a weighted average of two complete, equally plausible parameter sets, then jitter each parameter by about 5 % (randomization scale 1.0).',
          symbols: [{ k: 'theta', tex: '\\theta', m: 'all model parameters of one vessel, as a vector', u: 'mixed', v: '\u2014', g: 'Simulation and randomization' },
            { k: 'thetaAB', tex: '\\theta_A,\\ \\theta_B', m: 'two bootstrap solutions of the identification', u: 'mixed', v: TBD('values'), g: 'Simulation and randomization' },
            { k: 'lambda', tex: '\\lambda', m: 'blend weight, drawn each episode', u: '\u2014', v: TBD('distribution'), g: 'Simulation and randomization' }],
          example: '<p>With ' + M('\\lambda = 0.25') + ' every parameter sits a quarter of the way from solution B to solution A, all at once, so the correlations between the yaw parameters ' + M('k_R') + ', ' + M('N_r') + ' and ' + M('N_{uv}') + ' are kept: every draw is a physically consistent vessel. The jitter of about 5 % then adds variety around that line. How the jitter is distributed is not given in the source files ' + TBD('jitter distribution') + '.</p>' }) +
        '<figure class="fig"><div class="frame">' + drFigure() + '</div><figcaption><b>' + fDR + '.</b> Why blend whole parameter sets. Randomized vessels (dots) stay close to the line between two consistent solutions, instead of filling combinations the identification rules out. <span class="tag illus">Illustrative</span>Axes without numbers; the bootstrap values are not given in the source files.</figcaption></figure>' +

        H2('simulator', '\u25b6 Vessel simulator') +
        '<p>This is the model above, integrated live in your browser with the nominal parameters and 0.05 s Runge\u2013Kutta steps, in calm open water; the basin outline is drawn for scale only. Steer with the sliders, or run a standard maneuver and read its numbers.</p>' +
        APP.widgetVsimHTML() +
        '<h3>What to try</h3>' +
        '<ul><li><b>Step rudder.</b> Watch the plots: nothing for 0.73 s, then the rudder creeps toward the command and the yaw rate overshoots before settling.</li>' +
        '<li><b>Turning circle.</b> Compare the circle with the basin outline, then change the propeller setting and run it again: the circle hardly changes size, but it is completed faster.</li>' +
        '<li><b>Zig-zag.</b> Read off the overshoot angles, then try the same at 12 rpm-units.</li>' +
        '<li><b>Throttle only.</b> With the rudder amidships, move the propeller slider and watch the speed settle where thrust meets drag.</li></ul>';
    },
    mount(el) {
      APP.mountRstep(el.querySelector('#rstep-widget'));
      APP.mountVsim(el.querySelector('#vsim-widget'));
    },
    takeaways: ['The vessel is a 3-DOF model: kinematics turn surge, sway and yaw rate into motion on the map, and three coupled equations balance effective mass against thrust, hull damping, rudder forces and the coupling and Munk terms of a turning, elongated hull.',
      'The rudder acts as a small wing behind a 0.73 s delay and a 0.9 s lag, and the propeller\u2019s thrust grows with the square of its setting, so cruise at 6 rpm-units is 0.558 m/s and a turn takes several seconds to build.',
      'The simulator integrates the equations with Runge\u2013Kutta sub-steps of 0.05 s, five physics steps per decision, and each training episode draws a new, physically consistent vessel by blending two bootstrap parameter sets.'],
  });
})();

</script>
<script>
/* ====== MODULE: classic.js ====== */
/* ===================================================================
   CLASSIC — the classical comparators from the facts file (Section 2):
   LOS guidance + heading PID, yaw-rate and speed loops, closed-loop
   prediction through the VESSEL model, the dynamic window approach,
   and the COLREGs velocity-obstacle logic used by the widgets.
   Controller sign: a_delta > 0 turns to starboard; it is passed to the
   model as a commanded rudder angle of -40 * a_delta (the model's delta
   is positive to port, see Section 3).
   =================================================================== */
(function () {
  'use strict';
  const VS = window.VESSEL, G = window.GEOM, D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const P = VS.NOM;
  const K = {
    Delta: 2.5, betaCap: 20, Kp: 1 / 35, Kd: 1 / 18, Ki: 1 / 600, iBand: 10, iCap: 0.15,
    rFull: 10.4, kr: 0.08, spr: Math.sqrt(P.T12 / P.Xuu) / 12, ku: 6, Unom: 0.558, dt: 0.5,
    // DWA
    trig: 9, rSet: [-9, -6.75, -4.5, -2.25, 0, 2.25, 4.5, 6.75, 9], sp: [1.0, 0.5, 0], holds: [3, 6], losSp: [1.0, 0.5],
    horizon: 16, margin: 0.20, travelWin: 5.5, tgtWin: 10, clrCap: 1.5, pathNorm: 2,
    W: { heading: 1.0, clearance: 1.0, velocity: 0.5, path: 0.6, smooth: 0.25 },
    // VO
    voOff: 90, voStep: 5, voSp: [1, 0.75, 0.5, 0.25, 0], voT: 20, voMarginT: 0.20, liveMiss: 2.5, standT: 12,
    J: { course: 1.0, speed: 0.5, prox: 1.0, change: 0.3 },
  };
  const wrap = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; };
  const clip = (x, a, b) => Math.max(a, Math.min(b, x));

  // ---------- LOS guidance (Fossen, 2021) ----------
  // path: {a:[x,y], b:[x,y]}; returns cross-track error (+ starboard), path course and desired heading (deg)
  function los(p, path, betaDeg, Delta) {
    const dx = path.b[0] - path.a[0], dy = path.b[1] - path.a[1], Lp = Math.hypot(dx, dy);
    const t = [dx / Lp, dy / Lp], n = [t[1], -t[0]];               // n: starboard normal of the path direction
    const rel = [p[0] - path.a[0], p[1] - path.a[1]];
    const ey = rel[0] * n[0] + rel[1] * n[1], along = rel[0] * t[0] + rel[1] * t[1];
    const chiPath = Math.atan2(dx, dy) * R2D;
    const bh = clip(betaDeg || 0, -K.betaCap, K.betaCap);
    const corr = Math.atan2(-ey, Delta == null ? K.Delta : Delta) * R2D;
    const chid = wrap(chiPath + corr - bh);
    const proj = [path.a[0] + along * t[0], path.a[1] + along * t[1]];
    const look = [proj[0] + (Delta == null ? K.Delta : Delta) * t[0], proj[1] + (Delta == null ? K.Delta : Delta) * t[1]];
    return { ey, along, chiPath, corr, beta: bh, chid, proj, look };
  }
  // ---------- heading PID ----------
  function pid() {
    return { I: 0, step(e, rDeg) {
      if (Math.abs(e) < K.iBand) this.I = clip(this.I + K.Ki * e * K.dt, -K.iCap, K.iCap);   // integral of K_i e over time
      return { a: clip(K.Kp * e - K.Kd * rDeg + this.I, -1, 1), P: K.Kp * e, D: -K.Kd * rDeg, I: this.I };
    } };
  }
  const yawTrack = (rd, rDeg) => clip(rd / K.rFull + K.kr * (rd - rDeg), -1, 1);
  const speedCtl = (ud, u) => clip(ud / K.spr + K.ku * (ud - u), 0, 12);

  // ---------- closed-loop prediction through the vessel model ----------
  // mode: {type:'yaw', rd, hold, ud} (yaw-rate set-point for 'hold' s, then LOS-PID) or {type:'los', ud}
  function predict(start, mode, path, tEnd, every) {
    const V = VS.create({ n: start.n != null ? start.n : 6, u: start.u, psiDeg: start.psi, x: start.x, y: start.y });
    const ctl = pid(); const out = []; every = every || 0.25;
    const kEvery = Math.round(every / 0.05), kCtl = Math.round(K.dt / 0.05), kEnd = Math.round((tEnd || K.horizon) / 0.05);
    let travel = 0, px = start.x, py = start.y;
    const snap = () => { const s = V.s; return { t: V.t, x: s.x, y: s.y, psi: s.psi * R2D, u: s.u, U: Math.hypot(s.u, s.v), r: s.r * R2D, s: travel }; };
    for (let k = 0; k < kEnd; k++) {
      if (k % kCtl === 0) {                                              // controller at the 0.5 s decision rate
        const s = V.s, psiDeg = s.psi * R2D, rDeg = s.r * R2D;
        let a;
        if (mode.type === 'yaw' && V.t < mode.hold - 1e-9) a = yawTrack(mode.rd, rDeg);
        else { const g = los([s.x, s.y], path, Math.atan2(s.v, Math.max(1e-9, s.u)) * R2D); a = ctl.step(wrap(g.chid - psiDeg), rDeg).a; }
        V.setCommand(-40 * a);
        V.n = speedCtl(mode.ud, s.u);
      }
      if (k % kEvery === 0) out.push(snap());
      V.step(0.05);
      const s2 = V.s; travel += Math.hypot(s2.x - px, s2.y - py); px = s2.x; py = s2.y;
    }
    out.push(snap());
    return out;
  }

  // ---------- DWA ----------
  function dwaCandidates() {
    const c = [];
    for (const rd of K.rSet) for (const sp of K.sp) for (const hold of K.holds) c.push({ type: 'yaw', rd, sp, hold });
    for (const sp of K.losSp) c.push({ type: 'los', sp });
    return c;
  }
  // scene: {start:{x,y,psi,u}, path, panels:[{c,w}], bounds:{x0,x1,y0,y1}, target:{p,psi,U}|null}
  function boundGap(hull, b) {
    let g = Infinity;
    for (const q of hull) g = Math.min(g, q[0] - b.x0, b.x1 - q[0], q[1] - b.y0, b.y1 - q[1]);
    return g;
  }
  function dwaEvaluate(scene) {
    const cands = dwaCandidates().map(c => {
      const ud = c.sp * K.Unom;
      const tr = predict(scene.start, c.type === 'yaw' ? { type: 'yaw', rd: c.rd, hold: c.hold, ud } : { type: 'los', ud }, scene.path, K.horizon, 0.25);
      let firstViol = null, clr = Infinity, sumE = 0, sumU = 0;
      const RH = P.L / 2 + 0.01, far = K.clrCap + 0.05;
      for (const q of tr) {
        const hull = G.hullPts([q.x, q.y], q.psi);
        let gS = boundGap(hull, scene.bounds);
        for (const pn of scene.panels) {
          const lb = Math.hypot(q.x - pn.c[0], q.y - pn.c[1]) - RH - pn.w * Math.SQRT1_2;   // lower bound on the gap
          gS = Math.min(gS, lb > far ? lb : G.polyGap(hull, pn.poly || (pn.poly = G.squarePts(pn.c, pn.w))));
        }
        let gT = Infinity;
        if (scene.target && q.t <= K.tgtWin + 1e-9) {
          const h = [Math.sin(scene.target.psi * D2R), Math.cos(scene.target.psi * D2R)];
          const pt = [scene.target.p[0] + h[0] * scene.target.U * q.t, scene.target.p[1] + h[1] * scene.target.U * q.t];
          const lb = Math.hypot(q.x - pt[0], q.y - pt[1]) - 2 * RH;
          gT = lb > far ? lb : G.polyGap(hull, G.hullPts(pt, scene.target.psi));
        }
        clr = Math.min(clr, gS, gT);
        const violS = q.s <= K.travelWin + 1e-9 && gS < K.margin, violT = gT < K.margin;
        if (firstViol == null && (violS || violT)) firstViol = { t: q.t, x: q.x, y: q.y };
        sumE += Math.abs(los([q.x, q.y], scene.path, 0).ey); sumU += q.U;
      }
      const end = tr[tr.length - 1], gEnd = los([end.x, end.y], scene.path, 0);
      const heading = 1 - Math.abs(wrap(gEnd.chid - end.psi)) * D2R / Math.PI;
      const clearance = Math.min(clr, K.clrCap) / K.clrCap;
      const velocity = sumU / tr.length / K.Unom;
      const path = 1 - sumE / tr.length / K.pathNorm;
      return Object.assign({}, c, { tr, firstViol, admissible: firstViol == null, clr, s: { heading, clearance, velocity, path } });
    });
    return cands;
  }
  function dwaScore(cands, W) {
    W = W || K.W;
    cands.forEach(c => { c.G = W.heading * c.s.heading + W.clearance * c.s.clearance + W.velocity * c.s.velocity + W.path * c.s.path; });
    const adm = cands.filter(c => c.admissible);
    let win, fallback = false;
    if (adm.length) win = adm.reduce((a, b) => (b.G > a.G ? b : a));
    else { fallback = true; win = cands.reduce((a, b) => (b.firstViol.t > a.firstViol.t + 1e-9 || (Math.abs(b.firstViol.t - a.firstViol.t) < 1e-9 && b.clr > a.clr) ? b : a)); }
    return { win, fallback, nAdm: adm.length };
  }

  // ---------- COLREGs velocity obstacle helpers ----------
  const hv = psi => [Math.sin(psi * D2R), Math.cos(psi * D2R)];
  const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
  // open-water classification (facts 2.3, step 4). own/target: {p, psi, U}
  function classify(own, tgt, convention) {
    const d = [tgt.p[0] - own.p[0], tgt.p[1] - own.p[1]];
    const brg = Math.atan2(d[0], d[1]) * R2D;
    const alpha = wrap(brg - own.psi);                                  // signed relative bearing, + starboard
    const phi = wrap(Math.atan2(-d[0], -d[1]) * R2D - tgt.psi);         // own ship off the target's bow
    const recip = Math.abs(wrap(tgt.psi - own.psi - 180));
    let cls, role;
    if (Math.abs(alpha) >= 112.5) { cls = 'being overtaken'; role = 'stand-on'; }
    else if (Math.abs(phi) >= 112.5 && own.U > tgt.U) { cls = 'overtaking'; role = 'give-way'; }
    else if (Math.abs(alpha) <= 22.5 && recip <= 22.5) { cls = 'head-on'; role = 'give-way'; }
    else if (alpha > 0) { cls = 'crossing from starboard'; role = 'give-way'; }
    else { cls = 'crossing from port'; role = convention === 'channel' ? 'give-way' : 'stand-on'; }
    // side of the constraint: +1 relative velocity must pass to starboard of the line of sight;
    // -1 mirrored (narrow-channel convention, crossing from port: pass astern of the target)
    const side = (cls === 'crossing from port' && convention === 'channel') ? -1 : 1;
    return { d, alpha, phi, recip, cls, role, side };
  }
  // hard velocity obstacle with circles of combined radius R within horizon T; returns first-contact time or null
  function contactTime(d, w, R, T) {
    const ww = w[0] * w[0] + w[1] * w[1];
    const dd = d[0] * d[0] + d[1] * d[1];
    if (dd < R * R) return 0;
    if (ww < 1e-12) return null;
    const b = d[0] * w[0] + d[1] * w[1];                // |d - w t|^2 = dd - 2 b t + ww t^2 = R^2
    const disc = b * b - ww * (dd - R * R);
    if (disc < 0) return null;
    const t1 = (b - Math.sqrt(disc)) / ww;
    return t1 >= 0 && t1 <= T ? t1 : null;
  }
  function live(d, w0) {
    const ww = w0[0] * w0[0] + w0[1] * w0[1], b = d[0] * w0[0] + d[1] * w0[1];
    if (ww < 1e-12 || b <= 0) return { closing: false, live: false, tcpa: null, dcpa: Math.hypot(d[0], d[1]) };
    const tcpa = b / ww, dcpa = Math.hypot(d[0] - w0[0] * tcpa, d[1] - w0[1] * tcpa);
    return { closing: true, live: tcpa <= K.voT && dcpa < K.liveMiss, tcpa, dcpa };
  }
  function voCandidates(psi0, chiLOS) {
    const out = [], courses = [];
    for (let o = -K.voOff; o <= K.voOff + 1e-9; o += K.voStep) courses.push(wrap(psi0 + o));
    if (!courses.some(c => Math.abs(wrap(c - chiLOS)) < 1e-6)) courses.push(wrap(chiLOS));
    for (const chi of courses) for (const f of K.voSp) out.push({ chi, U: f * K.Unom });
    return out;
  }
  const voCost = (chi, U, chiLOS, chiPrev, Upref) => K.J.course * Math.abs(wrap(chi - chiLOS)) / 180 +
    K.J.speed * Math.max(0, Upref - U) / Upref + K.J.change * Math.abs(wrap(chi - chiPrev)) / 180;

  window.CLASSIC = { K, wrap, clip, los, pid, yawTrack, speedCtl, predict, dwaCandidates, dwaEvaluate, dwaScore, classify, contactTime, live, voCandidates, voCost, hv, cross };
})();

<script>
/* ====== MODULE: w4.js ====== */
/* ===================================================================
   SECTION 4 WIDGETS — LOS guidance, dynamic window approach, and the
   COLREGs velocity obstacle. Logic in CLASSIC, physics in VESSEL.
   =================================================================== */
(function () {
  'use strict';
  const C = window.CLASSIC, G = window.GEOM, K = C.K, D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const f1 = x => (Math.round(x * 10) / 10).toString();
  const fx = (x, n) => (Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n);
  const seg = (ctl, items, on) => '<div class="seg" role="group" data-ctl="' + ctl + '">' + items.map(([k, t]) => '<button type="button" data-v="' + k + '" aria-pressed="' + (k === on ? 'true' : 'false') + '">' + t + '</button>').join('') + '</div>';
  const ro = (k, label) => '<div class="ro"><span>' + label + '</span><span data-ro="' + k + '">\u2014</span></div>';
  const side = a => (a > 0 ? 'starboard' : 'port');
  // pointer position in SVG user units
  function svgXY(el, e) {
    const svg = el.tagName && el.tagName.toLowerCase() === 'svg' ? el : el.querySelector('svg');
    if (!svg) return [0, 0];
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const m = svg.getScreenCTM(); if (!m) return [0, 0];
    const q = pt.matrixTransform(m.inverse()); return [q.x, q.y];
  }
  function hexMix(a, b, t) {
    const p = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
    try { const A = p(a), B = p(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; } catch (e) { return b; }
  }
  function dragger(svg, onMove, onEnd) {
    let active = null;
    const down = e => { const h = e.target.closest('[data-drag]'); if (!h) return; active = h.dataset.drag; svg.setPointerCapture(e.pointerId); e.preventDefault(); onMove(active, svgXY(svg, e), true); };
    const move = e => { if (!active) return; e.preventDefault(); onMove(active, svgXY(svg, e), false); };
    const up = e => { if (!active) return; const a = active; active = null; try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ } if (onEnd) onEnd(a); };
    svg.addEventListener('pointerdown', down); svg.addEventListener('pointermove', move); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    return () => { svg.removeEventListener('pointerdown', down); svg.removeEventListener('pointermove', move); svg.removeEventListener('pointerup', up); svg.removeEventListener('pointercancel', up); };
  }

  /* ================= LOS guidance ================= */
  APP.widgetLosHTML = function () {
    const M = APP.M;
    return '<div class="widget wide" id="los-widget">' +
      '<div class="w-head"><div class="w-title"><span class="play-mark" aria-hidden="true">\u25b6</span>Line-of-sight guidance</div><div class="w-sub">drag the boat or its heading handle; change the look-ahead</div></div>' +
      '<div class="w-body">' +
      '<div class="controls"><div class="ctl-group"><label class="ctl-label" for="los-D">Look-ahead ' + M('\\Delta') + '</label><input id="los-D" type="range" min="0.5" max="8" step="0.1" value="2.5"><span class="rangeval" data-ro="D">2.5 m</span></div>' +
      '<div class="ctl-group"><label class="check"><input type="checkbox" data-opt="track" checked>Predicted track (40 s)</label><button type="button" class="btn" data-act="reset">Reset</button></div></div>' +
      '<div class="controls"><div class="ctl-group"><label class="ctl-label" for="los-off">Offset from the path</label><input id="los-off" type="range" min="-4" max="4" step="0.05" value="1.5"><span class="rangeval" data-ro="off"></span></div>' +
      '<div class="ctl-group"><label class="ctl-label" for="los-psi">Heading</label><input id="los-psi" type="range" min="-90" max="90" step="1" value="20"><span class="rangeval" data-ro="psi"></span></div></div>' +
      '<div class="los-layout"><div class="los-svg" data-svg="los"></div>' +
      '<div class="readout ro-grid los-ro">' + ro('ey', 'Cross-track error ' + M('e_y')) + ro('corr', 'Correction ' + M('\\operatorname{atan2}(-e_y, \\Delta)')) + ro('chid', 'Desired heading ' + M('\\chi_d')) +
      ro('psi2', 'Heading ' + M('\\psi')) + ro('e', 'Heading error ' + M('e')) + ro('a', 'Rudder from P alone, ' + M('K_p e')) + ro('reach', 'Track first reaches the path after') + ro('over', 'Largest overshoot') + '</div></div>' +
      '</div>' +
      '<div class="w-foot"><p>The path runs north. The boat is drawn to scale; the grid is 1 m. The predicted track runs the heading PID and the vessel model of Section 3 at cruise speed from the pose shown, with no sideslip at the start. The rudder column applies the proportional part only: the derivative and integral parts are zero while the boat is not yet turning.</p></div></div>';
  };

  APP.mountLos = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s);
    const box = q('[data-svg="los"]'), elD = q('#los-D'), elOff = q('#los-off'), elPsi = q('#los-psi');
    const st = { D: 2.5, x: 1.5, y: 2, psi: 20, track: true };
    const path = { a: [0, -30], b: [0, 60] };
    const v = FIG.view({ x0: -6, x1: 6, y0: -1, y1: 15, s: 30, pad: 8 });
    let trCache = null, trKey = '';
    function predicted() {
      const key = [st.D, st.x, st.y, st.psi].map(z => z.toFixed(3)).join(',');
      if (key === trKey) return trCache;
      const save = K.Delta; K.Delta = st.D;
      trCache = C.predict({ x: st.x, y: st.y, psi: st.psi, u: K.Unom }, { type: 'los', ud: K.Unom }, path, 40, 0.25);
      K.Delta = save; trKey = key; return trCache;
    }
    function render() {
      const g = C.los([st.x, st.y], path, 0, st.D);
      const e = C.wrap(g.chid - st.psi), P = K.Kp * e, a = C.clip(P, -1, 1);
      let s = FIG.svgOpen(v, 'Line-of-sight guidance: the boat, the path, the cross-track error, the look-ahead point and the desired heading.', ' class="los-svg-el" style="touch-action: none"');
      s += '<rect width="' + v.W + '" height="' + v.H + '" rx="10" class="s-water"/>';
      for (let gx = -6; gx <= 6; gx++) s += FIG.line(v, [[gx, -1], [gx, 15]], '', ' style="stroke: var(--water-2)"');
      for (let gy = -1; gy <= 15; gy++) s += FIG.line(v, [[-6, gy], [6, gy]], '', ' style="stroke: var(--water-2)"');
      s += FIG.line(v, [[0, -1], [0, 15]], 's-path');
      s += FIG.wtext(v, [0, 14.4], 'Path (heading north)', 'lbl-s', 'start', 6, 0);
      if (st.track) {
        const tr = predicted();
        s += FIG.line(v, tr.map(p => [p.x, p.y]), '', ' style="stroke: var(--vessel)" stroke-width="2" stroke-dasharray="6 4"');
      }
      // cross-track error, projection, look-ahead
      s += FIG.line(v, [[st.x, st.y], g.proj], '', ' style="stroke: var(--testing)" stroke-width="2"');
      s += FIG.wtext(v, [(st.x + g.proj[0]) / 2, st.y], 'e<tspan dy="3.5" font-size="76%">y</tspan>', 'lbl-b', 'middle', 0, -6, ' style="fill: var(--testing)"');
      s += FIG.dot(v, g.proj, 3.5, '', ' style="fill: var(--testing)"');
      s += FIG.line(v, [g.proj, g.look], '', ' style="stroke: var(--testing)" stroke-width="4" stroke-opacity=".45"');
      s += FIG.wtext(v, [(g.proj[0] + g.look[0]) / 2, (g.proj[1] + g.look[1]) / 2], '\u0394', 'lbl-b', g.look[0] < st.x ? 'end' : 'start', g.look[0] < st.x ? -8 : 8, 4, ' style="fill: var(--testing)"');
      s += FIG.dot(v, g.look, 6, '', ' style="fill: var(--decision)"');
      s += FIG.wtext(v, g.look, 'Look-ahead point', 'lbl-s', g.look[0] < st.x ? 'end' : 'start', g.look[0] < st.x ? -10 : 10, 4);
      // desired heading and actual heading
      const h = [Math.sin(g.chid * D2R), Math.cos(g.chid * D2R)], hp = [Math.sin(st.psi * D2R), Math.cos(st.psi * D2R)];
      s += FIG.hull(v, [st.x, st.y], st.psi, 's-own', ' data-drag="move" style="cursor: move"');
      s += FIG.line(v, [[st.x, st.y], g.look], '', ' style="stroke: var(--decision)" stroke-width="1.2" stroke-dasharray="3 4"');
      s += FIG.arrow(v, [st.x, st.y], [st.x + h[0] * 1.8, st.y + h[1] * 1.8], 's-dec f-dec', 9);
      const rightSide = h[0] < 0;
      s += FIG.wtext(v, [st.x + h[0] * 1.5, st.y + h[1] * 1.5], '\u03c7<tspan dy="3.5" font-size="76%">d</tspan>', 'lbl-b halo', rightSide ? 'start' : 'end', rightSide ? 10 : -10, 4, ' style="fill: var(--decision)"');
      const hq = [st.x + hp[0] * 1.55, st.y + hp[1] * 1.55];
      s += FIG.line(v, [[st.x, st.y], hq], '', ' style="stroke: var(--ink)" stroke-width="1.6"');
      s += FIG.circle(v, hq, 0.22, '', ' data-drag="turn" style="fill: var(--surface); stroke: var(--ink); cursor: grab" stroke-width="2"');
      s += FIG.wtext(v, hq, 'heading', 'lbl-s', 'start', 10, 4);
      s += FIG.scale(v, v.W - 70, v.H - 12, 1);
      box.innerHTML = s + '</svg>';
      // readouts

      for (let g = -10; g <= 10; g += 5) s += FIG.line(vw, [[g, -7], [g, 19]], '', ' style="stroke: var(--water-2)"');
      for (let g = -5; g <= 15; g += 5) s += FIG.line(vw, [[-10, g], [10, g]], '', ' style="stroke: var(--water-2)"');
      s += FIG.line(vw, [own.p, st.tgt.p], '', ' style="stroke: var(--ink-3)" stroke-dasharray="4 4"');
      s += FIG.circle(vw, st.tgt.p, RVO, '', ' style="fill: var(--target-fill); stroke: var(--target)" fill-opacity=".35" stroke-dasharray="3 3"');
      s += FIG.hull(vw, st.tgt.p, st.tgt.psi, 's-tgt', ' data-drag="target" style="cursor: move"');
      s += FIG.arrow(vw, st.tgt.p, [st.tgt.p[0] + vt[0] * 5, st.tgt.p[1] + vt[1] * 5], 's-trg f-trg', 8);
      s += FIG.hull(vw, own.p, 0, 's-own');
      s += FIG.arrow(vw, own.p, [vOS0[0] * 5, vOS0[1] * 5], 'k-ink2 f-ink2', 8);
      s += FIG.arrow(vw, own.p, [st.test[0] * 5, st.test[1] * 5], 's-dec f-dec', 8);
      s += FIG.wtext(vw, st.tgt.p, 'Target', 'lbl-s', 'middle', 0, -18);
      s += FIG.wtext(vw, [-9.6, 18.2], 'Arrows: 5 s of travel. Grid 5 m.', 'lbl-s', 'start');
      boxW.innerHTML = s + '</svg>';
      // velocity space
      let t = '<svg viewBox="0 0 ' + VW + ' ' + VW + '" role="img" aria-label="Velocity space: the velocity-obstacle cone, the forbidden half-plane, the candidate velocities and your velocity." style="touch-action: none">';
      t += '<defs><pattern id="vo-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill: var(--decision-fill)" fill-opacity=".45"/><path d="M0 0V7" style="stroke: var(--decision)" stroke-width="1.4" stroke-opacity=".7"/></pattern><clipPath id="vo-clip"><rect width="' + VW + '" height="' + VW + '" rx="10"/></clipPath></defs>';
      t += '<rect width="' + VW + '" height="' + VW + '" rx="10" style="fill: var(--surface); stroke: var(--rule)"/>';
      t += '<g clip-path="url(#vo-clip)">';
      for (let g = -1; g <= 1; g += 0.5) { t += '<path d="M' + f1(VX(g)) + ' 0V' + VW + 'M0 ' + f1(VY(g)) + 'H' + VW + '" style="stroke: var(--rule-2)"/>'; }
      if (lv.live && cls.role === 'give-way') {
        const dl = Math.hypot(cls.d[0], cls.d[1]), dh = [cls.d[0] / dl, cls.d[1] / dl];
        const n = cls.side > 0 ? [-dh[1], dh[0]] : [dh[1], -dh[0]];            // forbidden side: port of the line of sight (mirrored for side = -1)
        const F = 6, hp = [[vt[0] - dh[0] * F, vt[1] - dh[1] * F], [vt[0] + dh[0] * F, vt[1] + dh[1] * F], [vt[0] + dh[0] * F + n[0] * F, vt[1] + dh[1] * F + n[1] * F], [vt[0] - dh[0] * F + n[0] * F, vt[1] - dh[1] * F + n[1] * F]];
        t += '<path d="' + vpath(hp, true) + '" style="fill: url(#vo-hatch)"/>';
        t += '<path d="' + vpath([hp[0], hp[1]], false) + '" style="stroke: var(--decision)" stroke-width="1.6" fill="none"/>';
      }
      const cone = conePoly(cls.d, vt);
      if (cone) t += '<path d="' + vpath(cone, true) + '" style="fill: var(--target-fill); stroke: var(--target)" fill-opacity=".7" stroke-width="1.6"/>';
      else t += '<rect width="' + VW + '" height="' + VW + '" style="fill: var(--target-fill)" fill-opacity=".7"/>';
      t += '</g>';
      t += '<path d="M' + f1(VX(0)) + ' 8V' + (VW - 8) + 'M8 ' + f1(VY(0)) + 'H' + (VW - 8) + '" style="stroke: var(--ink-3)"/>';
      t += FIG.text(VW - 10, VY(0) - 6, 'east', 'lbl-s', 'end') + FIG.text(VX(0) + 6, 18, 'north', 'lbl-s', 'start');
      t += '<circle cx="' + VX(0) + '" cy="' + VY(0) + '" r="' + f1(U0 * VK) + '" fill="none" style="stroke: var(--ink-3)" stroke-dasharray="4 4"/>';
      if (st.cands) {
        const col = { ok: 'var(--perception)', collision: 'var(--target)', colregs: 'var(--decision)' };
        ch.list.forEach(c => { t += '<circle cx="' + f1(VX(c.vel[0])) + '" cy="' + f1(VY(c.vel[1])) + '" r="2.6" style="fill: ' + col[c.s] + '"/>'; });
      }
      if (ch.pick) {
        const X = VX(ch.pick.vel[0]), Y = VY(ch.pick.vel[1]);
        const star = Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 4 : 9.5, a = -Math.PI / 2 + i * Math.PI / 5; return f1(X + r * Math.cos(a)) + ' ' + f1(Y + r * Math.sin(a)); }).join('L');
        t += '<path d="M' + star + 'Z" style="fill: var(--ink); stroke: var(--surface)" stroke-width="1.2"/>';
      }
      t += '<circle cx="' + f1(VX(vt[0])) + '" cy="' + f1(VY(vt[1])) + '" r="4.5" class="f-trg"/>' + FIG.text(VX(vt[0]) + 8, VY(vt[1]) + 14, 'target velocity', 'lbl-s', 'start', ' style="fill: var(--target)"');
      t += '<circle cx="' + f1(VX(vOS0[0])) + '" cy="' + f1(VY(vOS0[1])) + '" r="6" fill="none" style="stroke: var(--ink-2)" stroke-width="1.6"/>';
      t += '<circle cx="' + f1(VX(st.test[0])) + '" cy="' + f1(VY(st.test[1])) + '" r="9" data-drag="vel" style="fill: var(--decision); stroke: var(--surface); cursor: grab" stroke-width="2.5"/>';
      boxV.innerHTML = t + '</svg>';
      // text
      const set = (k, x) => { const el = q('[data-ro="' + k + '"]'); if (el) el.textContent = x; };
      set('cls', cls.cls + ' (relative bearing ' + fx(cls.alpha, 0) + '\u00b0)');
      set('role', cls.role === 'give-way' ? 'give way' + (cls.side < 0 ? ' (pass astern: mirrored side)' : ' (pass to starboard of the line of sight)') : 'stand on (Rule 17)');
      set('live', lv.live ? 'yes: closing, predicted miss ' + fx(lv.dcpa, 2) + ' m in ' + fx(lv.tcpa, 1) + ' s' : (lv.closing ? 'no: miss ' + fx(lv.dcpa, 2) + ' m in ' + fx(lv.tcpa, 1) + ' s' : 'no: not closing'));
      const cT = Math.atan2(st.test[0], st.test[1]) * R2D, uT = Math.hypot(st.test[0], st.test[1]);
      set('test', uT < 0.01 ? 'stopped' : (Math.abs(cT) < 0.5 ? 'straight ahead' : fx(Math.abs(cT), 0) + '\u00b0 to ' + side(cT)) + ', ' + fx(uT, 3) + ' m/s');
      set('tc', me.tc == null ? 'none within 20 s' : fx(me.tc, 1) + ' s');
      const pc = ch.pick ? C.wrap(ch.pick.chi - own.psi) : 0;
      set('choice', ch.pick ? 'The comparator picks (star): ' + (Math.abs(pc) < 0.5 ? 'hold course' : fx(Math.abs(pc), 0) + '\u00b0 to ' + side(pc)) + ' at ' + fx(ch.pick.U, 3) + ' m/s \u2014 ' + ch.how + '.' : '');
      const msg = { ok: '<span class="pill yes">allowed</span>', collision: '<span class="pill no">forbidden by collision</span>', colregs: '<span class="pill colregs">forbidden by COLREGs</span>' }[me.s];
      q('[data-ro="status"]').innerHTML = 'Your velocity is ' + msg;
    }
    const offs = [];
    const on = (el, ev, fn) => { el.addEventListener(ev, fn); offs.push(() => el.removeEventListener(ev, fn)); };
    on(q('[data-ctl="preset"]'), 'click', e => { const b = e.target.closest('button'); if (!b) return; qa('[data-ctl="preset"] button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); setPreset(b.dataset.v); render(); });
    on(q('[data-ctl="conv"]'), 'click', e => { const b = e.target.closest('button'); if (!b) return; qa('[data-ctl="conv"] button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); st.conv = b.dataset.v; render(); });
    on(q('[data-opt="cands"]'), 'change', e => { st.cands = e.target.checked; render(); });
    let raf = 0;
    const later = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
    const offW = dragger(boxW, (what, xy) => { if (what !== 'target') return; st.tgt.p = [C.clip(vw.o.x0 + (xy[0] - vw.pad) / vw.s, -9.5, 9.5), C.clip(vw.o.y1 - (xy[1] - vw.pad) / vw.s, -6.5, 18.5)]; later(); });
    const offV = dragger(boxV, (what, xy) => {
      if (what !== 'vel') return;
      let vx = (xy[0] - VC) / VK, vy = (VC - xy[1]) / VK; const sp = Math.hypot(vx, vy);
      if (sp > U0) { vx *= U0 / sp; vy *= U0 / sp; }
      st.test = [vx, vy]; later();
    });
    render();
    APP.onCleanup(() => { offW(); offV(); offs.forEach(f => f()); if (raf) cancelAnimationFrame(raf); });
  };
})();

<script>
/* ====== MODULE: sec4.js ====== */
/* ===================================================================
   SECTION 4 — Classical methods
   Numbers from the facts file, Section 2 (classical comparators).
   =================================================================== */
(function () {
  'use strict';
  const { M, MD, T, AB, C, FIGN, H2, EQ, VERIFY, TBD, XS } = APP;
  const CL = window.CLASSIC, K = CL.K, D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const fx = (x, n) => (Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n);
  const f1 = x => (Math.round(x * 10) / 10).toString();

  // ---------- registry additions ----------
  APP.SYMGROUPS.push('Comparator tuning', 'Guidance and control', 'Dynamic window approach', 'Velocity obstacles');
  Object.assign(APP.ABBR, { APF: 'artificial potential field' });
  Object.assign(APP.TERMS, {
    coorddescent: ['coordinate descent', 'Tuning by adjusting one parameter at a time, keeping each change that improves the score, and cycling until nothing improves.'],
    localmin: ['local minimum', 'A point where every small move looks worse, although it is not the best point overall. In a potential field, a place where the pushes of obstacles cancel the pull of the goal.'],
    lookahead: ['look-ahead distance', 'How far ahead along the path line-of-sight guidance places the point it steers toward.'],
    setpoint: ['set-point', 'The value a control loop is asked to reach and hold, such as a yaw rate of 4.5\u00b0/s.'],
    feedforward: ['feedforward', 'The part of a command computed directly from the set-point, before any error is measured. Feedback then corrects what the feedforward gets wrong.'],
    dynwindow: ['dynamic window', 'The set of commands the vessel can actually follow in the next few seconds, given how fast it can change speed and turn rate.'],
    collisioncone: ['collision cone', 'The set of velocities, drawn as a cone, that would bring two vessels within a given distance of each other within a time horizon if the other keeps its velocity.'],
    liveenc: ['live encounter', 'In the COLREGs velocity obstacle, an encounter that is closing and predicted to pass within 2.5 m within 20 s. Only then does the side constraint apply.'],
    halfplane: ['half-plane', 'Everything on one side of a straight line. The COLREGs constraint forbids the half of velocity space on the wrong side of the line of sight.'],
  });
  const R = (cite, text, extra) => Object.assign({ cite, text }, extra || {});
  Object.assign(APP.REFS, {
    khatib1986: R('Khatib, 1986', 'Khatib, O. (1986). Real-time obstacle avoidance for manipulators and mobile robots. <i>The International Journal of Robotics Research, 5</i>(1), 90\u201398.', { verify: true }),
    fiorini1998: R('Fiorini and Shiller, 1998', 'Fiorini, P., and Shiller, Z. (1998). Motion planning in dynamic environments using velocity obstacles. <i>The International Journal of Robotics Research, 17</i>(7), 760\u2013772.', { verify: true }),
  });

  // ---------- small helpers ----------
  const svgBox = (w, h, label, style) => '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + APP.esc(label) + '"' + (style ? ' style="' + style + '"' : '') + '>';
  const sb = (base, sub, rest) => base + '<tspan dy="3.5" font-size="76%">' + sub + '</tspan><tspan dy="-3.5">' + (rest || '\u200b') + '</tspan>';
  const pt = (cx, cy, r, a) => [cx + r * Math.sin(a * D2R), cy - r * Math.cos(a * D2R)];
  function arcS(cx, cy, r, a0, a1, style) {
    const p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1), large = (((a1 - a0) % 360) + 360) % 360 > 180 ? 1 : 0;
    return '<path d="M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + 'A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + '" fill="none" style="' + style + '"/>';
  }
  const wedge = (cx, cy, r, a0, a1, style) => { const p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1), large = (((a1 - a0) % 360) + 360) % 360 > 180 ? 1 : 0;
    return '<path d="M' + cx + ' ' + cy + 'L' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + 'A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'Z" style="' + style + '"/>'; };
  const box = (x, y, w, h, title, sub, style) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="7" style="' + (style || 'fill: var(--surface); stroke: var(--rule)') + '"/>' +
    FIG.text(x + w / 2, y + (sub ? h / 2 - 3 : h / 2 + 5), title, 'lbl-b', 'middle') + (sub ? FIG.text(x + w / 2, y + h / 2 + 13, sub, 'lbl-s', 'middle') : '');

  // ---------- Figure: artificial potential field (illustrative) ----------
  function apfFigure() {
    const goal = [5, 12], obs = [[4.05, 7], [5.95, 7]], r0 = 0.55, rho0 = 2.5;
    const force = (p, eta) => {
      const dg = [goal[0] - p[0], goal[1] - p[1]], lg = Math.hypot(dg[0], dg[1]) || 1;
      let fx0 = dg[0] / lg, fy0 = dg[1] / lg;
      for (const c of obs) {
        const dx = p[0] - c[0], dy = p[1] - c[1], dc = Math.hypot(dx, dy), rho = Math.max(0.05, dc - r0);
        if (rho < rho0) { const k = eta * (1 / rho - 1 / rho0) / (rho * rho); fx0 += k * dx / dc; fy0 += k * dy / dc; }
      }
      return [fx0, fy0];
    };
    // choose the repulsion gain so that the trap sits at y = 5.3 on the axis between the obstacles
    let lo = 0.001, hi = 5;
    for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (force([5, 5.3], m)[1] > 0) lo = m; else hi = m; }
    const eta = (lo + hi) / 2;
    const v = FIG.view({ x0: 0, x1: 10, y0: 0, y1: 13, s: 30, pad: 8 });
    let s = FIG.svgOpen(v, 'Illustrative potential field: arrows show the combined pull of the goal and push of two close obstacles; a path from the start stops below the gap, where the forces cancel.', ' style="max-width: 360px; margin: 0 auto"');
    s += '<rect width="' + v.W + '" height="' + v.H + '" rx="10" class="s-water"/>';
    for (let gx = 0.6; gx < 10; gx += 0.8) for (let gy = 0.6; gy < 13; gy += 0.8) {
      if (obs.some(c => Math.hypot(gx - c[0], gy - c[1]) < r0 + 0.12)) continue;
      const F = force([gx, gy], eta), L = Math.hypot(F[0], F[1]); if (L < 1e-6) continue;
      const len = 0.18 + 0.2 * Math.min(1, L / 2);
      s += FIG.arrow(v, [gx - F[0] / L * len, gy - F[1] / L * len], [gx + F[0] / L * len, gy + F[1] / L * len], 'k-ink3 f-ink3', 5);
    }
    obs.forEach(c => { s += FIG.circle(v, c, r0, 's-panel'); });
    // path by normalized descent
    let p = [5.02, 1.2]; const tr = [p.slice()];
    for (let i = 0; i < 400; i++) { const F = force(p, eta), L = Math.hypot(F[0], F[1]); if (L < 1e-3) break; p = [p[0] + 0.03 * F[0] / L, p[1] + 0.03 * F[1] / L]; tr.push(p.slice()); }
    s += FIG.line(v, tr, '', ' style="stroke: var(--vessel)" stroke-width="3"');
    s += FIG.dot(v, tr[tr.length - 1], 6, '', ' style="fill: var(--target)"');
    s += FIG.wtext(v, tr[tr.length - 1], 'Stuck: the pushes', 'lbl-b halo', 'start', 10, 16, ' style="fill: var(--target)"') + FIG.wtext(v, tr[tr.length - 1], 'cancel the pull', 'lbl-b halo', 'start', 10, 32, ' style="fill: var(--target)"');
    s += FIG.hull(v, [5, 1.2], 0, 's-own') + FIG.wtext(v, [5, 1.2], 'Start', 'lbl-s halo', 'start', 14, 4);
    s += FIG.circle(v, goal, 0.35, '', ' style="fill: var(--decision)"') + FIG.wtext(v, goal, 'Goal (pulls)', 'lbl-b halo', 'start', 14, 5);
    s += FIG.wtext(v, [6.5, 7], 'Obstacles (push)', 'lbl-s halo', 'start', 8, 4);
    return s + '</svg>';
  }

  // ---------- Figure: LOS geometry (the worked example) ----------
  function losFigure() {
    const v = FIG.view({ x0: -2.2, x1: 3.2, y0: -0.3, y1: 5.6, s: 72, pad: 10 });
    const P0 = [1.0, 1.0], proj = [0, 1.0], look = [0, 3.5], psi = 10;
    let s = FIG.svgOpen(v, 'Line-of-sight geometry: the boat 1 m to starboard of a north-going path aims at the point 2.5 m ahead of its projection on the path.', ' style="max-width: 420px; margin: 0 auto"');
    s += '<rect width="' + v.W + '" height="' + v.H + '" rx="10" class="s-water"/>';
    s += FIG.line(v, [[0, -0.3], [0, 5.6]], 's-path') + FIG.wtext(v, [0, 5.3], sb('Path, direction \u03c7', 'path'), 'lbl-s', 'end', -8, 4);
    s += FIG.line(v, [P0, proj], '', ' style="stroke: var(--testing)" stroke-width="2.4"') + FIG.wtext(v, [0, 1.0], sb('e', 'y', ' = 1.0 m'), 'lbl-b', 'end', -10, 5, ' style="fill: var(--testing)"');
    s += FIG.line(v, [proj, look], '', ' style="stroke: var(--testing)" stroke-width="5" stroke-opacity=".4"') + FIG.wtext(v, [0, 2.4], '\u0394 = 2.5 m', 'lbl-b', 'end', -10, 4, ' style="fill: var(--testing)"');
    s += FIG.dot(v, proj, 4, '', ' style="fill: var(--testing)"') + FIG.dot(v, look, 6.5, '', ' style="fill: var(--decision)"') + FIG.wtext(v, look, 'Aim point', 'lbl-b', 'end', -12, -6, ' style="fill: var(--decision)"');
    s += FIG.hull(v, P0, psi, 's-own');
    s += FIG.arrow(v, P0, [P0[0] + (look[0] - P0[0]) * 0.86, P0[1] + (look[1] - P0[1]) * 0.86], 's-dec f-dec', 10);
    s += FIG.line(v, [P0, [P0[0], P0[1] + 2.4]], '', ' style="stroke: var(--ink-3)" stroke-dasharray="4 4"');
    const cx = v.X(P0[0], P0[1]), cy = v.Y(P0[0], P0[1]);
    s += arcS(cx, cy, 104, -21.8, 0, 'stroke: var(--decision); stroke-width: 1.6');
    const lq = pt(cx, cy, 118, -11); s += FIG.text(lq[0], lq[1], '21.8\u00b0', 'lbl-s', 'middle', ' style="fill: var(--decision)"');
    s += FIG.wtext(v, [P0[0] + (look[0] - P0[0]) * 0.7, P0[1] + (look[1] - P0[1]) * 0.7], sb('\u03c7', 'd'), 'lbl-b', 'end', -9, 4, ' style="fill: var(--decision); font-size: 15px"');
    s += FIG.scale(v, v.W - 92, v.H - 12, 1);
    return s + '</svg>';
  }

  // ---------- Figure: the PID loop ----------
  function pidFigure() {
    const w = 662, h = 250;
    let s = svgBox(w, h, 'Block diagram of the heading loop: line-of-sight guidance gives the desired heading; the error feeds proportional, integral and derivative parts; their sum is the rudder command; the vessel returns its heading and yaw rate.', 'max-width: 700px; margin: 0 auto');
    const ln = 'fill="none" style="stroke: var(--ink-2)" stroke-width="1.6"';
    s += box(6, 92, 112, 50, 'LOS guidance', 'desired heading');
    s += '<circle cx="158" cy="117" r="15" style="fill: var(--surface); stroke: var(--ink-2)" stroke-width="1.6"/>' + FIG.text(158, 122, '\u2212', 'lbl-b', 'middle') + FIG.text(150, 108, '+', 'lbl-s', 'middle');
    s += FIG.arrowS(118, 117, 142, 117, 'k-ink2 f-ink2', 7) + FIG.text(158, 88, 'error e', 'lbl-s', 'middle');
    const pc = 'fill: var(--decision-fill); stroke: var(--decision)';
    s += box(222, 18, 196, 52, 'P: reacts to the error', sb('K', 'p', ' e'), pc);
    s += box(222, 92, 196, 52, 'I: to the accumulated error', sb('\u222b K', 'i', ' e dt, capped'), pc);
    s += box(222, 166, 196, 52, 'D: to how fast it changes', sb('\u2212K', 'd', ' r'), pc);
    s += '<path d="M173 117H196M196 44V192M196 192H216" ' + ln + '/>';
    s += FIG.arrowS(196, 44, 221, 44, 'k-ink2 f-ink2', 7) + FIG.arrowS(196, 117, 221, 117, 'k-ink2 f-ink2', 7) + FIG.arrowS(196, 192, 221, 192, 'k-ink2 f-ink2', 7);
    s += '<circle cx="455" cy="117" r="15" style="fill: var(--surface); stroke: var(--ink-2)" stroke-width="1.6"/>' + FIG.text(455, 122, '+', 'lbl-b', 'middle');
    s += '<path d="M418 44H455V96M418 117H434M418 192H455V138" ' + ln + '/>';
    s += FIG.arrowS(455, 90, 455, 101, 'k-ink2 f-ink2', 6) + FIG.arrowS(430, 117, 439, 117, 'k-ink2 f-ink2', 6) + FIG.arrowS(455, 144, 455, 133, 'k-ink2 f-ink2', 6);
    s += FIG.arrowS(470, 117, 506, 117, 'k-ink2 f-ink2', 7) + FIG.text(488, 108, sb('a', '\u03b4'), 'lbl-b', 'middle');
    s += box(508, 92, 148, 50, 'Servo + vessel', 'Section 3', 'fill: var(--vessel-fill); stroke: var(--vessel)');
    s += '<path d="M572 142V236H158V140" ' + ln + '/>' + FIG.arrowS(158, 146, 158, 133, 'k-ink2 f-ink2', 7);
    s += FIG.text(365, 231, 'heading \u03c8 fed back', 'lbl-s', 'middle');
