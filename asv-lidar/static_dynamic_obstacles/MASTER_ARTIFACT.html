<script>
/* ====== MODULE: sec7.js ====== */
/* ===================================================================
   SECTION 7 — The learning problem (formulation file §§1-5, used exactly)
   =================================================================== */
(function () {
  'use strict';
  const { M, MD, T, AB, C, FIGN, H2, EQ, VERIFY, XS } = APP;
  const G = window.GEOM, K = G.K, F = APP.F7;
  const fx = (x, n) => (Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n);
  const clip = (x, a, b) => Math.max(a, Math.min(b, x)), DEG = Math.PI / 180;
  const fig = (n, svg, cap, wide) => '<figure class="fig' + (wide ? ' wide' : '') + '"><div class="frame' + (wide ? ' scroll-sm' : '') + '">' + svg + '</div>' + (wide ? '<span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span>' : '') + '<figcaption><b>' + n + '.</b> ' + cap + '</figcaption></figure>';
  const gO = 'Observation and action', gR = 'Reward', gC = 'COLREGs reward terms';
  const tbl = (head, rows) => '<div class="tbl-wrap"><table class="cmp"><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';

  APP.section({
    n: 7, id: 's7', title: 'The learning problem', short: 'The learning problem', subsystem: 'decision',
    learn: ['Exactly what the policy observes, what it commands, when an episode ends, and how it is rewarded.',
      'Why each reward term has its shape and weight, and what would go wrong if it were larger or smaller.'],
    build() {
      const nf = Array.from({ length: 5 }, () => FIGN());
      const U = K.Uref, Us = 2 * U, q = (e, chi) => 0.7 * Math.exp(-4 * e * e) + 0.3 * (1 + Math.cos(chi * DEG)) / 2;
      const e0 = Math.exp(-2 / 0.6), robs = d => -clip((Math.exp(-d / 0.6) - e0) / (1 - e0), 0, 1);
      const sb20 = (Math.cos(20 * DEG) - Math.cos(67.5 * DEG)) / (1 - Math.cos(67.5 * DEG));
      const Lref = 71.7 * U * K.dt;
      return '' +
        H2('overview', 'What the policy sees, does and is paid') +
        '<p>' + XS(5) + ' described reinforcement learning in general: an agent observes, acts and is rewarded. This section fills in the specifics for this study, the ' + T('formulation') + ': exactly what the policy observes, what it can command, when an episode ends, and how each step is scored. Everything here follows the study\u2019s formulation equations exactly, and the formulation refers to no particular learner: all four learners of ' + XS(5) + ' are trained on it unchanged.</p>' +

        H2('observation', 'The observation: six branches, 70 values') +
        '<p>A pilot glancing at instruments does not read raw sensor data; the dials are scaled so that \u201cfull\u201d and \u201cempty\u201d mean something. The observation does the same: every value is scaled to [0, 1] or [\u22121, 1] by ' + T('normalization') + ', and the 70 values are grouped into six branches by what they describe.</p>' +
        fig(nf[0], F.branches(), 'The six branches of the observation, where each comes from, and which encoder of the network reads it.', true) +
        EQ({ label: 'Model', title: 'The observation vector', tex: 'o_t = \\{\\, \\text{lidar} \\in [0,1]^{27},\\ \\text{boundary} \\in [0,1]^{7},\\ \\text{ego} \\in [-1,1]^{3},\\ \\text{path} \\in [-1,1]^{3},\\ \\text{target} \\in \\mathbb{R}^{16},\\ \\text{context} \\in \\mathbb{R}^{14} \\,\\}',
          words: 'at every step the policy receives 70 numbers in six groups: static obstacles, the map boundary, its own motion, its path, one target vessel, and the state of the current encounter with its own previous command.',
          symbols: [{ k: 'rlO', tex: 'o_t', m: 'observation at step t', u: '\u2014', v: '70 values', g: 'Reinforcement learning' }],
          example: '<p>' + M('27 + 7 + 3 + 3 + 16 + 14 = 70') + '. The LiDAR branch is the 27 sector closeness values of ' + XS(6, 'pooling') + ', ' + M('c_k = \\operatorname{clip}(1 - \\bar{\\rho}_k/16,\\ 0,\\ 1)') + ', computed from static returns only over \u00b1135\u00b0; the moving target goes to its own branch instead.</p>' }) +
        EQ({ label: 'Model', title: 'Boundary branch', tex: 'b_i = \\operatorname{clip}\\!\\left(1 - \\frac{d_i}{16\\ \\mathrm{m}},\\ 0,\\ 1\\right), \\qquad \\beta_i \\in \\{-90^\\circ, -60^\\circ, \\dots, +90^\\circ\\}',
          words: 'seven rays are cast on the map from the estimated pose, across the bow from beam to beam, and each reports how close the edge of the navigable water is.',
          symbols: [{ k: 'bi', tex: 'b_i', m: 'closeness of the boundary along ray i', u: '\u2014', v: '0.75 (example)', g: gO },
            { k: 'di', tex: 'd_i', m: 'distance to the navigable polygon along ray i, at most 16 m', u: 'm', v: '4', g: gO },
            { k: 'betai', tex: '\\beta_i', m: 'bearing of ray i off the bow', u: '\u00b0', v: '\u221290 to +90 in steps of 30', g: gO }],
          example: '<p>A wall 4 m away abeam to starboard gives ' + M('b = 1 - 4/16 = 0.75') + '; open water for 16 m or more gives 0. The rays use the map, not the LiDAR, so walls that the gate of ' + XS(6, 'gate') + ' removed from the scan are still seen here.</p>' }) +
        EQ({ label: 'Model', title: 'Ego and path branches', tex: '\\begin{gathered} \\text{ego} = \\left[\\operatorname{clip}\\!\\left(\\tfrac{\\hat{u}}{U_s}\\right),\\ \\operatorname{clip}\\!\\left(\\tfrac{\\hat{v}}{U_s}\\right),\\ \\operatorname{clip}\\!\\left(\\tfrac{\\hat{r}\\,[^\\circ/\\mathrm{s}]}{180}\\right)\\right], \\qquad U_s = 2\\,U_{\\mathrm{ref}} = 1.116\\ \\mathrm{m/s} \\\\[4pt] \\text{path} = \\left[\\operatorname{clip}\\!\\left(\\tfrac{\\hat{e}_y}{h_{\\mathrm{side}}}\\right),\\ \\operatorname{clip}\\!\\left(\\tfrac{\\tilde{\\chi}}{180^\\circ}\\right),\\ \\operatorname{clip}\\!\\left(\\tfrac{\\tilde{\\chi}_{\\mathrm{LA}}}{180^\\circ}\\right)\\right] \\end{gathered}',
          words: 'own speeds and turn rate are scaled so that twice cruise speed reads 1; the cross-track error is scaled by the room on that side, so \u00b11 marks the edge of the water, and the two course errors by 180\u00b0. Every clip here is to [\u22121, 1].',
          symbols: [{ k: 'Uscale', tex: 'U_s', m: 'speed scale, twice the cruise speed', u: 'm/s', v: '1.116', g: gO },
            { k: 'hside', tex: 'h_{\\mathrm{side}}', m: 'distance from the path to the boundary on the side the vessel is on', u: 'm', v: '3.52 (8 m channel, starboard)', g: gO },
            { k: 'chitil', tex: '\\tilde{\\chi}', m: 'course error: course over ground minus path course', u: '\u00b0', v: '10 (example)', g: gO },
            { k: 'chitilLA', tex: '\\tilde{\\chi}_{\\mathrm{LA}}', m: 'look-ahead course error, against the line-of-sight course', u: '\u00b0', v: '\u2014', g: gO }],
          example: '<p>At cruise, ' + M('0.558/1.116 = 0.5') + '; turning at the full-rudder rate of 10.4\u00b0/s gives ' + M('10.4/180 = 0.058') + '. In an 8 m channel the path sits 3.52 m from the starboard wall, so a vessel 1.0 m to starboard of it reads ' + M('1.0/3.52 = 0.28') + ', and a course error of 10\u00b0 reads ' + M('10/180 = 0.056') + '.</p>' }) +
        '<p>The target slot describes one tracked vessel in 16 values. All are zero, including the ' + T('presencebit') + ', when no track is held, and the network\u2019s target-slot encoder is gated by that bit (' + XS(5, 'protocol') + '). The class is written as a ' + T('onehot', 'one-hot') + ' row.</p>' +
        tbl(['#', 'Feature', 'Encoding'], [
          ['0', 'distance to the target\u2019s domain ' + M('d_{\\mathrm{dom}}') + ' (Eq. 5)', M('\\operatorname{clip}(d_{\\mathrm{dom}}/16,\\ 0,\\ 1)')],
          ['1\u20132', 'relative bearing ' + M('\\alpha'), M('\\sin\\alpha,\\ \\cos\\alpha')],
          ['3\u20134', 'heading-crossing angle ' + M('c'), M('\\sin c,\\ \\cos c')],
          ['5', 'target speed ' + M('U_{\\mathrm{TS}}'), M('\\operatorname{clip}(U_{\\mathrm{TS}}/U_s,\\ 0,\\ 1)')],
          ['6', 'relative speed ' + M('|\\mathbf{v}_{\\mathrm{TS}} - \\mathbf{v}_{\\mathrm{OS}}|'), M('\\operatorname{clip}(v_{\\mathrm{rel}}/U_s,\\ 0,\\ 1)')],
          ['7', 'DCPA measured to the domain, ' + M('\\mathrm{DCPA}_{\\mathrm{dom}} = \\max(0,\\ \\mathrm{DCPA} - R_{\\mathrm{dom}}(\\alpha))'), M('\\operatorname{clip}(\\mathrm{DCPA}_{\\mathrm{dom}}/1.25,\\ 0,\\ 12.8)/12.8')],
          ['8', 'TCPA', M('\\operatorname{clip}(\\mathrm{TCPA},\\ -40,\\ 40)/40')],
          ['9', 'collision risk index (Eq. 6)', 'in [0, 1]'],
          ['10\u201314', 'class: none, head-on, crossing, overtaking, being overtaken', 'one-hot, {0, 1}'],
          ['15', 'presence', '1'],
        ]) +
        '<p>The context branch is the latched encounter of ' + XS(2, 'engage') + ', followed by the previous executed action. It tells the policy not just where the target is, but what the encounter requires of it now.</p>' +
        tbl(['#', 'Feature', 'Definition'], [
          ['0, 1', 'engaged, clearing', 'state indicators'],
          ['2', 'compliant turn sense ' + M('\\sigma'), '+1, 0, \u22121'],
          ['3', 'heading change since engagement', M('\\operatorname{wrap}(\\hat{\\psi} - \\psi_e)/180^\\circ') + ' (0 when idle)'],
          ['4', 'speed change since engagement', M('\\operatorname{clip}((\\hat{u} - u_e)/U_s,\\ -1,\\ 1)')],
          ['5', 'turn admissible', M('A') + ' (Eq. 11) for the compliant side'],
          ['6', 'slowdown clears', M('S_{\\mathrm{coast}}') + ' (Eq. 12, coasting profile)'],
          ['7', 'admissibility known', '1 when Eq. 11 was evaluated on a boundary'],
          ['8', 'action required', M('a_{\\mathrm{req}} = \\operatorname{clip}(\\Delta y_{\\mathrm{req}}/d_{\\mathrm{req}},\\ 0,\\ 1)')],
          ['9', 'proximity gate', M('\\rho') + ' (Eq. 9)'],
          ['10', 'in extremis', M('\\mathrm{DCPA} < d_{\\mathrm{req}}') + ' and ' + M('0 \\le \\mathrm{TCPA} < 5\\ \\mathrm{s}')],
          ['11', 'engagement age', M('\\operatorname{clip}((t - t_e)\\,\\Delta t/25\\ \\mathrm{s},\\ 0,\\ 1)')],
          ['12, 13', 'previous rudder, throttle', 'executed ' + M('a_{t-1}')],
        ]) +
        '<p>Two notes on these tables. The reward and the observation use different stopping profiles: the reward\u2019s slowdown credit uses a full-astern stop, while the observation\u2019s \u201cslowdown clears\u201d flag uses coasting at zero propeller speed. And the DCPA in the observation is measured to the domain and rescaled, whereas the DCPA in Eqs. 7\u20139 and 19\u201324 is center to center.</p>' +
        EQ({ label: 'Method', title: 'Proximity gate (Eq. 9)', tex: '\\rho = \\operatorname{clip}\\!\\left(1 - \\frac{\\mathrm{DCPA}}{\\kappa_{\\mathrm{eng}}\\, d_{\\mathrm{req}}},\\ 0,\\ 1\\right), \\qquad \\rho_{\\mathrm{pk}} = \\max \\rho \\ \\text{since engagement}',
          words: 'a number that is 0 while the predicted pass is wide (3.75 m or more) and grows to 1 as the predicted miss distance shrinks to zero; its peak since engagement is also kept.',
          symbols: [{ k: 'rhoGate', tex: '\\rho', m: 'proximity gate (Eq. 9; not the water density or a range)', u: '\u2014', v: fx(1 - 1 / 3.75, 2) + ' at DCPA 1 m', g: gO },
            { k: 'rhoPk', tex: '\\rho_{\\mathrm{pk}}', m: 'peak proximity gate since engagement', u: '\u2014', v: '\u2014', g: gO },
            { k: 'keng', tex: '\\kappa_{\\mathrm{eng}}', m: 'engagement factor on the required passing distance', u: '\u2014', v: '1.5', g: 'Encounter state and response' }],
          example: '<p>' + M('\\kappa_{\\mathrm{eng}} d_{\\mathrm{req}} = 1.5 \\times 2.5 = 3.75\\ \\mathrm{m}') + '. A predicted miss of 1.0 m gives ' + M('\\rho = 1 - 1.0/3.75 = ' + fx(1 - 1 / 3.75, 3)) + '; a miss of 3.75 m or more gives 0. It is the ' + T('proxgate', 'proximity gate') + ' that scales the rule penalties below.</p>' }) +
        '<h3>One module, two consumers</h3>' +
        '<p>The quantities that describe the encounter, its CPA, risk, class, engagement, latch, room and stopping tests, are computed once per step by a single encounter module. The observation reads them, and so does the reward\u2019s COLREGs group. Because both consumers read the same numbers, the policy is always shown exactly what its rule penalties are based on; there is no second, hidden definition of the encounter for the reward to use.</p>' +
        fig(nf[1], F.twoConsumers(), 'One module, two consumers: the encounter module feeds both the observation and the reward.', true) +
        '<h3>\u25b6 Live observation panel</h3>' + APP.widgetObsHTML() +

        H2('action', 'The action: rudder and propulsion') +
        EQ({ label: 'Model', title: 'Action mapping', tex: '\\begin{gathered} a_t = [a_\\delta,\\ a_n] \\in [-1, 1]^2 \\\\[4pt] \\delta_c = 100\\, a_\\delta\\ \\%\\ \\text{of}\\ \\delta_{\\max} = 40^\\circ, \\qquad n_c = \\operatorname{clip}(6 + 6\\, a_n,\\ 0,\\ 12) \\end{gathered}',
          words: 'the policy outputs two numbers between \u22121 and 1: the first sets the rudder as a fraction of full deflection, the second sets the propeller from stopped through cruise to double cruise command; it cannot go astern.',
          symbols: [{ k: 'adelta', tex: 'a_\\delta', m: 'rudder part of the action', u: '\u2014', v: '0.5 (example)', g: 'Vessel' },
            { k: 'an', tex: 'a_n', m: 'propulsion part of the action', u: '\u2014', v: '\u22120.5 (example)', g: gO },
            { k: 'deltac', tex: '\\delta_c', m: 'commanded rudder angle', u: '% of full', v: '50', g: 'Vessel' },
            { k: 'deltaMax', tex: '\\delta_{\\max}', m: 'full rudder deflection', u: '\u00b0', v: '40', g: gO },
            { k: 'nc', tex: 'n_c', m: 'propeller command', u: 'rpm-units', v: '3 (example)', g: gO }],
          example: '<p>' + M('a_\\delta = 0.5') + ' commands half rudder, 20\u00b0; the servo dynamics of ' + XS(3, 'servo') + ' then apply. ' + M('a_n = 0') + ' gives ' + M('n_c = 6') + ', cruise at 0.558 m/s on the nominal model; ' + M('a_n = -0.5') + ' gives 3; any ' + M('a_n \\le -1') + ' gives 0, coasting. Only the runtime safety layer of ' + XS(9) + ' can reverse the propeller.</p>' }) +
        fig(nf[2], F.action(), 'The two action channels: rudder command and propeller command against the policy\u2019s outputs.') +
        '<p>Why should the policy control speed continuously, rather than holding cruise and only steering? Because the rules make speed an answer in its own right. Rule 8(e) requires a vessel, if necessary to avoid collision or to allow more time to assess the situation, to slacken her speed or take all way off ' + C('imo1972') + '. In a channel too narrow for the required alteration, slowing or stopping may be the only lawful action left (' + XS(1, 'problem') + '). A policy that could only steer would have no way to express it.</p>' +

        H2('termination', 'When an episode ends') +
        EQ({ label: 'Model', title: 'Termination', tex: '\\begin{aligned} &\\textbf{goal } (+100): && d_{\\mathrm{goal}} \\le 0.5\\ \\mathrm{m} \\ \\ \\text{or}\\ \\ \\big(s_{\\mathrm{rem}} \\le 1.25\\ \\mathrm{m},\\ |e_y| \\le 1.60\\ \\mathrm{m},\\ \\text{overshoot} \\le 1.60\\ \\mathrm{m}\\big) \\\\ &\\textbf{collision } (-300): && \\text{hull} + 0.15\\ \\mathrm{m}\\ \\text{touches an obstacle, the boundary or the target} \\\\ &\\textbf{timeout } (0): && t = T = 180 \\end{aligned}',
          words: 'an episode ends with the goal when the vessel reaches the goal point or the last 1.25 m of the path close to it, with a collision when its hull, plus a 0.15 m margin, touches anything, and otherwise after 180 decisions.',
          symbols: [{ k: 'dgoal', tex: 'd_{\\mathrm{goal}}', m: 'distance to the goal point', u: 'm', v: '\u2264 0.5', g: gO },
            { k: 'srem', tex: 's_{\\mathrm{rem}}', m: 'along-path distance remaining', u: 'm', v: '\u2264 1.25', g: gO },
            { k: 'Tep', tex: 'T', m: 'episode length in decisions, at most 180 (90 s)', u: '\u2014', v: '180', g: 'Reinforcement learning' }],
          example: '<p>At cruise a 20 m leg takes ' + M('20/0.558 = 35.8\\ \\mathrm{s}') + ', about 72 decisions, so the 180-decision limit leaves room for a slowdown or a detour. A timeout carries no terminal reward because the episode is cut rather than ended by the task; the learner bootstraps its value instead (' + XS(5, 'values') + ').</p>' }) +
        fig(nf[3], F.termination(), 'The three ways an episode ends.', true) +

        H2('reward', 'The reward: one equation, eight terms') +
        '<p>The reward is a running score with a few large, final verdicts. Along the way, eight ' + T('shaping', 'shaping') + ' terms say \u201cyou are on the path\u201d, \u201cyou are making progress\u201d, \u201cyou are too close\u201d; at the end, the goal or a collision settles the episode.</p>' +
        EQ({ label: 'Method', title: 'Total reward (Eq. 13)', tex: '\\begin{aligned} r_t = {} & w_{\\mathrm{pf}}\\, r_{\\mathrm{pf}} + w_{\\mathrm{prog}}\\, r_{\\mathrm{prog}} + w_{\\mathrm{exist}}\\, \\kappa_{\\mathrm{ex}}\\, r_{\\mathrm{exist}} + w_{\\mathrm{smooth}}\\, r_{\\mathrm{smooth}} \\\\ & + w_{\\mathrm{obs}}\\, r_{\\mathrm{obs}} + w_{\\mathrm{bnd}}\\, r_{\\mathrm{bnd}} + w_{\\mathrm{dom}}\\, r_{\\mathrm{dom}} + w_{\\mathrm{col}}\\, r_{\\mathrm{col}} + r_{\\mathrm{term}} \\end{aligned}',
          words: 'each step\u2019s reward is a weighted sum of eight terms, each confined to [\u22121, 0] (progress to [\u22121, 1]), plus a terminal reward at the end of the episode.',
          symbols: [{ k: 'wpf', tex: 'w_{\\mathrm{pf}}', m: 'weight of path following', u: '\u2014', v: '3.0', g: gR }, { k: 'wprog', tex: 'w_{\\mathrm{prog}}', m: 'weight of progress', u: '\u2014', v: '1.5', g: gR },
            { k: 'wexist', tex: 'w_{\\mathrm{exist}}', m: 'weight of the existence penalty', u: '\u2014', v: '0.25', g: gR }, { k: 'wsmooth', tex: 'w_{\\mathrm{smooth}}', m: 'weight of smoothness', u: '\u2014', v: '0.5', g: gR },
            { k: 'wobs', tex: 'w_{\\mathrm{obs}}', m: 'weight of the obstacle term', u: '\u2014', v: '11.0', g: gR }, { k: 'wbnd', tex: 'w_{\\mathrm{bnd}}', m: 'weight of the boundary term', u: '\u2014', v: '15.0', g: gR },
            { k: 'wdom', tex: 'w_{\\mathrm{dom}}', m: 'weight of the domain term', u: '\u2014', v: '12.5', g: gR }, { k: 'wcol', tex: 'w_{\\mathrm{col}}', m: 'weight of the COLREGs group', u: '\u2014', v: '9.0', g: gR },
            { k: 'kex', tex: '\\kappa_{\\mathrm{ex}}', m: 'existence switch: 0 only under carve-out R-5', u: '\u2014', v: '1', g: gR },
            { k: 'rterm', tex: 'r_{\\mathrm{term}}', m: 'terminal reward', u: '\u2014', v: '+100 goal, \u2212300 collision, 0 timeout', g: gR }],
          example: '<p>Because every term is ' + T('boundedterm', 'bounded') + ', each weight is the most that term can add or cost in one step. The worst a single step can cost, all penalties at their maximum, is ' + M('3 + 0.25 + 0.5 + 11 + 15 + 12.5 + 9 = 51.25') + '; the most it can earn is 1.5, from progress. A collision costs ' + M('300') + ' at once, the equivalent of about six steps at the worst per-step penalty.</p>' }) +
        fig(nf[4], F.weights(), 'Weights of the eight bounded terms.') +
        '<p>Bounding every term before weighting is the first lesson of Paper 2: there, the obstacle term was about 49 times weaker than path following at contact, because of a scale hidden inside its formula, and nobody could see it from the weights. With bounded terms the weights say exactly how the terms compare.</p>' +

        H2('pathterm', 'Path following') +
        EQ({ label: 'Method', title: 'Path following (Eq. 14)', tex: '\\begin{gathered} \\tilde{e} = \\operatorname{clip}\\!\\left(\\frac{e_y}{W_{\\mathrm{loc}}/2},\\ -1,\\ 1\\right), \\qquad \\chi^{*} = 0.25\\,\\tilde{\\chi}_{\\mathrm{LA}} + 0.75\\,\\tilde{\\chi} \\\\[4pt] q = 0.7\\, e^{-4\\tilde{e}^{2}} + 0.3\\, \\frac{1 + \\cos\\chi^{*}}{2} \\\\[4pt] g_u = \\operatorname{clip}\\!\\left(\\frac{\\max(u, 0)}{U_{\\mathrm{eff}}},\\ 0,\\ 1\\right) g_{\\mathrm{over}}(u), \\quad g_{\\mathrm{over}}(u) = \\operatorname{clip}\\!\\left(1 - \\frac{u - 1.2\\,U_{\\mathrm{ref}}}{0.5\\,U_{\\mathrm{ref}}},\\ 0,\\ 1\\right) \\\\[4pt] r_{\\mathrm{pf}} = -(1 - g_u\\, q) \\end{gathered}',
          words: 'the path quality q is high when the vessel is near the path, measured against half the local width, and pointing along it; it only counts at full value when the vessel is moving at its reference speed, and it fades again above 1.2 times cruise.',
          symbols: [{ k: 'rpf', tex: 'r_{\\mathrm{pf}}', m: 'path-following term', u: '\u2014', v: '[\u22121, 0]', g: gR },
            { k: 'etil', tex: '\\tilde{e}', m: 'cross-track error scaled by half the local width', u: '\u2014', v: '0.5 (example)', g: gR },
            { k: 'Wloc', tex: 'W_{\\mathrm{loc}}', m: 'local width of the navigable water', u: 'm', v: '8 (channel)', g: gR },
            { k: 'chistar', tex: '\\chi^{*}', m: 'blended course error', u: '\u00b0', v: '0 (example)', g: gR },
            { k: 'qpf', tex: 'q', m: 'path quality, between 0 and 1', u: '\u2014', v: fx(q(0.5, 0), 3), g: gR },
            { k: 'gu', tex: 'g_u', m: 'speed gate', u: '\u2014', v: '1 at cruise', g: gR },
            { k: 'gover', tex: 'g_{\\mathrm{over}}(u)', m: 'overspeed gate', u: '\u2014', v: '1 below 0.67 m/s', g: gR },
            { k: 'Ueff', tex: 'U_{\\mathrm{eff}}', m: 'reference speed in the gate: U_ref, or lower under a carve-out', u: 'm/s', v: '0.558', g: gR }],
          example: '<p>On the path, aligned and at cruise: ' + M('q = 1') + ', ' + M('g_u = 1') + ', so ' + M('r_{\\mathrm{pf}} = 0') + '. Halfway to the wall (' + M('\\tilde{e} = 0.5') + '): ' + M('q = 0.7 e^{-1} + 0.3 = ' + fx(q(0.5, 0), 3)) + ' and ' + M('r_{\\mathrm{pf}} = ' + fx(-(1 - q(0.5, 0)), 3)) + '. Stopped exactly on the path: ' + M('g_u = 0') + ', so ' + M('r_{\\mathrm{pf}} = -1') + ', weighted \u22123 per step. The overspeed gate starts at ' + M('1.2 \\times 0.558 = 0.67\\ \\mathrm{m/s}') + ' and reaches zero at ' + M(fx(1.7 * U, 2) + '\\ \\mathrm{m/s}') + '.</p>' }) +
        F.mini('pf') +
        '<p>Two details carry most of the design. Scaling by the local width keeps the term informative in every channel: Paper 2\u2019s ' + M('\\exp(-0.05\\, e_y)') + ' changed by less than 10 % across a 10 m channel, so it gave almost no gradient and acted as a constant. And the speed gate means that stopping on the line does not score a perfect path. When stopping is the lawful answer, two carve-outs lower the reference speed so that it is not punished:</p>' +
        EQ({ label: 'Method', title: 'Speed-reference carve-outs (Eq. 15)', tex: '\\begin{aligned} &\\text{R-5 (overtaking, port pass inadmissible):} && U_{\\mathrm{eff}} = \\max(U_{\\mathrm{TS}},\\ 0.2\\ \\mathrm{m/s}), \\quad \\kappa_{\\mathrm{ex}} = 0 \\\\ &\\text{R-2 (give-way, } A = 0,\\ S_{\\mathrm{stop}} = 1\\text{):} && U_{\\mathrm{eff}} = 0.4\\, U_{\\mathrm{ref}} \\end{aligned}',
          words: 'while an encounter is engaged, the speed the path term expects drops to the target\u2019s speed when holding astern of it is the lawful choice, and to 40 % of cruise when the turn does not fit but a full stop would let the target pass clear.',
          symbols: [{ k: 'Sstop', tex: 'S_{\\mathrm{stop}}', m: 'a full-astern stop would clear (Eq. 12, full-astern profile)', u: '\u2014', v: '1 or 0', g: gR }],
          example: '<p>Under R-2, ' + M('U_{\\mathrm{eff}} = 0.4 \\times 0.558 = ' + fx(0.4 * U, 3) + '\\ \\mathrm{m/s}') + ': a vessel slowed to that speed gets ' + M('g_u = 1') + '. Under R-5, following a target at 0.25 m/s gives ' + M('U_{\\mathrm{eff}} = 0.25\\ \\mathrm{m/s}') + ', and the existence penalty is switched off so that waiting behind it is not charged for time. Neither carve-out applies unless the ' + T('carveout', 'conditions') + ' hold, so \u201calways slow\u201d is never rewarded.</p>' }) +

        H2('progress', 'Progress and existence') +
        EQ({ label: 'Method', title: 'Progress (Eq. 16)', tex: 'r_{\\mathrm{prog}} = \\operatorname{clip}\\!\\left(N_{\\mathrm{ref}}\\, \\frac{s_t - s_{t-1}}{L_{\\mathrm{path}}},\\ -1,\\ 1\\right), \\qquad N_{\\mathrm{ref}} = \\frac{L_{\\mathrm{ref}}}{U_{\\mathrm{ref}}\\, \\Delta t} = 71.7',
          words: 'each step earns the fraction of the path covered, scaled so that cruise speed earns 1 per step on a reference path; summed over a completed path the progress reward is the same however fast the vessel went.',
          symbols: [{ k: 'rprog', tex: 'r_{\\mathrm{prog}}', m: 'progress term', u: '\u2014', v: '[\u22121, 1]', g: gR },
            { k: 'salong', tex: 's', m: 'along-path position', u: 'm', v: '\u2014', g: 'Workspace and path' },
            { k: 'Nref', tex: 'N_{\\mathrm{ref}}', m: 'reference number of steps', u: '\u2014', v: '71.7', g: gR },
            { k: 'Lpath', tex: 'L_{\\mathrm{path}}', m: 'length of this episode\u2019s path', u: 'm', v: '20', g: gR },
            { k: 'Lref', tex: 'L_{\\mathrm{ref}}', m: 'reference path length', u: 'm', v: fx(Lref, 1), g: gR },
            { k: 'rexist', tex: 'r_{\\mathrm{exist}}', m: 'existence penalty, \u22121 every step', u: '\u2014', v: '\u22121', g: gR }],
          example: '<p>' + M('L_{\\mathrm{ref}} = 71.7 \\times 0.558 \\times 0.5 = ' + fx(Lref, 1) + '\\ \\mathrm{m}') + '. On a 20 m path at cruise, a step covers 0.279 m and earns ' + M('71.7 \\times 0.279/20 = 1.0') + '. The sum over a completed path ' + T('telescoping', 'telescopes') + ' to ' + M('71.7 \\times 20/20 = 71.7') + ', weighted 107.6, at any speed up to the per-step cap (on a 20 m path, up to cruise): a lawful slowdown costs no progress reward, only the time value of getting it later. The existence penalty, ' + M('-1 \\times 0.25') + ' per step, makes dawdling cost a little.</p>' }) +
        F.mini('prog') +

        H2('smooth', 'Smoothness') +
        EQ({ label: 'Method', title: 'Smoothness (Eq. 17)', tex: 'r_{\\mathrm{smooth}} = -\\sigma_t\\, \\operatorname{clip}\\!\\left(\\left(\\frac{\\Delta a_\\delta}{0.25}\\right)^{2} + 0.5 \\left(\\frac{\\Delta a_n}{0.30}\\right)^{2},\\ 0,\\ 1\\right), \\qquad \\sigma_t = \\begin{cases} 0.25 & \\text{first 4 steps after engagement} \\\\ 1 & \\text{otherwise} \\end{cases}',
          words: 'changing the commands from one step to the next costs, rising with the square of the change and capped; for four steps after an encounter is engaged the cost is cut to a quarter, so one decisive alteration is cheap.',
          symbols: [{ k: 'rsmooth', tex: 'r_{\\mathrm{smooth}}', m: 'smoothness term', u: '\u2014', v: '[\u22121, 0]', g: gR },
            { k: 'dA', tex: '\\Delta a_\\delta,\\ \\Delta a_n', m: 'change of the rudder and propulsion actions since the last step', u: '\u2014', v: '0.1 (example)', g: gR },
            { k: 'sigT', tex: '\\sigma_t', m: 'smoothness scale: 0.25 in the free window, else 1', u: '\u2014', v: '1', g: gR }],
          example: '<p>A rudder change of 0.1 costs ' + M('(0.1/0.25)^2 = 0.16') + ', weighted 0.08; a change of 0.25 or more costs the full 1, weighted 0.5. In the free window after engagement the same full change costs 0.125: Rule 8(b) asks for one alteration large enough to be readily apparent, not a series of small ones.</p>' }) +
        F.mini('smooth') +

        H2('safety', 'Boundary, domain and obstacles') +
        EQ({ label: 'Method', title: 'Boundary, domain and obstacles (Eq. 18)', tex: '\\begin{gathered} r_{\\mathrm{bnd}} = -\\left[\\max\\!\\left(0,\\ 1 - \\frac{d_{\\mathrm{bnd}}}{0.35}\\right)\\right]^{2}, \\qquad r_{\\mathrm{dom}} = -\\left[\\max_{\\mathrm{TS}}\\, \\max\\!\\left(0,\\ 1 - \\frac{|\\mathbf{p}_{\\mathrm{TS}} - \\mathbf{p}_{\\mathrm{OS}}|}{R_{\\mathrm{dom}}(\\alpha)}\\right)\\right]^{2} \\\\[4pt] r_{\\mathrm{obs}} = -\\operatorname{clip}\\!\\left(\\frac{e^{-d_{\\mathrm{clr}}/0.6} - e^{-2.0/0.6}}{1 - e^{-2.0/0.6}},\\ 0,\\ 1\\right) \\end{gathered}',
          words: 'three penalties for being too close: to the boundary, only within the last 0.35 m; to the target, only inside its domain; and to a static obstacle, only within 2 m, rising steeply in the last half meter. All three use true positions.',
          symbols: [{ k: 'rbnd', tex: 'r_{\\mathrm{bnd}},\\ r_{\\mathrm{dom}},\\ r_{\\mathrm{obs}}', m: 'boundary, domain and obstacle terms', u: '\u2014', v: '[\u22121, 0]', g: gR },
            { k: 'dbnd', tex: 'd_{\\mathrm{bnd}}', m: 'hull-to-boundary distance', u: 'm', v: '0.175 (example)', g: gR },
            { k: 'dsafe', tex: 'd_{\\mathrm{safe}}', m: 'safety band (the reward\u2019s boundary band)', u: 'm', v: '0.35', g: 'Encounter state and response' },
            { k: 'dclrObs', tex: 'd_{\\mathrm{clr}}', m: 'hull-to-hull clearance to the nearest static obstacle within \u00b1135\u00b0 (same letters as Eq. 12\u2019s threshold, different quantity)', u: 'm', v: '0.6 (example)', g: gR },
            { k: 'doa', tex: 'd_{\\mathrm{oa}}', m: 'decay length of the obstacle term', u: 'm', v: '0.6', g: gR }],
          example: '<p>Halfway into the boundary band, ' + M('d_{\\mathrm{bnd}} = 0.175') + ': ' + M('r_{\\mathrm{bnd}} = -(0.5)^2 = -0.25') + ', weighted \u22123.75. Dead ahead the domain reaches 3.14 m, so a target 1.57 m ahead gives ' + M('r_{\\mathrm{dom}} = -0.25') + ', weighted \u22123.1. A panel 0.6 m away gives ' + M('r_{\\mathrm{obs}} = ' + fx(robs(0.6), 3)) + ', weighted ' + fx(11 * robs(0.6), 2) + '; beyond 2 m it gives exactly 0. Without the shift, the same exponential would still charge ' + M(fx(11 * Math.exp(-2 / 0.6), 2)) + ' per step at 2 m and something at every distance: a background penalty with no useful gradient.</p>' }) +
        F.mini('safety') +
        '<p>The boundary weight, 15, is the largest of the dense weights for a reason: slowing down must always cost less than touching the boundary, or the policy learns to graze the wall rather than lose speed.</p>' +

        H2('colregs', 'The COLREGs group') +
        '<p>Five terms judge behavior under the rules. They are computed on the perceived, latched encounter, they are zero unless the encounter is engaged, and each is scaled by the proximity gate, so that penalties grow only as the predicted pass gets close. The group is clipped to [0, 1] before its weight of 9 is applied, so two simultaneous violations cannot outrank the safety terms.</p>' +
        EQ({ label: 'Method', title: 'COLREGs group (Eq. 19)', tex: 'v_{\\mathrm{col}} = \\operatorname{clip}\\!\\left(0.55\\, v_{\\mathrm{port}} + 0.55\\, v_{\\mathrm{bow}} + 0.40\\, v_{\\mathrm{side}} + 0.45\\, v_{\\mathrm{hold}} + 0.50\\, v_{\\mathrm{r8}},\\ 0,\\ 1\\right), \\qquad r_{\\mathrm{col}} = -v_{\\mathrm{col}}',
          words: 'the five rule terms are added with their own weights, the sum is capped at 1, and the result is the penalty.',
          symbols: [{ k: 'vcol', tex: 'v_{\\mathrm{col}}', m: 'combined rule penalty, between 0 and 1', u: '\u2014', v: '0.53 (example)', g: gC },
            { k: 'rcol', tex: 'r_{\\mathrm{col}}', m: 'COLREGs term of the reward', u: '\u2014', v: '\u22120.53', g: gR }],
          example: '<p>With ' + M('v_{\\mathrm{port}} = 0.6') + ' and ' + M('v_{\\mathrm{r8}} = 0.4') + ': ' + M('0.55 \\times 0.6 + 0.50 \\times 0.4 = 0.53') + ', so ' + M('r_{\\mathrm{col}} = -0.53') + ', weighted \u22124.77 per step. At most the group costs 9 per step, less than the boundary (15) or domain (12.5) terms can.</p>' }) +
        EQ({ label: 'Method', title: 'Wrong-way turn or heading (Eq. 20)', tex: '\\begin{gathered} v_{\\mathrm{port}} = \\max(\\rho,\\ \\rho_{\\mathrm{pk}})\\, \\operatorname{clip}\\!\\big(\\max(m_r,\\ m_\\psi),\\ 0,\\ 1\\big) \\\\[4pt] m_r = \\frac{\\max\\big(0,\\ -\\sigma (r - r_p)\\big) - 0.02\\ \\mathrm{rad/s}}{0.2\\ \\mathrm{rad/s}}, \\qquad m_\\psi = \\frac{\\max\\big(0,\\ -\\sigma\\, \\operatorname{wrap}(\\hat{\\psi} - \\psi_e)\\big) - 5^\\circ}{20^\\circ} \\end{gathered}',
          words: 'for the give-way classes, turning, or having turned, against the compliant sense is charged, with a small dead band; the gate uses its peak since engagement so that a wrong-way swerve cannot shrink its own penalty by opening the distance.',
          symbols: [{ k: 'vport', tex: 'v_{\\mathrm{port}}', m: 'wrong-way turn or heading', u: '\u2014', v: '0.4 (example)', g: gC },
            { k: 'mr', tex: 'm_r,\\ m_\\psi', m: 'wrong-way yaw-rate and heading measures', u: '\u2014', v: '0.4, 0.5', g: gC },
            { k: 'rp', tex: 'r_p', m: 'yaw rate needed to track the path', u: 'rad/s', v: '0 on a straight path', g: gC }],
          example: '<p>With a peak gate of 0.8 and the heading 15\u00b0 the wrong way: ' + M('m_\\psi = (15 - 5)/20 = 0.5') + ', so ' + M('v_{\\mathrm{port}} = 0.8 \\times 0.5 = 0.4') + '. Turning the wrong way at 0.1 rad/s (5.7\u00b0/s) gives ' + M('m_r = (0.1 - 0.02)/0.2 = 0.4') + '. The heading form was added because charging only the yaw rate let a wrong-way heading, once reached, cost nothing.</p>' }) +
        F.mini('port') +
        EQ({ label: 'Method', title: 'Bow crossing (Eq. 21)', tex: 'v_{\\mathrm{bow}} = \\rho\\; \\sigma_{\\mathrm{bow}}(\\beta_{\\mathrm{CPA}})\\; \\operatorname{clip}\\!\\left(1 - \\frac{\\mathrm{DCPA}}{d_{\\mathrm{req}}},\\ 0,\\ 1\\right), \\qquad \\sigma_{\\mathrm{bow}}(\\beta) = \\operatorname{clip}\\!\\left(\\frac{\\cos\\beta - \\cos 67.5^\\circ}{1 - \\cos 67.5^\\circ},\\ 0,\\ 1\\right)',
          words: 'in crossing and overtaking, passing close ahead of the target\u2019s bow is charged: fully when the own ship would be dead ahead of it at the closest approach, fading to nothing 67.5\u00b0 off its bow.',
          symbols: [{ k: 'vbow', tex: 'v_{\\mathrm{bow}}', m: 'bow crossing', u: '\u2014', v: fx(0.7 * sb20 * 0.6, 3) + ' (example)', g: gC },
            { k: 'sigbow', tex: '\\sigma_{\\mathrm{bow}}(\\beta)', m: 'bow factor', u: '\u2014', v: fx(sb20, 3) + ' at 20\u00b0', g: gC },
            { k: 'betaCPA', tex: '\\beta_{\\mathrm{CPA}}', m: 'bearing of the own ship from the target at the projected CPA', u: '\u00b0', v: '20', g: gC }],
          example: '<p>Gate 0.7, own ship 20\u00b0 off the target\u2019s bow at the CPA, DCPA 1.0 m. With ' + M('\\cos 20^\\circ = 0.940') + ' and ' + M('\\cos 67.5^\\circ = 0.383') + ', ' + M('\\sigma_{\\mathrm{bow}} = 0.557/0.617 = ' + fx(sb20, 3)) + ', so ' + M('v_{\\mathrm{bow}} = 0.7 \\times ' + fx(sb20, 3) + ' \\times 0.6 = ' + fx(0.7 * sb20 * 0.6, 3)) + '.</p>' }) +
        F.mini('bow') +
        EQ({ label: 'Method', title: 'Wrong side (Eq. 22)', tex: '\\begin{aligned} &\\text{head-on:} && v_{\\mathrm{side}} = \\rho\\, \\operatorname{clip}(+y_{\\mathrm{CPA}}/d_{\\mathrm{req}},\\ 0,\\ 1) \\\\ &\\text{overtaking } (A_{\\mathrm{port}} = 1): && v_{\\mathrm{side}} = \\rho\\, \\operatorname{clip}(-y_{\\mathrm{CPA}}/d_{\\mathrm{req}},\\ 0,\\ 1) \\end{aligned}',
          words: 'head-on, the target should pass on the own ship\u2019s port side; a predicted pass with the target to starboard is charged in proportion to how far to starboard it is. When overtaking and a port pass fits, the reverse applies.',
          symbols: [{ k: 'vside', tex: 'v_{\\mathrm{side}}', m: 'wrong-side pass', u: '\u2014', v: '0.28 (example)', g: gC },
            { k: 'yCPA', tex: 'y_{\\mathrm{CPA}}', m: 'target\u2019s lateral offset at the projected CPA in the own ship\u2019s body frame, positive to starboard', u: 'm', v: '+1.0', g: gC }],
          example: '<p>Head-on, gate 0.7, target predicted to pass 1.0 m to starboard: ' + M('v_{\\mathrm{side}} = 0.7 \\times 1.0/2.5 = 0.28') + '.</p>' }) +
        F.mini('side') +
        EQ({ label: 'Method', title: 'Hold course and speed (Eq. 23)', tex: 'v_{\\mathrm{hold}} = \\rho \\left[ \\operatorname{clip}\\!\\left( \\left(\\frac{r - r_p}{0.05}\\right)^{2} + \\left(\\frac{\\hat{u} - u_e}{0.10}\\right)^{2},\\ 0,\\ 1 \\right) + \\operatorname{clip}\\!\\left( \\frac{|\\hat{u} - u_e| - 0.10}{0.10},\\ 0,\\ 2 \\right) \\right]',
          words: 'when being overtaken, the own ship should hold its course and speed; turning or changing speed is charged, and the speed part keeps rising past 0.10 m/s so that running away from the overtaker is never free. It is zero in extremis.',
          symbols: [{ k: 'vhold', tex: 'v_{\\mathrm{hold}}', m: 'failure to hold course and speed, between 0 and 3', u: '\u2014', v: '1.6 (example)', g: gC }],
          example: '<p>Gate 0.8, speed up by 0.2 m/s, no turn: the first part is ' + M('\\operatorname{clip}(2^2,\\ 0,\\ 1) = 1') + ', the second ' + M('(0.2 - 0.1)/0.1 = 1') + ', so ' + M('v_{\\mathrm{hold}} = 0.8 \\times 2 = 1.6') + '. A version that saturated at 0.10 m/s made fleeing an overtaker free.</p>' }) +
        F.mini('hold') +
        EQ({ label: 'Method', title: 'Rule 8: late or insufficient action (Eq. 24)', tex: '\\begin{gathered} a_{\\mathrm{req}} = \\operatorname{clip}\\!\\left(\\frac{\\Delta y_{\\mathrm{req}}}{d_{\\mathrm{req}}},\\ 0,\\ 1\\right), \\qquad \\Delta\\psi_c = \\max\\big(0,\\ \\sigma\\, \\operatorname{wrap}(\\hat{\\psi} - \\psi_e)\\big), \\qquad \\Delta u = \\max(0,\\ u_e - \\hat{u}) \\\\[4pt] A_t = \\frac{\\Delta u}{0.167\\ \\mathrm{m/s}} + [A = 1 \\lor S_{\\mathrm{stop}} = 0]\\, \\frac{\\Delta\\psi_c}{20^\\circ} \\\\[4pt] v_{\\mathrm{r8}} = \\operatorname{clip}\\!\\left(1 - \\frac{\\mathrm{TCPA}}{15\\ \\mathrm{s}},\\ 0,\\ 1\\right) \\operatorname{clip}\\!\\left(a_{\\mathrm{req}} - A_t,\\ 0,\\ 1\\right) \\end{gathered}',
          words: 'for the give-way classes, the action still owed is the sideways deficit minus the action already taken, counted as slowing plus, when turning is admissible or slowing cannot clear, turning in the compliant sense; what is still owed is charged more heavily as the closest approach nears.',
          symbols: [{ k: 'vr8', tex: 'v_{\\mathrm{r8}}', m: 'late or insufficient action', u: '\u2014', v: '0.18 (example)', g: gC },
            { k: 'areq', tex: 'a_{\\mathrm{req}}', m: 'action required: lateral deficit over the required passing distance', u: '\u2014', v: '0.6', g: gC },
            { k: 'Atk', tex: 'A_t', m: 'action taken so far (not the advantage of Section 5)', u: '\u2014', v: '0.3', g: gC },
            { k: 'dpsic', tex: '\\Delta\\psi_c,\\ \\Delta u', m: 'heading change in the compliant sense, and speed reduction, since engagement', u: '\u00b0, m/s', v: '6\u00b0, 0', g: gC },
            { k: 'dumin', tex: '\\Delta u_{\\min}', m: 'speed reduction that counts as a full action, 0.30 U_ref', u: 'm/s', v: '0.167', g: gC }],
          example: '<p>DCPA 1.0 m: ' + M('a_{\\mathrm{req}} = (2.5 - 1.0)/2.5 = 0.6') + '. After turning 6\u00b0 the compliant way, with the turn admissible, ' + M('A_t = 6/20 = 0.3') + '. At TCPA 6 s: ' + M('v_{\\mathrm{r8}} = (1 - 6/15) \\times (0.6 - 0.3) = 0.18') + '. If the target is already clear, ' + M('a_{\\mathrm{req}} = 0') + ' and nothing is owed: Rule 9(a) channel-keeping needs no alteration. Slowing is credited at ' + M('\\Delta u_{\\min} = 0.30 \\times 0.558 = 0.167\\ \\mathrm{m/s}') + ' per unit of action.</p>' }) +
        F.mini('r8') +

        H2('explorer', 'Why each term has its shape and weight') +
        '<p>The table collects the reasons behind every choice, as found during the project\u2019s development, together with what goes wrong when a value is larger or smaller. The explorer below shows each term against what drives it, with the relevant rows beside it: an ' + T('ablation') + ' view, one choice at a time.</p>' +
        tbl(['Parameter or choice', 'Why this value', 'If larger or smaller'], APP.RATIONALE) +
        '<div class="callout"><span class="h">Verified property</span><p>A statement about Eqs. 13\u201324, checked by the authors, not a result of training: from one engagement state, a scripted 30\u00b0 compliant crossing turn returns +61 (discounted) more than the same turn made the wrong way, from either side.</p></div>' +
        '<h3>\u25b6 Reward explorer</h3>' + APP.widgetRexHTML() +

        H2('landscape', 'A combined view: scripted maneuvers') +
        '<p>Terms interact. The last widget runs four scripted responses to the same engagement, a compliant 30\u00b0 turn, the same turn the wrong way, a slowdown, and no action, through the vessel model, and scores every step with the full reward. Stacked bars show what each term contributes over time; the running line is the discounted total. Change the weights and the totals change with them. This is a picture of the ' + T('landscape', 'reward landscape') + ', what the equations say about these particular behaviors, and not a result of any trained policy.</p>' +
        '<h3>\u25b6 Reward landscape</h3>' + APP.widgetLandHTML();
    },
    mount(el) {
      APP.mountObs(el.querySelector('#obs-widget'));
      APP.mountRex(el.querySelector('#rex-widget'));
      APP.mountLand(el.querySelector('#land-widget'));
    },
    takeaways: ['The policy observes 70 normalized values in six branches, static LiDAR closeness, map rays, own motion, path errors, one target slot with a presence bit, and the latched encounter with its previous action, and commands rudder and propulsion continuously, so that slowing is available as a lawful action.',
      'The reward adds eight bounded, weighted terms and a terminal reward: each weight is that term\u2019s largest per-step contribution, the boundary weight is the largest so that slowing always costs less than touching a wall, and a collision outweighs any near miss.',
      'Five rule terms, gated by proximity and clipped as a group, charge wrong-way turns, bow crossings, wrong-side passes, failures to hold course and speed, and late or insufficient action; the encounter module behind them also feeds the observation, so the policy sees what it is judged on.'],
  });
})();

</script>
<script>
/* ====== MODULE: sim8.js ====== */
/* ===================================================================
   SIM8 — scenario generation for Section 8 (facts §6, curriculum
   brief): class bands, the backward solve and its validation checks,
   the contact-free floor, an illustrative layout sampler, A* on a
   0.25 m grid with inflation, space-time reachability, the
   three-obstacle motifs, the curriculum stages and the seed
   namespaces. Pure functions; no DOM.
   Illustrative parts (labelled where shown): panel positions drawn by
   the sampler, motif lateral offsets, preset encounter values. The
   seeds here do not reproduce the study's scenes.
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, K = G.K, P = window.PERC, DEG = Math.PI / 180;
  const clip = (x, a, b) => Math.max(a, Math.min(b, x));
  const U = K.Uref;

  /* ---------- classes and generator bands (facts §6.2) ---------- */
  const CLASSES = ['headon', 'cross_port', 'cross_stbd', 'overtaking', 'overtaken'];
  const CNAME = { headon: 'head-on', cross_port: 'crossing from port', cross_stbd: 'crossing from starboard', overtaking: 'overtaking', overtaken: 'being overtaken', none: 'none (no class)', nullc: 'null', notarget: 'no target' };
  const BANDS = {
    headon: { c: [170, 190], k: [0.70, 1.30], T0: [12.3, 17.0], d0: [0, 2.0] },
    cross_port: { c: [67.5, 175], k: [0.60, 1.40], T0: [7.9, 14.8], d0: [0, 2.5] },
    cross_stbd: { c: [185, 292.5], k: [0.60, 1.40], T0: [7.9, 14.8], d0: [0, 2.5] },
    overtaking: { c: [-67.5, 67.5], k: [0.40, 0.55], T0: [19.7, 31.5], d0: [0, 2.0] },
    overtaken: { c: [-67.5, 67.5], k: [1.50, 2.20], T0: [9.9, 15.8], d0: [0, 2.0] },   // floored (dcf + 0.35)
  };
  const inBandC = (cls, c) => G.inBand(c, BANDS[cls].c[0], BANDS[cls].c[1]);
  const inRange = (x, r) => x >= r[0] - 1e-9 && x <= r[1] + 1e-9;

  /* ---------- workspaces ---------- */
  // mode 'basin': 10 x 25 m, navigable polygon inset 0.40 m; mode 'channel': walls at 5 -/+ W/2 (as in Sections 1 and 7)
  function makeWS(mode, o) {
    o = o || {};
    if (mode === 'channel') {
      const W = o.W || 6, x0 = 5 - W / 2, x1 = 5 + W / 2, xi = o.xi == null ? 0.12 : o.xi, xp = 5 + xi * W / 2;
      return finish({ mode, W, nav: [[x0, 0.4], [x1, 0.4], [x1, 24.6], [x0, 24.6]], start: [xp, 2], goal: [xp, 22], panels: o.panels || [], xi });
    }
    return finish({ mode: 'basin', W: 10, nav: [[0.4, 0.4], [9.6, 0.4], [9.6, 24.6], [0.4, 24.6]], start: o.start || [5, 2], goal: o.goal || [5, 22], panels: o.panels || [] });
  }

      const nd = gen.hist.length, idx = st.histIdx == null ? nd - 1 : st.histIdx;
      set(0, st.manual ? 'your layout' : (idx + 1) + ' of ' + nd);
      set(1, ws.panels.length);
      set(2, res.found ? fx(res.len, 2) + ' m' : 'no route');
      set(3, fx(ws.len, 2) + ' m'); set(4, fx(S8.RATIO * ws.len, 2) + ' m');
      set(5, st.manual ? '—' : nd); set(6, st.manual ? '—' : gen.ledger.rejNoRoute + gen.ledger.rejLong); set(7, st.manual ? '—' : gen.ledger.thinned);

        (res.why === 'noroute' ? '<b>Rejected: no route.</b> The inflated panels and walls close the passage' + (st.manual ? '.' : '; the generator draws the panels again (up to 20 times, then removes one).') :
          '<b>Rejected: route too long.</b> ' + fx(res.ratio, 2) + ' times the straight leg exceeds 2.25.');
    }

      if (!cssW || !ws) return;
      const v = view(), g = S8.GRID, gs = g * v.s;

          const c = S8.cellC(i, j); if (!(c[0] >= b[0] && c[0] <= b[2] && c[1] >= b[1] && c[1] <= b[3])) continue;
          ctx.fillStyle = m === 2 ? colors['--panel-fill'] : colors['--ink-3'];
          ctx.fillRect(v.X(0, j * g) + 0.5, v.Y(i * g, 0) + 0.5, gs - 1, gs - 1);
        }
        ctx.globalAlpha = 1;
      }
      const nShow = st.anim != null ? st.anim : (st.explored ? res.order.length : 0);
      if (nShow) {
        ctx.fillStyle = colors['--testing']; ctx.globalAlpha = 0.28;
        for (let m = 0; m < Math.min(nShow, res.order.length); m++) { const c = res.order[m], i = c % S8.NX, j = Math.floor(c / S8.NX); ctx.fillRect(v.X(0, j * g) + 0.5, v.Y(i * g, 0) + 0.5, gs - 1, gs - 1); }
        ctx.globalAlpha = 1;
      }
      // navigable outline
      ctx.setLineDash([4, 3]); ctx.strokeStyle = colors['--ink-3']; ctx.lineWidth = 1;
      ctx.strokeRect(v.X(b[0], b[1]), v.Y(b[0], b[1]), (b[3] - b[1]) * v.s, (b[2] - b[0]) * v.s); ctx.setLineDash([]);
      if (ws.mode === 'channel') { ctx.strokeStyle = colors['--ink-2']; ctx.lineWidth = 2; [b[0], b[2]].forEach(x => { ctx.beginPath(); ctx.moveTo(v.X(x, 0), v.Y(x, 0)); ctx.lineTo(v.X(x, 25), v.Y(x, 25)); ctx.stroke(); }); }
      // leg
      ctx.setLineDash([7, 5]); ctx.strokeStyle = colors['--decision']; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(v.X(...ws.start), v.Y(...ws.start)); ctx.lineTo(v.X(...ws.goal), v.Y(...ws.goal)); ctx.stroke(); ctx.setLineDash([]);

      ws.panels.forEach((pn, i) => {
        const pts = G.squarePts(pn.c, pn.w); ctx.beginPath(); pts.forEach((p, k) => { const x = v.X(p[0], p[1]), y = v.Y(p[0], p[1]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
        ctx.fillStyle = colors['--panel-fill']; ctx.fill(); ctx.strokeStyle = drag && drag.i === i ? colors['--ink'] : colors['--panel']; ctx.lineWidth = drag && drag.i === i ? 2 : 1; ctx.stroke();
      });

        res.path.forEach((c, k) => { const p = S8.cellC(c % S8.NX, Math.floor(c / S8.NX)), x = v.X(p[0], p[1]), y = v.Y(p[0], p[1]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
      }

      }

    function stopAnim() { if (timer) { clearInterval(timer); timer = 0; } st.anim = null; }
    on(offs, q('[data-act="search"]'), 'click', () => {
      stopAnim(); st.anim = 0; const n = res.order.length, stepN = Math.max(8, Math.ceil(n / 90));

    });

      stopAnim(); let i = 0; showDraw(0);

    });
    const step = d => { stopAnim(); st.seed = Math.max(1, st.seed + d); load(); draw(); };
    on(offs, q('[data-act="prev"]'), 'click', () => step(-1));
    on(offs, q('[data-act="next"]'), 'click', () => step(1));
    wireSeg(root, 'ws', v => { stopAnim(); st.key = v; st.seed = AS_WS[v].seed; load(); resize(); }, offs);
    root.querySelectorAll('[data-opt]').forEach(el => on(offs, el, 'change', () => { st[el.dataset.opt] = el.checked; draw(); }));

    const toWorld = ev => { const r = cv.getBoundingClientRect(), v = view(); return [v.xa + (ev.clientY - r.top - v.pad) / v.s, (ev.clientX - r.left - v.pad) / v.s]; };
    on(offs, cv, 'pointerdown', ev => {
      const w = toWorld(ev), i = ws.panels.findIndex(pn => Math.abs(w[0] - pn.c[0]) <= 0.6 && Math.abs(w[1] - pn.c[1]) <= 0.6);
      if (i < 0) return;
      stopAnim(); drag = { i, dx: ws.panels[i].c[0] - w[0], dy: ws.panels[i].c[1] - w[1] }; cv.setPointerCapture(ev.pointerId); ev.preventDefault(); draw();
    });

      pn.c = [S8.clip(w[0] + drag.dx, b[0] + 0.55, b[2] - 0.55), S8.clip(w[1] + drag.dy, b[1] + 0.55, b[3] - 0.55)];
      st.manual = true; st.histIdx = null; res = S8.feasible(ws); readouts(); draw();
    });

    on(offs, cv, 'pointerup', end); on(offs, cv, 'pointercancel', end);

    const ro2 = new ResizeObserver(() => resize()); ro2.observe(cv); offs.push(() => ro2.disconnect());
    offs.push(APP.on('theme', () => { readColors(); draw(); }));
    APP.onCleanup(() => { stopAnim(); offs.forEach(f => f()); });
  };
})();

      '<div class="w-foot"><p>North is to the right. The dashed outline is where the backward solve assumes the own ship to be, on its path at cruise; it is not a planned maneuver, and in the coupled layouts it may cross a panel that the own ship would have to avoid. The encounter values are illustrative picks inside the generator’s bands that pass every check; the decoupled panel positions and the motifs’ lateral offsets are illustrative within the stated ranges. Moving the CPA along the leg re-places the decoupled panels but leaves the coupled ones fixed, as in the generator.</p></div></div>';

  APP.widgetReachHTML = function () {

      '<div class="ctl-group"><label class="ctl-label" for="re-d">Miss distance d₀</label><input id="re-d" type="range" min="0" max="2" step="0.05" value="0.2"><span class="rangeval" data-ro="d">0.20 m</span></div></div>' +
      '<div class="controls"><button type="button" class="btn primary" data-act="play">Play</button><button type="button" class="btn" data-act="step">+0.5 s</button>' +
      '<div class="ctl-group"><label class="ctl-label" for="re-t">Time</label><input id="re-t" type="range" min="0" max="90" step="0.5" value="0"><span class="rangeval" data-ro="t">0.0 s</span></div></div>' +
      '<div class="reach-canvas"><canvas role="img" aria-label="Top view, north to the right: the cells an ideal point vessel could occupy at the chosen time, the target with its 1.3 m exclusion disc, and the goal."></canvas></div>' +
      '<div class="reach-legend ui small"><span><i class="lg" style="background: var(--perception)"></i>reachable now</span><span><i class="lg" style="background: var(--target); opacity: .35"></i>removed: within 1.3 m of the target</span><span><i class="lg" style="background: var(--ink-3); opacity: .55"></i>inflated walls and panels</span><span><i class="lg" style="background: var(--decision); border-radius: 50%"></i>goal, 0.5 m</span></div>' +
      '<div class="astar-banner ui" data-ro="banner" aria-live="polite"></div>' +
      '<div class="readout ro-grid" data-ro="ro"></div></div>' +
      '<div class="w-foot"><p>The point moves up to 1.1 m/s in any direction or waits, so each half second the reachable set grows by 0.55 m on the same grid as A*; then every cell within 1.3 m of the target’s position at that moment is removed. Optimistic about the vessel (no turning radius, twice cruise speed), conservative about separation: a draw fails only if no controller could solve it. The target appears when the own ship would be ' + APP.M('s_0') + ' along its path at cruise, holds its course and speed, and stops short of the far wall. Encounter values are illustrative picks inside the generator’s bands.</p></div></div>';
  };
  APP.mountReach = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s), offs = [];
    const cv = q('canvas'), ctx = cv.getContext('2d'), tEl = q('#re-t'), dEl = q('#re-d');
    const st = { key: 'ch35', d0: 0.2 };
    let ws = null, R = null, tr = null, chk = null, colors = {}, cssW = 0, cssH = 0, dpr = 1, timer = 0, raf = 0, pending = false;
    function readColors() { ['--land', '--land-2', '--water', '--ink', '--ink-2', '--ink-3', '--decision', '--testing', '--target', '--target-fill', '--panel', '--panel-fill', '--perception', '--vessel', '--vessel-fill'].forEach(k => { colors[k] = APP.css(k); }); }
    const xRange = () => ws && ws.mode === 'channel' ? [Math.max(0, ws.box[0] - 1), Math.min(10, ws.box[2] + 1)] : [0, 10];   // channel views show 1 m of bank each side
    const view = () => { const pad = 8, s = (cssW - 2 * pad) / 25, xr = xRange(); return { s, pad, xa: xr[0], xb: xr[1], X: (x, y) => pad + y * s, Y: (x, y) => pad + (x - xr[0]) * s }; };
    function resize() { cssW = cv.clientWidth || 800; const v = view(); cssH = Math.round((v.xb - v.xa) * v.s + 2 * v.pad); dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); cv.style.height = cssH + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }
    function compute() {
      const P0 = RE_PRE[st.key]; ws = P0.mk();
      const e = Object.assign({}, P0.e, { d0: st.d0 });
      chk = S8.checks(ws, e); tr = S8.makeTrack(ws, chk.S); R = S8.reach(ws, tr);
      chk.gap = ws.panels.length ? S8.trackPanelGap(ws, tr) : Infinity;
    }
    function poly(pts, v, fill, stroke, lw, dash) {
      ctx.beginPath(); pts.forEach((p, i) => { const x = v.X(p[0], p[1]), y = v.Y(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.setLineDash(dash || []); ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); ctx.setLineDash([]); }
    }
    function draw() {
      if (!cssW || !R) return;
      const v = view(), g = S8.GRID, gs = g * v.s, k = Math.round(+tEl.value / S8.STEP), t = k * S8.STEP, b = ws.box;
      ctx.clearRect(0, 0, cssW, cssH); ctx.fillStyle = colors['--land']; ctx.fillRect(0, 0, cssW, cssH);
      ctx.fillStyle = colors['--water'];
      if (ws.mode === 'channel') ctx.fillRect(v.X(b[0], 0), v.Y(b[0], 0), 25 * v.s, (b[2] - b[0]) * v.s); else ctx.fillRect(v.X(0, 0), v.Y(0, 0), 25 * v.s, 10 * v.s);
      const F = R.frames[k], mask = R.mask;
      for (let j = 0; j < S8.NY; j++) for (let i = 0; i < S8.NX; i++) {
        const c = j * S8.NX + i, x = v.X(0, j * g), y = v.Y(i * g, 0), q0 = S8.cellC(i, j);
        if (mask[c]) { if (q0[0] >= b[0] && q0[0] <= b[2] && q0[1] >= b[1] && q0[1] <= b[3]) { ctx.globalAlpha = 0.45; ctx.fillStyle = colors['--ink-3']; ctx.fillRect(x + 0.5, y + 0.5, gs - 1, gs - 1); ctx.globalAlpha = 1; } continue; }
        if (F[c]) { ctx.globalAlpha = 0.6; ctx.fillStyle = colors['--perception']; ctx.fillRect(x + 0.5, y + 0.5, gs - 1, gs - 1); ctx.globalAlpha = 1; }
      }
      ws.panels.forEach(pn => poly(G.squarePts(pn.c, pn.w), v, colors['--panel-fill'], colors['--panel'], 1));
      ctx.setLineDash([7, 5]); ctx.strokeStyle = colors['--decision']; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(v.X(...ws.start), v.Y(...ws.start)); ctx.lineTo(v.X(...ws.goal), v.Y(...ws.goal)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = colors['--decision']; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(v.X(...ws.goal), v.Y(...ws.goal), S8.R_GOAL * v.s, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = colors['--decision']; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = colors['--decision']; ctx.beginPath(); ctx.arc(v.X(...ws.start), v.Y(...ws.start), 3.5, 0, 7); ctx.fill();
      const pT = S8.targetAt(tr, t);
      if (pT) {
        ctx.fillStyle = colors['--target']; ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(v.X(pT[0], pT[1]), v.Y(pT[0], pT[1]), S8.R_EXCL * v.s, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        ctx.setLineDash([4, 3]); ctx.strokeStyle = colors['--target']; ctx.lineWidth = 1.3; ctx.stroke(); ctx.setLineDash([]);
        poly(G.hullPts(pT, tr.psi), v, colors['--target-fill'], colors['--target'], 1.4);
      }
      ctx.font = '700 12px "Atkinson Hyperlegible", system-ui, sans-serif'; ctx.fillStyle = colors['--ink-2']; ctx.fillText('t = ' + t.toFixed(1) + ' s', 8, cssH - 8);
      readouts(k);
    }
    function readouts(k) {
      const t = k * S8.STEP, F = R.frames[k]; let n = 0; for (let c = 0; c < F.length; c++) n += F[c];
      q('[data-ro="t"]').textContent = t.toFixed(1) + ' s';
      const b = q('[data-ro="banner"]'), solved = R.solvedAt != null;
      b.className = 'astar-banner ui ' + (solved ? 'ok' : 'bad');
      b.innerHTML = solved ? '<b>Solvable.</b> A cell within 0.5 m of the goal is first reached at t = ' + R.solvedAt.toFixed(1) + ' s, before the 90 s end of the episode.' :
        '<b>Not solvable.</b> No cell within 0.5 m of the goal is ever reached in 90 s: no controller could solve this draw, so the generator draws again.';
      const r2 = (l, val) => '<div class="ro"><span>' + l + '</span><span>' + val + '</span></div>';
      const others = chk.out.every(o => o.ok) && (chk.gap >= 0.30);
      q('[data-ro="ro"]').innerHTML = r2('Reachable area now', fx(n * S8.GRID * S8.GRID, 1) + ' m²') + r2('Target', S8.targetAt(tr, t) ? 'present' : 'not yet') +
        r2('Target speed', fx(tr.U, 2) + ' m/s') + r2('Other checks of this draw', others ? 'pass' : 'fail');
    }
    const schedule = () => { if (pending) return; pending = true; raf = requestAnimationFrame(() => { pending = false; compute(); resize(); }); };
    const stop = () => { if (timer) { clearInterval(timer); timer = 0; } q('[data-act="play"]').textContent = 'Play'; };
    on(offs, q('[data-act="play"]'), 'click', () => {
      if (timer) { stop(); return; }
      if (+tEl.value >= 90) tEl.value = 0;
      q('[data-act="play"]').textContent = 'Pause';
      timer = setInterval(() => { const nv = Math.min(90, +tEl.value + 0.5); tEl.value = nv; draw(); if (nv >= 90) stop(); }, 90);
    });
    on(offs, q('[data-act="step"]'), 'click', () => { stop(); tEl.value = Math.min(90, +tEl.value + 0.5); draw(); });
    on(offs, tEl, 'input', () => { stop(); draw(); });
    wireSeg(root, 'scene', v => { stop(); st.key = v; st.d0 = RE_PRE[v].e.d0; dEl.value = st.d0; q('[data-ro="d"]').textContent = st.d0.toFixed(2) + ' m'; tEl.value = RE_PRE[v].t; schedule(); }, offs);
    on(offs, dEl, 'input', () => { stop(); st.d0 = +dEl.value; q('[data-ro="d"]').textContent = st.d0.toFixed(2) + ' m'; schedule(); });
    readColors(); compute(); resize();
    tEl.value = 12; draw();
    const ro2 = new ResizeObserver(() => resize()); ro2.observe(cv); offs.push(() => ro2.disconnect());
    offs.push(APP.on('theme', () => { readColors(); draw(); }));
    APP.onCleanup(() => { stop(); if (raf) cancelAnimationFrame(raf); offs.forEach(f => f()); });
  };

  /* ================= 5. curriculum timeline ================= */
  const SNAME = { headon: 'Head-on', crossing: 'Crossing', overtaking: 'Overtaking', overtaken: 'Being overtaken', nullc: 'Null', notarget: 'No target' };
  const Mf = x => (x / 1e6).toFixed(2).replace(/0$/, '') + ' M';
  function sceneSVG(sc) {
    const v = FIG.view({ x0: -0.2, x1: 10.2, y0: -0.2, y1: 25.2, s: 12, pad: 4, orient: 'right' });
    let s = FIG.svgOpen(v, 'A sample scene for this stage, drawn by the illustrative sampler.');
    s += sc.ws.mode === 'channel' ? FIG.channel(v, sc.ws.W) : FIG.basin(v);
    s += FIG.line(v, [sc.ws.start, sc.ws.goal], 's-path') + FIG.panels(v, sc.ws.panels) + FIG.hull(v, sc.ws.start, sc.ws.psiP, 's-own');
    if (sc.enc) {
      const S = sc.enc.S, tr = S8.makeTrack(sc.ws, S), h = G.hvec(S.psiTS), d = Math.min(tr.run, S.Uts * (sc.enc.e.T0 + 4));
      s += FIG.line(v, [S.pTS0, [S.pTS0[0] + d * h[0], S.pTS0[1] + d * h[1]]], '', ' style="stroke: var(--target)" stroke-width="1.3" stroke-dasharray="4 3"');
      s += FIG.hull(v, S.pTS0, S.psiTS, 's-tgt');
      if (sc.vary) { const m = [S.pTS0[0] + 0.45 * d * h[0], S.pTS0[1] + 0.45 * d * h[1]]; s += FIG.dot(v, m, 4, '', ' style="fill: var(--surface); stroke: var(--target)" stroke-width="2"') + FIG.wtext(v, m, 'speed change', 'lbl-s halo', 'middle', 0, -8); }
    }
    return s + '</svg>';
  }
  function describe(sc) {
    const cls = sc.family === 'notarget' ? 'no target' : S8.CNAME[sc.cls] || sc.cls;
    const where = sc.ws.mode === 'channel' ? 'a ' + fx(sc.ws.W, 1) + ' m channel' : 'the basin';
    return 'Sample: ' + cls + ' in ' + where + ', ' + sc.ws.panels.length + ' panel' + (sc.ws.panels.length === 1 ? '' : 's') +
      (sc.coupled ? ', a coupled ' + S8.MOTIFS[sc.motif].name.toLowerCase() + ' layout' : '') + (sc.vary ? '; this target changes speed once' : '') + '.';
  }
  APP.widgetCurHTML = function () {
    return '<div class="widget wide" id="cur-widget">' + head('The curriculum, stage by stage', 'what each of the seven stages adds, on fixed timesteps') +
      '<div class="w-body"><div class="controls"><button type="button" class="btn primary" data-act="play">Play</button>' +
      '<div class="ctl-group"><label class="ctl-label" for="cur-s">Training step</label><input id="cur-s" type="range" min="0" max="3000000" step="10000" value="640000" style="width: 14rem"><span class="rangeval" data-ro="s"></span></div></div>' +
      '<div class="cur-tl frame scroll-sm" data-svg="tl"></div><span class="scroll-hint ui small">Swipe sideways to see the whole timeline.</span>' +
      '<div class="cur-card"><div class="cur-info" data-ro="info"></div><div class="cur-scene"><div data-svg="scene"></div><p class="ui small muted" data-ro="desc"></p><button type="button" class="btn" data-act="sample">Another sample</button></div></div></div>' +
      '<div class="w-foot"><p>Stage boundaries are fixed fractions of a 2.5 M base budget (6.4, 14.4, 25.6, 40, 60 and 80 %); training then continues in stage 7 to 3.0 M. Ticks under the bar mark the validation-set evaluations every 200,000 steps. The sample scenes come from the same illustrative sampler as the figures: it follows each stage’s rules, with choices of its own where the facts are silent (when the target appears, panel offsets, the null class’s time to CPA, and the channel share in stages 6 and 7 ' + APP.TBD('channel share, stages 6–7') + ').</p></div></div>';
  };
  APP.mountCur = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s), offs = [];
    const sEl = q('#cur-s');
    let timer = 0, sampleSeed = 3, lastStage = 0;
    const W = 720, H = 132, L = 24, R = 24, X = x => L + x / S8.TOTAL * (W - L - R), BY = 46, BH = 30;
    function tl(step) {
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Timeline of the seven curriculum stages over 3 million training steps.">';
      S8.STAGES.forEach((sg, i) => {
        const x0 = X(sg.from), x1 = X(sg.to), cur = step >= sg.from && step < sg.to + (i === 6 ? 1 : 0);
        s += '<rect data-stage="' + sg.n + '" x="' + f1(x0 + 1) + '" y="' + BY + '" width="' + f1(x1 - x0 - 2) + '" height="' + BH + '" rx="4" style="fill: ' + (sg.layouts ? 'var(--decision)' : 'var(--testing)') + '; cursor: pointer" fill-opacity="' + (cur ? 0.85 : 0.18 + 0.06 * i) + '"' + (cur ? ' stroke="var(--ink)" stroke-width="1.5"' : '') + '/>';
        const lx = i === 6 ? X(2.25e6) : (x0 + x1) / 2;
        s += txt(lx, BY + 20, String(sg.n), cur ? 'lbl-b' : 'lbl-s', 'middle', cur ? ' style="fill: var(--paper)"' : '');
        if (i) s += txt(x0, BY - 12, Mf(sg.from), 'lbl-s', 'middle');
      });
      s += txt(X(0), BY - 12, '0', 'lbl-s', 'middle') + txt(X(S8.TOTAL), BY - 12, '3.0 M', 'lbl-s', 'middle');
      s += '<path d="M' + f1(X(S8.BASE)) + ' ' + (BY - 2) + 'V' + (BY + BH + 16) + '" style="stroke: var(--ink-2)" stroke-dasharray="3 2"/>' + txt(X(S8.BASE), BY + BH + 26, '2.5 M base budget', 'lbl-s', 'middle');
      s += txt(X(0.75e6), 14, 'stages 1–5: decoupled', 'lbl-s', 'middle', ' style="fill: var(--testing)"') + txt(X(2.25e6), 14, 'stages 6–7: coupled layouts added', 'lbl-s', 'middle', ' style="fill: var(--decision)"');
      for (let e = 2e5; e <= S8.TOTAL + 1; e += 2e5) s += '<path d="M' + f1(X(e)) + ' ' + (BY + BH + 4) + 'v7" style="stroke: ' + (e <= step ? 'var(--ink)' : 'var(--ink-3)') + '" stroke-width="' + (e <= step ? 1.8 : 1) + '"/>';
      s += txt(L, BY + BH + 26, 'ticks: validation-set evaluations, every 0.2 M steps', 'lbl-s', 'start');
      s += '<path d="M' + f1(X(step)) + ' ' + (BY - 1) + 'V' + (BY + BH + 12) + '" style="stroke: var(--ink)" stroke-width="2"/><path d="M' + f1(X(step) - 5) + ' ' + (BY - 9) + 'h10l-5 7z" style="fill: var(--ink)"/>';
      return s + '</svg>';
    }
    function info(sg) {
      const chips = S8.SHARES.map(([k, sh]) => '<span class="cur-chip' + (sg.cls.includes(k) ? ' on' : '') + '">' + SNAME[k] + ' <b>' + sh.toFixed(2) + '</b></span>').join('');
      const obs = sg.obsW ? sg.obs + ' (' + sg.obsW.map(([n, w]) => n + ': ' + w.toFixed(2)).join(', ') + ')' : sg.obs;
      const row = (k, v) => '<tr><th>' + k + '</th><td>' + v + '</td></tr>';
      return '<h4 class="ui">Stage ' + sg.n + ' <span class="muted">from ' + (sg.from ? Mf(sg.from) : '0') + ' to ' + Mf(sg.to) + ' steps</span></h4><p class="cur-note">' + sg.note + '</p>' +
        '<div class="cur-chips">' + chips + '</div><p class="ui small muted" style="margin:.2rem 0 .6rem">Episode types: the stage admits the highlighted ones and draws among them with these fixed shares.</p>' +
        '<table class="cmp cur-tab"><tbody>' + row('Static panels', obs) + row('Channels', sg.ch + (sg.chShare ? ' (' + Math.round(sg.chShare * 100) + ' % of episodes)' : sg.chShare === null ? ' (share not given)' : '')) +
        row('Three-obstacle layouts', sg.layouts ? Math.round(sg.layouts * 100) + ' % of episodes (coupled)' : 'none') +
        row('CPA guard', sg.guard ? '±' + sg.guard + ' ' + 'T₀ of own-ship travel' + (sg.n === 6 ? ' (halved), outside the layouts' : '') : 'removed') +
        row('Times to CPA', sg.easyT ? 'the longer half of each band' : sg.n < 3 ? '—' : 'full bands') +
        row('Speed-changing targets', sg.vary ? Math.round(sg.vary * 100) + ' % of the layout targets change speed once' : 'none') + '</tbody></table>';
    }
    function render() {
      const step = +sEl.value, sg = S8.stageAt(step);
      q('[data-ro="s"]').textContent = (step / 1e6).toFixed(2) + ' M';
      q('[data-svg="tl"]').innerHTML = tl(step);
      if (sg.n !== lastStage) {
        lastStage = sg.n;
        q('[data-ro="info"]').innerHTML = info(sg);
        drawSample(sg);
      }
    }
    function drawSample(sg) { const sc = S8.scene(sampleSeed, sg.n); q('[data-svg="scene"]').innerHTML = sceneSVG(sc); q('[data-ro="desc"]').textContent = describe(sc); }
    on(offs, sEl, 'input', () => { stop(); render(); });
    on(offs, q('[data-svg="tl"]'), 'click', e => { const r = e.target.closest('[data-stage]'); if (!r) return; stop(); const sg = S8.STAGES[+r.dataset.stage - 1]; sEl.value = Math.round((sg.from + sg.to) / 2 / 1e4) * 1e4; render(); });
    on(offs, q('[data-act="sample"]'), 'click', () => { sampleSeed++; drawSample(S8.stageAt(+sEl.value)); });
    const stop = () => { if (timer) { clearInterval(timer); timer = 0; } q('[data-act="play"]').textContent = 'Play'; };
    on(offs, q('[data-act="play"]'), 'click', () => {
      if (timer) { stop(); return; }
      if (+sEl.value >= S8.TOTAL) sEl.value = 0;
      q('[data-act="play"]').textContent = 'Pause';
      timer = setInterval(() => { const nv = Math.min(S8.TOTAL, +sEl.value + 20000); sEl.value = nv; render(); if (nv >= S8.TOTAL) stop(); }, 60);
    });
    render();
    APP.onCleanup(() => { stop(); offs.forEach(f => f()); });
  };
})();

</script>
<script>
/* ====== MODULE: sec8fig.js ====== */
/* ===================================================================
   SECTION 8 — registry additions and static figures
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, K = G.K, S8 = window.SIM8, U = S8.U;
  const { svgBox, txt, box, arr, PER, DEC, TST, NEU, f1 } = APP.F6H;
  const fx = APP.W6.fx;

  APP.SYMGROUPS.push('Scenario generation', 'Feasibility and solvability', 'Curriculum and data sets');
  Object.assign(APP.TERMS, {
    scenseed: ['scenario seed', 'The integer from which the generator draws one scenario; the same scenario seed always gives the same scene. Not to be confused with the training seed of Section 5, which fixes a training run’s own random choices.'],
    generator: ['scenario generator', 'The deterministic function that turns a scenario seed and the curriculum stage into a complete scene: workspace, path, panels and target.'],
    namespace: ['seed namespace', 'A reserved range of scenario seeds. The training, validation and test sets draw their seeds from ranges that do not overlap.'],
    decoupled: ['decoupled scenario', 'A scenario whose static panels are kept clear of the region around the predicted closest point of approach, so that obstacle avoidance and collision avoidance happen one after the other.'],
    coupled: ['coupled scenario', 'A scenario with three panels in a structured layout and the encounter generated around them, so that the vessel may have to resolve both at once.'],
    backsolve: ['backward solve', 'Choosing an encounter’s outcome first, when and how close the closest approach will be, and computing where the target must start to produce it.'],
    cpaguard: ['CPA guard', 'A stretch of the path around the predicted closest point of approach kept free of panels in decoupled scenarios: ±0.4 T₀ of own-ship travel, halved in stage 6 and removed in stage 7.'],
    contactfree: ['contact-free floor', 'The lowest miss distance a being-overtaken draw may take: the smallest miss distance at which the two hulls, on straight tracks, never touch, plus 0.35 m.'],
    inflation: ['inflation', 'Growing walls and obstacles by a margin so that the hull can be treated as a point: grid cells within the margin are marked as blocked.'],
    astar: ['A* search', 'A shortest-route search on a grid that always expands the cell with the smallest length so far plus a straight-line estimate of the rest.'],
    motif: ['layout motif', 'One of the three patterns for placing three panels in coupled scenarios: gate + on-path, slalom, and side + on-path.'],
    reachset: ['reachable set', 'All the places a vessel could be at a given time, given where it started and how fast it can move.'],
    spacetime: ['space-time solvability', 'The property that some trajectory reaches the goal while staying clear of the panels and of the moving target at every moment.'],
    curriculum: ['curriculum', 'An order of training material from easy to hard. Here, seven stages that switch on at fixed training steps.'],
    trainset: ['training set', 'The episodes used to train: generated on the fly from the training seeds, a fresh draw every episode.'],
    valset: ['validation set', 'The 270 fixed episodes (120 decoupled, 150 coupled) used only to select checkpoints.'],
    testset: ['test set', 'Test set v4: 1,000 held-out episodes (664 decoupled, 336 coupled), run once per selected policy for the paper’s tables.'],
    frozenbench: ['frozen benchmark', 'A fixed set of 800 basin and channel encounter episodes, in 8 cells of 100. The test set’s decoupled part is drawn from it, which keeps continuity with earlier tables.'],
    robustset: ['robustness set', 'The same scenarios replayed with a reactive target (700) or, in head-ons, a non-compliant target that turns to port (200).'],
    reactive: ['reactive target', 'A target that follows the COLREGs velocity-obstacle rule of Section 4 from its own side, instead of holding its course and speed.'],
    noncompliant: ['non-compliant target', 'A target that breaks the rules on purpose: here, in head-on encounters, it turns to port.'],
