        '<li><b>Symbols and terms</b>, at the top of the page, lists every symbol, abbreviation, term and reference introduced so far, with the section where each first appears.</li>' +
        '<li>A figure tagged <span class="tag illus">Illustrative</span> is a sketch or a scripted demonstration, not measured or trained behavior.</li>' +
        '<li>Marks such as ' + APP.TBD() + ' and ' + APP.VERIFY() + ' flag a value the source files do not give, or a detail still to be checked by the author.</li>' +
        '</ul>';
    },
    takeaways: ['Paper 3 studies one small autonomous boat that must follow a path, avoid fixed panels and handle one moving vessel in confined water, seeing only through its own LiDAR.',
      'The study is built from four ingredients (vessel, sensing, decision-making and testing), and each keeps the same color in every figure.',
      'This explainer covers scope, objective and methods. Results are pending and will be reported in the paper.'],
  });
})();

<script>
/* ====== MODULE: ov.js ====== */
/* ===================================================================
   WIDGET — ▶ Overview animation (Section 1). Plays the scripted
   scenario from GEOM.createSim on a to-scale canvas (north to the
   right). Illustrative: scripted response, simplified kinematics.
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, K = G.K;
  const WIDTHS = [3.5, 4, 4.5, 5, 6, 7, 8, 10];
  const CLASSES = [['headon', 'Head-on'], ['cross_stbd', 'Crossing from starboard'], ['cross_port', 'Crossing from port'], ['overtaking', 'Overtaking'], ['overtaken', 'Being overtaken']];
  const CLASS_NAME = { none: 'None', headon: 'Head-on', cross_stbd: 'Crossing from starboard', cross_port: 'Crossing from port', overtaking: 'Overtaking', overtaken: 'Being overtaken' };
  const SIDE = s => (s > 0 ? 'starboard' : 'port');
  function responseText(d, sigma) {
    if (!d) return '\u2014';
    switch (d.response) {
      case 'turn': return 'Alter to ' + SIDE(sigma);
      case 'partial': return 'Alter to ' + SIDE(sigma) + ' as far as the room allows';
      case 'slow': return 'Take all way off, let the target pass';
      case 'holdastern': return 'Hold astern of the target';
      case 'hold': return 'Hold course and speed';
      default: return '\u2014';
    }
  }

  APP.widgetOverviewHTML = function () {
    const { M } = APP;
    const seg = (ctl, items) => '<div class="seg" role="group" data-ctl="' + ctl + '">' + items.map(([k, t]) => '<button type="button" data-v="' + k + '" aria-pressed="false">' + t + '</button>').join('') + '</div>';
    const ro = (k, label) => '<div class="ro"><span>' + label + '</span><span data-ro="' + k + '">\u2014</span></div>';
    return '<div class="widget" id="ov-widget">' +
      '<div class="w-head"><div class="w-title"><span class="play-mark" aria-hidden="true">\u25b6</span>Overview animation</div>' +
      '<div class="w-sub"><span class="tag illus">Illustrative</span>Scripted response and simplified motion; not the trained policy</div></div>' +
      '<div class="w-body">' +
      '<div class="controls"><div class="ctl-group"><button type="button" class="btn primary" data-act="play">Play</button><button type="button" class="btn" data-act="restart">Restart</button></div>' +
      '<div class="ctl-group"><span class="ctl-label">Speed</span>' + seg('speed', [['1', '1\u00d7'], ['2', '2\u00d7'], ['4', '4\u00d7'], ['8', '8\u00d7']]) + '</div>' +
      '<div class="ctl-group"><label class="check"><input type="checkbox" data-opt="rays" checked>LiDAR beams</label><label class="check"><input type="checkbox" data-opt="tracks" checked>Tracks</label><label class="check"><input type="checkbox" data-opt="domain">Ship domain</label></div></div>' +
      '<div class="controls"><div class="ctl-group"><span class="ctl-label">Encounter</span>' + seg('cls', CLASSES) + '</div></div>' +
      '<div class="controls"><div class="ctl-group"><span class="ctl-label">Workspace</span>' + seg('mode', [['basin', 'Basin'], ['channel', 'Channel']]) + '</div>' +
      '<div class="ctl-group"><label for="ov-width" class="ctl-label">Channel width</label><input id="ov-width" type="range" min="0" max="7" step="1" value="7" aria-valuetext="10 m"><span class="rangeval" data-ro="width">10 m</span></div></div>' +
      '<div class="canvas-wrap"><canvas aria-label="Animated top view of the basin or channel. The readouts below describe the same state in text."></canvas><div class="overlay-msg" hidden></div></div>' +
      '<div class="statebar" aria-label="Encounter state">' + ['Idle', 'Engaged', 'Clearing', 'Released'].map(s => '<span data-st="' + s.toLowerCase() + '">' + s + '</span>').join('') + '</div>' +
      '<div class="timeline" aria-hidden="true"><div class="bar"></div><div class="prog"></div></div>' +
      '<div class="readout ro-grid" aria-live="off">' +
      '<div class="ro-h">Encounter</div>' + ro('cls', 'Class') + ro('sigma', 'Turn sense ' + M('\\sigma')) + ro('phase', 'State') +
      '<div class="ro-h">Geometry, every 0.5 s</div>' + ro('tcpa', M('\\mathrm{TCPA}')) + ro('dcpa', M('\\mathrm{DCPA}')) + ro('cri', 'CRI') +
      '<div class="ro-h">Room and response, at the decision</div>' + ro('dy', 'Needed sideways ' + M('\\Delta y_{\\mathrm{req}}')) + ro('room', 'Room ' + M('R_{\\mathrm{side}}')) + ro('A', 'Turn fits ' + M('A')) + ro('S', 'Stop clears ' + M('S')) + ro('resp', 'Response') +
      '<div class="ro-h">So far</div>' + ro('t', 'Time') + ro('minc', 'Closest, center to center') + ro('ming', 'Closest, hull to hull') +
      '</div>' +
      '<div class="readout" style="margin-top:.5rem"><div class="ro-h">Room against the sideways distance needed</div><div class="gauge" aria-hidden="true"><i data-g="room"></i><em data-g="dy"></em></div><div class="small muted ui" data-ro="gaugeTxt">Appears when the own ship decides.</div></div>' +
      '</div>' +
      '<div class="w-foot"><p>Drawn to scale, north to the right: starboard is toward the bottom of the picture when the own ship heads right. The target is drawn with the own ship\u2019s hull. Each encounter type uses its own generated panel layout, with the panels kept clear of the region around the closest approach, as the generator does in the early training stages.</p>' +
      '<p>Motion is simplified: heading and speed follow their commands with first-order lags of 1.5 s and 1.6 s, and the turn rate is capped at 10.4\u00b0/s. The real vessel model is in Section 3. The channel is drawn 25 m long for illustration ' + APP.TBD('channel length') + '.</p></div>' +
      '</div>';
  };

  APP.mountOverview = function (root) {
    const cv = root.querySelector('canvas'), ctx = cv.getContext('2d');
    const q = s => root.querySelector(s), qa = s => Array.from(root.querySelectorAll(s));
    const msg = q('.overlay-msg'), playBtn = q('[data-act="play"]');
    const st = { cls: 'headon', mode: 'basin', wIdx: 7, speed: 2, playing: false, rays: true, tracks: true, domain: false };
    let S, rays = [], trail = [], ttrail = [], lastScanT = -1, raf = 0, lastT = 0, colors = {}, cssW = 0, cssH = 0, dpr = 1, labelT0 = null, roTick = 0;

    function readColors() {
      ['--land', '--land-2', '--water', '--ink', '--ink-2', '--ink-3', '--rule', '--vessel', '--vessel-fill', '--perception', '--decision', '--decision-fill', '--target', '--target-fill', '--panel', '--panel-fill', '--surface', '--testing']
        .forEach(k => { colors[k] = APP.css(k); });
    }
    function W() { return WIDTHS[st.wIdx]; }
    function view() {
      const s = cssW / 26.4;
      return { s, X: (x, y) => (y + 0.7) * s, Y: (x, y) => (x + 0.6) * s };
    }
    function resize() {
      cssW = cv.clientWidth || 800; cssH = Math.round(cssW / 26.4 * 11.2);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); cv.style.height = cssH + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }
    function segsFor() {
      const ws = S.ws;
      const segs = ws.mode === 'basin' ? G.polySegs([[0, 0], [10, 0], [10, 25], [0, 25]], 'wall')
        : G.polySegs([[5 - ws.W / 2, 0], [5 + ws.W / 2, 0], [5 + ws.W / 2, 25], [5 - ws.W / 2, 25]], 'wall');
      ws.panels.forEach(pn => segs.push(...G.polySegs(G.squarePts(pn.c, pn.w), 'panel')));
      if (S.ts) segs.push(...G.polySegs(G.hullPts(S.ts.p, S.ts.psi), 'target'));
      return segs;
    }
    function scan() {                                      // one scan per 0.5 s decision step
      const h = G.hvec(S.os.psi), o = [S.os.p[0] + K.bow * h[0], S.os.p[1] + K.bow * h[1]];
      const segs = segsFor(); rays = [];
      for (let i = 0; i < 720; i += 4) {
        const d = G.hvec(S.os.psi + i * 0.5), hit = G.rayCast(o, d, segs);
        const ok = hit.t >= K.Rmin && hit.t <= K.Rmax;
        const r = Math.min(hit.t, K.Rmax);
        rays.push({ o, q: [o[0] + r * d[0], o[1] + r * d[1]], tag: ok ? hit.tag : null });
      }
    }
    function reset() {
      const mode = st.cls === 'overtaken' ? 'basin' : st.mode;
      S = G.createSim(mode, W(), st.cls);
      trail = []; ttrail = []; rays = []; lastScanT = -1; labelT0 = null;
      if (!S.sc.infeasible) scan();
      qa('.timeline .ev').forEach(e => e.remove());
      syncControls(); updateReadouts(true); draw();
      if (S.sc.infeasible) { showMsg(S.sc.infeasible); setPlaying(false); }
      else { msg.hidden = true; }
    }
    function showMsg(t) { msg.textContent = t; msg.hidden = false; }
    function setPlaying(on) {
      st.playing = on && S && !S.done && !S.sc.infeasible;
      playBtn.textContent = st.playing ? 'Pause' : (S && S.done && !S.sc.infeasible ? 'Replay' : 'Play');
      if (st.playing) { lastT = performance.now(); if (!raf) raf = requestAnimationFrame(loop); }
    }
    function loop(now) {
      raf = 0;
      if (!st.playing) return;
      const dtReal = Math.min(0.1, (now - lastT) / 1000); lastT = now;
      let steps = Math.round(dtReal * st.speed / 0.05);
      steps = Math.max(1, Math.min(steps, 60));
      for (let i = 0; i < steps && !S.done; i++) {
        S.step(0.05);
        if (Math.round(S.t * 20) % 5 === 0) { trail.push(S.os.p.slice()); if (S.ts) ttrail.push(S.ts.p.slice()); }
        if (Math.floor(S.t / K.dt) !== Math.floor(lastScanT / K.dt)) { lastScanT = S.t; scan(); }
      }
      if (S.shownCls && S.shownCls !== 'none' && labelT0 == null) labelT0 = now;
      draw();
      if (++roTick % 4 === 0 || S.done) updateReadouts();
      if (S.done) {
        setPlaying(false); updateReadouts(true);
        if (S.outcome === 'goal') showMsg('Goal reached after ' + S.t.toFixed(1) + ' s. Closest approach: ' + S.minCentre.toFixed(2) + ' m center to center, ' + S.minGap.toFixed(2) + ' m between hulls.');
        else showMsg('The run ended: ' + S.outcome + '.');
        return;
      }
      raf = requestAnimationFrame(loop);
    }

    // ---------- drawing ----------
    function poly(pts, v, fill, stroke, lw) {
      ctx.beginPath(); pts.forEach((p, i) => { const x = v.X(p[0], p[1]), y = v.Y(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
    }
    function arrow(v, p, dir, len, color) {
      const x0 = v.X(p[0], p[1]), y0 = v.Y(p[0], p[1]), q = [p[0] + len * dir[0], p[1] + len * dir[1]], x1 = v.X(q[0], q[1]), y1 = v.Y(q[0], q[1]);
      const a = Math.atan2(y1 - y0, x1 - x0), hd = 7;
      if (Math.hypot(x1 - x0, y1 - y0) < 3) return;
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - hd * Math.cos(a), y1 - hd * Math.sin(a)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - hd * Math.cos(a) + 3.2 * Math.sin(a), y1 - hd * Math.sin(a) - 3.2 * Math.cos(a));
      ctx.lineTo(x1 - hd * Math.cos(a) - 3.2 * Math.sin(a), y1 - hd * Math.sin(a) + 3.2 * Math.cos(a)); ctx.closePath(); ctx.fill();
    }
    function label(x, y, lines, color, t) {
      ctx.font = '700 12.5px "Atkinson Hyperlegible", system-ui, sans-serif';
      const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 16, h = 8 + lines.length * 16;
      const sc = t == null ? 1 : Math.min(1, 0.6 + t * 1.6);
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      let bx = -w / 2, by = -h - 12;
      ctx.fillStyle = colors['--surface']; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx, by, w, h, 7); else ctx.rect(bx, by, w, h); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5, by + h); ctx.lineTo(0, -4); ctx.lineTo(5, by + h); ctx.fillStyle = color; ctx.fill();
      ctx.fillStyle = colors['--ink']; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      lines.forEach((l, i) => { ctx.font = (i ? '400 12px ' : '700 12.5px ') + '"Atkinson Hyperlegible", system-ui, sans-serif'; ctx.fillStyle = i ? colors['--ink-2'] : color; ctx.fillText(l, 0, by + 5 + i * 16); });
      ctx.restore();
    }
    function draw() {
      if (!S || !cssW) return;
      const v = view(), ws = S.ws;
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = colors['--land']; ctx.fillRect(0, 0, cssW, cssH);
      if (ws.mode === 'basin') {
        poly([[0, 0], [10, 0], [10, 25], [0, 25]], v, colors['--water'], colors['--land-2'], 2);
        ctx.setLineDash([4, 3]); poly(ws.nav, v, null, colors['--ink-3'], 1); ctx.setLineDash([]);
      } else {
        const x0 = 5 - ws.W / 2, x1 = 5 + ws.W / 2;
        poly([[x0, 0], [x1, 0], [x1, 25], [x0, 25]], v, colors['--water']);
        ctx.strokeStyle = colors['--ink-2']; ctx.lineWidth = 2.2;
        [[x0], [x1]].forEach(([x]) => { ctx.beginPath(); ctx.moveTo(v.X(x, 0), v.Y(x, 0)); ctx.lineTo(v.X(x, 25), v.Y(x, 25)); ctx.stroke(); });
      }
      // path
      ctx.setLineDash([7, 5]); ctx.strokeStyle = colors['--decision']; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(v.X(ws.start[0], ws.start[1]), v.Y(ws.start[0], ws.start[1])); ctx.lineTo(v.X(ws.goal[0], ws.goal[1]), v.Y(ws.goal[0], ws.goal[1])); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = colors['--decision']; ctx.beginPath(); ctx.arc(v.X(ws.start[0], ws.start[1]), v.Y(ws.start[0], ws.start[1]), 3.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(v.X(ws.goal[0], ws.goal[1]), v.Y(ws.goal[0], ws.goal[1]), 0.5 * v.s, 0, 7); ctx.strokeStyle = colors['--decision']; ctx.lineWidth = 1.5; ctx.stroke();
      ws.panels.forEach(pn => poly(G.squarePts(pn.c, pn.w), v, colors['--panel-fill'], colors['--panel'], 1));
      // tracks
      if (st.tracks) {
        [[trail, '--vessel', []], [ttrail, '--target', [4, 4]]].forEach(([tr, c, dash]) => {
          if (tr.length < 2) return; ctx.setLineDash(dash); ctx.strokeStyle = colors[c]; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.75;
          ctx.beginPath(); tr.forEach((p, i) => i ? ctx.lineTo(v.X(p[0], p[1]), v.Y(p[0], p[1])) : ctx.moveTo(v.X(p[0], p[1]), v.Y(p[0], p[1]))); ctx.stroke();
          ctx.globalAlpha = 1; ctx.setLineDash([]);
        });
      }
      // LiDAR beams
      if (st.rays && rays.length) {

      const nx = cssW - 46, ny = cssH - 16;

      ctx.font = '700 11px "Atkinson Hyperlegible", system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('N', nx + 30, ny);

    function updateReadouts(force) {
      if (!S) return;

      ro('minc').textContent = S.ts ? f(S.minCentre, 2, 'm') : '\u2014';

      const ctl = b.parentElement.dataset.ctl;

    const offTheme = APP.on('theme', () => { readColors(); draw(); });

      roObs.disconnect(); if (io) io.disconnect(); offTheme(); offVis();

    });
  };

      SYM('dyreq', { tex: '\\Delta y_{\\mathrm{req}}', meaning: 'lateral deficit: extra sideways separation the pass needs (Eq. 8)', unit: 'm', group: 'Encounter state and response' });

      SYM('A', { tex: 'A', meaning: 'turn admissible on the compliant side, 1 or 0 (Eq. 11)', unit: '\u2014', group: 'Encounter state and response' });
      SYM('S', { tex: 'S', meaning: 'stopping clears: 1 if a stop leaves at least ' + M('d_{\\mathrm{clr}}') + ' (Eq. 12)', unit: '\u2014', group: 'Encounter state and response' });
      return '' +
        H2('problem', 'Three tasks that get in each other\u2019s way') +
        '<p>Picture cycling along a narrow towpath beside a canal. You keep to your route, you steer around the bollards, and when someone comes the other way you both keep to your own side. If the path is too narrow even for that, one of you slows down or stops until the other has passed: swerving harder is no use when there is a wall on one side and water on the other.</p>' +
        '<p>Paper 3 poses the same problem for an ' + T('asv', 'autonomous surface vessel') + ' (' + AB('ASV') + '). It must do three things at once: ' + T('pathfollowing', 'follow a planned path') + ', avoid ' + T('staticobs', 'static obstacles') + ', and deal correctly with one other moving vessel, the ' + T('target') + ', in ' + T('confined') + '. The three tasks are coupled. Any avoidance maneuver moves the vessel off its path, so good path following and good avoidance pull in opposite directions. Confinement tightens this further: a course alteration that gives enough passing distance in open water may run into a bank, a wall or a panel. Research on restricted waters and inland waterways therefore treats maneuvering space as part of the navigation problem rather than as a side constraint ' + C(['thyri2022', 'paulig2024', 'waltz2025', 'he2025']) + '.</p>' +
        '<p>When the lawful turn does not fit, speed becomes the answer. The collision regulations allow for this explicitly: Rule 8(e) says that a vessel shall, if necessary to avoid a collision or to allow more time to assess the situation, slow down or ' + T('wayoff', 'take all way off') + ' by stopping or reversing its propulsion ' + C('imo1972') + '. For that reason the vessel here commands its propeller as well as its rudder, continuously, so that slowing down is always one of the things it can choose.</p>' +
        '<figure class="fig wide"><div class="frame">' + roomFigure() + '</div><figcaption><b>' + fRoom + '.</b> Why room matters. The same crossing encounter in two channels. With 8 m the own ship (solid track) alters to starboard and passes astern of the target (dashed track). With 6 m that alteration no longer fits between the path and the wall, so it takes way off and lets the target pass ahead. The faint hulls mark where the own ship decides; the solid hulls mark the closest approach. <span class="tag illus">Illustrative</span>Runs of the scripted response used in the overview animation (' + XS(1, 'overview') + '); the numbers come from the tests of ' + XS(2, 'room') + '.</figcaption></figure>' +

        H2('sensing', 'What the vessel is allowed to know') +
        '<p>Large ships broadcast their identity, position, course and speed by radio through the ' + T('ais', 'Automatic Identification System') + ' (' + AB('AIS') + '). A small autonomous craft cannot count on it: many vessels it meets will not broadcast, and in narrow water a few meters of error matter. Paper 3 therefore gives the ' + T('policy') + ' neither AIS nor the simulator\u2019s exact knowledge of the target. Everything it knows about the other vessel is estimated from its own two-dimensional ' + T('lidar', 'LiDAR') + ', a laser that spins through 360\u00b0 and measures the distance to the first surface each beam hits: 720 beams, one every 0.5\u00b0, from 1 to 16 m, with returns closer than 1 m lost in a ' + T('deadzone') + '.</p>' +
        '<p>Before the policy can judge risk or name the encounter, software must find the target in the scan, decide that it is moving, and estimate its position, course and speed; this is ' + T('tracking') + ', explained in Section 6. An ' + T('occlusion', 'occluded') + ' or badly tracked target can change both the predicted passing distance and the encounter class. Field studies of maritime tracking show that detection problems depend on the environment ' + C('helgesen2022') + ', and recent learning studies that combine sensing and control ' + C(['lin2025', 'wu2025a']) + ' motivate evaluating the whole chain from sensor to action, rather than an avoidance policy fed ideal target states.</p>' +
        '<p>The water\u2019s edge is treated differently. A dredged channel edge, a ' + T('depthcontour') + ' or a regulatory boundary reflects no laser light: a range sensor cannot see where the navigable water ends. Such limits come from charts, so here the navigable boundary comes from a ' + T('map') + ', placed around the vessel using its estimated position and heading, its ' + T('pose') + '. In the basin the ' + T('navpoly') + ' is the water inset 0.40 m from the walls, and LiDAR returns from outside it (walls, people on the deck, anything beyond the water) are discarded.</p>' +
        '<figure class="fig wide"><div class="frame">' + sensingFigure() + '</div><figcaption><b>' + fSense + '.</b> The laser sees surfaces, not depths. A quay wall returns a range, but where a bank slopes gently the navigable limit is a depth contour with nothing standing on it. The map, not the scan, says where the water ends. <span class="tag illus">Illustrative</span></figcaption></figure>' +
        '<p>One clarification. During training the simulator still uses its exact state, the ' + T('groundtruth') + ', to detect collisions and to score clearance. The restriction applies to what the policy receives as input, not to every part of the training environment.</p>' +

        H2('workspace', 'Where it happens: the basin and the channels') +
        '<p>Everything happens at ' + T('modelscale') + '. The main workspace is the basin in which the authors\u2019 previous policy for static obstacles was tested ' + C('tran2026') + ': 10 m wide and 25 m long. Each ' + T('episode') + ' draws one straight, slanted ' + T('leg') + ' from y = 2 m to y = 22 m, with the start and goal x each drawn uniformly between 2.5 and 7.5 m, so the leg leans by up to about 14\u00b0 from north. Up to three 1.0 m square ' + T('panel', 'panels') + ' stand in the water as static obstacles.</p>' +
        '<p>The second workspace is a ' + T('channel') + ' with two parallel walls, used for head-on, crossing and overtaking encounters. The ' + T('refpath') + ' does not run down the middle: its offset is drawn between \u22120.30 and +0.30 times the half-width, with a mean of +0.12, that is, toward starboard. This ' + T('stbdstation') + ' reflects Rule 9(a), which asks a vessel in a narrow channel to keep toward the outer limit on its starboard side (' + XS(2, 'rules') + ').</p>' +
        '<p>Channel width ' + M('W') + ' is the study\u2019s main geometric knob. Training includes channels from 3.5 to 10 m wide (Section 8); the headline evaluation uses the basin and channels of 7.5 to 10 m; and a separate ' + T('widthsweep') + ' runs 10, 8, 7, 6, 5, 4.5, 4 and 3.5 m to see how behavior changes as room runs out. Width is treated as a geometric experimental variable, not as a legal definition of a narrow channel. For scale: the hull is ' + M('L = 1.725\\ \\mathrm{m}') + ' long and ' + M('B = 0.50\\ \\mathrm{m}') + ' wide, so the basin is about 14.5 hull lengths long and 5.8 wide, and the narrowest channel is seven hull widths across.</p>' +
        '<figure class="fig wide"><div class="frame">' + workspaceFigure() + '</div><figcaption><b>' + fWork + '.</b> The two workspaces, drawn to the same scale with north to the right, so starboard is toward the bottom of the picture. Top: the basin with an example leg, three panels and the hull at the start. Bottom: a 6 m channel with the path at its starboard station. The source files give neither the channel length ' + TBD('channel length') + ' nor whether channel width is measured wall to wall or between navigable limits inset from the walls ' + VERIFY('channel width wall to wall, no inset') + '.</figcaption></figure>' +

        H2('objective', 'What the study sets out to do') +
        '<p>The objective, in the paper\u2019s words, is to develop and evaluate a sensor-realistic ' + T('drl', 'deep reinforcement learning') + ' (' + AB('DRL') + ') ' + T('formulation') + ' for path following, static-obstacle avoidance and COLREGs-aware two-vessel encounters in confined water, and to compare four ' + T('learner', 'learners') + ', ' + AB('PPO') + ', recurrent PPO, ' + AB('SAC') + ' and ' + AB('TQC') + ', under that shared formulation. The formulation is the fixed definition of the learning problem: what the policy observes, what it may command, how it is rewarded and when an episode ends. All four learners get exactly the same one (Sections 5 and 7).</p>' +
        '<p>Four central questions follow:</p>' +
        '<ol><li>Can the policy complete the navigation task while producing ' + T('encconsistent') + ' behavior?</li>' +
        '<li>How does its response change as maneuvering room decreases?</li>' +
        '<li>How does degraded perception affect safety and compliance?</li>' +
        '<li>Which differences between learners remain meaningful across training ' + T('seed', 'seeds') + '?</li></ol>' +
        '<h3>Scope</h3>' +
        '<p>One model-scale ASV, one moving target and up to three static obstacles, in the basin and in parallel-walled channels. The policy issues continuous rudder and propulsion commands twice a second (' + M('\\Delta t = 0.5\\ \\mathrm{s}') + '). Target information comes only from the onboard LiDAR; navigable boundaries come from the map through the estimated pose. Detection, tracking and encounter classification are explicit processing stages, and the policy\u2019s observation includes the encounter context as well as range, path and own-ship information.</p>' +
        '<p>The regulatory scope is a selection of requirements from Rules 8, 9, 13, 14, 15/16 and 17(a)(i), with an explicit ' + T('ncconv') + ' for crossings (both in Section 2). Training targets keep a constant velocity and do not cooperate; reactive and noncompliant targets are kept for robustness tests. An optional engineered ' + T('supervisor') + ' exists but stays off during training and during the assessment of learned compliance, and its interventions are never credited to the policy (Section 9).</p>' +
        '<h3>Four contributions</h3>' +
        '<ol>' +
        '<li><b>A sensor- and encounter-aware learning formulation.</b> One observation and reward design combines tracked LiDAR target information, map-derived boundaries, own-ship and path states and explicit encounter context. A classifier names the encounter; the policy learns the rudder-and-propulsion response. Reward terms support route completion, clearance and selected COLREGs-related behaviors, without treating reward shaping as a formal safety guarantee.</li>' +
        '<li><b>A geometric framework for constrained encounter responses.</b> The formulation relates the room available to the response that is encounter-consistent: a course alteration, holding astern of a slower vessel, or a speed reduction where the predicted clearance supports it. A dedicated channel-width sweep tests where these switch over, rather than inferring legal precedence from width alone.</li>' +
        '<li><b>A controlled four-learner comparison with classical references.</b> PPO, recurrent PPO, SAC and TQC share the frozen formulation and one protocol: ' + M('2.5 \\times 10^{6}') + ' environment steps ' + VERIFY('Introduction draft 4 says two million') + ' and three training seeds, with ' + T('checkpoint') + ' selection confined to a separate ' + T('devset') + '. Nonlearned ' + T('comparator', 'comparators') + ' use the same perception: COLREGs-aware velocity obstacles ' + C('kuwata2014') + ', a narrow-channel adaptation of them, and line-of-sight guidance with proportional\u2013integral\u2013derivative control plus a dynamic-window avoidance layer ' + C('fox1997') + ' (Section 4). Differences are reported with their seed-to-seed variability.</li>' +
        '<li><b>An evaluation design separating safety, rule-related behavior and robustness.</b> Held-out scenarios, paired tests against different target behaviors, the width sweep and a perception-degradation study separate task completion from collision type, encounter violations and dependence on the supervisor. The design also prepares the planned physical-transfer assessment (Sections 9 and 10).</li>' +
        '</ol>' +
        '<h3>Out of scope</h3>' +
        '<ul><li>Several target vessels at once.</li><li>Restricted visibility (Rule 19) and sound or light signals.</li><li>Active stand-on action under Rules 17(a)(ii) and 17(b).</li><li>Responsibilities that depend on vessel status (Rule 18).</li><li>Legal compliance or certification.</li></ul>' +
        '<div class="callout stance"><span class="h">How this explainer talks about the rules</span><p>The COLREGs subset is implemented as an adopted operating convention. Compliance is judged by ' + T('behavmetric', 'declared behavioral metrics') + ', not by legal certification. Channel width is a geometric experimental variable, not a legal definition of a narrow channel. The behavior the study wants is called <i>encounter-consistent</i>.</p></div>' +
        '<p class="results-note">What the trained policies actually do, for each of these questions, is reported in the paper.</p>' +

        H2('overview', '\u25b6 Overview animation') +
        '<p>The animation puts the pieces together. The own ship follows its leg while its LiDAR sweeps; a target appears; the encounter is classified and a label pops up; the own ship alters course or slows, passes, and reaches its goal. Choose the encounter type and the workspace, and in a channel step the width down from 10 m to see the alteration stop fitting and speed reduction take over.</p>' +
        '<p>It is <b>illustrative</b>. The own ship runs a short ' + T('scripted') + ' built from the formulation\u2019s own geometric tests, not the trained policy, and its motion is simplified. The encounter geometry is drawn from inside the scenario generator\u2019s ranges (Section 8).</p>' +
        APP.widgetOverviewHTML() +
        '<h3>What to look for</h3>' +
        '<ul>' +
        '<li><b>Crossing from starboard, channel.</b> At 10 and 8 m the alteration fits. At 7 and 6 m it does not, and stopping would let the target pass clear, so the own ship takes way off (Rule 8(e)). At 5 m neither fits cleanly and the animation squeezes past; narrower than that, the generator cannot place such a crossing inside the channel.</li>' +
        '<li><b>Crossing from port, channel.</b> The same sequence at smaller widths, because the path sits toward starboard and leaves more room to port.</li>' +
        '<li><b>Head-on, channel.</b> Stopping in the path of a vessel coming straight at you does not clear it (the target keeps coming), so once the turn stops fitting the animation alters as far as the room allows.</li>' +
        '<li><b>Overtaking, channel.</b> From 5 m down there is no room to pass, and the own ship ' + T('holdastern', 'holds astern') + ' at the slower vessel\u2019s speed.</li>' +
        '<li><b>Being overtaken.</b> The own ship is the ' + T('standon', 'stand-on vessel') + ' and keeps its course and speed while the faster target passes.</li>' +
        '</ul>' +
        '<details class="more"><summary>How the scripted response works</summary><div>' +
        '<ol>' +
        '<li>Follow the leg with line-of-sight guidance, aiming at a point 2.5 m ahead on the path ' + C('fossen2021') + '.</li>' +
        '<li>Every 0.5 s, compute the encounter from the true states: the class, which must persist for two steps, and the closest point of approach (' + XS(2, 'classes') + ' and ' + XS(2, 'cpa') + ').</li>' +
        '<li>When the encounter engages (Eq. 7), or once the time to the closest point of approach drops below 15 s if it engaged earlier, evaluate the sideways distance still needed ' + M('\\Delta y_{\\mathrm{req}}') + ' (Eq. 8), the room on the compliant side ' + M('R_{\\mathrm{side}}') + ' (Eq. 10), whether the turn fits, ' + M('A') + ' (Eq. 11), and whether a stop would clear, ' + M('S') + ' (Eq. 12). The 15 s mark is where the formulation\u2019s penalty for late action starts to grow (Section 7).</li>' +
        '<li>Choose: with turn sense 0, hold course and speed. If the turn fits, alter 30\u00b0 to the compliant side until the sideways offset reaches ' + M('\\Delta y_{\\mathrm{req}} + 0.25\\ \\mathrm{m}') + ', then hold it. If it does not fit and the target is being overtaken, hold astern at its speed (at least 0.2 m/s). If it does not fit but a stop clears, take all way off. Otherwise, alter as far as the room allows, since that is the only help left.</li>' +
        '<li>After the encounter is released (' + XS(2, 'engage') + '), return to the path. A target that stops at a wall is treated as static after 2 s, as the tracker does (Section 6), and is then passed like a panel.</li>' +
        '</ol>' +
        '<p class="small muted">The 30\u00b0 alteration matches the one used in the formulation\u2019s scripted reward check (Section 7); the 0.25 m margin, the 15 s timing rule and the motion lags are choices made for this animation only.</p>' +
        '</div></details>';
    },
    mount(el) { APP.mountOverview(el.querySelector('#ov-widget')); },
    takeaways: ['The own ship must follow its path, clear static panels and handle one moving vessel at the same time; in confined water a lawful turn may not fit, and then speed is the answer (Rule 8(e)).',
      'The policy sees the target only through its own LiDAR and tracker, and the navigable boundary only through a map placed with its estimated pose.',
      'The study compares four learners on one fixed formulation, with channel width, target behavior and perception quality as the experimental variables; results are reported in the paper.'],
  });
})();

</script>
<script>
/* ====== MODULE: sec2.js ====== */
/* ===================================================================
   SECTION 2 — The collision regulations in brief
   =================================================================== */
(function () {
  'use strict';
  const { M, T, AB, C, FIGN, H2, SYM, EQ, VERIFY, TBD, XS } = APP;
  const G = window.GEOM, K = G.K;
  const fx = (x, n) => (Math.abs(x) < 5e-13 ? 0 : x).toFixed(n);
  const DEG = Math.PI / 180;

  // screen helpers for heading-up schematic diagrams (compass angle -> screen)
  const pt = (cx, cy, r, a) => [cx + r * Math.sin(a * DEG), cy - r * Math.cos(a * DEG)];
  function arc(cx, cy, r, a0, a1, cls, extra) {
    const p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    const large = (((a1 - a0) % 360) + 360) % 360 > 180 ? 1 : 0;
    return '<path d="M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + 'A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + '" fill="none" class="' + (cls || '') + '"' + (extra || '') + '/>';
  }
  // schematic hull (screen), centered at (x, y), compass heading a, length len px
  function sHull(x, y, a, len, cls) {
    const w = len * 0.29, hl = len / 2, bowL = len * 0.24;
    const loc = [[0, hl], [w / 2, hl - bowL], [w / 2, -hl], [-w / 2, -hl], [-w / 2, hl - bowL]];
    const s = Math.sin(a * DEG), c = Math.cos(a * DEG);
    const P = loc.map(([xs, yf]) => [x + xs * c + yf * s, y + xs * s - yf * c]);
    return '<path d="M' + P.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L') + 'Z" class="' + cls + '"/>';
  }
  const sArrow = (x, y, a, len, cls, head) => { const q = pt(x, y, len, a); return FIG.arrowS(x, y, q[0], q[1], cls, head || 7); };
  // SVG text subscript: base, subscript, then the rest of the label on the normal baseline
  const sb = (base, sub, rest) => base + '<tspan dy="3.5" font-size="76%">' + sub + '</tspan><tspan dy="-3.5">' + (rest || '\u200b') + '</tspan>';
  const svgBox = (w, h, label, style) => '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + APP.esc(label) + '"' + (style ? ' style="' + style + '"' : '') + '>';

  // ---------- Figure: nautical words ----------
  function wordsFigure() {
    const w = 640, h = 410, cx = 300, cy = 212, R = 150, psi = 20;
    let s = svgBox(w, h, 'A hull seen from above, heading 20 degrees east of north, with its bow, stern, port and starboard sides labeled, a ring of relative bearings, the stern arc beyond 22.5 degrees abaft the beam, and heading and course arrows.', 'max-width: 640px; margin: 0 auto');
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" style="stroke: var(--rule)" stroke-width="1.2"/>';
    const a0 = psi + 112.5, a1 = psi + 247.5, p0 = pt(cx, cy, R, a0), p1 = pt(cx, cy, R, a1);
    s += '<path d="M' + cx + ' ' + cy + 'L' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + 'A' + R + ' ' + R + ' 0 0 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'Z" style="fill: var(--decision-fill)" fill-opacity=".55"/>';
    for (let rel = 0; rel < 360; rel += 22.5) {
      const major = rel % 90 === 0, q0 = pt(cx, cy, R - (major ? 12 : 6), psi + rel), q1 = pt(cx, cy, R, psi + rel);
      s += '<path d="M' + q0[0].toFixed(1) + ' ' + q0[1].toFixed(1) + 'L' + q1[0].toFixed(1) + ' ' + q1[1].toFixed(1) + '" style="stroke: var(--ink-3)" stroke-width="' + (major ? 1.6 : 1) + '"/>';
    }
    [[0, '0\u00b0 dead ahead'], [90, '90\u00b0 abeam to starboard'], [180, '180\u00b0 astern'], [270, '270\u00b0 abeam to port']].forEach(([rel, t]) => {
      const q = pt(cx, cy, R + 16, psi + rel), anchor = rel === 90 ? 'start' : rel === 270 ? 'end' : rel === 0 ? 'end' : 'middle';
      s += FIG.text(q[0] + (rel === 0 ? -8 : 0), q[1] + 4, t, 'lbl', anchor);
    });
    [112.5, 247.5].forEach(rel => { const q = pt(cx, cy, R, psi + rel); s += '<path d="M' + cx + ' ' + cy + 'L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1) + '" style="stroke: var(--decision)" stroke-width="1.2" stroke-dasharray="4 3"/>'; });
    const sl = pt(cx, cy, R - 40, psi + 180);
    s += FIG.text(sl[0], sl[1] + 8, 'Stern arc: more than', 'lbl-s', 'middle', ' style="fill: var(--decision)"') + FIG.text(sl[0], sl[1] + 22, '22.5\u00b0 abaft the beam', 'lbl-s', 'middle', ' style="fill: var(--decision)"');
    // north reference and heading angle, drawn outside the hull
    s += '<path d="M' + cx + ' ' + (cy - 70) + 'V' + (cy - R + 14) + '" style="stroke: var(--ink-3)" stroke-width="1.2" stroke-dasharray="3 3"/>';
    s += arc(cx, cy, 112, 0, psi, '', ' style="stroke: var(--ink-2)" stroke-width="1.4"');
    const aq = pt(cx, cy, 124, psi / 2); s += FIG.text(aq[0], aq[1] + 3, '\u03c8', 'lbl-b', 'middle');
    s += sHull(cx, cy, psi, 130, 's-own');
    const side = (xs, yf) => [cx + xs * Math.cos(psi * DEG) + yf * Math.sin(psi * DEG), cy + xs * Math.sin(psi * DEG) - yf * Math.cos(psi * DEG)];
    const pl = side(-19, 22), sr = side(19, 22);
    s += '<circle cx="' + pl[0].toFixed(1) + '" cy="' + pl[1].toFixed(1) + '" r="4.5" fill="#C62828"/><circle cx="' + sr[0].toFixed(1) + '" cy="' + sr[1].toFixed(1) + '" r="4.5" fill="#2E7D32"/>';
    const lab = (xs, yf, t, anchor) => { const q = side(xs, yf); return FIG.text(q[0], q[1] + 4, t, 'lbl-b', anchor || 'middle'); };
    s += lab(0, 84, 'Bow') + lab(0, -84, 'Stern') + lab(-30, 10, 'Port (red light)', 'end') + lab(30, 10, 'Starboard (green light)', 'start');
    // compass north, heading and course
    s += FIG.arrowS(60, 120, 60, 64, 'k-ink2 f-ink2', 8) + FIG.text(60, 56, 'North', 'lbl-b', 'middle');
    s += sArrow(cx, cy, psi, R + 34, 's-ves f-ves', 9);
    s += sArrow(cx, cy, psi + 10, R + 14, 's-trg f-trg', 8);
    const hq = pt(cx, cy, R + 34, psi), cq = pt(cx, cy, R + 14, psi + 10);
    s += FIG.text(hq[0] + 8, hq[1] + 4, 'Heading \u03c8', 'lbl-b', 'start', ' style="fill: var(--vessel)"');
    s += FIG.text(cq[0] + 10, cq[1] + 10, 'Course', 'lbl-b', 'start', ' style="fill: var(--target)"');
    s += FIG.text(w - 10, h - 10, 'Schematic, not to scale', 'lbl-s', 'end');
    return s + '</svg>';
  }

  // ---------- Rule diagrams (schematic) ----------
  const ruleSvg = (inner, label) => svgBox(280, 170, label, 'max-width: 320px') + '<rect x="0" y="0" width="280" height="170" rx="8" class="s-water"/>' + inner + '</svg>';
  function rule8() {
    let s = '';
    s += '<path d="M70 150 C70 120 72 105 82 92 C95 75 118 62 150 40" fill="none" style="stroke: var(--vessel)" stroke-width="2.4"/>';
    s += '<path d="M70 150 L72 128 L78 118 L80 104 L86 95 L88 82 L95 74 L97 62 L104 55" fill="none" style="stroke: var(--ink-3)" stroke-width="1.4" stroke-dasharray="3 3"/>';
    s += sHull(70, 150, 0, 34, 's-own');
    s += FIG.text(150, 32, 'One early, clear alteration', 'lbl-s', 'middle', ' style="fill: var(--vessel)"') + FIG.text(104, 48, 'not many small ones', 'lbl-s', 'end');
    s += FIG.arrowS(200, 145, 200, 75, 'k-ink2 f-ink2', 7) + FIG.arrowS(228, 145, 228, 105, 'k-ink2 f-ink2', 7) + FIG.arrowS(256, 145, 256, 132, 'k-ink2 f-ink2', 6);
    s += FIG.text(228, 64, '8(e): slow down', 'lbl-s', 'middle') + FIG.text(228, 50, 'or stop', 'lbl-s', 'middle');
    return ruleSvg(s, 'Rule 8: one early, clear alteration instead of many small ones; or slow down or stop.');
  }
  function rule9() {
    let s = '<rect x="0" y="0" width="60" height="170" class="s-land"/><rect x="220" y="0" width="60" height="170" class="s-land"/>';
    s += '<path d="M60 0V170M220 0V170" style="stroke: var(--ink-2)" stroke-width="2"/>';
    s += '<path d="M140 8V162" style="stroke: var(--ink-3)" stroke-dasharray="2 4"/>';

  // ---------- alpha-c classification map (also used by the widget) ----------
  APP.acMap = function (o) {
    o = o || {};

    const W = ml + P + mr, H = mt + P + mb;
    const X = a => ml + a / 360 * P, Y = c => mt + (1 - c / 360) * P;
    const rect = (a0, a1, c0, c1, cls, extra) => '<rect x="' + X(a0).toFixed(1) + '" y="' + Y(c1).toFixed(1) + '" width="' + (X(a1) - X(a0)).toFixed(1) + '" height="' + (Y(c0) - Y(c1)).toFixed(1) + '" class="' + cls + '"' + (extra || '') + '/>';
    const polyg = (pts, cls, extra) => '<path d="M' + pts.map(([a, c]) => X(a).toFixed(1) + ' ' + Y(c).toFixed(1)).join('L') + 'Z" class="' + cls + '"' + (extra || '') + '/>';
    const act = o.active;
    const op = k => (act ? (act === k ? 0.95 : 0.35) : 0.8);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + APP.esc(o.label || 'Classification map: relative bearing on the horizontal axis, heading-crossing angle on the vertical axis, with the region of each encounter class.') + '"' + (o.style ? ' style="' + o.style + '"' : '') + '>';
    s += '<defs><pattern id="' + id + '-h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill: var(--decision-fill)"/><path d="M0 0V6" style="stroke: var(--decision)" stroke-width="1.2" stroke-opacity=".6"/></pattern>' +
      '<pattern id="' + id + '-h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" style="fill: var(--decision-fill)"/><path d="M0 0V6" style="stroke: var(--decision)" stroke-width="1.2" stroke-opacity=".6"/></pattern>' +
      '<clipPath id="' + id + '-clip"><rect x="' + ml + '" y="' + mt + '" width="' + P + '" height="' + P + '"/></clipPath></defs>';
    s += '<rect x="' + ml + '" y="' + mt + '" width="' + P + '" height="' + P + '" style="fill: var(--surface); stroke: var(--rule)"/>';
    s += '<g clip-path="url(#' + id + '-clip)">';
    const fillS = k => 'style="fill: var(--decision-fill); stroke: var(--decision)" fill-opacity="' + op(k) + '" stroke-width="1"';
    s += rect(10, 112.5, 190, 292.5, '', ' ' + fillS('cross_stbd'));
    s += rect(247.5, 350, 67.5, 170, '', ' ' + fillS('cross_port'));
    s += rect(350, 360, 170, 190, '', ' ' + fillS('headon')) + rect(0, 10, 170, 190, '', ' ' + fillS('headon'));
    const hatch = (k, pat) => 'style="fill: url(#' + id + '-' + pat + '); stroke: var(--decision)" fill-opacity="' + op(k) + '" stroke-width="1"';
    s += rect(112.5, 247.5, 0, 67.5, '', ' ' + hatch('overtaken', 'h2')) + rect(112.5, 247.5, 292.5, 360, '', ' ' + hatch('overtaken', 'h2'));
    for (const sh of [-360, 0, 360]) {
      s += polyg([[-67.5 + sh, 0], [67.5 + sh, 0], [135 + sh, 67.5], [0 + sh, 67.5]], '', ' ' + hatch('overtaking', 'h1'));
      s += polyg([[225 + sh, 292.5], [360 + sh, 292.5], [427.5 + sh, 360], [292.5 + sh, 360]], '', ' ' + hatch('overtaking', 'h1'));
    }
    s += '</g>';
    // axes
    const ticks = [0, 90, 180, 270, 360];
    ticks.forEach(t => {
      s += '<path d="M' + X(t).toFixed(1) + ' ' + (mt + P) + 'v4M' + ml + ' ' + Y(t).toFixed(1) + 'h-4" style="stroke: var(--ink-3)"/>';
      s += FIG.text(X(t), mt + P + (o.small ? 13 : 15), t + '\u00b0', 'lbl-s', 'middle') + FIG.text(ml - 6, Y(t) + 4, t + '\u00b0', 'lbl-s', 'end');
    });
    if (!o.small) {
      s += FIG.text(ml + P / 2, H - 8, 'Relative bearing \u03b1 (0\u00b0 ahead, 90\u00b0 starboard)', 'lbl', 'middle');
      s += FIG.text(12, mt + P / 2, 'Heading-crossing angle c', 'lbl', 'middle', ' transform="rotate(-90 12 ' + (mt + P / 2) + ')"');
      const L = (a, c, t, anchor, extra) => FIG.text(X(a), Y(c), t, 'lbl-b', anchor || 'middle', extra);
      s += L(61, 244, 'Crossing from') + L(61, 229, 'starboard');
      s += L(298, 122, 'Crossing from') + L(298, 107, 'port');
      s += L(24, 184, 'Head-on', 'start') + '<path d="M' + X(10).toFixed(1) + ' ' + Y(180).toFixed(1) + 'h6" style="stroke: var(--ink-2)"/>';
      s += L(180, 36, 'Being overtaken') + L(180, 22, '(target faster)', 'middle', ' style="font-weight:400"');
      s += L(52, 330, 'Overtaking') + L(52, 316, '(own ship faster)', 'middle', ' style="font-weight:400"');
    }
    if (o.marker) s += '<g data-mark><circle r="6" cx="' + X(o.marker[0]).toFixed(1) + '" cy="' + Y(o.marker[1]).toFixed(1) + '" style="fill: var(--ink); stroke: var(--surface)" stroke-width="2"/></g>';
    return s + '</svg>';
  };

  // ---------- Figure: relative motion and the CPA ----------
  function relMotionFigure(ex) {
    const v = FIG.view({ x0: -2.5, x1: 9.5, y0: -2.5, y1: 9.8, s: 38, pad: 10 });
    const { p, vOS, vTS, C: cp } = ex;
    let o = FIG.svgOpen(v, 'Relative motion: seen from the own ship, the target moves along a straight line with the relative velocity; the closest point of approach is the foot of the perpendicular from the own ship to that line.', ' style="max-width: 520px; margin: 0 auto"');
    o += '<rect width="' + v.W + '" height="' + v.H + '" rx="10" class="s-water"/>';
    for (let g = -2; g <= 9; g++) o += FIG.line(v, [[g, -2.5], [g, 9.8]], '', ' style="stroke: var(--water-2)" stroke-width="1"') + FIG.line(v, [[-2.5, g], [9.5, g]], '', ' style="stroke: var(--water-2)" stroke-width="1"');
    const vr = cp.v, far = [p[0] + vr[0] * (cp.tcpa + 4), p[1] + vr[1] * (cp.tcpa + 4)], back = [p[0] - vr[0] * 2.5, p[1] - vr[1] * 2.5];
    const cpaPt = [p[0] + vr[0] * cp.tcpa, p[1] + vr[1] * cp.tcpa];
    o += FIG.line(v, [back, far], '', ' style="stroke: var(--target)" stroke-width="1.5" stroke-dasharray="6 4"');
    o += FIG.line(v, [[0, 0], cpaPt], '', ' style="stroke: var(--decision)" stroke-width="2.4"');
    o += FIG.dot(v, cpaPt, 4.5, 'f-dec');
    o += FIG.hull(v, [0, 0], 0, 's-own') + FIG.arrow(v, [0, 0], [vOS[0] * 5, vOS[1] * 5], 's-ves f-ves', 8);
    const psiT = G.bearing(vTS[0], vTS[1]);
    o += FIG.hull(v, p, psiT, 's-tgt');
    o += FIG.arrow(v, p, [p[0] + vTS[0] * 5, p[1] + vTS[1] * 5], 's-trg f-trg', 8);
    const tip = [p[0] + vTS[0] * 5, p[1] + vTS[1] * 5], tip2 = [tip[0] - vOS[0] * 5, tip[1] - vOS[1] * 5];
    o += FIG.arrow(v, tip, tip2, 'k-ink3 f-ink3', 7) + FIG.arrow(v, p, tip2, 's-dec f-dec', 9);
    o += FIG.wtext(v, tip, 'target velocity', 'lbl', 'start', 8, -2, ' style="fill: var(--target)"');
    o += FIG.wtext(v, [(tip[0] + tip2[0]) / 2, (tip[1] + tip2[1]) / 2], 'minus own velocity', 'lbl-s', 'start', 8, 4);
    o += FIG.wtext(v, [(p[0] + tip2[0]) / 2, (p[1] + tip2[1]) / 2], 'relative velocity v', 'lbl', 'end', -10, 2, ' style="fill: var(--decision)"');
    o += FIG.wtext(v, cpaPt, 'DCPA = ' + cp.dcpa.toFixed(2) + ' m', 'lbl-b', 'start', 12, 12, ' style="fill: var(--decision)"');
    o += FIG.wtext(v, cpaPt, 'closest approach after ' + cp.tcpa.toFixed(1) + ' s', 'lbl', 'start', 12, 28);
    o += FIG.wtext(v, [0, 0], 'Own ship', 'lbl-b', 'end', -16, 6) + FIG.wtext(v, p, 'Target', 'lbl-b', 'start', 22, 4);
    o += FIG.wtext(v, [vOS[0] * 5, vOS[1] * 5], 'own velocity', 'lbl', 'start', 6, 2, ' style="fill: var(--vessel)"');
    return o + '</svg>';
  }

  // ---------- Figure: CR_CPA against TCPA ----------
  function criPlot() {
    const w = 520, h = 250, ml = 46, mr = 14, mt = 14, mb = 40, PW = w - ml - mr, PH = h - mt - mb;

    [0, 0.5, 1].forEach(y => { o += '<path d="M' + ml + ' ' + Y(y) + 'H' + (ml + PW) + '" style="stroke: var(--rule-2)"/>' + FIG.text(ml - 6, Y(y) + 4, y.toFixed(1), 'lbl-s', 'end'); });
