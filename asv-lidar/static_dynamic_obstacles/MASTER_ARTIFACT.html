/* ===================================================================

:root {

}

    --rule: #2B4152; --rule-2: #223645;
    --water: #15344A; --water-2: #1C4460; --land: #3B3427; --land-2: #4E4532;
    --vessel: #C8DA56; --vessel-fill: #3F4A12;
    --perception: #41CDB4; --perception-fill: #0F4A40;

    --testing: #86A9F2; --testing-fill: #1D3160;

/* ---------- Header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--header);
  display: flex; align-items: center; gap: .75rem; padding: 0 1rem 0 .75rem;

}

.brand > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.tbtn {

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - var(--header)); }
.rail {
  position: sticky; top: calc(var(--header) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--header) - env(safe-area-inset-top, 0px)); overflow-y: auto;

}
.rail h2 { font-size: .8rem; font-weight: 700; color: var(--ink-2); margin: 0 0 .6rem .35rem; letter-spacing: .02em; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li { margin: 0; }
.rail a.sec {
  display: grid; grid-template-columns: 1.9rem 1fr; gap: .2rem; align-items: baseline;
  padding: .38rem .45rem; border-radius: 8px; text-decoration: none; font-size: .92rem; line-height: 1.3; color: var(--ink-2);
}
.rail a.sec .n { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--sc, var(--ink-3)); }
.rail a.sec:hover { background: var(--surface-2); color: var(--ink); }
.rail a.sec[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--sc, var(--ink)); }
.rail a.sec .todo { font-size: .75rem; color: var(--ink-3); font-weight: 400; display: block; }
.rail ol.subs { margin: .15rem 0 .5rem 2.35rem; border-left: 1px solid var(--rule); }
.rail ol.subs a { display: block; padding: .22rem .6rem; font-size: .84rem; line-height: 1.3; text-decoration: none; color: var(--ink-2); border-left: 2px solid transparent; margin-left: -1px; }
.rail ol.subs a:hover { color: var(--ink); }
.rail ol.subs a.on { color: var(--ink); border-left-color: var(--sc, var(--ink)); font-weight: 700; }
.rail .legend { margin: 1.4rem .35rem 0; font-size: .8rem; color: var(--ink-2); line-height: 1.5; }
.rail .legend div { display: flex; gap: .5rem; align-items: center; }
.rail .legend i { width: .8rem; height: .8rem; border-radius: 3px; display: inline-block; flex: none; }

main { min-width: 0; padding: 2.2rem clamp(1rem, 4vw, 3.5rem) 5rem; }
.section { max-width: var(--wide); margin: 0 auto; }
.section > * { max-width: var(--measure); }
.section > .wide, .section > .widget, .section > .fig.wide, .section > .eq, .section > .tbl-wrap.wide { max-width: var(--wide); }

/* ---------- Section head ---------- */
.sec-head { position: relative; margin: .5rem 0 1.6rem; max-width: var(--measure); }
.sec-num {
  font-family: var(--serif); font-weight: 700; font-size: 5.2rem; line-height: .8; color: var(--accent);
  position: absolute; right: calc(100% + 1.4rem); top: .1rem; font-variant-numeric: lining-nums; opacity: .95;
}
.sec-kicker { font-family: var(--sans); font-size: .9rem; color: var(--ink-2); margin: 0 0 .35rem; }
.sec-head h1 { font-size: clamp(2rem, 3.2vw + 1rem, 2.75rem); line-height: 1.12; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.learn {
  margin: 1.2rem 0 0; padding: .85rem 1.1rem .9rem; border-left: 4px solid var(--accent);
  background: var(--accent-fill); border-radius: 0 10px 10px 0; font-size: 1.06rem; line-height: 1.55;
}

.learn p { margin: 0; }

h2.sub { font-size: 1.5rem; line-height: 1.25; font-weight: 600; margin: 3rem 0 .8rem; text-wrap: balance; }
h2.sub .sn { font-family: var(--sans); font-variant-numeric: tabular-nums; color: var(--accent); margin-right: .5rem; font-weight: 700; font-size: 1.1rem; }

p { margin: 0 0 1em; }
.section ul, .section ol { padding-left: 1.3rem; }
.section li { margin: .3em 0; }
.lead { font-size: 1.22rem; line-height: 1.55; }
.muted { color: var(--ink-2); }
.small { font-size: .9rem; }
.ui { font-family: var(--sans); }
strong, b { font-weight: 700; }

/* ---------- Flags, terms, citations ---------- */
.flag { font-family: var(--sans); font-size: .78em; font-weight: 700; color: var(--flag); background: var(--flag-bg); border-radius: 4px; padding: .05em .35em; white-space: nowrap; }
.flag.tbd { color: var(--warn); background: var(--warn-bg); }
.term {

}
.term:hover, .term:focus-visible { border-bottom-color: var(--ink); background: var(--surface-2); }
.term:focus-visible { outline: 2px solid var(--testing); outline-offset: 1px; }
abbr[title] { text-decoration: none; }
abbr.ab { border-bottom: 1px dotted var(--ink-3); cursor: help; font-variant-numeric: lining-nums; }

.tip {

  background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); font-family: var(--sans); font-size: .9rem; line-height: 1.45; pointer-events: none;
  opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
}
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: .15rem; }
.tip .where { color: var(--ink-3); font-size: .8rem; margin-top: .3rem; }

/* ---------- Math ---------- */
.mj { display: inline; }
.mj mjx-container, .md mjx-container { color: var(--ink); }
.mj mjx-container[jax="SVG"] { display: inline-block; vertical-align: baseline; }
.mj mjx-container svg { max-width: none; }
/* keep MathJax's absolutely positioned assistive MathML inside scrollers */
mjx-container { position: relative; }
.tbl-wrap, .md { position: relative; }
td .mj { white-space: nowrap; }
.md { display: block; overflow-x: auto; overflow-y: hidden; padding: .3rem 0; text-align: center; }
.md mjx-container[jax="SVG"][display="true"] { margin: .35em 0 !important; }
code.tex { font-family: var(--mono); font-size: .86em; background: var(--surface-2); padding: .05em .3em; border-radius: 4px; }
code, .code { font-family: var(--mono); font-size: .9em; }
.mathfail { font-family: var(--sans); font-size: .9rem; color: var(--warn); background: var(--warn-bg); padding: .5rem .8rem; border-radius: 8px; margin: 0 0 1rem; }

/* ---------- Equation block ---------- */
.eq {
  margin: 1.6rem 0 2rem; background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--accent);
  border-radius: 4px 12px 12px 4px; padding: 1rem 1.2rem 1.1rem;
}
.eq-head { display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap; font-family: var(--sans); }
.eq-label { font-weight: 700; color: var(--accent); font-size: .92rem; font-variant-numeric: tabular-nums; }
.eq-title { font-weight: 700; font-size: 1rem; }
.eq-math { margin: .5rem 0 .4rem; font-size: 1.12rem; }
.eq-words { margin: .2rem 0 .9rem; }
.eq-words strong { font-family: var(--sans); font-size: .92rem; }
.eq-example { margin-top: .9rem; padding: .75rem .95rem .6rem; background: var(--accent-fill); border-radius: 8px; font-size: 1rem; }
.eq-example > b { font-family: var(--sans); font-size: .88rem; display: block; margin-bottom: .25rem; }
.eq-example p:last-child { margin-bottom: .2rem; }
.eq-note { font-family: var(--sans); font-size: .88rem; color: var(--ink-2); margin-top: .7rem; }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; margin: 1rem 0 1.4rem; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: .9rem; line-height: 1.4; }
th, td { text-align: left; vertical-align: top; padding: .45rem .6rem; border-bottom: 1px solid var(--rule-2); }
thead th { font-weight: 700; color: var(--ink-2); border-bottom: 1.5px solid var(--rule); font-size: .84rem; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.symtab td:first-child { white-space: nowrap; width: 1%; }
.symtab td:nth-child(3), .symtab td:nth-child(4) { white-space: nowrap; font-variant-numeric: tabular-nums; }
.symtab td { font-size: .88rem; }
tr.hl td { background: var(--accent-fill); }
.swatch { display: inline-block; width: .85rem; height: .85rem; border-radius: 3px; vertical-align: -.1rem; margin-right: .4rem; border: 1px solid rgba(0,0,0,.15); }

/* ---------- Figures ---------- */
.fig { margin: 1.6rem 0 2rem; }
.fig .frame { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: .8rem; overflow-x: auto; }
.fig svg { display: block; width: 100%; height: auto; font-family: var(--sans); }
figcaption { font-family: var(--sans); font-size: .88rem; line-height: 1.5; color: var(--ink-2); margin-top: .6rem; max-width: var(--measure); }
figcaption b { color: var(--ink); }
.tag { display: inline-block; font-family: var(--sans); font-size: .74rem; font-weight: 700; padding: .1em .45em; border-radius: 4px; border: 1px solid var(--rule); color: var(--ink-2); vertical-align: .08em; margin-right: .35rem; background: var(--surface); }
.tag.illus { border-style: dashed; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14.5rem, 1fr)); gap: 1rem; }

/* SVG theme classes */
.s-water { fill: var(--water); } .s-land { fill: var(--land); } .s-land2 { fill: var(--land-2); }
.s-rule { stroke: var(--rule); } .s-ink { fill: var(--ink); } .s-ink2 { fill: var(--ink-2); } .s-ink3 { fill: var(--ink-3); }
.s-nav { fill: none; stroke: var(--ink-3); stroke-dasharray: 4 3; stroke-width: 1; }
.s-wall { stroke: var(--ink-2); stroke-width: 2; }
.s-path { stroke: var(--decision); stroke-width: 1.6; stroke-dasharray: 7 5; fill: none; }
.s-own { fill: var(--vessel-fill); stroke: var(--vessel); stroke-width: 1.4; }
.s-tgt { fill: var(--target-fill); stroke: var(--target); stroke-width: 1.4; }
.s-panel { fill: var(--panel-fill); stroke: var(--panel); stroke-width: 1; }
.k-ink2 { stroke: var(--ink-2); } .k-ink3 { stroke: var(--ink-3); } .f-ink2 { fill: var(--ink-2); } .f-ink3 { fill: var(--ink-3); }
.s-per { stroke: var(--perception); } .s-dec { stroke: var(--decision); } .s-tst { stroke: var(--testing); } .s-ves { stroke: var(--vessel); } .s-trg { stroke: var(--target); }
.f-per { fill: var(--perception); } .f-dec { fill: var(--decision); } .f-tst { fill: var(--testing); } .f-ves { fill: var(--vessel); } .f-trg { fill: var(--target); }
.lbl, .lbl-b, .lbl-s { font-family: var(--sans); }
.lbl { font-size: 12px; fill: var(--ink-2); }
.lbl-b { font-size: 12.5px; fill: var(--ink); font-weight: 700; }
.lbl-s { font-size: 11px; fill: var(--ink-3); }

/* ---------- Callouts ---------- */
.callout { margin: 1.4rem 0; padding: .9rem 1.1rem; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
.callout > b:first-child, .callout > .h { font-family: var(--sans); font-weight: 700; display: block; margin-bottom: .3rem; }
.callout.stance { border-left: 5px solid var(--decision); border-radius: 4px 12px 12px 4px; }
.callout.reading { background: var(--surface-2); border-color: transparent; }
.callout p:last-child, .callout ul:last-child { margin-bottom: 0; }
.results-note { font-family: var(--sans); font-size: .92rem; border: 1px dashed var(--rule); border-radius: 10px; padding: .6rem .9rem; color: var(--ink-2); }

details.more summary { cursor: pointer; padding: .7rem 1rem; font-family: var(--sans); font-weight: 700; font-size: .95rem; }
details.more > div { padding: 0 1.1rem .8rem; }

/* ---------- Takeaways, next/prev ---------- */
.takeaways { margin: 3.2rem 0 2rem; padding: 1.1rem 1.3rem 1rem; border-top: 3px solid var(--accent); background: var(--surface); border-radius: 0 0 12px 12px; box-shadow: var(--shadow); }
.takeaways h2 { font-family: var(--sans); font-size: 1rem; margin: 0 0 .5rem; }
.takeaways ul { margin: 0; }
.pager { display: flex; gap: .8rem; justify-content: space-between; flex-wrap: wrap; margin-top: 1.5rem; font-family: var(--sans); }
.pager a { display: block; flex: 1 1 14rem; padding: .8rem 1rem; border: 1px solid var(--rule); border-radius: 12px; text-decoration: none; background: var(--surface); }
.pager a:hover { border-color: var(--ink-3); }
.pager a small { display: block; color: var(--ink-2); font-size: .82rem; }
.pager a span { font-weight: 700; }
.pager a.next { text-align: right; }

/* ---------- Section 0 map ---------- */
.lanes { margin: 1.2rem 0 1.8rem; border-top: 1px solid var(--rule); }
.lane { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--rule); align-items: start; }
.lane .who { font-family: var(--sans); font-weight: 700; font-size: .98rem; display: flex; gap: .55rem; align-items: center; }
.lane .who i { width: .9rem; height: .9rem; border-radius: 3px; flex: none; }
.lane p { margin: 0 0 .5rem; font-size: 1rem; max-width: 40rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  display: inline-flex; gap: .45rem; align-items: baseline; padding: .28rem .7rem; border-radius: 999px; font-family: var(--sans); font-size: .86rem;
  border: 1px solid var(--rule); background: var(--surface); text-decoration: none; color: var(--ink);
}

/* ---------- Rule cards (Section 2) ---------- */

/* ---------- Widgets ---------- */

.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: .38rem .85rem; cursor: pointer; font-family: var(--sans); font-size: .88rem; }

.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; min-width: 5.2rem; }
.check { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; font-size: .86rem; color: var(--ink-2); }
.check input { accent-color: var(--accent); width: 1rem; height: 1rem; }

.ro { display: flex; justify-content: space-between; gap: .6rem; padding: .28rem 0; border-bottom: 1px solid var(--rule-2); }
.ro span:first-child { color: var(--ink-2); }
.ro span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.ro-h { font-weight: 700; font-size: .8rem; color: var(--ink-3); margin: .6rem 0 .1rem; grid-column: 1 / -1; }
.pill { display: inline-block; padding: .08rem .55rem; border-radius: 999px; font-weight: 700; font-size: .84rem; border: 1.5px solid currentColor; }
.yes { color: var(--perception); } .no { color: var(--target); }
.canvas-wrap { position: relative; }
.canvas-wrap canvas { display: block; width: 100%; border-radius: 10px; background: var(--land); touch-action: none; }
.overlay-msg { position: absolute; inset: auto 1rem 1rem 1rem; font-family: var(--sans); font-size: .92rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: .6rem .8rem; box-shadow: var(--shadow); }

.w-foot { font-family: var(--sans); font-size: .84rem; color: var(--ink-2); padding: .7rem 1.1rem .9rem; border-top: 1px solid var(--rule-2); background: var(--surface-2); }

/* ---------- Drawer ---------- */

/* ---------- Placeholder sections ---------- */

/* ---------- Responsive ---------- */

.cur-chip b { font-variant-numeric: tabular-nums; }
.cur-tab { font-size: .86rem; }
.cur-tab th { width: 34%; color: var(--ink-2); font-weight: 700; }
.cur-scene svg { display: block; width: 100%; border-radius: 8px; }
.cur-scene p { margin: .4rem 0 .5rem; }
@media (max-width: 860px) {
  .bs-side, .cur-card { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .dc-layout { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .cur-tl svg { min-width: 600px; }
  .bs-map svg { min-width: 600px; }
  .dc-map svg { min-width: 520px; }
}

@media (max-width: 1180px) {
  .sec-num { position: static; display: block; font-size: 3.6rem; margin-bottom: .4rem; }
}
@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-flex; }
  .rail {
    position: fixed; top: calc(var(--header) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; height: auto; width: min(19rem, 88vw); z-index: 50;
    background: var(--paper); transform: translateX(-102%); transition: transform .18s ease-out; box-shadow: var(--shadow);
  }
  .rail.on { transform: none; }
  .cpa-layout { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  body { font-size: 1rem; }
  .brand small { display: none; }
  .tbtn .lbl-long { display: none; }
  .topbar { gap: .5rem; padding: 0 .6rem; }
  .tbtn { padding: 0 .65rem; }
  .brand { font-size: .95rem; gap: .45rem; }
  .flag { white-space: normal; }
  .lane { grid-template-columns: 1fr; gap: .3rem; }
  .notation { grid-template-columns: 1fr; gap: .1rem; }
  .notation dt { text-align: left; margin-top: .5rem; }
  main { padding-top: 1.4rem; }
  .eq { padding: .8rem .8rem 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media print {
  .topbar, .rail, .drawer, .drawer-scrim, .pager { display: none !important; }
  .shell { display: block; }
}

/* legible labels over busy figure areas */
.halo { paint-order: stroke; stroke: var(--water); stroke-width: 4px; stroke-linejoin: round; }

/* anchored headings clear the sticky header */
section[id], .sec h2[id], [id^="s"] > h2, h2[id] { scroll-margin-top: 4.5rem; }

@media (max-width: 380px) { .brand svg { display: none; } }

</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button type="button" class="tbtn menu-btn" id="menu-btn" aria-expanded="false" aria-controls="rail">Sections</button>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" style="fill: var(--water-2)"/><path d="M13 4 L17 10 L17 22 L9 22 L9 10 Z" style="fill: var(--vessel-fill); stroke: var(--vessel)" stroke-width="1.4"/><path d="M13 1.5 V4" style="stroke: var(--decision)" stroke-width="1.6"/></svg>
    <span>Paper 3, explained <small>learning to navigate by the rules, with onboard LiDAR</small></span>
  </div>
  <div class="spacer"></div>
  <button type="button" class="tbtn" id="open-drawer" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 8h12M2 13h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="lbl-long">Symbols and terms</span><span class="sr-only">Symbols and terms</span></button>
  <button type="button" class="tbtn" id="theme-btn" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2 A6 6 0 0 1 8 14 Z" fill="currentColor"/></svg><span class="lbl-long">Light</span></button>
</header>
<div id="mathfail" class="mathfail" hidden role="status" style="margin: .6rem 1rem 0">Equations are shown as TeX source because the math renderer did not load.</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections">
    <h2>Sections</h2>
    <ol id="rail-list"></ol>
    <div class="legend" aria-label="Colors used in figures">
      <div><i style="background: var(--vessel)"></i>Vessel (own ship)</div>
      <div><i style="background: var(--perception)"></i>Sensing</div>
      <div><i style="background: var(--decision)"></i>Decision-making</div>
      <div><i style="background: var(--testing)"></i>Testing</div>
      <div><i style="background: var(--target)"></i>Target vessel</div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="drawer-scrim" id="drawer-scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" inert>
  <div class="drawer-head"><h2 id="drawer-title">Symbols and terms</h2><button type="button" class="tbtn" id="close-drawer">Close</button></div>
  <div class="drawer-tabs" role="tablist" aria-label="Lists">
    <button type="button" role="tab" data-tab="sym" aria-selected="true">Symbols</button>
    <button type="button" role="tab" data-tab="abbr" aria-selected="false">Abbreviations</button>
    <button type="button" role="tab" data-tab="terms" aria-selected="false">Terms</button>
    <button type="button" role="tab" data-tab="refs" aria-selected="false">References</button>
  </div>
  <div class="drawer-filter"><label class="sr-only" for="drawer-filter">Filter the list</label><input id="drawer-filter" type="search" placeholder="Filter" autocomplete="off"></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<script>
/* ====== MODULE: core.js ====== */
/* ===================================================================
   CORE — shared stores, content helpers, math, tooltips, drawer,
   navigation, theme. Sections register with APP.section(); every
   section's build() runs once at start-up, in order, so symbols,
   terms, abbreviations and references record the section in which
   they first appear. Only the active section is mounted.
   =================================================================== */
(function () {
  'use strict';
  const APP = window.APP = window.APP || {};
  Object.assign(APP, {
    sections: [], byId: {}, building: null, current: null,
    sym: new Map(), termUse: new Map(), abbrUse: new Map(), refUse: new Map(),
    tex: [], figCount: {}, listeners: {}, cleanups: [],
    reducedMotion: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  });

  APP.SUBSYSTEMS = {
    neutral: { name: 'Framing', color: '--ink', fill: '--surface-2' },
    vessel: { name: 'Vessel', color: '--vessel', fill: '--vessel-fill' },
    perception: { name: 'Sensing', color: '--perception', fill: '--perception-fill' },
    decision: { name: 'Decision-making', color: '--decision', fill: '--decision-fill' },
    testing: { name: 'Testing', color: '--testing', fill: '--testing-fill' },
  };
  APP.SYMGROUPS = ['Notation and conventions', 'Vessel', 'Workspace and path', 'Encounter geometry',
    'Collision risk', 'Encounter state and response'];

  // ---------- tiny event bus ----------
  APP.on = (e, f) => { (APP.listeners[e] = APP.listeners[e] || []).push(f); return () => APP.off(e, f); };
  APP.off = (e, f) => { APP.listeners[e] = (APP.listeners[e] || []).filter(g => g !== f); };
  APP.emit = (e, a) => (APP.listeners[e] || []).slice().forEach(f => { try { f(a); } catch (err) { console.error(err); } });

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  APP.esc = esc;
  const secRef = n => (n == null ? '' : 'Section ' + n);

  // ---------- math placeholders ----------
  // M(tex): inline math; MD(tex): display math. TeX strings live in APP.tex, so
  // no escaping inside attributes is needed. Typeset on mount (typesetIn).
  APP.M = function (tex) { APP.tex.push(tex); return '<span class="mj" data-t="' + (APP.tex.length - 1) + '"></span>'; };
  APP.MD = function (tex) { APP.tex.push(tex); return '<span class="md mj" data-t="' + (APP.tex.length - 1) + '" data-d="1"></span>'; };

  // ---------- glossary terms ----------
  APP.T = function (key, label) {
    const d = APP.TERMS[key];
    if (!d) { console.warn('term?', key); return label || key; }
    if (!APP.termUse.has(key)) APP.termUse.set(key, APP.building);
    return '<button type="button" class="term" data-term="' + key + '">' + (label || d[0]) + '</button>';
  };
  // ---------- abbreviations ----------
  APP.AB = function (key, label) {
    const d = APP.ABBR[key];
    if (!d) { console.warn('abbr?', key); return label || key; }
    if (!APP.abbrUse.has(key)) APP.abbrUse.set(key, APP.building);
    return '<abbr class="ab" data-ab="' + esc(key) + '" tabindex="0">' + (label || esc(key)) + '</abbr>';
  };
  // ---------- citations ----------
  function citeOne(key, text) {
    const r = APP.REFS[key];
    if (!r) { console.warn('ref?', key); return key; }
    if (!APP.refUse.has(key)) APP.refUse.set(key, APP.building);
    return '<a class="cite" href="#ref-' + key + '" data-ref="' + key + '">' + (text || r.cite) + '</a>';
  }
  APP.C = function (keys, pre) {
    keys = Array.isArray(keys) ? keys : [keys];
    return '(' + (pre ? pre + ' ' : '') + keys.map(k => citeOne(k)).join('; ') + ')';
  };
  APP.Cn = function (key) {                          // narrative: "Waltz and Okhrin (2023)"
    const r = APP.REFS[key]; const m = r.cite.match(/^(.*), (\d{4}[a-z]?)$/);
    return citeOne(key, m ? m[1] + ' (' + m[2] + ')' : r.cite);
  };
  // ---------- flags ----------
  APP.VERIFY = t => '<span class="flag" title="To be checked by the author">[VERIFY' + (t ? ': ' + t : '') + ']</span>';
  APP.TBD = t => '<span class="flag tbd" title="Not given in the facts files">[TBD' + (t ? ': ' + t : '') + ']</span>';
  // cross-reference; numbers of subsections are filled in after every section is built
  APP.XS = (n, sub) => '<a class="xref" href="#s' + n + (sub ? '-' + sub : '') + '" data-xs="' + n + (sub ? '-' + sub : '') + '">Section ' + n + '</a>';

  // ---------- symbols ----------
  APP.SYM = function (key, o) {
    if (!APP.sym.has(key)) APP.sym.set(key, Object.assign({ key, first: APP.building, group: 'Encounter geometry' }, o));
    return '';
  };

  // ---------- equation block ----------
  // o: {label, title, tex, words, symbols:[{k, tex, m, u, v, g}], example, note}
  APP.EQ = function (o) {
    const rows = (o.symbols || []).map(s => {
      APP.SYM(s.k, { tex: s.tex, meaning: s.m, unit: s.u, group: s.g });
      return '<tr><td>' + APP.M(s.tex) + '</td><td>' + s.m + '</td><td>' + (s.u || '\u2014') + '</td><td>' + (s.v == null ? '\u2014' : s.v) + '</td></tr>';
    }).join('');
    return '<div class="eq"' + (o.id ? ' id="' + o.id + '"' : '') + '>' +
      '<div class="eq-head"><span class="eq-label">' + o.label + '</span><span class="eq-title">' + o.title + '</span></div>' +
      '<div class="eq-math">' + APP.MD(o.tex) + '</div>' +
      '<p class="eq-words"><strong>In words:</strong> ' + o.words + '</p>' +
      (rows ? '<div class="tbl-wrap"><table class="symtab"><thead><tr><th>Symbol</th><th>Meaning</th><th>Unit</th><th>Value used here</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') +
      (o.example ? '<div class="eq-example"><b>Worked example</b>' + o.example + '</div>' : '') +
      (o.note ? '<div class="eq-note">' + o.note + '</div>' : '') +
      '</div>';
  };

  // ---------- subsections & figures ----------
  APP.H2 = function (id, title) {
    const sec = APP.buildingSec;
    sec.subs.push({ id: sec.id + '-' + id, title });
    const k = sec.subs.length;
    APP.subNum = APP.subNum || {};
    APP.subNum[sec.n + '-' + id] = k;
    return '<h2 class="sub" id="' + sec.id + '-' + id + '"><span class="sn">' + sec.n + '.' + k + '</span>' + title + '</h2>';
  };
  APP.FIGN = function () {
    const n = APP.building; APP.figCount[n] = (APP.figCount[n] || 0) + 1;
    return 'Figure ' + n + '.' + APP.figCount[n];
  };

  // ---------- section registry ----------
  APP.section = function (def) {
    def.subs = [];
    APP.sections.push(def); APP.byId[def.id] = def;
  };

  function wrapSection(def) {
    const ss = APP.SUBSYSTEMS[def.subsystem || 'neutral'];
    const idx = APP.sections.indexOf(def);
    const prev = APP.sections[idx - 1], next = APP.sections[idx + 1];
    const pager = '<nav class="pager" aria-label="Section navigation">' +
      (prev ? '<a class="prev" href="#' + prev.id + '"><small>Previous section</small><span>' + prev.n + '\u2002' + prev.title + '</span></a>' : '<span></span>') +
      (next ? '<a class="next" href="#' + next.id + '"><small>Next section</small><span>' + next.n + '\u2002' + next.title + '</span></a>' : '') + '</nav>';
    const learn = def.learn ? '<div class="learn"><b>What you will learn</b><p>' + def.learn.join('<br>') + '</p></div>' : '';
    const take = def.takeaways ? '<section class="takeaways" aria-label="Key takeaways"><h2>Key takeaways</h2><ul>' + def.takeaways.map(t => '<li>' + t + '</li>').join('') + '</ul></section>' : '';
    return '<article class="section" id="sec-' + def.id + '" style="--accent: var(' + ss.color + '); --accent-fill: var(' + ss.fill + ')">' +
      '<header class="sec-head"><div class="sec-num" aria-hidden="true">' + def.n + '</div>' +
      '<p class="sec-kicker"><span class="swatch" style="background: var(' + ss.color + ')"></span>' + ss.name + (def.planned ? ', planned for a later stage' : '') + '</p>' +
      '<h1>' + def.title + '</h1>' + learn + '</header>' +
      def.html + take + pager + '</article>';
  }

  APP.buildAll = function () {
    for (const def of APP.sections) {
      APP.building = def.n; APP.buildingSec = def;
      try { def.html = def.build(); } catch (e) { console.error('build failed', def.id, e); def.html = '<p class="mathfail">This section failed to build: ' + esc(e.message) + '</p>'; }
      if (def.takeaways && typeof def.takeaways === 'function') def.takeaways = def.takeaways();
      if (def.learn && typeof def.learn === 'function') def.learn = def.learn();
    }
    APP.building = null; APP.buildingSec = null;
    const fix = h => h.replace(/data-xs="(\d+)-([\w-]+)">Section \d+</g, (m, n, id) =>
      'data-xs="' + n + '-' + id + '">Section ' + n + (APP.subNum && APP.subNum[n + '-' + id] ? '.' + APP.subNum[n + '-' + id] : '') + '<');
    for (const def of APP.sections) { def.html = fix(def.html); def.full = wrapSection(def); }
  };

  // ---------- math typesetting ----------
  const mathCache = new Map();
  let mathState = 'loading';             // loading | ready | failed
  const pending = new Set();
  APP.mathReady = function () {
    if (mathState === 'ready') return;
    mathState = 'ready';
    try { document.head.appendChild(window.MathJax.svgStylesheet()); } catch (e) { /* older API */ }
    const roots = Array.from(pending); pending.clear();
    roots.forEach(r => APP.typesetIn(r));
  };
  APP.mathFailed = function () {
    if (mathState !== 'loading') return;
    mathState = 'failed';
    const roots = Array.from(pending); pending.clear();
    roots.forEach(r => fallbackIn(r));
    const b = document.getElementById('mathfail'); if (b) b.hidden = false;
  };
  function fallbackIn(root) {
    root.querySelectorAll('.mj:not([data-done])').forEach(el => {
      el.setAttribute('data-done', '1');
      el.innerHTML = '<code class="tex">' + esc(APP.tex[+el.dataset.t]) + '</code>';
    });
  }
  APP.typesetIn = async function (root) {
    if (!root) return;
    if (mathState === 'loading') { pending.add(root); return; }
    if (mathState === 'failed') { fallbackIn(root); return; }
    const els = Array.from(root.querySelectorAll('.mj:not([data-done])'));
    let n = 0;
    for (const el of els) {
      if (!el.isConnected) continue;
      el.setAttribute('data-done', '1');
      const tex = APP.tex[+el.dataset.t], disp = !!el.dataset.d;
      const key = (disp ? 'D:' : 'I:') + tex;
      let node = mathCache.get(key);
      if (!node) {
        try { node = await window.MathJax.tex2svgPromise(tex, { display: disp }); }
        catch (e) { console.warn('TeX error', tex, e); el.innerHTML = '<code class="tex">' + esc(tex) + '</code>'; continue; }
        mathCache.set(key, node);
        if (++n % 25 === 0) await new Promise(r => setTimeout(r, 0));
      }
      el.textContent = '';
      el.appendChild(node.cloneNode(true));
      const svg = el.querySelector('svg'); if (svg) { svg.setAttribute('aria-hidden', 'true'); svg.setAttribute('focusable', 'false'); }
      const sr = document.createElement('span'); sr.className = 'sr-only'; sr.textContent = tex; el.appendChild(sr);
    }
  };

  // ---------- tooltips ----------
  let tipEl, tipFor = null, tipPinned = false;
  function tipContent(el) {
    if (el.dataset.term) {
      const d = APP.TERMS[el.dataset.term]; const s = APP.termUse.get(el.dataset.term);
      return '<b>' + esc(d[0]) + '</b>' + d[1] + (s != null && s !== APP.current.n ? '<div class="where">First defined in ' + secRef(s) + '</div>' : '');
    }
    if (el.dataset.ab) return '<b>' + esc(el.dataset.ab) + '</b>' + esc(APP.ABBR[el.dataset.ab]);
    if (el.dataset.ref) return APP.REFS[el.dataset.ref].text + (APP.REFS[el.dataset.ref].verify ? ' ' + APP.VERIFY() : '');
    if (el.dataset.tip) return el.dataset.tip;
    return '';
  }
  function showTip(el) {
    const html = tipContent(el); if (!html) return;
    tipFor = el; tipEl.innerHTML = html; tipEl.classList.add('on');
    const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
    let x = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
    let y = r.bottom + 8;
    if (y + t.height > window.innerHeight - 8) y = r.top - t.height - 8;
    tipEl.style.left = x + 'px'; tipEl.style.top = Math.max(8, y) + 'px';
  }
  function hideTip() { tipFor = null; tipPinned = false; if (tipEl) tipEl.classList.remove('on'); }
  const TIPSEL = '.term, abbr.ab, a.cite, [data-tip]';
  function initTips() {
    tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
    document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const el = e.target.closest(TIPSEL); if (el && el !== tipFor) showTip(el); });
    document.addEventListener('pointerout', e => { if (e.pointerType === 'touch' || tipPinned) return; const el = e.target.closest(TIPSEL); if (el && !el.contains(e.relatedTarget)) hideTip(); });
    document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest(TIPSEL); if (el) showTip(el); });
    document.addEventListener('focusout', e => { const el = e.target.closest && e.target.closest(TIPSEL); if (el) hideTip(); });
    document.addEventListener('click', e => {
      const term = e.target.closest('.term, abbr.ab');
      if (term) { e.preventDefault(); if (tipFor === term && tipPinned) hideTip(); else { showTip(term); tipPinned = true; } return; }
      const cite = e.target.closest('a.cite');
      if (cite) { e.preventDefault(); hideTip(); openDrawer('refs', cite.dataset.ref); return; }
      if (tipPinned && !e.target.closest('.tip')) hideTip();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(); closeDrawer(); closeRail(); } });
    window.addEventListener('scroll', () => { if (tipFor) hideTip(); }, { passive: true });
  }

  // ---------- drawer: symbols, abbreviations, terms, references ----------
  let drawerTab = 'sym';
  function secCell(n) { return '<td class="sec">' + (n == null ? '' : '\u00a7' + n) + '</td>'; }
  APP.renderSymbols = function (filter) {
    const f = (filter || '').toLowerCase();
    let out = '';
    for (const g of APP.SYMGROUPS) {
      const rows = Array.from(APP.sym.values()).filter(s => s.group === g)
        .filter(s => !f || (s.meaning + ' ' + s.tex + ' ' + (s.unit || '')).toLowerCase().includes(f));
      if (!rows.length) continue;
      out += '<h3>' + g + '</h3><div class="tbl-wrap"><table><thead><tr><th>Symbol</th><th>Meaning</th><th>Unit</th><th>First in</th></tr></thead><tbody>' +
        rows.map(s => '<tr><td>' + APP.M(s.tex) + '</td><td>' + s.meaning + '</td><td>' + (s.unit || '\u2014') + '</td>' + secCell(s.first) + '</tr>').join('') + '</tbody></table></div>';
    }
    return out || '<p class="muted">No symbols match.</p>';
  };
  APP.renderAbbr = function (filter) {
    const f = (filter || '').toLowerCase();
    const rows = Array.from(APP.abbrUse.entries()).sort((a, b) => a[0].localeCompare(b[0]))
      .filter(([k]) => !f || (k + ' ' + APP.ABBR[k]).toLowerCase().includes(f));
    return rows.length ? '<div class="tbl-wrap"><table><thead><tr><th>Abbreviation</th><th>Meaning</th><th>First in</th></tr></thead><tbody>' +
      rows.map(([k, n]) => '<tr><td><b>' + esc(k) + '</b></td><td>' + esc(APP.ABBR[k]) + '</td>' + secCell(n) + '</tr>').join('') + '</tbody></table></div>' : '<p class="muted">No abbreviations match.</p>';
  };
  APP.renderTerms = function (filter) {
    const f = (filter || '').toLowerCase();
    const rows = Array.from(APP.termUse.entries()).map(([k, n]) => [APP.TERMS[k], n]).sort((a, b) => a[0][0].localeCompare(b[0][0]))
      .filter(([d]) => !f || (d[0] + ' ' + d[1]).toLowerCase().includes(f));
    return rows.length ? '<div class="tbl-wrap"><table><thead><tr><th>Term</th><th>Definition</th><th>First in</th></tr></thead><tbody>' +
      rows.map(([d, n]) => '<tr><td><b>' + esc(d[0]) + '</b></td><td>' + d[1] + '</td>' + secCell(n) + '</tr>').join('') + '</tbody></table></div>' : '<p class="muted">No terms match.</p>';
  };
  APP.renderRefs = function (filter, idPrefix) {
    const f = (filter || '').toLowerCase();
    const rows = Array.from(APP.refUse.keys()).map(k => [k, APP.REFS[k]]).sort((a, b) => a[1].text.localeCompare(b[1].text))
      .filter(([, r]) => !f || r.text.toLowerCase().includes(f));
    return rows.length ? '<ol class="refs" style="list-style:none;padding:0">' + rows.map(([k, r]) => '<li id="' + (idPrefix || 'd') + 'ref-' + k + '">' + r.text + (r.verify ? ' ' + APP.VERIFY() : '') + '</li>').join('') + '</ol>' : '<p class="muted">No references match.</p>';
  };
  function renderDrawer() {
    const body = document.getElementById('drawer-body'), f = document.getElementById('drawer-filter').value;
    const map = { sym: APP.renderSymbols, abbr: APP.renderAbbr, terms: APP.renderTerms, refs: APP.renderRefs };
    body.innerHTML = map[drawerTab](f);
    APP.typesetIn(body);
    document.querySelectorAll('.drawer-tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === drawerTab)));
  }
  let lastFocus = null;
  function openDrawer(tab, refKey) {
    if (tab) drawerTab = tab;
    lastFocus = document.activeElement;
    document.getElementById('drawer').classList.add('on');
    document.getElementById('drawer').removeAttribute('inert');
    document.getElementById('drawer-scrim').classList.add('on');
    renderDrawer();
    setTimeout(() => {
      if (refKey) { const li = document.getElementById('dref-' + refKey); if (li) { li.scrollIntoView({ block: 'center' }); li.setAttribute('tabindex', '-1'); li.focus(); li.style.background = 'var(--warn-bg)'; } }
      else document.getElementById('drawer-filter').focus();
    }, 60);
  }
  function closeDrawer() {
    const d = document.getElementById('drawer'); if (!d || !d.classList.contains('on')) return;
    d.classList.remove('on'); d.setAttribute('inert', '');
    document.getElementById('drawer-scrim').classList.remove('on');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  APP.openDrawer = openDrawer;
  function initDrawer() {
    document.getElementById('open-drawer').addEventListener('click', () => openDrawer());
    document.getElementById('close-drawer').addEventListener('click', closeDrawer);
    document.getElementById('drawer-scrim').addEventListener('click', closeDrawer);
    document.getElementById('drawer-filter').addEventListener('input', renderDrawer);
    document.querySelectorAll('.drawer-tabs button').forEach(b => b.addEventListener('click', () => { drawerTab = b.dataset.tab; renderDrawer(); }));
  }

  // ---------- rail & routing ----------
  function renderRail() {
    const ol = document.getElementById('rail-list');
    ol.innerHTML = APP.sections.map(s => {
      const ss = APP.SUBSYSTEMS[s.subsystem || 'neutral'];
      return '<li style="--sc: var(' + ss.color + ')"><a class="sec" href="#' + s.id + '" data-sec="' + s.id + '"><span class="n">' + s.n + '</span><span>' + (s.short || s.title) +
        (s.planned ? '<span class="todo">Later stage</span>' : '') + '</span></a><ol class="subs" hidden>' +
        s.subs.map(u => '<li><a href="#' + u.id + '" data-sub="' + u.id + '">' + u.title + '</a></li>').join('') + '</ol></li>';
    }).join('');
  }
  function railActive(id) {
    document.querySelectorAll('#rail-list a.sec').forEach(a => {
      const on = a.dataset.sec === id; a.setAttribute('aria-current', on ? 'page' : 'false');
      const subs = a.parentElement.querySelector('ol.subs'); if (subs) subs.hidden = !on || !subs.children.length;
    });
  }
  let spy = null;
  function initSpy(el) {
    if (spy) spy.disconnect();
    const heads = el.querySelectorAll('h2.sub'); if (!heads.length || !('IntersectionObserver' in window)) return;
    spy = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) {
        document.querySelectorAll('#rail-list ol.subs a').forEach(a => a.classList.toggle('on', a.dataset.sub === en.target.id));
      } });
    }, { rootMargin: '-15% 0px -75% 0px' });
    heads.forEach(h => spy.observe(h));
  }
  APP.onCleanup = f => APP.cleanups.push(f);
  function unmountCurrent() {
    APP.cleanups.splice(0).forEach(f => { try { f(); } catch (e) { console.error(e); } });
    APP.emit('unmount');
  }
  function route() {
    const h = (location.hash || '#s0').slice(1);
    const secId = (h.match(/^s\d+/) || ['s0'])[0];
    const def = APP.byId[secId] || APP.sections[0];
    const main = document.getElementById('main');
    if (!APP.current || APP.current.id !== def.id) {
      unmountCurrent();
      APP.current = def;
      main.innerHTML = def.full;
      railActive(def.id);
      document.title = def.n + '. ' + def.title + ' \u2014 Paper 3, explained';
      try { if (def.mount) def.mount(main.firstElementChild); } catch (e) { console.error('mount failed', def.id, e); }
      APP.typesetIn(main);
      initSpy(main);
      if (h === def.id) window.scrollTo(0, 0);
    }
    if (h !== def.id) {
      const target = document.getElementById(h);
      if (target) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
    }
    closeRail();
  }
  function closeRail() { const r = document.getElementById('rail'); if (r) r.classList.remove('on'); const b = document.getElementById('menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }

  // ---------- theme ----------
  const THEME_KEY = 'paper3-explainer-theme';
  function effectiveTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function setThemeButton() {
    const b = document.getElementById('theme-btn'); const t = effectiveTheme();
    b.setAttribute('aria-pressed', String(t === 'dark'));
    b.querySelector('.lbl-long').textContent = t === 'dark' ? 'Dark' : 'Light';
    b.setAttribute('aria-label', 'Color theme: ' + (t === 'dark' ? 'dark' : 'light') + '. Switch theme');
  }
  function initTheme() {
    try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') document.documentElement.setAttribute('data-theme', s); } catch (e) { /* storage unavailable */ }
    setThemeButton();
    document.getElementById('theme-btn').addEventListener('click', () => {
      const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
      setThemeButton(); APP.emit('theme');
    });
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { setThemeButton(); APP.emit('theme'); });
  }
  APP.css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // ---------- start ----------
  APP.start = function () {
    APP.buildAll();
    renderRail();
    initTips(); initDrawer(); initTheme();
    const mb = document.getElementById('menu-btn');
    mb.addEventListener('click', () => { const r = document.getElementById('rail'); const on = !r.classList.contains('on'); r.classList.toggle('on', on); mb.setAttribute('aria-expanded', String(on)); });
    document.getElementById('rail').addEventListener('click', e => { if (e.target.closest('a')) closeRail(); });
    document.addEventListener('visibilitychange', () => APP.emit('visibility', document.hidden));
    window.addEventListener('hashchange', route);
    route();
    setTimeout(() => { if (mathState === 'loading') APP.mathFailed(); }, 15000);
  };
})();

</script>

<script>
/* ====== MODULE: geom.js ====== */
/* ===================================================================
   GEOM — encounter geometry (Paper Eqs. 3–12) and the scripted
   overview simulation. Pure functions; no DOM. Numbers from
   MASTER_ARTIFACT_FACTS.md and FORMULATION_EQUATIONS.md only.
   Frames: world x east, y north; headings compass (0 = north,
   clockwise positive, degrees); relative bearing 0 = dead ahead,
   90 = starboard.
   =================================================================== */
(function (root) {
  'use strict';
  const DEG = Math.PI / 180;

  // ---- Constants (facts §1, equations §§1–5) ------------------------
  const K = {
    L: 1.725, B: 0.50,                  // hull length overall, beam [m]
    Uref: 0.558, Us: 1.116,             // cruise speed at 6 rpm-units; speed scale 2*Uref [m/s]
    dt: 0.5,                            // decision period [s]
    af: 3.14, aa: 1.57, b: 1.25,        // ship-domain semi-axes fore / aft / abeam [m]
    dreq: 2.5,                          // required passing distance = 2b [m]
    kEng: 1.5, kRel: 2.5,               // engage / clear factors on d_req
    Teng: 25, Nclr: 6,                  // engagement horizon [s]; release steps
    cWall: 0.65,                        // wall clearance in the room test [m]
    dclr: 1.76,                         // clearance a full stop must leave [m]
    Rmax: 16, Rmin: 1.0, bow: 0.8625,   // LiDAR range limits; sensor ahead of reference point [m]
    losDelta: 2.5,                      // LOS look-ahead [m]
    rMaxDeg: 10.4,                      // steady yaw rate at full rudder [deg/s]
    overtakeMargin: 0.15,               // speed margin (x Uref) for overtaking classes
  };

  // ---- Angle helpers ------------------------------------------------
  const wrap360 = a => ((a % 360) + 360) % 360;
  const wrap180 = a => { const x = wrap360(a); return x > 180 ? x - 360 : x; };
  const hvec = psi => [Math.sin(psi * DEG), Math.cos(psi * DEG)];        // unit heading
  const stbd = psi => [Math.cos(psi * DEG), -Math.sin(psi * DEG)];       // unit starboard
  const bearing = (dx, dy) => wrap360(Math.atan2(dx, dy) / DEG);         // compass bearing
  function inBand(x, lo, hi) {                                           // closed band on circle
    x = wrap360(x); const l = wrap360(lo), h = wrap360(hi);
    if (hi - lo >= 360) return true;
    return l <= h ? (x >= l && x <= h) : (x >= l || x <= h);
  }

  // ---- Eq. 3: closest point of approach -----------------------------
  function cpa(pOS, vOS, pTS, vTS) {
    const px = pTS[0] - pOS[0], py = pTS[1] - pOS[1];
    const vx = vTS[0] - vOS[0], vy = vTS[1] - vOS[1];
    const v2 = vx * vx + vy * vy;
    if (v2 < 1e-12) return { tcpa: 0, dcpa: Math.hypot(px, py), p: [px, py], v: [vx, vy] };
    const t = -(px * vx + py * vy) / v2;
    return { tcpa: t, dcpa: Math.hypot(px + vx * t, py + vy * t), p: [px, py], v: [vx, vy] };
  }

  // ---- Eq. 4: domain radius at relative bearing alpha ---------------
  function Rdom(alphaDeg) {
    const ca = Math.cos(alphaDeg * DEG), sa = Math.sin(alphaDeg * DEG);
    const a = ca >= 0 ? K.af : K.aa;
    return 1 / Math.sqrt((ca / a) ** 2 + (sa / K.b) ** 2);
  }

  // ---- Eq. 6: collision risk index (after Waltz & Okhrin, 2023) -----
  function cri(dDom, dcpaDom, tcpa, phiDeg) {
    const Ts = tcpa >= 0 ? 20 : 6;
    const fbow = phiDeg < 45 ? 1 + 0.3 * (1 - phiDeg / 45) : 1;
    const crCPA = Math.exp(-dcpaDom / 4) * Math.exp(-Math.abs(tcpa) / Ts) * fbow;
    const crED = Math.exp(-dDom / 5);
    const value = dDom <= 0 ? 1 : Math.min(1, Math.max(crCPA, crED));
    return { value, crCPA, crED, fbow, Ts };
  }

  // ---- §4.4: classification (angles measured from the path tangent) --
  const SIGMA = { none: 0, headon: 1, cross_stbd: 1, cross_port: -1, overtaking: -1, overtaken: 0 };
  function classify(alphaP, cP, betaOS, Uos, Uts) {
    const m = K.overtakeMargin * K.Uref;
    if (inBand(cP, -67.5, 67.5)) {
      if (inBand(betaOS, 112.5, 247.5) && Uos > Uts + m) return 'overtaking';
      if (inBand(alphaP, 112.5, 247.5) && Uts > Uos + m) return 'overtaken';
    }
    if (inBand(alphaP, -10, 10) && inBand(cP, 170, 190)) return 'headon';
    if (inBand(alphaP, 10, 112.5) && inBand(cP, 190, 292.5)) return 'cross_stbd';
    if (inBand(alphaP, 247.5, 350) && inBand(cP, 67.5, 170)) return 'cross_port';
    return 'none';
  }

  // ---- Everything the CPA widget and the animation read out ---------
  // os/ts: {p:[x,y], psi, U}; psiP: path tangent used for classification
  function encounter(os, ts, psiP) {
    const vOS = hvec(os.psi).map(c => c * os.U), vTS = hvec(ts.psi).map(c => c * ts.U);
    const C = cpa(os.p, vOS, ts.p, vTS);
    const dx = ts.p[0] - os.p[0], dy = ts.p[1] - os.p[1];
    const range = Math.hypot(dx, dy);
    const brg = bearing(dx, dy);
    const alpha = wrap360(brg - os.psi);             // relative bearing (own heading)
    const alphaP = wrap360(brg - (psiP == null ? os.psi : psiP));
    const c = wrap360(ts.psi - os.psi);              // heading-crossing angle (own heading)
    const cP = wrap360(ts.psi - (psiP == null ? os.psi : psiP));
    const brgOS = bearing(-dx, -dy);
    const betaOS = wrap360(brgOS - ts.psi);          // bearing of OS from TS's bow
    const phi = Math.abs(wrap180(brgOS - ts.psi));   // angle of OS off the TS bow
    const R = Rdom(alpha);
    const dDom = Math.max(0, range - R);
    const dcpaDom = Math.max(0, C.dcpa - R);
    const risk = cri(dDom, dcpaDom, C.tcpa, phi);
    const cls = classify(alphaP, cP, betaOS, os.U, ts.U);
    const cond = {
      cls: cls !== 'none',
      tcpa: C.tcpa > 0 && C.tcpa <= K.Teng,
      dcpa: C.dcpa < K.kEng * K.dreq,
    };
    return {
      tcpa: C.tcpa, dcpa: C.dcpa, prel: C.p, vrel: C.v, range, alpha, alphaP, c, cP,
      betaOS, phi, Rdom: R, dDom, dcpaDom, risk, cls, sigma: SIGMA[cls], cond,
      engage: cond.cls && cond.tcpa && cond.dcpa,
    };
  }

  // ---- Facts §6.2 step 3: solve backward for the spawn ---------------
  // side = +1 puts the target to the own ship's starboard at the CPA.
  function backSolve(pOS0, psiOS, Uos, c, k, T0, d0, side) {
    const hO = hvec(psiOS), psiTS = wrap360(psiOS + c), hT = hvec(psiTS), Uts = k * Uos;
    const vrel = [Uos * hO[0] - Uts * hT[0], Uos * hO[1] - Uts * hT[1]];
    const nv = Math.hypot(vrel[0], vrel[1]) || 1;
    let n = [vrel[1] / nv, -vrel[0] / nv];
    const s = stbd(psiOS);
    if ((n[0] * s[0] + n[1] * s[1]) * side < 0) n = [-n[0], -n[1]];
    const pOST = [pOS0[0] + Uos * T0 * hO[0], pOS0[1] + Uos * T0 * hO[1]];
    const pTST = [pOST[0] + d0 * n[0], pOST[1] + d0 * n[1]];
    const pTS0 = [pTST[0] - Uts * T0 * hT[0], pTST[1] - Uts * T0 * hT[1]];
    return { pTS0, psiTS, Uts, pOST, pTST };
  }

  // ---- Ray casting --------------------------------------------------
  function raySeg(o, d, a, b) {             // distance along unit ray d to segment ab
    const ex = b[0] - a[0], ey = b[1] - a[1];
    const den = d[0] * ey - d[1] * ex;
    if (Math.abs(den) < 1e-12) return Infinity;
    const ax = a[0] - o[0], ay = a[1] - o[1];
    const t = (ax * ey - ay * ex) / den;
    const u = (ax * d[1] - ay * d[0]) / den;
    return (t > 1e-9 && u >= 0 && u <= 1) ? t : Infinity;
  }
  function rayCast(o, d, segs) {
    let best = Infinity, tag = null;
    for (const s of segs) { const t = raySeg(o, d, s[0], s[1]); if (t < best) { best = t; tag = s[2]; } }
    return { t: best, tag };
  }
  const polySegs = (pts, tag) => pts.map((p, i) => [p, pts[(i + 1) % pts.length], tag]);
  function hullPts(p, psi, L, B) {          // pointed-bow hull outline in world frame
    const f = hvec(psi), s = stbd(psi), hl = (L || K.L) / 2, hb = (B || K.B) / 2;
    const body = [[0, hl], [hb, hl - 0.42], [hb, -hl], [-hb, -hl], [-hb, hl - 0.42]];
    return body.map(([xs, yf]) => [p[0] + xs * s[0] + yf * f[0], p[1] + xs * s[1] + yf * f[1]]);
  }
  const squarePts = (c, w) => [[c[0] - w / 2, c[1] - w / 2], [c[0] + w / 2, c[1] - w / 2],
                               [c[0] + w / 2, c[1] + w / 2], [c[0] - w / 2, c[1] + w / 2]];

  // Minimum gap between two convex polygons (0 if they overlap)
  function polyGap(A, B) {
    const axes = [];
    for (const P of [A, B]) for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length];
      const nx = b[1] - a[1], ny = a[0] - b[0], n = Math.hypot(nx, ny);
      axes.push([nx / n, ny / n]);
    }
    let overlap = true;
    for (const [nx, ny] of axes) {
      let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
      for (const q of A) { const t = q[0] * nx + q[1] * ny; a0 = Math.min(a0, t); a1 = Math.max(a1, t); }
      for (const q of B) { const t = q[0] * nx + q[1] * ny; b0 = Math.min(b0, t); b1 = Math.max(b1, t); }
      if (a1 < b0 || b1 < a0) { overlap = false; break; }
    }
    if (overlap) return 0;
    let best = Infinity;                    // vertex-to-edge distances
    const ptSeg = (p, a, b) => {
      const ex = b[0] - a[0], ey = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * ex + (p[1] - a[1]) * ey) / (ex * ex + ey * ey)));
      return Math.hypot(p[0] - a[0] - t * ex, p[1] - a[1] - t * ey);
    };
    for (const [P, Q] of [[A, B], [B, A]])
      for (const p of P) for (let i = 0; i < Q.length; i++) best = Math.min(best, ptSeg(p, Q[i], Q[(i + 1) % Q.length]));
    return best;
  }

  /* =================================================================
     Scripted overview simulation (Section 1 widget). ILLUSTRATIVE:
     simplified kinematics and a scripted response rule built on the
     formulation's admissibility tests (Eqs. 8, 10, 11, 12, 15).
     ================================================================= */
  const CLASS_PARAMS = {    // illustrative picks inside the generator's bands (facts §6.2)
    headon:     { c: 180, k: 0.90, T0: 12.5, d0: 0.8, side: -1 },
    cross_stbd: { c: 225, k: 0.90, T0: 8.5,  d0: 0.2, side: +1 },
    cross_port: { c: 135, k: 0.90, T0: 8.5,  d0: 0.2, side: -1 },
    overtaking: { c: 0,   k: 0.50, T0: 20.0, d0: 0.5, side: +1 },
    overtaken:  { c: 0,   k: 1.60, T0: 12.0, d0: 1.1, side: -1 },
  };
  const BANDS = {           // generator bands (facts §6.2), used to keep picks honest
    headon: { c: [170, 190], k: [0.70, 1.30], T0: [12.3, 17.0], d0: [0, 2.0] },
    cross_stbd: { c: [190, 292.5], k: [0.60, 1.40], T0: [7.9, 14.8], d0: [0, 2.5] },
    cross_port: { c: [67.5, 170], k: [0.60, 1.40], T0: [7.9, 14.8], d0: [0, 2.5] },
    overtaking: { c: [-67.5, 67.5], k: [0.40, 0.55], T0: [19.7, 31.5], d0: [0, 2.0] },
    overtaken: { c: [-67.5, 67.5], k: [1.50, 2.20], T0: [9.9, 15.8], d0: [0, Infinity] },
  };

  const DEFAULT_PANELS = [[0.30, -2.2], [0.45, 2.2], [0.60, -2.2]];   // [fraction of leg, lateral offset (+ stbd)]
  function makeWorkspace(mode, W, panelSpec) {
    if (mode === 'basin') {
      const nav = [[0.4, 0.4], [9.6, 0.4], [9.6, 24.6], [0.4, 24.6]];
      const start = [3.5, 2], goal = [6.5, 22];
      const psiP = bearing(goal[0] - start[0], goal[1] - start[1]);
      const len = Math.hypot(goal[0] - start[0], goal[1] - start[1]);
      const at = (f, e) => { const h = hvec(psiP), s = stbd(psiP);
        return [start[0] + f * len * h[0] + e * s[0], start[1] + f * len * h[1] + e * s[1]]; };
      const panels = (panelSpec || DEFAULT_PANELS).map(([f, e]) => ({ c: at(f, e), w: 1.0, f, e }));
      return { mode, W: 10, nav, outer: [0, 0, 10, 25], start, goal, psiP, len, panels, sCPA: 0.78 * len };
    }
    const x0 = 5 - W / 2, x1 = 5 + W / 2, xp = 5 + 0.12 * W / 2;  // starboard station (facts §6.1)
    const nav = [[x0, 0.4], [x1, 0.4], [x1, 24.6], [x0, 24.6]];
    const start = [xp, 2], goal = [xp, 22];
    return { mode, W, nav, outer: [0, 0, 10, 25], start, goal, psiP: 0, len: 20, panels: [], sCPA: 0.62 * 20 };
  }
  const pathPoint = (ws, s) => { const h = hvec(ws.psiP); return [ws.start[0] + s * h[0], ws.start[1] + s * h[1]]; };

  function insideNav(ws, p, m) {
    const xs = ws.nav.map(q => q[0]), ys = ws.nav.map(q => q[1]);
    return p[0] >= Math.min(...xs) + m && p[0] <= Math.max(...xs) - m &&
           p[1] >= Math.min(...ys) + m && p[1] <= Math.max(...ys) - m;
  }

  // Candidate list for one class in one workspace; first valid one wins.
  function candidates(ws, cls) {
    const base = CLASS_PARAMS[cls], out = [];
    if (ws.mode === 'basin') {
      if (cls !== 'cross_stbd' && cls !== 'cross_port') out.push(Object.assign({}, base));
      if (cls === 'cross_stbd' || cls === 'cross_port') {
        const sgn = cls === 'cross_stbd' ? 1 : -1;
        for (const T0 of [14.5, 13.5, 12.5, 12, 11, 10, 9, 8.5])
          for (const th of [20, 25, 30, 35, 40, 45, 50, 55, 60])
            for (const k of [0.9, 0.8, 0.7, 1.0, 1.1, 0.6])
              out.push({ c: wrap360(180 + sgn * th), k, T0, d0: 0.2, side: sgn });
      } else if (cls === 'overtaken') {
        for (const d0 of [1.1, 1.0, 0.9])
          for (const T0 of [12, 11, 13, 10])
            for (const side of [-1, 1]) out.push(Object.assign({}, base, { T0, d0, side }));
      } else {
        for (const T0 of [base.T0 - 0.5, base.T0 + 0.5, base.T0 + 1.5])
          out.push(Object.assign({}, base, { T0 }));
      }
      return out;
    }
    if (cls === 'headon') {
      for (const T0 of [15, 14, 13, 12.5]) out.push({ c: 180, k: 0.9, T0, d0: 0.12 * ws.W, side: -1 });
    } else if (cls === 'overtaking') {
      out.push({ c: 0, k: 0.5, T0: 20, d0: 0, side: +1 });
    } else if (cls === 'cross_stbd' || cls === 'cross_port') {
      const sgn = cls === 'cross_stbd' ? 1 : -1;
      for (const th of [45, 40, 35, 30, 25, 20, 16, 13, 11])
        for (const T0 of [12, 11, 10, 9, 8.5, 7.9])
          for (const k of [0.9, 0.8, 0.7, 1.0, 0.6])
            out.push({ c: wrap360(180 + sgn * th), k, T0, d0: 0.2, side: sgn });
    }
    return out;
  }

  // Pre-computed picks (inside the generator's bands, facts §6.2) that the scripted
  // response completes without contact; null = the generator would redraw.
  const SCEN_TABLE = {
    basin: {
      headon: { sFrac: 0.74, c: 180, k: 0.9, T0: 13.5, d0: 0.5, side: -1, panels: [[0.25,-2.2],[0.4,2.2],[0.55,-2.2]] },
      cross_stbd: { sFrac: 0.78, c: 210, k: 0.6, T0: 13.5, d0: 0.2, side: 1, panels: [[0.25,2.5],[0.4,-2.5],[0.55,2.5]] },
      cross_port: { sFrac: 0.78, c: 140, k: 0.6, T0: 14.5, d0: 0.2, side: -1, panels: [[0.25,2],[0.4,-2],[0.55,2]] },
      overtaking: { sFrac: 0.82, c: 0, k: 0.4, T0: 20, d0: 0, side: 1, panels: [[0.25,-2.5],[0.4,2.5],[0.55,-2.5]] },
      overtaken: { sFrac: 0.86, c: 0, k: 1.7, T0: 12, d0: 1.3, side: -1, panels: [[0.3,-2.5],[0.45,2.5],[0.6,-2.5]] },
    },
    channel: {
      headon: {
        '4': { c: 180, k: 1.1, T0: 12.5, d0: 0.48, side: -1 },
        '5': { c: 180, k: 1.1, T0: 12.5, d0: 0.6, side: -1 },
        '6': { c: 180, k: 1.1, T0: 12.5, d0: 0.72, side: -1 },
        '7': { c: 180, k: 1.1, T0: 12.5, d0: 0.84, side: -1 },
        '8': { c: 180, k: 1.1, T0: 12.5, d0: 0.96, side: -1 },
        '10': { c: 180, k: 1.1, T0: 12.5, d0: 1.2, side: -1 },
        '4.5': { c: 180, k: 1.1, T0: 12.5, d0: 0.54, side: -1 },
        '3.5': { c: 180, k: 1.1, T0: 12.5, d0: 0.42, side: -1 },
      },
      cross_stbd: {
        '4': null,
        '5': { c: 200, k: 0.8, T0: 9, d0: 0.2, side: 1 },
        '6': { c: 205, k: 0.6, T0: 13, d0: 0.2, side: 1 },
        '7': { c: 205, k: 0.6, T0: 13, d0: 0.2, side: 1 },
        '8': { c: 205, k: 0.6, T0: 13, d0: 0.2, side: 1 },
        '10': { c: 205, k: 0.6, T0: 13, d0: 0.2, side: 1 },
        '4.5': null,
        '3.5': null,
      },
      cross_port: {
        '4': { c: 160, k: 0.8, T0: 10, d0: 0.2, side: -1 },
        '5': { c: 155, k: 0.6, T0: 12, d0: 0.2, side: -1 },
        '6': { c: 155, k: 0.6, T0: 12, d0: 0.2, side: -1 },
        '7': { c: 155, k: 0.6, T0: 12, d0: 0.2, side: -1 },
        '8': { c: 155, k: 0.6, T0: 12, d0: 0.2, side: -1 },
        '10': { c: 155, k: 0.6, T0: 12, d0: 0.2, side: -1 },
        '4.5': { c: 155, k: 0.6, T0: 12, d0: 0.2, side: -1 },
        '3.5': null,
      },
      overtaking: {
        '4': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
        '5': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
        '6': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
        '7': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
        '8': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
        '10': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
        '4.5': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
        '3.5': { c: 0, k: 0.4, T0: 20, d0: 0.5, side: 1 },
      },
    },
  };

  function buildScenario(mode, W, cls, opts) {
    const ws = makeWorkspace(mode, W, opts && opts.prm && opts.prm.panels);
    const sFrac = (opts && opts.prm && opts.prm.sFrac) || (opts && opts.sFrac);
    if (sFrac) ws.sCPA = sFrac * ws.len;
    const Uos = K.Uref;
    const tCPA = ws.sCPA / Uos;
    const notes = [];
    if (cls === 'overtaken' && mode !== 'basin') return { ws, cls, infeasible: 'Being-overtaken encounters are generated in the basin only.' };
    let list;
    if (opts && opts.prm) list = [opts.prm];
    else if (opts && opts.search) list = candidates(ws, cls);
    else {
      const row = mode === 'basin' ? SCEN_TABLE.basin : SCEN_TABLE.channel[cls];
      const pick = row && (mode === 'basin' ? row[cls] : row[String(W)]);
      if (!pick) return { ws, cls, infeasible: 'No encounter of this type inside the generator\u2019s bands fits this channel; the generator would draw again.' };
      return buildScenario(mode, W, cls, { prm: pick });
    }
    for (const prm of list) {
      const tSpawn = tCPA - prm.T0;
      if (tSpawn < 1.0) continue;
      const guard = 0.4 * prm.T0 * Uos;
      if (ws.panels.some(pn => Math.abs(pn.f * ws.len - ws.sCPA) < guard + 0.6)) continue;
      const pOS0 = pathPoint(ws, Uos * tSpawn);
      const sol = backSolve(pOS0, ws.psiP, Uos, prm.c, prm.k, prm.T0, prm.d0, prm.side);
      if (!insideNav(ws, sol.pTS0, 0.5)) continue;
      if (Math.hypot(sol.pTS0[0] - pOS0[0], sol.pTS0[1] - pOS0[1]) < 3.0) continue;   // spawn range
      const e = encounter({ p: pOS0, psi: ws.psiP, U: Uos }, { p: sol.pTS0, psi: sol.psiTS, U: sol.Uts }, ws.psiP);
      if (e.cls !== cls) continue;                                                     // re-classify
      let hitsPanel = false;                                  // straight track clears panels by 0.30 m
      const hT = hvec(sol.psiTS), run = stopDistance(ws, sol.pTS0, sol.psiTS, false);
      for (let d = 0; d <= run && !hitsPanel; d += 0.25) {
        const q = [sol.pTS0[0] + d * hT[0], sol.pTS0[1] + d * hT[1]];
        hitsPanel = ws.panels.some(pn => polyGap(hullPts(q, sol.psiTS), squarePts(pn.c, pn.w)) < 0.3);
      }
      if (hitsPanel) continue;
      return { ws, cls, prm, tSpawn, tCPA, pOS0, sol, notes };
    }
    return { ws, cls, infeasible: 'No geometry inside the generator\u2019s bands fits this workspace here; the generator would redraw.' };
  }

  // Distance the target can travel before it must stop short of a wall or panel
  function stopDistance(ws, p, psi, withPanels) {
    const h = hvec(psi), s = stbd(psi);
    const segs = polySegs(ws.nav, 'wall');
    if (withPanels) ws.panels.forEach(pn => segs.push(...polySegs(squarePts(pn.c, pn.w), 'panel')));
    let best = Infinity;
    for (const off of [-K.B / 2, 0, K.B / 2]) {
      const o = [p[0] + off * s[0], p[1] + off * s[1]];
      best = Math.min(best, rayCast(o, h, segs).t);
    }
    return Math.max(0, best - K.L / 2 - 0.35);
  }

  // Eq. 10 room on one side (beam-on distance to the map boundary over the passage)
  function roomSide(ws, os, eY, sAlong, tcpa, sigma) {
    const segs = polySegs(ws.nav, 'wall');
    const dir = stbd(ws.psiP).map(c => c * sigma);
    const sEnd = Math.min(ws.len, sAlong + Math.max(tcpa, 0) * Math.max(os.U, 0));
    let dmin = Infinity;
    for (let s = sAlong; s <= sEnd + 1e-9; s += 0.25) {
      const q = pathPoint(ws, s), st = stbd(ws.psiP);
      const o = [q[0] + eY * st[0], q[1] + eY * st[1]];
      dmin = Math.min(dmin, rayCast(o, dir, segs).t);
      if (sEnd - sAlong < 0.25) break;
    }
    return dmin - K.B / 2 - K.cWall;
  }

  // Eq. 12 idea: the own ship brakes along its heading (the animation's simplified
  // first-order speed response, time constant TAU_U) while the target holds its
  // constant velocity; D_stop is the smallest center distance over the maneuver.
  const TAU_PSI = 1.5, TAU_U = 1.6;          // illustrative time constants of the animation [s]
  function stopClearance(os, ts) {
    const hO = hvec(os.psi), vT = hvec(ts.psi).map(c => c * ts.U);
    let best = Infinity;
    for (let tau = 0; tau <= 60; tau += 0.1) {
      const sb = TAU_U * os.U * (1 - Math.exp(-tau / TAU_U));
      const dx = ts.p[0] + vT[0] * tau - (os.p[0] + sb * hO[0]);
      const dy = ts.p[1] + vT[1] * tau - (os.p[1] + sb * hO[1]);

    const ws = sc.ws;

      os: { p: ws.start.slice(), psi: ws.psiP, U: K.Uref, psiCmd: ws.psiP, Ucmd: K.Uref, r: 0 },
      ts: null, tsTravel: 0, tsStop: Infinity,
      phase: 'idle', lastCls: 'none', clsCount: 0, clearCount: 0,
      latched: null, decision: null, mode: 'follow', offGoal: 0,
      minGap: Infinity, minCentre: Infinity, minPanelGap: Infinity, minWallGap: Infinity,
      nextDecision: 0, enc: null, events: [], tsStatic: false, stillCount: 0, trail: [],

    function staticPassRef(sOS) {                          // stopped target handled like a panel
      const pts = hullPts(S.ts.p, S.ts.psi).map(q => pathCoords(ws, q));
      const sMin = Math.min(...pts.map(q => q.s)), sMax = Math.max(...pts.map(q => q.s));

    }
    function guidance() {
      const { s, eY } = pathCoords(ws, S.os.p);
      let ref = 0;                                          // lateral offset of the line we steer to
      if (S.mode === 'turning' || S.mode === 'offset') ref = S.latched.sigma * S.offGoal;
      if (S.tsStatic) ref = staticPassRef(s);
      if (S.mode === 'turning') {

    function act(e) {
      const { s, eY } = pathCoords(ws, S.os.p);

      else response = 'partial';

      else if (response === 'partial') { S.offGoal = Math.max(0, room); S.mode = S.offGoal > 0.05 ? 'turning' : 'follow'; }
      else if (response === 'slow') { S.os.Ucmd = 0; }       // take all way off (Rule 8(e))
      else if (response === 'holdastern') { S.os.Ucmd = Math.max(S.ts.U, 0.2); }   // R-5 speed reference
      S.events.push({ t: S.t, kind: 'act', response });
    }

    function decisionStep() {
      if (!S.ts) return;
      const e = encounter(S.os, S.ts, ws.psiP);
      S.enc = e;
      if (e.cls === S.lastCls) S.clsCount++; else { S.lastCls = e.cls; S.clsCount = 1; }
      S.shownCls = S.clsCount >= 2 ? e.cls : (S.shownCls || 'none');   // class must persist 2 steps
      if (S.phase === 'idle' && S.clsCount >= 2 && e.engage) {
        S.phase = 'engaged';
        S.latched = { cls: e.cls, sigma: e.sigma, psiE: S.os.psi, uE: S.os.U, tE: S.t };
        S.events.push({ t: S.t, kind: 'engage', cls: e.cls });
      }
      if (S.phase !== 'engaged' && S.phase !== 'clearing') return;
      if (!S.decision && (S.latched.sigma === 0 || e.tcpa <= T_ACT)) act(e);
      const clearNow = e.tcpa < 0 || e.dcpa > K.kRel * K.dreq;
      S.phase = clearNow ? 'clearing' : 'engaged';
      if (e.tcpa < 0 && e.range > K.dreq) S.clearCount++; else S.clearCount = 0;
      S.stillCount = S.ts.U < 0.02 ? S.stillCount + 1 : 0;
      const demoted = S.stillCount >= 4;                      // stopped for 2 s: treated as static
      const resp = S.decision && S.decision.response;
      if (S.clearCount >= K.Nclr || demoted) {
        S.phase = 'released';
        S.events.push({ t: S.t, kind: 'release', why: demoted ? 'static' : 'clear' });
        if (demoted) S.tsStatic = true;
        if (resp !== 'holdastern' || demoted) { S.os.Ucmd = K.Uref; S.mode = 'follow'; }
      } else if (resp === 'holdastern') S.os.Ucmd = Math.max(S.ts.U, 0.2);
    }

    S.step = function (dt) {
      if (S.done) return;
      S.t += dt;
      // target appears and moves (constant velocity; stops short of the wall)
      if (!S.ts && S.t >= sc.tSpawn) {
        S.ts = { p: sc.sol.pTS0.slice(), psi: sc.sol.psiTS, U: sc.sol.Uts, U0: sc.sol.Uts };
        S.tsStop = stopDistance(ws, S.ts.p, S.ts.psi, false);
        S.events.push({ t: S.t, kind: 'spawn' });
      }
      if (S.ts) {
        const remain = S.tsStop - S.tsTravel;
        const Ut = Math.max(0, Math.min(S.ts.U0, remain / 1.5));
        S.ts.U = Ut;
        const h = hvec(S.ts.psi);
        S.ts.p[0] += Ut * dt * h[0]; S.ts.p[1] += Ut * dt * h[1]; S.tsTravel += Ut * dt;
      }
      if (S.t >= S.nextDecision - 1e-9) { decisionStep(); S.nextDecision += K.dt; }
      const { s, eY } = guidance();
      // simplified own-ship kinematics (illustrative time constants)
      const dpsi = wrap180(S.os.psiCmd - S.os.psi);
      const r = Math.max(-K.rMaxDeg, Math.min(K.rMaxDeg, dpsi / TAU_PSI));
      S.os.psi = wrap360(S.os.psi + r * dt); S.os.r = r;
      S.os.U += (S.os.Ucmd - S.os.U) * (dt / TAU_U);
      const h = hvec(S.os.psi);
      S.os.p[0] += S.os.U * h[0] * dt; S.os.p[1] += S.os.U * h[1] * dt;

        const gap = polyGap(hullOS, hullPts(S.ts.p, S.ts.psi));
        S.minGap = Math.min(S.minGap, gap);
        S.minCentre = Math.min(S.minCentre, Math.hypot(S.ts.p[0] - S.os.p[0], S.ts.p[1] - S.os.p[1]));
        if (gap <= 0) { S.done = true; S.outcome = 'contact'; }
      }
      for (const pn of ws.panels) {
        const g = polyGap(hullOS, squarePts(pn.c, pn.w));
        S.minPanelGap = Math.min(S.minPanelGap, g);
        if (g <= 0) { S.done = true; S.outcome = 'contact'; }
      }
      const xs = ws.nav.map(q => q[0]), ys = ws.nav.map(q => q[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      for (const q of hullOS) S.minWallGap = Math.min(S.minWallGap, q[0] - x0, x1 - q[0], q[1] - y0, y1 - q[1]);
      if (S.minWallGap <= 0) { S.done = true; S.outcome = 'contact'; }

      const dg = Math.hypot(ws.goal[0] - S.os.p[0], ws.goal[1] - S.os.p[1]);

      }

<script>
/* ====== MODULE: figs.js ====== */
/* ===================================================================
   FIGS — SVG helpers shared by the static figures. World frame: x east,
   y north (meters). Two screen orientations: 'up' (north up) and
   'right' (north to the right, east down), used for the long basin.
   Colors come from CSS classes so the figures follow the theme.
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, FIG = window.FIG = {};
  const f1 = x => (Math.round(x * 10) / 10).toString();

  FIG.view = function (o) {
    const pad = o.pad == null ? 12 : o.pad, s = o.s, right = o.orient === 'right';
    const X = right ? (x, y) => pad + (y - o.y0) * s : (x, y) => pad + (x - o.x0) * s;
    const Y = right ? (x, y) => pad + (x - o.x0) * s : (x, y) => pad + (o.y1 - y) * s;
    const W = right ? (o.y1 - o.y0) * s + 2 * pad : (o.x1 - o.x0) * s + 2 * pad;
    const H = right ? (o.x1 - o.x0) * s + 2 * pad : (o.y1 - o.y0) * s + 2 * pad;
    return { X, Y, P: p => [X(p[0], p[1]), Y(p[0], p[1])], W, H, s, pad, right, o };
  };
  FIG.svgOpen = (v, label, extra) => '<svg viewBox="0 0 ' + f1(v.W) + ' ' + f1(v.H) + '" role="img" aria-label="' + APP.esc(label) + '"' + (extra || '') + '>';
  FIG.pathD = (v, pts, closed) => pts.map((q, i) => (i ? 'L' : 'M') + f1(v.X(q[0], q[1])) + ' ' + f1(v.Y(q[0], q[1]))).join('') + (closed ? 'Z' : '');
  FIG.poly = (v, pts, cls, extra) => '<path d="' + FIG.pathD(v, pts, true) + '" class="' + cls + '"' + (extra || '') + '/>';
  FIG.line = (v, pts, cls, extra) => '<path d="' + FIG.pathD(v, pts, false) + '" class="' + cls + '" fill="none"' + (extra || '') + '/>';
  FIG.hull = (v, p, psi, cls, extra) => FIG.poly(v, G.hullPts(p, psi), cls || 's-own', extra);
  FIG.circle = (v, c, r, cls, extra) => '<circle cx="' + f1(v.X(c[0], c[1])) + '" cy="' + f1(v.Y(c[0], c[1])) + '" r="' + f1(r * v.s) + '" class="' + cls + '"' + (extra || '') + '/>';
  FIG.dot = (v, c, rpx, cls, extra) => '<circle cx="' + f1(v.X(c[0], c[1])) + '" cy="' + f1(v.Y(c[0], c[1])) + '" r="' + rpx + '" class="' + cls + '"' + (extra || '') + '/>';
  FIG.text = (x, y, str, cls, anchor, extra) => '<text x="' + f1(x) + '" y="' + f1(y) + '" class="' + (cls || 'lbl') + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') + (extra || '') + '>' + str + '</text>';
  FIG.wtext = (v, p, str, cls, anchor, dx, dy, extra) => FIG.text(v.X(p[0], p[1]) + (dx || 0), v.Y(p[0], p[1]) + (dy || 0), str, cls, anchor, extra);

  // arrow in screen coordinates
  FIG.arrowS = function (x0, y0, x1, y1, cls, head, extra) {
    head = head || 8;
    const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);
    if (L < 1) return '';
    const bx = x1 - head * Math.cos(a), by = y1 - head * Math.sin(a);
    const w = head * 0.45;
    const lx = bx + w * Math.sin(a), ly = by - w * Math.cos(a), rx = bx - w * Math.sin(a), ry = by + w * Math.cos(a);
    return '<g class="' + cls + '"' + (extra || '') + '><path d="M' + f1(x0) + ' ' + f1(y0) + 'L' + f1(bx) + ' ' + f1(by) + '" fill="none" stroke-width="1.8"/>' +
      '<path d="M' + f1(x1) + ' ' + f1(y1) + 'L' + f1(lx) + ' ' + f1(ly) + 'L' + f1(rx) + ' ' + f1(ry) + 'Z" stroke="none"/></g>';
  };
  FIG.arrow = (v, p0, p1, cls, head, extra) => FIG.arrowS(v.X(p0[0], p0[1]), v.Y(p0[0], p0[1]), v.X(p1[0], p1[1]), v.Y(p1[0], p1[1]), cls, head, extra);

  // asymmetric ship domain (Eq. 4) around p, heading psi
  FIG.domainPts = function (p, psi, n) {
    const out = []; n = n || 72;
    for (let i = 0; i < n; i++) {
      const a = i * 360 / n, R = G.Rdom(a), h = G.hvec(psi + a);
      out.push([p[0] + R * h[0], p[1] + R * h[1]]);
    }
    return out;
  };
  FIG.circlePts = (c, r, n) => Array.from({ length: n || 72 }, (_, i) => { const t = i / (n || 72) * 2 * Math.PI; return [c[0] + r * Math.cos(t), c[1] + r * Math.sin(t)]; });

  // north arrow, screen position (x, y)
  FIG.north = function (x, y, orient) {
    const r = orient === 'right';
    const ax = r ? x + 22 : x, ay = r ? y : y - 22;
    return '<g aria-hidden="true">' + FIG.arrowS(x, y, ax, ay, 'f-dec s-dec', 7) +
      FIG.text(r ? ax + 6 : ax, r ? ay + 4 : ay - 5, 'N', 'lbl-b', r ? 'start' : 'middle') + '</g>';
  };
  // scale bar of `m` meters starting at screen (x, y)
  FIG.scale = function (v, x, y, m) {
    const w = m * v.s;
    return '<g aria-hidden="true"><path d="M' + f1(x) + ' ' + f1(y - 4) + 'V' + f1(y) + 'H' + f1(x + w) + 'V' + f1(y - 4) + '" fill="none" class="s-ink2" stroke="currentColor" style="stroke: var(--ink-2)" stroke-width="1.2"/>' +
      FIG.text(x + w / 2, y - 7, m + ' m', 'lbl-s', 'middle') + '</g>';
  };

  // basin: land rim, water 10 x 25 m, navigable inset (0.40 m) dashed
  FIG.basin = function (v, o) {
    o = o || {};
    let s = '<rect x="0" y="0" width="' + f1(v.W) + '" height="' + f1(v.H) + '" class="s-land" rx="8"/>';
    s += FIG.poly(v, [[0, 0], [10, 0], [10, 25], [0, 25]], 's-water');
    s += FIG.poly(v, [[0, 0], [10, 0], [10, 25], [0, 25]], '', ' fill="none" style="stroke: var(--land-2)" stroke-width="2"');
    if (o.nav !== false) s += FIG.poly(v, [[0.4, 0.4], [9.6, 0.4], [9.6, 24.6], [0.4, 24.6]], 's-nav');
    return s;
  };
  // channel of width W centered at x = 5 inside the basin length
  FIG.channel = function (v, W, o) {
    o = o || {};
    const x0 = 5 - W / 2, x1 = 5 + W / 2;
    let s = '<rect x="0" y="0" width="' + f1(v.W) + '" height="' + f1(v.H) + '" class="s-land" rx="8"/>';
    s += FIG.poly(v, [[x0, 0], [x1, 0], [x1, 25], [x0, 25]], 's-water');
    s += FIG.line(v, [[x0, 0], [x0, 25]], 's-wall', ' style="stroke: var(--ink-2)"');
    s += FIG.line(v, [[x1, 0], [x1, 25]], 's-wall', ' style="stroke: var(--ink-2)"');
    return s;
  };
  FIG.panels = (v, panels) => panels.map(pn => FIG.poly(v, G.squarePts(pn.c, pn.w), 's-panel')).join('');
  FIG.pathLine = (v, ws) => FIG.line(v, [ws.start, ws.goal], 's-path') +
    FIG.dot(v, ws.start, 3.5, 'f-dec') + FIG.dot(v, ws.goal, 5, 'f-dec', ' fill-opacity=".25" style="stroke: var(--decision)"');

  // run the scripted overview simulation headlessly and record a trajectory
  FIG.record = function (mode, W, cls, every) {
    const S = G.createSim(mode, W, cls); const rec = []; let n = 0, k = Math.round((every || 0.5) / 0.05);
    rec.push({ t: 0, os: { p: S.os.p.slice(), psi: S.os.psi, U: S.os.U }, ts: null });
    while (!S.done && n < 4000) {
      S.step(0.05); n++;
      if (n % k === 0 || S.done) rec.push({ t: S.t, os: { p: S.os.p.slice(), psi: S.os.psi, U: S.os.U }, ts: S.ts ? { p: S.ts.p.slice(), psi: S.ts.psi, U: S.ts.U } : null, phase: S.phase });
    }
    return { S, rec };
  };
})();

  APP.section({
    n: 0, id: 's0', title: 'Start here', short: 'Start here', subsystem: 'neutral',

    build() {

        '<p>That is Paper 3 in two sentences. This explainer unpacks it for a reader with a general engineering degree, comfortable with statics, dynamics, calculus and some programming, but with no background in ship handling, control or machine learning. It covers what the study sets out to do and how it does it. It does not report results: those are pending and will be reported in the paper.</p>' +
        '<figure class="fig wide"><div class="frame">' + heroFigure() + '</div><figcaption><b>' + f1 + '.</b> The problem at model scale. The ' + T('ownship') + ' (1.725 \u00d7 0.50 m) follows a straight ' + T('leg') + ' across the ' + T('basin') + ' past three 1.0 m ' + T('panel', 'panels') + '. Its ' + T('lidar', 'LiDAR') + ' beams (every sixth of 720 drawn) hit the walls, the panels and a ' + T('target') + ' vessel coming from starboard; the planned response is an alteration to starboard. <span class="tag illus">Illustrative</span>The positions are chosen for the picture; the target is drawn with the own ship\u2019s hull, since its size is not given here ' + APP.TBD('target hull size') + '.</figcaption></figure>' +

        APP.H2('ingredients', 'Four ingredients, and where to find them') +
        '<p>Every part of the study belongs to one of four ingredients. Each has its own color, used for it in every figure and diagram from here on; the own ship and the target vessel keep their own colors throughout.</p>' +
        '<div class="lanes wide">' +
        lane('vessel', 'Vessel', 'The boat itself: a model-scale hull with one propeller and a rudder, described by equations of motion with identified parameters. It takes two commands, rudder and propeller speed, twice a second.', [[3, 'The vessel and its dynamics']]) +
        lane('perception', 'Sensing', 'What the boat can know: a 360\u00b0 LiDAR at the bow, software that finds and tracks the other vessel in the scan, and a map that says where the navigable water ends.', [[6, 'LiDAR perception']]) +

        '<p>Every equation in this explainer comes as a block of four parts: the equation itself; one sentence, <b>In words</b>, saying what it computes; a symbol table giving each symbol\u2019s meaning, unit and the value used here; and a worked example with real numbers. The label <b>Paper Eq. n</b> gives the equation\u2019s number in the paper\u2019s formulation.</p>' +

        APP.H2('using', 'Using this explainer') +
        '<ul>' +
        '<li>Items marked <b>\u25b6</b> are interactive: drag, slide or press play. They run entirely in your browser.</li>' +
