            { k: 'relu', tex: '\\operatorname{ReLU}', m: 'rectified linear unit: keeps positive values, sets negative ones to zero', u: '\u2014', v: '\u2014', g: 'Neural networks and memory' },
            { k: 'thetaNN', tex: '\\theta', m: 'all weights and biases of a network (its parameters)', u: '\u2014', v: '\u2014', g: 'Neural networks and memory' }],
          example: '<p>One unit with weights (0.5, \u22121.0) and bias 0.2 receiving (0.8, 0.1): ' + M('0.4 - 0.1 + 0.2 = 0.5') + ', which is positive, so the output is 0.5. Receiving (0.2, 0.9) instead: ' + M('0.1 - 0.9 + 0.2 = -0.6') + ', so the output is 0. A layer of 256 units fed by 256 inputs, as in this study\u2019s heads, has ' + M('256 \\times 256 + 256 = 65{,}792') + ' parameters.</p>' }) +
        '<figure class="fig"><div class="frame">' + smallNetFigure() + '</div><figcaption><b>' + fNet + '.</b> A small network. The real one is described in ' + XS(5, 'protocol') + '.</figcaption></figure>' +

        H2('pg', 'Policy gradient and actor\u2013critic') +
        '<p>One way to learn is to adjust the policy directly: after trying something, make the actions that turned out better than expected more likely, and the worse ones less likely. This is the ' + T('policygrad') + '. Weighting each action by its advantage, rather than by the raw return, tells the learner only what was surprising, which makes learning much less noisy.</p>' +
        EQ({ label: 'Method', title: 'Policy gradient', tex: '\\nabla_{\\theta}\\, \\mathcal{J}(\\theta) = \\mathbb{E}\\!\\left[\\, \\nabla_{\\theta} \\log \\pi_{\\theta}(a_t \\mid s_t)\\; A_t \\,\\right]',
          words: 'to improve the expected return, change the parameters so that every action taken becomes more likely in proportion to how much better than expected it was.',
          symbols: [{ k: 'Jrl', tex: '\\mathcal{J}(\\theta)', m: 'expected return of the policy with parameters \u03b8 (the objective)', u: '\u2014', v: '\u2014', g: 'Policy optimization' },
            { k: 'nabla', tex: '\\nabla_{\\theta}', m: 'gradient: the direction in parameter space that increases a quantity fastest', u: '\u2014', v: '\u2014', g: 'Policy optimization' },
            { k: 'pitheta', tex: '\\pi_{\\theta}(a_t \\mid s_t)', m: 'probability the policy gives to the action taken', u: '\u2014', v: '\u2014', g: 'Policy optimization' },
            { k: 'At', tex: 'A_t', m: 'advantage of the action taken at step t', u: '\u2014', v: '+' + fx(20 - Vex, 1) + ' or \u22123', g: 'Policy optimization' }],
          example: '<p>The turn from the value example, with advantage +' + fx(20 - Vex, 1) + ', has its log-probability pushed up with weight ' + fx(20 - Vex, 1) + '. An action with advantage \u22123 is pushed down with weight 3, and an action that did exactly as expected, advantage 0, is left alone. The size of each step is set by the learning rate, ' + M('3 \\times 10^{-4}') + ' for all four learners here.</p>' }) +
        '<p>The advantage has to come from somewhere, and that is the job of a second network. In an ' + T('actorcritic') + ' learner the actor (the policy) proposes actions and the critic (a value function) judges them, like a performer and a reviewer who both improve: the critic learns to predict the return, and its predictions tell the actor which actions were better or worse than expected. All four learners in this study are actor\u2013critics.</p>' +
        '<figure class="fig"><div class="frame scroll-sm">' + actorCriticFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fAC + '.</b> The actor proposes, the critic judges.</figcaption></figure>' +

        H2('onoff', 'On-policy and off-policy learning') +
        '<p>Learners differ in which experience they learn from. An ' + T('onpolicy') + ' learner only uses data its current policy has just collected: it gathers a fresh batch, learns from it, throws it away and starts again. Learning stays stable, because the data always matches the behavior being improved, but every step of experience is used only briefly. An ' + T('offpolicy') + ' learner stores every step in a ' + T('replay') + ' and keeps drawing random samples from it, including steps from much older versions of itself. That squeezes far more learning out of each simulated second, at the price of learning from behavior the agent no longer has, which needs extra safeguards.</p>' +
        '<figure class="fig wide"><div class="frame scroll-sm">' + onOffFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fOO + '.</b> PPO and recurrent PPO are on-policy; SAC and TQC are off-policy. Numbers are this study\u2019s settings.</figcaption></figure>' +
        '<p>In numbers: each PPO update collects 512 steps from each of the 10 simulators, 5,120 steps in all, and passes over them 10 times in ' + T('minibatch', 'minibatches') + ' of 512, which is 100 gradient steps; then the data is discarded. SAC and TQC keep the most recent ' + M('10^6') + ' steps and take one gradient step on 256 randomly drawn ones for every environment step.</p>' +

        H2('ppo', 'PPO: small, safe steps') +
        '<p>If a policy changes too much on the strength of one batch of experience, it can undo everything it has learned. ' + AB('PPO') + ' ' + C('schulman2017') + ' is built around one idea: measure how much the new policy has changed its mind about each action, and stop rewarding changes beyond a small margin. The learner updates by maximizing a ' + T('surrogate') + ' objective on each batch.</p>' +
        EQ({ label: 'Method', title: 'PPO\u2019s clipped objective', tex: '\\begin{gathered} \\rho_t(\\theta) = \\frac{\\pi_{\\theta}(a_t \\mid s_t)}{\\pi_{\\theta_{\\mathrm{old}}}(a_t \\mid s_t)} \\\\[4pt] L^{\\mathrm{CLIP}}(\\theta) = \\mathbb{E}_t\\!\\left[ \\min\\!\\left( \\rho_t(\\theta)\\,\\hat{A}_t,\\ \\operatorname{clip}\\!\\left(\\rho_t(\\theta),\\ 1-\\epsilon,\\ 1+\\epsilon\\right) \\hat{A}_t \\right) \\right] \\end{gathered}',
          words: 'compare how likely the new policy makes each action with how likely the old one made it; reward moving toward good actions and away from bad ones, but only up to a change of \u03b5, and always take the more cautious of the two versions.',
          symbols: [{ k: 'ratio', tex: '\\rho_t(\\theta)', m: 'probability ratio: new policy over the policy that collected the data', u: '\u2014', v: '1.5, 0.6', g: 'Policy optimization' },
            { k: 'thetaold', tex: '\\theta_{\\mathrm{old}}', m: 'parameters of the policy that collected the batch', u: '\u2014', v: '\u2014', g: 'Policy optimization' },
            { k: 'Ahat', tex: '\\hat{A}_t', m: 'estimated advantage (from GAE, below)', u: '\u2014', v: '\u00b12', g: 'Policy optimization' },
            { k: 'epsClip', tex: '\\epsilon', m: 'clip range', u: '\u2014', v: '0.2', g: 'Policy optimization' },
            { k: 'Lclip', tex: 'L^{\\mathrm{CLIP}}(\\theta)', m: 'clipped surrogate objective, maximized', u: '\u2014', v: 'see example', g: 'Policy optimization' }],
          example: '<p>With ' + M('\\epsilon = 0.2') + ': an action with ' + M('\\hat{A}_t = +2') + ' whose probability has already risen by half (' + M('\\rho = 1.5') + ') scores ' + M('\\min(1.5 \\times 2,\\ 1.2 \\times 2) = 2.4') + ', the same as at ' + M('\\rho = 1.2') + ', so there is no reward for pushing it further. An action with ' + M('\\hat{A}_t = -2') + ' whose probability has fallen to ' + M('\\rho = 0.6') + ' scores ' + M('\\min(-1.2,\\ -1.6) = -1.6') + ', flat below ' + M('\\rho = 0.8') + '.</p>' }) +
        '<p>PPO estimates the advantage with ' + AB('GAE') + ' ' + C('schulman2016') + '. It starts from the one-step prediction error of the critic, then blends in the errors of later steps with weights that fade by ' + M('\\gamma\\lambda') + ' per step, trading a little bias for much less noise.</p>' +
        EQ({ label: 'Method', title: 'Generalized advantage estimation', tex: '\\begin{gathered} \\delta_t^{V} = r_t + \\gamma\\, V(s_{t+1}) - V(s_t) \\\\[4pt] \\hat{A}_t = \\sum_{l=0}^{\\infty} (\\gamma\\lambda)^{l}\\, \\delta_{t+l}^{V} \\end{gathered}',
          words: 'an action\u2019s advantage is how much better things went than the critic predicted, one step at a time, with later surprises counting less and less.',
          symbols: [{ k: 'tdV', tex: '\\delta_t^{V}', m: 'one-step prediction error of the critic (not the rudder angle)', u: '\u2014', v: '1.0, 0.5, \u22120.2', g: 'Policy optimization' },
            { k: 'lamGAE', tex: '\\lambda', m: 'GAE weighting between one-step and long-run estimates', u: '\u2014', v: '0.95', g: 'Policy optimization' },
            { k: 'Vcrit', tex: 'V(s)', m: 'the critic\u2019s value estimate', u: '\u2014', v: '\u2014', g: 'Policy optimization' }],
          example: '<p>Here ' + M('\\gamma\\lambda = 0.951 \\times 0.95 = ' + fx(gl, 3)) + '. If the critic\u2019s next three errors are 1.0, 0.5 and \u22120.2 (and later ones are zero):</p>' + MD('\\hat{A}_t = 1.0 + ' + fx(gl, 3) + ' \\times 0.5 + ' + fx(gl, 3) + '^{2} \\times (-0.2) = ' + fx(gae, 3)) + '<p>With ' + M('\\lambda = 0') + ' it would be the first error alone, 1.0; with ' + M('\\lambda = 1') + ' it would be the whole discounted return minus the critic\u2019s prediction.</p>' }) +
        '<p>This study\u2019s PPO settings are the defaults: learning rate ' + M('3 \\times 10^{-4}') + ', 512 steps from each of 10 simulators per update, minibatches of 512, 10 ' + T('epoch', 'epochs') + ', ' + M('\\lambda = 0.95') + ', ' + M('\\epsilon = 0.2') + ', and a target ' + AB('KL') + ' divergence of 0.03, which stops an update early if the policy has already moved that far from the one that collected the data.</p>' +
        '<h3>\u25b6 Clip widget</h3>' + APP.widgetClipHTML() +

        H2('rppo', 'Recurrent PPO: adding memory') +
        '<p>A single photograph of a tennis match does not tell you where the ball is going; a second of video does. When one observation does not contain everything needed to act well, the problem has ' + T('partialobs') + '. Here, for example, a target crossing behind a panel drops out of the tracker after three missed scans, 1.5 s (' + XS(6) + '), and the observation then shows no target at all; and whether an encounter is developing well is easier to judge over several frames than from one.</p>' +
        '<figure class="fig wide"><div class="frame scroll-sm">' + occlusionFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fOcc + '.</b> Why memory can help: in the last frame one observation alone shows no target, but a policy with memory can still know that one was there and where it was heading. <span class="tag illus">Illustrative</span></figcaption></figure>' +
        '<p>Recurrent PPO is PPO with an ' + AB('LSTM') + ' memory ' + C('hochreiter1997') + ': 256 units, one for the actor and one for the critic. At every step the memory reads the new input and its own previous state, and gates decide what to keep, what to write and what to show.</p>' +
        EQ({ label: 'Method', title: 'LSTM cell', tex: '\\begin{aligned} \\mathbf{f}_t &= \\sigma(\\mathbf{W}_f[\\mathbf{h}_{t-1}, \\mathbf{x}_t] + \\mathbf{b}_f) & \\mathbf{i}_t &= \\sigma(\\mathbf{W}_i[\\mathbf{h}_{t-1}, \\mathbf{x}_t] + \\mathbf{b}_i) \\\\[2pt] \\mathbf{o}_t &= \\sigma(\\mathbf{W}_o[\\mathbf{h}_{t-1}, \\mathbf{x}_t] + \\mathbf{b}_o) & \\tilde{\\mathbf{c}}_t &= \\tanh(\\mathbf{W}_c[\\mathbf{h}_{t-1}, \\mathbf{x}_t] + \\mathbf{b}_c) \\\\[2pt] \\mathbf{c}_t &= \\mathbf{f}_t \\odot \\mathbf{c}_{t-1} + \\mathbf{i}_t \\odot \\tilde{\\mathbf{c}}_t & \\mathbf{h}_t &= \\mathbf{o}_t \\odot \\tanh(\\mathbf{c}_t) \\end{aligned}',
          words: 'the forget gate decides how much of the old memory to keep, the input gate how much new content to write, and the output gate how much of the memory to pass on.',
          symbols: [{ k: 'lstmX', tex: '\\mathbf{x}_t', m: 'input to the memory at step t (the encoded observation)', u: '\u2014', v: '\u2014', g: 'Neural networks and memory' },
            { k: 'lstmH', tex: '\\mathbf{h}_t', m: 'hidden state: the memory\u2019s output, 256 values', u: '\u2014', v: '0.553 (one unit)', g: 'Neural networks and memory' },
            { k: 'lstmC', tex: '\\mathbf{c}_t', m: 'cell state: the long-term memory, 256 values', u: '\u2014', v: '0.85', g: 'Neural networks and memory' },
            { k: 'lstmG', tex: '\\mathbf{f}_t,\\ \\mathbf{i}_t,\\ \\mathbf{o}_t', m: 'forget, input and output gates, each between 0 and 1 (bold: not the observation)', u: '\u2014', v: '0.9, 0.1, 0.8', g: 'Neural networks and memory' },
            { k: 'lstmCand', tex: '\\tilde{\\mathbf{c}}_t', m: 'candidate content to write', u: '\u2014', v: '\u22120.5', g: 'Neural networks and memory' },
            { k: 'sigmoid', tex: '\\sigma(\\cdot)', m: 'logistic sigmoid: squashes any number into (0, 1)', u: '\u2014', v: '\u2014', g: 'Neural networks and memory' },
            { k: 'odot', tex: '\\odot', m: 'element-by-element product', u: '\u2014', v: '\u2014', g: 'Neural networks and memory' }],
          example: '<p>Follow one of the 256 units with hypothetical numbers. Its memory holds 1.0; the forget gate is 0.9, the input gate 0.1 and the candidate \u22120.5, so ' + M('c_t = 0.9 \\times 1.0 + 0.1 \\times (-0.5) = 0.85') + '. With the output gate at 0.8, ' + M('h_t = 0.8 \\times \\tanh(0.85) = ' + fx(h553, 3)) + '. A forget gate near 1 keeps a memory alive for many steps, which is what lets it outlast a 1.5 s gap in the tracker.</p>',
          note: 'The forget gate was added to the original LSTM shortly after it was introduced; the form above is the one in general use.' }) +
        '<figure class="fig wide"><div class="frame scroll-sm">' + lstmFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fLstm + '.</b> Inside one LSTM cell. The cell state runs along the top; three gates control it.</figcaption></figure>' +

        H2('sac', 'SAC: rewarded for staying random') +
        '<p>A good driver knows several lines through a corner, not just one; if something blocks the usual line, another is ready. ' + AB('SAC') + ' ' + C('haarnoja2018') + ' builds that into its objective: it is paid not only for reward but also for acting as randomly as it can while still doing well. The randomness is measured by the ' + T('entropy') + ' of the policy, and its price by a ' + T('temperature') + ' ' + M('\\alpha') + '.</p>' +
        EQ({ label: 'Method', title: 'Maximum-entropy objective', tex: '\\mathcal{J}(\\pi) = \\sum_{t} \\mathbb{E}\\!\\left[\\, \\gamma^{t} \\left( r_t + \\alpha\\, \\mathcal{H}\\big(\\pi(\\cdot \\mid s_t)\\big) \\right) \\right], \\qquad \\mathcal{H} = -\\mathbb{E}_{a \\sim \\pi}\\!\\left[\\log \\pi(a \\mid s)\\right]',
          words: 'collect as much discounted reward as possible, plus a bonus of \u03b1 times the randomness of the policy at every step.',
          symbols: [{ k: 'alphaT', tex: '\\alpha', m: 'temperature: the weight on randomness in SAC and TQC (not the relative bearing)', u: '\u2014', v: 'tuned automatically', g: 'Soft actor\u2013critic and TQC' },
            { k: 'Hent', tex: '\\mathcal{H}', m: 'entropy of the policy: how spread out its actions are', u: 'nats', v: fx(ent(0.5), 2) + ' or ' + fx(ent(0.1), 2), g: 'Soft actor\u2013critic and TQC' }],
          example: '<p>For a plain bell curve the entropy is ' + M('\\tfrac{1}{2}\\ln(2\\pi e \\sigma^{2})') + ' nats. A rudder policy with spread 0.5 has entropy ' + fx(ent(0.5), 3) + '; one with spread 0.1 has ' + fx(ent(0.1), 3) + '. With a hypothetical ' + M('\\alpha = 0.05') + ' the wider policy earns ' + M('0.05 \\times (' + fx(ent(0.5), 3) + ' + ' + fx(-ent(0.1), 3) + ') = ' + fx(0.05 * (ent(0.5) - ent(0.1)), 3)) + ' more per step: small next to the terminal rewards, enough to keep options open.</p>' }) +
        '<p>SAC\u2019s critics learn soft action values: the discounted value of the next state includes the entropy bonus. Two tricks keep them honest. It trains two critics and uses the smaller of their estimates in the target, because a learner that picks the best-looking action systematically favors estimates that happen to be too high; this is the ' + T('overestimation') + '. And the targets come from ' + T('targetnet', 'target networks') + ', slowly moving copies of the critics, so that the targets do not chase the very estimates they are training.</p>' +
        EQ({ label: 'Method', title: 'Soft target with twin critics', tex: '\\begin{gathered} y_Q = r_t + \\gamma \\left( \\min_{j=1,2} Q_{\\mathrm{targ},j}(s_{t+1},\\ a\') - \\alpha \\log \\pi(a\' \\mid s_{t+1}) \\right), \\qquad a\' \\sim \\pi(\\cdot \\mid s_{t+1}) \\\\[4pt] \\theta_{\\mathrm{targ}} \\leftarrow \\tau\\, \\theta + (1-\\tau)\\, \\theta_{\\mathrm{targ}} \\end{gathered}',
          words: 'the critics learn toward the reward plus the discounted value of the next state, taken from the more pessimistic of two slow target critics and topped up with the entropy bonus; each target critic moves only 0.5 % of the way toward its critic per update.',
          symbols: [{ k: 'yQ', tex: 'y_Q', m: 'learning target for the critics', u: '\u2014', v: fx(ysoft, 2), g: 'Soft actor\u2013critic and TQC' },
            { k: 'Qtarg', tex: 'Q_{\\mathrm{targ},j}', m: 'target critic j, a slowly updated copy of critic j', u: '\u2014', v: '50, 46', g: 'Soft actor\u2013critic and TQC' },
            { k: 'aprime', tex: 'a\'', m: 'next action, sampled from the current policy', u: '\u2014', v: 'log-probability \u22121.0', g: 'Soft actor\u2013critic and TQC' },
            { k: 'tauPolyak', tex: '\\tau', m: 'target-network update rate', u: '\u2014', v: '0.005', g: 'Soft actor\u2013critic and TQC' }],
          example: '<p>With hypothetical numbers: step reward 0, target critics at 50 and 46, ' + M('\\alpha = 0.05') + ' and a next-action log-probability of \u22121.0:</p>' + MD('y_Q = 0 + 0.951 \\times \\left(46 - 0.05 \\times (-1.0)\\right) = ' + fx(ysoft, 2)) + '<p>The smaller critic, 46, is used rather than 50. With ' + M('\\tau = 0.005') + ' a target network closes half its gap to the critic in about ' + fx(half, 0) + ' updates.</p>' }) +
        '<p>Finally, the right temperature changes during learning, so SAC tunes it automatically ' + C('haarnoja2018b') + ': whenever the policy is less random than a target entropy, ' + M('\\alpha') + ' rises; whenever it is more random, ' + M('\\alpha') + ' falls.</p>' +
        EQ({ label: 'Method', title: 'Automatic temperature', tex: '\\mathcal{L}(\\alpha) = \\mathbb{E}_{a \\sim \\pi}\\!\\left[ -\\alpha \\left( \\log \\pi(a \\mid s) + \\bar{\\mathcal{H}} \\right) \\right], \\qquad \\bar{\\mathcal{H}} = -\\dim(\\mathcal{A}) = -2',
          words: 'adjust \u03b1 by gradient descent on this loss, which lowers \u03b1 when the policy is more random than the target and raises it when it is less random.',
          symbols: [{ k: 'Hbar', tex: '\\bar{\\mathcal{H}}', m: 'target entropy: minus the number of action dimensions', u: 'nats', v: '\u22122 ' + VERIFY('library default'), g: 'Soft actor\u2013critic and TQC' }],
          example: '<p>If the policy\u2019s log-probabilities average \u22121.0, its entropy is about 1.0, above the target of \u22122. The slope of the loss is ' + M('-(\\log \\pi + \\bar{\\mathcal{H}}) = -(-1.0 - 2) = 3.0') + ', positive, so descent lowers ' + M('\\alpha') + ' and the bonus for randomness shrinks.</p>' }) +
        '<figure class="fig wide"><div class="frame scroll-sm">' + sacFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fSac + '.</b> One SAC update. TQC, next, changes only what the critics output and how the target is formed.</figcaption></figure>' +
        '<p>This study\u2019s SAC settings are the defaults: learning rate ' + M('3 \\times 10^{-4}') + ', a replay buffer of ' + M('10^6') + ' steps, batches of 256, ' + M('\\tau = 0.005') + ', ' + M('10^4') + ' random warm-up steps before learning starts, automatic temperature, and one gradient step per environment step.</p>' +

        H2('tqc', 'TQC: a distribution of returns, trimmed at the top') +
        '<p>Asked how long a commute takes, \u201c25 minutes\u201d is less useful than \u201cusually 20 to 30, but 60 when there is an accident\u201d. ' + AB('TQC') + ' ' + C('kuznetsov2020') + ' keeps SAC\u2019s design but lets each critic describe the whole distribution of possible returns, as 25 ' + T('quantile', 'quantiles') + ' or atoms, instead of one average. To form a target it pools the atoms of both critics, sorts them, and drops the most optimistic few before averaging. Trimming the top of the pooled distribution is a finer-grained way to curb over-estimation than taking the smaller of two averages.</p>' +
        EQ({ label: 'Method', title: 'Truncated pooled quantiles', tex: '\\begin{gathered} z_{(1)} \\le z_{(2)} \\le \\dots \\le z_{(NM)} \\quad \\text{(atoms of all } N \\text{ critics, sorted)} \\\\[4pt] y_i = r_t + \\gamma \\left( z_{(i)}(s_{t+1},\\ a\') - \\alpha \\log \\pi(a\' \\mid s_{t+1}) \\right), \\qquad i = 1, \\dots, N(M-d) \\\\[4pt] \\hat{Q} = \\frac{1}{N(M-d)} \\sum_{i=1}^{N(M-d)} z_{(i)} \\end{gathered}',
          words: 'pool and sort the atoms of both critics, keep all but the top d per critic, and use the kept atoms as learning targets; their mean is the value estimate.',
          symbols: [{ k: 'zatom', tex: 'z_{(i)}', m: 'i-th smallest of the pooled return atoms', u: '\u2014', v: 'see widget', g: 'Soft actor\u2013critic and TQC' },
            { k: 'Mq', tex: 'M', m: 'atoms (quantiles) per critic', u: '\u2014', v: '25', g: 'Soft actor\u2013critic and TQC' },
            { k: 'Ncrit', tex: 'N', m: 'number of critics', u: '\u2014', v: '2', g: 'Soft actor\u2013critic and TQC' },
            { k: 'dq', tex: 'd', m: 'top atoms dropped per critic', u: '\u2014', v: '2', g: 'Soft actor\u2013critic and TQC' },
            { k: 'yi', tex: 'y_i', m: 'target for the i-th kept atom', u: '\u2014', v: '\u2014', g: 'Soft actor\u2013critic and TQC' },
            { k: 'Qhat', tex: '\\hat{Q}', m: 'value estimate: mean of the kept atoms', u: '\u2014', v: fx(tq.kept, 1) + ' (widget)', g: 'Soft actor\u2013critic and TQC' }],
          example: '<p>With ' + M('N = 2') + ' critics of ' + M('M = 25') + ' atoms and ' + M('d = 2') + ', the pool has 50 atoms and the targets keep ' + M('2 \\times (25 - 2) = 46') + '. In the widget\u2019s illustrative distribution the four dropped atoms are ' + tq.top4.map(v => fx(v, 1)).join(', ') + '; the mean of all 50 atoms is ' + fx(tq.all, 1) + ', and of the 46 kept ones ' + fx(tq.kept, 1) + '.</p>' }) +
        '<p>This study\u2019s TQC uses the SAC settings above with 2 critics of 25 quantiles each, dropping the top 2 quantiles per critic.</p>' +
        '<h3>\u25b6 Quantile widget</h3>' + APP.widgetTqcHTML() +

        H2('compare', 'The four learners side by side') +
        '<div class="tbl-wrap wide"><table class="cmp"><thead><tr><th></th><th>PPO</th><th>Recurrent PPO</th><th>SAC</th><th>TQC</th></tr></thead><tbody>' +
        '<tr><td><b>Data</b></td><td>on-policy</td><td>on-policy</td><td>off-policy</td><td>off-policy</td></tr>' +
        '<tr><td><b>Memory</b></td><td>none: one observation at a time</td><td>256-unit LSTM for actor and for critic</td><td>none</td><td>none</td></tr>' +
        '<tr><td><b>Exploration</b></td><td>samples its bell-curve policy</td><td>as PPO</td><td>entropy bonus with automatic temperature</td><td>as SAC</td></tr>' +
        '<tr><td><b>Over-estimation control</b></td><td>its critic learns state values from the returns actually collected, with no best-action pick in the target; clipping limits each update</td><td>as PPO</td><td>minimum of two critics; slow target networks</td><td>drops the top 2 of 25 atoms per critic; slow target networks</td></tr>' +
        '<tr><td><b>Sample efficiency (by design)</b></td><td>lower: each batch used for 10 passes, then discarded</td><td>as PPO</td><td>higher: every step can be reused from a buffer of ' + M('10^6') + '</td><td>as SAC</td></tr>' +
        '<tr><td><b>Learning cost per environment step</b></td><td>100 gradient steps (batch 512) per 5,120 steps: about 0.02</td><td>as PPO, but each pass runs the memory through sequences</td><td>1 gradient step (batch 256) on the actor and two critics</td><td>as SAC, with 25 outputs per critic and a sort of 50 atoms</td></tr>' +
        '</tbody></table></div>' +
        '<p>Which of these trade-offs matters most for this problem is exactly what the study measures; the comparison is reported in the paper.</p>' +

        H2('protocol', 'How this study trains them') +
        '<p>The comparison is only fair if everything except the algorithm is the same. So all four learners use the same network, the same budget and the same settings policy, from the same libraries: Stable-Baselines3 2.3.2 and sb3-contrib 2.3.0 ' + C('raffin2021') + '.</p>' +
        '<ul><li><b>Same network.</b> Two encoders and two heads, shown below.</li>' +
        '<li><b>Same budget.</b> ' + M('3 \\times 10^{6}') + ' environment steps through the seven-stage curriculum (' + XS(8, 'curriculum') + '), with 10 simulators running in parallel. The stages switch at fixed fractions of a base budget of ' + M('2.5 \\times 10^{6}') + ' steps, and training then continues in stage 7 to the end. At 0.5 s per step that is ' + M('3 \\times 10^{6} \\times 0.5\\ \\mathrm{s} = 1.5 \\times 10^{6}\\ \\mathrm{s}') + ', about ' + fx(days, 1) + ' days of simulated boating per run.</li>' +
        '<li><b>Same settings policy.</b> Each learner uses the default ' + T('hyperparameter', 'hyperparameters') + ' of its original paper, with no tuning for this problem, so that differences come from the algorithms rather than from tuning effort. All share ' + M('\\gamma = 0.951') + ' and reward normalization only: rewards are divided by a running estimate of their scale and clipped at \u00b110, while observations are already scaled by construction.</li>' +
        '<li><b>Three seeds.</b> Each learner is trained with three ' + T('seed', 'seeds') + ', 12 runs in all, to show how much the outcome varies by chance.</li>' +
        '<li><b>Checkpoint selection.</b> Every ' + M('2 \\times 10^{5}') + ' steps the policy is run on the ' + T('valset') + ' with the safety layer off: 270 fixed episodes, 120 of them decoupled, with the panels kept clear of the encounter, and 150 coupled, with three panels and the encounter to resolve together (' + XS(8, 'datasets') + '). Each seed is represented by its best ' + T('checkpoint') + ' by the selection score, goal rate \u2212 2 \u00d7 collision rate over all 270 episodes, the same form as the comparators\u2019 tuning score (' + XS(4, 'fair') + ').</li>' +
        '<li><b>One look at the test.</b> ' + T('testset', 'Test set v4') + ', 1,000 held-out episodes (664 decoupled, 336 coupled), is run once per selected policy. Picking the best of many checkpoints on a set flatters that set\u2019s score, because part of what gets picked is luck; a set that played no part in any choice gives an honest measure. The training, validation and test sets draw their seeds from disjoint ranges, so no episode is shared.</li></ul>' +
        '<figure class="fig wide"><div class="frame scroll-sm">' + protocolFigure() + '</div><span class="scroll-hint ui small">Swipe sideways to see the whole diagram.</span><figcaption><b>' + fProt + '.</b> One training run and how its policy is chosen and tested.</figcaption></figure>' +
        '<p>The network has two encoders. A scene encoder turns the LiDAR, boundary, ego-motion and path branches, together with the previous action, into 128 features. A target-slot encoder turns the target branch and the encounter context, 28 values, into 32 features through layers of 64, 64 and 32; its input is gated by the presence bit, so that with no target held it contributes nothing. The 160 features feed an actor head and a critic head of two 256-unit ReLU layers each.</p>' +
        '<h3>\u25b6 Network diagram</h3>' + APP.widgetNetHTML() +
        '<p>One more fact belongs here for transparency: the problem formulation was developed with PPO as the working learner. The formulation itself refers to no algorithm, and all four learners are trained on it unchanged. How they compare is reported in the paper.</p>';
    },

      APP.mountClip(el.querySelector('#clip-widget'));
      APP.mountTqc(el.querySelector('#tqc-widget'));
      APP.mountNet(el.querySelector('#net-widget'));
    },
    takeaways: ['Reinforcement learning improves a policy from reward by trial: the return discounts future rewards by 0.951 per 0.5 s step, a horizon of about 10 s; value functions estimate the expected return; the Bellman equation ties each value to the next.',
      'PPO and recurrent PPO are on-policy actor\u2013critics that limit each update with a clipped probability ratio, recurrent PPO adding an LSTM memory; SAC and TQC are off-policy, reuse a replay buffer, reward randomness, and curb over-estimation with twin critics or by dropping the top quantiles.',
      'All four share one network, 3 million steps, their papers\u2019 default settings and three seeds; each seed\u2019s checkpoint is chosen on the validation set, and test set v4 is run once per policy.'],
  });
})();

<script>
/* ====== MODULE: percep.js ====== */
/* ===================================================================
   PERCEPTION — the LiDAR pipeline of facts §4, in browser-sized form.
   Compass convention throughout: bearings clockwise from north,
   beam bearings clockwise from the bow; direction = (sin, cos).
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, K = G.K, DEG = Math.PI / 180;
  const NB = 720, DTH = 0.5;
  const P = window.PERC = {
    NB, DTH, DTHR: DTH * DEG,
    EPS: 0.35, MINPTS: 4,                                   // breakpoint distance [m], minimum cluster size
    GATE: Math.max(2.5 * 0.558 * 0.5, 0.30),                // association gate [m] (= 0.70)
    SIGP: 0.03, SIGPSI: 0.2,                                // pose noise: position [m], heading [deg]
    TAUP: Math.max(0.25, 5 * Math.SQRT2 * 0.03),            // pass-through margin [m] (= 0.25)
    DNB: 0.30,                                              // "no return within" radius [m]
    WS: K.B + 2 * 0.15,                                     // safe width [m] (= 0.80)
    SIGA: 0.10, SIGZ: 0.05, V0VAR: 0.5,                     // Kalman filter settings
  };
  P.rng = function (a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  P.gauss = rnd => { const u = Math.max(1e-12, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  P.sensor = pose => { const h = G.hvec(pose.psi); return [pose.x + K.bow * h[0], pose.y + K.bow * h[1]]; };
  // A noisy estimate of a pose (sigma scaled by k).
  P.noisyPose = (pose, rnd, k) => ({ x: pose.x + (k || 1) * P.SIGP * P.gauss(rnd), y: pose.y + (k || 1) * P.SIGP * P.gauss(rnd), psi: pose.psi + (k || 1) * P.SIGPSI * P.gauss(rnd) });

  // One scan from the TRUE pose. st: ok | far (no return within 16 m) | dead (closer than 1 m) | drop
  P.scan = function (pose, segs, o) {
    o = o || {};
    const s = P.sensor(pose), out = new Array(NB);
    const j0 = o.from == null ? 0 : o.from, j1 = o.to == null ? NB - 1 : o.to;
    for (let j = 0; j < NB; j++) {
      const th = j * DTH;
      if (j < j0 || j > j1) { out[j] = { j, th: th > 180 ? th - 360 : th, rho: Infinity, tag: null, st: 'far' }; continue; }
      const d = G.hvec(pose.psi + th), hit = G.rayCast(s, d, segs);
      let rho = hit.t, st = 'ok';
      if (!(rho <= K.Rmax)) { rho = Infinity; st = 'far'; } else if (rho < K.Rmin) st = 'dead';
      if (st === 'ok' && o.drop && o.rnd && o.rnd() < o.drop) st = 'drop';
      out[j] = { j, th: th > 180 ? th - 360 : th, rho, tag: hit.tag, st };
    }
    return out;
  };
  // Lift a return into world coordinates with an (estimated) pose — facts §4 step 3.
  P.world = (b, est) => { const s = P.sensor(est), d = G.hvec(est.psi + b.th); return [s[0] + b.rho * d[0], s[1] + b.rho * d[1]]; };
  P.inNav = (q, nav) => {           // axis-aligned navigable rectangle
    const xs = nav.map(v => v[0]), ys = nav.map(v => v[1]);
    return q[0] >= Math.min(...xs) && q[0] <= Math.max(...xs) && q[1] >= Math.min(...ys) && q[1] <= Math.max(...ys);
  };

  // Adaptive breakpoint segmentation — facts §4 step 2.
  // Returns {kept: [[j...]], small: [[j...]]}; points compared in the sensor frame.
  P.segment = function (beams, eps, useRange, minPts) {
    const ok = b => b && b.st === 'ok';
    const pt = b => [b.rho * Math.sin(b.th * DEG), b.rho * Math.cos(b.th * DEG)];
    const thr = b => eps + (useRange === false ? 0 : b.rho * P.DTHR);
    const joins = (a, b) => ok(a) && ok(b) && Math.hypot(pt(a)[0] - pt(b)[0], pt(a)[1] - pt(b)[1]) <= thr(b);
    const cl = []; let cur = null;
    for (let j = 0; j < NB; j++) {
      const b = beams[j];
      if (!ok(b)) { cur = null; continue; }
      if (cur && joins(beams[j - 1], b)) cur.push(j); else { cur = [j]; cl.push(cur); }
    }
    if (cl.length > 1 && cl[0][0] === 0 && cl[cl.length - 1][cl[cl.length - 1].length - 1] === NB - 1 && joins(beams[NB - 1], beams[0])) {
      const last = cl.pop(); cl[0] = last.concat(cl[0]);          // merge across the 0/360 seam
    }
    const m = minPts || P.MINPTS;
    return { kept: cl.filter(c => c.length >= m), small: cl.filter(c => c.length < m) };
  };

  // Widest opening at range level d (arc widths at d; a blocking beam adds half an arc and resets).
  P.widestOpening = function (r, d) {
    const a = P.DTHR * d; let wid = a / 2, best = 0;
    for (const x of r) {
      if (x > d) wid += a;
      else { wid += a / 2; best = Math.max(best, wid); wid = a / 2; }
    }
    return Math.max(best, wid);
  };
  // Feasibility pooling (Meyer et al., 2020a, Algorithm 1): the first level with no opening wider than w.
  P.poolFeas = function (ranges, w) {
    const r = ranges.map(x => Math.min(x, K.Rmax)), lv = Array.from(new Set(r)).sort((a, b) => a - b);
    let prev = null;
    for (const d of lv) {
      const o = P.widestOpening(r, d);
      if (o <= (w || P.WS)) return { rho: d, level: d, opening: o, prev };
      prev = { level: d, opening: o };
    }
    return { rho: K.Rmax, level: K.Rmax, opening: 0, prev };
  };
  P.pool = function (ranges, w) {
    const r = ranges.map(x => Math.min(x, K.Rmax));
    const f = P.poolFeas(r, w);
    return { max: Math.max(...r), min: Math.min(...r), feas: f.rho, detail: f };
  };
  P.closeness = rho => Math.min(1, Math.max(0, 1 - rho / K.Rmax));

  // Constant-velocity Kalman filter, run per axis (x with vx, y with vy): facts §4 step 5.
  P.kf1 = {
    init: (z, sz, v0var) => ({ p: z, v: 0, P11: sz * sz, P12: 0, P22: v0var == null ? P.V0VAR : v0var }),
    predict(f, dt, sa) {
      const q11 = sa * sa * Math.pow(dt, 4) / 4, q12 = sa * sa * Math.pow(dt, 3) / 2, q22 = sa * sa * dt * dt;
      return { p: f.p + dt * f.v, v: f.v, P11: f.P11 + 2 * dt * f.P12 + dt * dt * f.P22 + q11, P12: f.P12 + dt * f.P22 + q12, P22: f.P22 + q22 };
    },
    update(f, z, sz) {
      const S = f.P11 + sz * sz, K1 = f.P11 / S, K2 = f.P12 / S, inn = z - f.p;
      return { p: f.p + K1 * inn, v: f.v + K2 * inn, P11: (1 - K1) * f.P11, P12: (1 - K1) * f.P12, P22: f.P22 - K2 * f.P12, K1, K2, inn };
    },
  };

  // Free-space motion evidence — facts §4 step 6.
  // A point q "is passed through" by a scan if the beam toward it, and every beam within TAUP laterally,
  // reached at least TAUP beyond it (no return within 16 m counts as passing if 16 m is far enough).
  P.passesThrough = function (q, scan, est) {
    const s = P.sensor(est), dx = q[0] - s[0], dy = q[1] - s[1], r = Math.hypot(dx, dy);
    if (r < K.Rmin || r + P.TAUP > K.Rmax) return false;
    const th = G.wrap360(G.bearing(dx, dy) - est.psi), j = Math.round(th / DTH) % NB;
    const m = Math.ceil(Math.atan2(P.TAUP, r) / P.DTHR);
    for (let k = -m; k <= m; k++) {
      const b = scan[(j + k + NB) % NB];
      if (b.st === 'far') continue;
      if (b.st !== 'ok' || !(b.rho >= r + P.TAUP)) return false;
    }
    return true;
  };
  P.nearAny = (q, pts, rad) => pts.some(p => Math.hypot(p[0] - q[0], p[1] - q[1]) <= rad);
  // oldS/curS: {scan, est, pts: [{q, tag}]}. Returns per-point flags and per-tag counts.
  P.freeSpace = function (oldS, curS, tags) {
    const oldQ = oldS.pts.map(p => p.q), curQ = curS.pts.map(p => p.q);
    const app = curS.pts.map(p => P.passesThrough(p.q, oldS.scan, oldS.est) && !P.nearAny(p.q, oldQ, P.DNB));
    const vac = oldS.pts.map(p => P.passesThrough(p.q, curS.scan, curS.est) && !P.nearAny(p.q, curQ, P.DNB));
    const res = {};
    (tags || []).forEach(t => {
      const nA = curS.pts.filter((p, i) => p.tag === t && app[i]).length, nV = oldS.pts.filter((p, i) => p.tag === t && vac[i]).length;
      const nC = curS.pts.filter(p => p.tag === t).length + oldS.pts.filter(p => p.tag === t).length;
      res[t] = { nA, nV, nC, moving: nA + nV >= 3 && nA + nV >= 0.10 * nC };
    });
    return { app, vac, res };
  };
})();

</script>
<script>
/* ====== MODULE: w6a.js ====== */
/* ===================================================================
   SECTION 6 WIDGETS (1/2) — scan viewer, segmentation, association
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, K = G.K, P = window.PERC;
  const f1 = x => (Math.round(x * 10) / 10).toString();
  const fx = (x, n) => (Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n).replace('-', '\u2212');
  const ro = (k, label) => '<div class="ro"><span>' + label + '</span><span data-ro="' + k + '">\u2014</span></div>';
  const txt = (x, y, s, cls, anchor, extra) => '<text x="' + f1(x) + '" y="' + f1(y) + '" class="' + (cls || 'lbl-s') + '" text-anchor="' + (anchor || 'start') + '"' + (extra || '') + '>' + s + '</text>';
  const head = (title, sub) => '<div class="w-head"><div class="w-title"><span class="play-mark" aria-hidden="true">\u25b6</span>' + title + '</div><div class="w-sub">' + sub + '</div></div>';
  function on(offs, el, ev, fn) { el.addEventListener(ev, fn); offs.push(() => el.removeEventListener(ev, fn)); }
  APP.W6 = { f1, fx, ro, txt, head, on };

  /* ================= 1. scan viewer ================= */
  const WS = G.makeWorkspace('basin');
  const T_LOOP = 22, U_OS = 0.558, T0 = [8.7, 15.5], U_TS = 0.36;
  const osPose = t => { const s = 1.5 + U_OS * t, h = G.hvec(WS.psiP); return { x: WS.start[0] + s * h[0], y: WS.start[1] + s * h[1], psi: WS.psiP }; };
  const tsPos = t => [T0[0] - U_TS * t, T0[1]];
  APP.widgetScanHTML = function () {
    return '<div class="widget wide" id="scan-widget">' + head('LiDAR scan viewer', '720 beams every 0.5 s, from a sensor at the bow') +
      '<div class="w-body"><div class="controls">' +
      '<button type="button" class="btn primary" data-act="play">Play</button><button type="button" class="btn" data-act="step">One scan</button>' +
      '<div class="ctl-group"><label class="check"><input type="checkbox" data-opt="beams" checked>Beams</label>' +
      '<label class="check"><input type="checkbox" data-opt="gate">Gate against the map</label>' +
      '<label class="check"><input type="checkbox" data-opt="noise">Pose noise</label>' +
      '<label class="check"><input type="checkbox" data-opt="x10" disabled>Exaggerate the noise \u00d710</label>' +
      '<label class="check"><input type="checkbox" data-opt="drop">Beam dropout</label></div></div>' +
      '<div class="scan-canvas"><canvas role="img" aria-label="Top view of the basin, north to the right: the own ship moves along its path, a target crosses, and the LiDAR beams and returns of the latest scan are drawn."></canvas></div>' +
      '<div class="scan-legend ui small"><span><i class="dot" style="background: var(--perception)"></i>panel returns</span><span><i class="dot" style="background: var(--target)"></i>target returns</span><span><i class="dot" style="background: var(--ink-3)"></i>wall returns</span><span><i class="dot hollow"></i>discarded by the gate</span><span>dashed ring: 1 m dead zone</span></div>' +
      '<div class="readout ro-grid">' + ro('ret', 'Beams with a return') + ro('dead', 'Lost in the dead zone') + ro('far', 'No return within 16 m') + ro('drop', 'Dropped') + ro('kept', 'Kept after gating') + ro('tgt', 'Returns on the target') + '</div></div>' +
      '<div class="w-foot"><p>North is to the right. The points are placed on the map with the <em>estimated</em> pose, so with pose noise on they no longer sit exactly on the walls and panels; at the true noise level (0.03 m, 0.2\u00b0) the shift is a few centimeters, which is why the \u00d710 option exists. Beam dropout removes 20 % of the returns at random, an illustrative rate; the rate used for the perception-degradation tests is not given in the source files ' + APP.TBD('dropout rate') + '.</p></div></div>';
  };
  APP.mountScan = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s), offs = [];
    const cv = q('canvas'), ctx = cv.getContext('2d');
    const opt = { beams: true, gate: false, noise: false, x10: false, drop: false };
    let t = 0, playing = false, raf = 0, lastT = 0, scanT = -1, colors = {}, cssW = 0, cssH = 0, dpr = 1, S = null;
    const rnd = P.rng(17);
    const segsAt = tt => { const s = G.polySegs([[0, 0], [10, 0], [10, 25], [0, 25]], 'wall'); WS.panels.forEach(pn => s.push(...G.polySegs(G.squarePts(pn.c, pn.w), 'panel'))); s.push(...G.polySegs(G.hullPts(tsPos(tt), 270), 'target')); return s; };
    function readColors() { ['--land', '--land-2', '--water', '--ink', '--ink-2', '--ink-3', '--vessel', '--vessel-fill', '--perception', '--target', '--target-fill', '--panel', '--panel-fill', '--decision', '--surface'].forEach(k => { colors[k] = APP.css(k); }); }
    const view = () => { const s = cssW / 26.4; return { s, X: (x, y) => (y + 0.7) * s, Y: (x, y) => (x + 0.6) * s }; };
    function resize() {
      cssW = cv.clientWidth || 800; cssH = Math.round(cssW / 26.4 * 11.2); dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); cv.style.height = cssH + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
    }
    function doScan() {
      const pose = osPose(t), beams = P.scan(pose, segsAt(t), { drop: opt.drop ? 0.2 : 0, rnd });
      const est = opt.noise ? P.noisyPose(pose, rnd, opt.x10 ? 10 : 1) : pose;
      const pts = beams.filter(b => b.st === 'ok').map(b => { const qq = P.world(b, est); return { q: qq, tag: b.tag, inNav: P.inNav(qq, WS.nav) }; });
      S = { pose, est, beams, pts, t };
      const c = st => beams.filter(b => b.st === st).length, set = (k, v) => { q('[data-ro="' + k + '"]').textContent = v; };
      set('ret', c('ok') + ' of 720'); set('dead', c('dead')); set('far', c('far')); set('drop', c('drop'));
      set('kept', opt.gate ? pts.filter(p => p.inNav).length + ' (' + pts.filter(p => !p.inNav).length + ' discarded)' : pts.length + ' (gate off)');
      set('tgt', pts.filter(p => p.tag === 'target').length);
    }
    function poly(pts, v, fill, stroke, lw) {
      ctx.beginPath(); pts.forEach((p, i) => { const x = v.X(p[0], p[1]), y = v.Y(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
    }
    function draw() {
      if (!cssW) return;
      const v = view();
      ctx.clearRect(0, 0, cssW, cssH); ctx.fillStyle = colors['--land']; ctx.fillRect(0, 0, cssW, cssH);
      poly([[0, 0], [10, 0], [10, 25], [0, 25]], v, colors['--water'], colors['--land-2'], 2);
      ctx.setLineDash([4, 3]); poly(WS.nav, v, null, colors['--ink-3'], 1); ctx.setLineDash([]);
      WS.panels.forEach(pn => poly(G.squarePts(pn.c, pn.w), v, colors['--panel-fill'], colors['--panel'], 1));
      poly(G.hullPts(tsPos(t), 270), v, colors['--target-fill'], colors['--target'], 1.4);
      const pose = osPose(t);
      poly(G.hullPts([pose.x, pose.y], pose.psi), v, colors['--vessel-fill'], colors['--vessel'], 1.4);
      if (S) {
        const s0 = P.sensor(S.est), sx = v.X(s0[0], s0[1]), sy = v.Y(s0[0], s0[1]);
        if (opt.beams) {
          ctx.lineWidth = 0.6; ctx.strokeStyle = colors['--perception']; ctx.globalAlpha = 0.16; ctx.beginPath();
          S.beams.forEach(b => { if (b.st !== 'ok' && b.st !== 'far') return; const r = b.st === 'ok' ? b.rho : K.Rmax, d = G.hvec(S.est.psi + b.th); const e = [s0[0] + r * d[0], s0[1] + r * d[1]]; ctx.moveTo(sx, sy); ctx.lineTo(v.X(e[0], e[1]), v.Y(e[0], e[1])); });
          ctx.stroke(); ctx.globalAlpha = 1;
        }
        S.pts.forEach(p => {
          const x = v.X(p.q[0], p.q[1]), y = v.Y(p.q[0], p.q[1]);
          if (opt.gate && !p.inNav) { ctx.strokeStyle = colors['--ink-3']; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.stroke(); return; }
          ctx.fillStyle = p.tag === 'target' ? colors['--target'] : p.tag === 'panel' ? colors['--perception'] : colors['--ink-3'];
          ctx.beginPath(); ctx.arc(x, y, p.tag === 'wall' ? 1.5 : 2.2, 0, 7); ctx.fill();
        });
        ctx.setLineDash([3, 3]); ctx.strokeStyle = colors['--ink-2']; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(sx, sy, K.Rmin * v.s, 0, 7); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = colors['--ink']; ctx.beginPath(); ctx.arc(sx, sy, 2.4, 0, 7); ctx.fill();
      }
      ctx.font = '700 12px "Atkinson Hyperlegible", system-ui, sans-serif'; ctx.fillStyle = colors['--ink-2'];
      ctx.fillText('t = ' + t.toFixed(1) + ' s', 8, cssH - 8);
    }
    function loop(now) {
      raf = 0; if (!playing) return;
      const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; t += dt;
      if (t > T_LOOP) { t = 0; scanT = -1; }
      if (Math.floor(t / K.dt) !== Math.floor(scanT / K.dt)) { scanT = t; doScan(); }
      draw(); raf = requestAnimationFrame(loop);
    }
    const playBtn = q('[data-act="play"]');
    const setPlay = p => { playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; if (p) { lastT = performance.now(); if (!raf) raf = requestAnimationFrame(loop); } };
    on(offs, playBtn, 'click', () => setPlay(!playing));
    on(offs, q('[data-act="step"]'), 'click', () => { setPlay(false); t = (Math.floor(t / K.dt) + 1) * K.dt; if (t > T_LOOP) t = 0; scanT = t; doScan(); draw(); });
    root.querySelectorAll('[data-opt]').forEach(el => on(offs, el, 'change', () => {
      opt[el.dataset.opt] = el.checked;
      const x10 = q('[data-opt="x10"]'); x10.disabled = !opt.noise; if (!opt.noise) { x10.checked = false; opt.x10 = false; }
      doScan(); draw();
    }));
    readColors(); resize(); doScan(); draw();
    const ro2 = new ResizeObserver(() => resize()); ro2.observe(cv); offs.push(() => ro2.disconnect());
    offs.push(APP.on('theme', () => { readColors(); draw(); }));
    APP.onCleanup(() => { playing = false; if (raf) cancelAnimationFrame(raf); offs.forEach(f => f()); });
  };

  /* ================= 2. segmentation ================= */
  const rotSq = (c, w, a) => G.squarePts([0, 0], w).map(([x, y]) => { const ca = Math.cos(a * G.DEG), sa = Math.sin(a * G.DEG); return [c[0] + x * ca + y * sa, c[1] - x * sa + y * ca]; });
  const SEG_OBJ = [
    { k: 'P1', name: 'near panel A', pts: G.squarePts([-1.8, 3.5], 1) },
    { k: 'P2', name: 'near panel B', pts: G.squarePts([-1.1, 5.15], 1) },
    { k: 'P3', name: 'far panel', pts: G.squarePts([2.5, 8.2], 1) },
    { k: 'T', name: 'target', pts: G.hullPts([1.25, 9.3], 90), target: true },
    { k: 'P4', name: 'distant angled panel', pts: rotSq([-7.6, 8.6], 1, 30) },
  ];
  const SEG_POSE = { x: 0, y: -K.bow, psi: 0 };
  let SEG_SCAN = null;
  const segScan = () => { if (!SEG_SCAN) { const s = []; SEG_OBJ.forEach(o => s.push(...G.polySegs(o.pts, o.k))); SEG_SCAN = P.scan(SEG_POSE, s); } return SEG_SCAN; };
  APP.segScan = segScan;
  APP.widgetSegHTML = function () {
    const M = APP.M;
    return '<div class="widget wide" id="seg-widget">' + head('Segmentation by adaptive breakpoints', 'change the base distance \u03b5 and watch the clusters') +
      '<div class="w-body"><div class="controls"><div class="ctl-group"><label class="ctl-label" for="seg-e">Base distance ' + M('\\varepsilon') + '</label><input id="seg-e" type="range" min="0.02" max="1" step="0.01" value="0.35"><span class="rangeval" data-ro="e">0.35 m</span></div>' +
      '<div class="ctl-group"><label class="check"><input type="checkbox" data-opt="range" checked>Include the range term ' + M('\\rho_j \\Delta\\theta') + '</label><button type="button" class="btn" data-act="reset">Study setting (0.35 m)</button></div></div>' +
      '<div class="seg-layout"><div class="seg-svg" data-svg="seg"></div><div class="seg-side">' +
      '<div class="readout">' + ro('n', 'Clusters kept (4 or more points)') + ro('thrN', 'Threshold at 4.5 m') + ro('thrF', 'Threshold at 9 m') + ro('thrD', 'Threshold at 11.5 m') + '</div>' +
      '<div class="seg-verdict ui" data-ro="verdict" aria-live="polite"></div></div></div></div>' +
      '<div class="w-foot"><p>One scan of an illustrative scene, sensor at the bottom right, north up. Each color is one cluster; gray rings are pieces with fewer than 4 points, which are discarded. Too small a threshold breaks objects apart (over-segmentation), most visibly on angled faces far away, where neighboring beams land farthest apart; too large a threshold joins a target to the panel it is passing behind (under-segmentation).</p></div></div>';
  };
  APP.mountSeg = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s), offs = [];
    const ee = q('#seg-e'), er = q('[data-opt="range"]');
    const v = FIG.view({ x0: -8.7, x1: 3.6, y0: -0.3, y1: 10.2, s: 42, pad: 12 });
    const PAL = ['var(--decision)', 'var(--perception)', 'var(--testing)', 'var(--vessel)', 'var(--target)', 'var(--ink-2)'];
    function render() {
      const eps = +ee.value, ur = er.checked, sc = segScan(), r = P.segment(sc, eps, ur, 4);
      let s = FIG.svgOpen(v, 'Scan points colored by cluster for the chosen breakpoint distance.');
      s += '<rect x="0" y="0" width="' + f1(v.W) + '" height="' + f1(v.H) + '" rx="8" class="s-water"/>';
      SEG_OBJ.forEach(o => { s += FIG.poly(v, o.pts, o.target ? 's-tgt' : 's-panel', ' fill-opacity=".35" stroke-opacity=".6"'); });
      const sen = P.sensor(SEG_POSE);
      s += FIG.hull(v, [SEG_POSE.x, SEG_POSE.y], 0, 's-own');
      r.small.forEach(c => c.forEach(j => { s += FIG.dot(v, P.world(sc[j], SEG_POSE), 2.6, '', ' style="fill: none; stroke: var(--ink-3)" stroke-width="1"'); }));
      r.kept.forEach((c, i) => { const col = PAL[i % PAL.length]; c.forEach(j => { s += FIG.dot(v, P.world(sc[j], SEG_POSE), 2.6, '', ' style="fill: ' + col + '"'); }); });
      SEG_OBJ.forEach(o => { const c = o.pts.reduce((a, p) => [a[0] + p[0] / o.pts.length, a[1] + p[1] / o.pts.length], [0, 0]); s += FIG.wtext(v, c, o.name, 'lbl-s halo', 'middle', 0, o.k === 'P4' ? -28 : o.k === 'T' ? -16 : o.k === 'P2' ? -22 : 30); });
      s += FIG.dot(v, sen, 3, 's-ink');
      q('[data-svg="seg"]').innerHTML = s + '</svg>';
      const set = (k, t) => { q('[data-ro="' + k + '"]').textContent = t; };
      const thr = rr => eps + (ur ? rr * P.DTHR : 0);
      set('e', eps.toFixed(2) + ' m'); set('n', r.kept.length); set('thrN', fx(thr(4.5), 3) + ' m'); set('thrF', fx(thr(9), 3) + ' m'); set('thrD', fx(thr(11.5), 3) + ' m');
      // verdict per object
      const lines = SEG_OBJ.map(o => {
        const tot = sc.filter(b => b.st === 'ok' && b.tag === o.k).length;
        const keptCl = r.kept.filter(c => c.some(j => sc[j].tag === o.k));
        const merged = keptCl.filter(c => c.some(j => sc[j].tag !== o.k));
        const lost = r.small.reduce((n, c) => n + c.filter(j => sc[j].tag === o.k).length, 0);
        let st, cls;
        if (!keptCl.length) { st = 'lost: every piece under 4 points'; cls = 'bad'; }
        else if (merged.length) { const others = Array.from(new Set(merged.flatMap(c => c.map(j => sc[j].tag)).filter(t => t !== o.k))).map(k => SEG_OBJ.find(x => x.k === k).name); st = 'merged with the ' + others.join(' and '); cls = 'bad'; }
        else if (keptCl.length > 1) { st = 'split into ' + keptCl.length + ' clusters'; cls = 'warn'; }
        else { st = 'one cluster'; cls = 'ok'; }
        if (lost && keptCl.length) st += '; ' + lost + ' of ' + tot + ' points discarded';
        return '<li class="' + cls + '"><b>' + o.name.charAt(0).toUpperCase() + o.name.slice(1) + ':</b> ' + st + '</li>';
      });
      q('[data-ro="verdict"]').innerHTML = '<ul>' + lines.join('') + '</ul>';
    }
    on(offs, ee, 'input', render); on(offs, er, 'change', render);
    on(offs, q('[data-act="reset"]'), 'click', () => { ee.value = 0.35; er.checked = true; render(); });
    render();
    APP.onCleanup(() => offs.forEach(f => f()));
  };

  /* ================= 3. association ================= */
  const TR = [
    { id: 'T1', name: 'T1 \u00b7 target', p: [1.9, 2.9], v: [0.6, 0.12], st: 'confirmed', hits: 6, miss: 0 },
    { id: 'T2', name: 'T2 \u00b7 panel', p: [4.7, 4.4], v: [0, 0], st: 'confirmed', hits: 9, miss: 0 },
    { id: 'T3', name: 'T3 \u00b7 new', p: [2.65, 3.55], v: [0, 0], st: 'tentative', hits: 1, miss: 0 },
  ];
  const CL = [{ id: 'C1', p: [2.27, 3.05] }, { id: 'C2', p: [4.75, 4.43] }, { id: 'C3', p: [5.6, 1.9] }];
  const pred = t => [t.p[0] + 0.5 * t.v[0], t.p[1] + 0.5 * t.v[1]];
  const PAIRS = (() => { const out = []; TR.forEach(t => CL.forEach(c => { const pp = pred(t); out.push({ t: t.id, c: c.id, d: Math.hypot(pp[0] - c.p[0], pp[1] - c.p[1]) }); })); out.sort((a, b) => a.d - b.d); const ut = new Set(), uc = new Set();
    out.forEach(p => { p.inGate = p.d <= P.GATE; if (p.inGate && !ut.has(p.t) && !uc.has(p.c)) { p.acc = true; ut.add(p.t); uc.add(p.c); } else if (p.inGate) p.why = (uc.has(p.c) ? p.c + ' already taken' : p.t + ' already matched'); }); return out; })();
  const STEPS = [
    ['Scan k: three tracks', 'Two confirmed tracks (a target and a panel) and one tentative track that has been seen once.'],
    ['Predict 0.5 s ahead', 'Each track is moved forward with its estimated velocity to where it should be at the next scan.'],
    ['Draw the gates', 'A circle of 0.70 m around each prediction: only clusters inside it may be matched to that track.'],
    ['Scan k+1 delivers clusters', 'Segmentation of the new scan gives three cluster centroids, C1 to C3.'],
    ['Sort all distances', 'Every track\u2013cluster distance is listed, smallest first; pairs beyond the gate are out.'],
    ['Accept the smallest unused pairs', 'Going down the list, a pair is accepted only if neither its track nor its cluster is already used. T3\u2013C1 is inside T3\u2019s gate but C1 is already taken by T1.'],
    ['Update the bookkeeping', 'T1 and T2 score a hit. T3 misses (1 of the 3 allowed in a row). C3 matched nothing, so it starts a new tentative track, T4, confirmed if it is hit again.'],
  ];
  APP.widgetAssocHTML = function () {
    return '<div class="widget wide" id="assoc-widget">' + head('Association over two scans', 'step through one association cycle') +
      '<div class="w-body"><div class="controls"><button type="button" class="btn" data-act="back">Back</button><button type="button" class="btn primary" data-act="next">Next</button><button type="button" class="btn" data-act="play">Play</button><span class="ui small muted" data-ro="step"></span></div>' +
      '<div class="assoc-layout"><div class="assoc-svg" data-svg="assoc"></div><div class="assoc-side"><div class="assoc-step ui" data-ro="text" aria-live="polite"></div><div class="tbl-wrap" data-ro="table"></div></div></div></div>' +
      '<div class="w-foot"><p>Positions are illustrative; the gate (0.70 m), the greedy nearest-neighbor rule, confirmation after 2 hits and deletion after 3 consecutive misses are the study\u2019s.</p></div></div>';
  };
  APP.mountAssoc = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s), offs = [];
    let k = 0, timer = 0;
    const v = FIG.view({ x0: 1.0, x1: 6.3, y0: 1.2, y1: 5.0, s: 72, pad: 10 });
    function render() {
      let s = FIG.svgOpen(v, 'Association step ' + (k + 1) + ': ' + STEPS[k][0]);
      s += '<rect x="0" y="0" width="' + f1(v.W) + '" height="' + f1(v.H) + '" rx="8" class="s-water"/>';
      const col = t => t.st === 'confirmed' ? 'var(--testing)' : 'var(--ink-3)';
      TR.forEach(t => {
        const pp = pred(t), c = col(t);
        if (k <= 1 || k === 6) {
          s += FIG.dot(v, t.p, 6, '', ' style="fill: ' + (t.st === 'confirmed' ? c : 'var(--surface)') + '; stroke: ' + c + '" stroke-width="2"');
          if (Math.hypot(t.v[0], t.v[1]) > 0) s += FIG.arrow(v, t.p, [t.p[0] + 1.2 * t.v[0], t.p[1] + 1.2 * t.v[1]], 's-tst f-tst', 7);
        }
        if (k >= 1) {
          s += FIG.dot(v, pp, 4.5, '', ' style="fill: var(--surface); stroke: ' + c + '" stroke-width="2" stroke-dasharray="2 2"');
          if (k === 1 && Math.hypot(t.v[0], t.v[1]) > 0) s += FIG.line(v, [t.p, pp], '', ' style="stroke: ' + c + '" stroke-dasharray="3 3"');
        }
        if (k >= 2) s += FIG.circle(v, pp, P.GATE, '', ' style="fill: ' + c + '; fill-opacity: .07; stroke: ' + c + '" stroke-dasharray="5 4" stroke-width="1.4"');
        const lp = k >= 1 ? pp : t.p;
        s += FIG.wtext(v, lp, t.name, 'lbl-b halo', 'middle', 0, t.id === 'T3' ? -14 : t.id === 'T1' ? 22 : -14);
      });
      if (k >= 3) CL.forEach(c => {
        const used = k >= 5 && PAIRS.some(p => p.acc && p.c === c.id);
        s += '<rect x="' + f1(v.X(c.p[0], c.p[1]) - 5) + '" y="' + f1(v.Y(c.p[0], c.p[1]) - 5) + '" width="10" height="10" style="fill: var(--perception); stroke: var(--surface)" stroke-width="1.5"' + (k >= 5 && !used ? ' opacity=".9"' : '') + '/>';
        s += FIG.wtext(v, c.p, c.id, 'lbl-s halo', 'start', 9, 14);
      });
      if (k >= 5) PAIRS.filter(p => p.acc).forEach(p => { const t = TR.find(x => x.id === p.t), c = CL.find(x => x.id === p.c); s += FIG.line(v, [pred(t), c.p], '', ' style="stroke: var(--decision)" stroke-width="2.5"'); });
      if (k === 6) {
        const c3 = CL[2];
        s += FIG.circle(v, c3.p, 0.22, '', ' style="fill: none; stroke: var(--ink-3)" stroke-width="2"') + FIG.wtext(v, c3.p, 'T4 \u00b7 new, tentative', 'lbl-b halo', 'middle', 0, -16);
      }
      s += FIG.scale(v, v.W - 92, v.H - 12, 1);
      q('[data-svg="assoc"]').innerHTML = s + '</svg>';
      q('[data-ro="step"]').textContent = 'Step ' + (k + 1) + ' of ' + STEPS.length;
      q('[data-ro="text"]').innerHTML = '<b>' + STEPS[k][0] + '.</b> ' + STEPS[k][1];
      let tb = '';
      if (k >= 4) {
        tb = '<table class="cmp assoc-tab"><thead><tr><th>Pair</th><th>Distance</th><th>' + (k >= 5 ? 'Result' : 'In gate?') + '</th></tr></thead><tbody>' +
          PAIRS.filter(p => p.d < 2.4).map(p => '<tr class="' + (k >= 5 ? (p.acc ? 'acc' : p.inGate ? 'rej' : 'out') : (p.inGate ? '' : 'out')) + '"><td>' + p.t + '\u2013' + p.c + '</td><td>' + p.d.toFixed(2) + ' m</td><td>' +
            (k >= 5 ? (p.acc ? 'accepted' : p.inGate ? 'skipped: ' + p.why : 'beyond 0.70 m') : (p.inGate ? 'yes' : 'no')) + '</td></tr>').join('') + '</tbody></table>';
      }
      if (k === 6) tb += '<table class="cmp assoc-tab"><thead><tr><th>Track</th><th>Hits</th><th>Misses in a row</th><th>Status</th></tr></thead><tbody>' +
        '<tr><td>T1</td><td>7</td><td>0</td><td>confirmed</td></tr><tr><td>T2</td><td>10</td><td>0</td><td>confirmed</td></tr><tr><td>T3</td><td>1</td><td>1</td><td>tentative; dropped at 3</td></tr><tr><td>T4</td><td>1</td><td>0</td><td>tentative; confirmed at 2</td></tr></tbody></table>';
      q('[data-ro="table"]').innerHTML = tb;
      q('[data-act="back"]').disabled = k === 0; q('[data-act="next"]').disabled = k === STEPS.length - 1;
    }
    const stop = () => { if (timer) { clearInterval(timer); timer = 0; } q('[data-act="play"]').textContent = 'Play'; };
    on(offs, q('[data-act="next"]'), 'click', () => { stop(); if (k < STEPS.length - 1) { k++; render(); } });
    on(offs, q('[data-act="back"]'), 'click', () => { stop(); if (k > 0) { k--; render(); } });
    on(offs, q('[data-act="play"]'), 'click', () => {
      if (timer) { stop(); return; }
      if (k === STEPS.length - 1) { k = 0; render(); }
      q('[data-act="play"]').textContent = 'Pause';
      timer = setInterval(() => { if (k < STEPS.length - 1) { k++; render(); } else stop(); }, 1800);
    });
    render();
    APP.onCleanup(() => { stop(); offs.forEach(f => f()); });
  };
})();

</script>
<script>
/* ====== MODULE: w6b.js ====== */
/* ===================================================================
   SECTION 6 WIDGETS (2/2) — Kalman filter, visible face, free space,
   sector pooling
   =================================================================== */
(function () {
  'use strict';
  const G = window.GEOM, K = G.K, P = window.PERC, { f1, fx, ro, txt, head, on } = APP.W6;

  /* ================= 4. Kalman filter ================= */
  const KF_N = 50, KF_DT = 0.5;
  function kfTruth(change) {
    const out = []; let x = 0.8; const U = t => !change ? 0.40 : t <= 10 ? 0.40 : t >= 12 ? 0.70 : 0.40 + 0.15 * (t - 10);
    for (let k = 0; k <= KF_N; k++) { const t = k * KF_DT; if (k) x += KF_DT * (U(t - KF_DT) + U(t)) / 2; out.push({ t, x, y: 12.0, U: U(t) }); }
    return out;
  }
  function kfRun(truth, noise, sa, sz) {
    let fx_ = null, fy_ = null; const out = [];
    truth.forEach((tr, k) => {
      const z = [tr.x + sz * noise[k][0], tr.y + sz * noise[k][1]];
      let prior = null;
      if (!k) { fx_ = P.kf1.init(z[0], sz); fy_ = P.kf1.init(z[1], sz); }
      else { const px = P.kf1.predict(fx_, KF_DT, sa), py = P.kf1.predict(fy_, KF_DT, sa); prior = { x: px.p, y: py.p, s: Math.sqrt(px.P11) }; fx_ = P.kf1.update(px, z[0], sz); fy_ = P.kf1.update(py, z[1], sz); }
      const U = Math.hypot(fx_.v, fy_.v), sU = U > 1e-6 ? Math.sqrt((fx_.v * fx_.v * fx_.P22 + fy_.v * fy_.v * fy_.P22)) / U : Math.sqrt(fx_.P22);
      out.push({ z, x: fx_.p, y: fy_.p, vx: fx_.v, vy: fy_.v, sx: Math.sqrt(fx_.P11), sv: Math.sqrt(fx_.P22), U, sU, chi: G.bearing(fx_.v, fy_.v), K1: fx_.K1, K2: fx_.K2, prior });
    });
    return out;
  }
  APP.widgetKfHTML = function () {
    const M = APP.M;
    return '<div class="widget wide" id="kf-widget">' + head('Kalman filter on a crossing target', 'noisy centroids in, position and velocity out') +
      '<div class="w-body"><div class="controls">' +
      '<button type="button" class="btn primary" data-act="play">Play</button><button type="button" class="btn" data-act="reset">Restart</button><button type="button" class="btn" data-act="noise">New noise</button>' +
      '<div class="ctl-group"><label class="ctl-label" for="kf-a">Process noise ' + M('\\sigma_a') + '</label><input id="kf-a" type="range" min="-2" max="0" step="0.05" value="-1"><span class="rangeval" data-ro="a">0.10</span></div>' +
      '<div class="ctl-group"><label class="ctl-label" for="kf-z">Measurement noise ' + M('\\sigma_z') + '</label><input id="kf-z" type="range" min="0.01" max="0.3" step="0.01" value="0.05"><span class="rangeval" data-ro="z">0.05 m</span></div>' +
      '<div class="ctl-group"><label class="check"><input type="checkbox" data-opt="change">Target speeds up at 10 s</label><label class="check"><input type="checkbox" data-opt="mag" checked>Draw circles 5\u00d7 larger</label></div></div>' +
      '<div class="kf-svg" data-svg="map"></div><div class="kf-svg" data-svg="speed"></div>' +
      '<div class="readout ro-grid">' + ro('t', 'Time') + ro('U', 'Speed: true / estimated') + ro('chi', 'Course estimate (true 090\u00b0)') + ro('sv', 'Velocity uncertainty ' + M('\\sigma_v')) + ro('k1', 'Position gain') + ro('k2', 'Velocity gain') + '</div></div>' +
      '<div class="w-foot"><p>Dots are measured centroids; the line is the estimate. The light circle is the prediction\u2019s 2\u03c3 uncertainty before a measurement arrives, the dark one after it. In the speed plot the band is \u00b12\u03c3. Defaults are the study\u2019s settings (' + M('\\sigma_a = 0.10\\ \\mathrm{m/s^2}') + ', ' + M('\\sigma_z = 0.05\\ \\mathrm{m}') + ', starting velocity variance 0.5 (m/s)\u00b2); the first measurement sets the starting position with variance ' + M('\\sigma_z^2') + ', a choice made for this widget. The target\u2019s path is illustrative.</p></div></div>';
  };
  APP.mountKf = function (root) {
    if (!root) return;
    const q = s => root.querySelector(s), offs = [];
    const ea = q('#kf-a'), ez = q('#kf-z'), ec = q('[data-opt="change"]'), em = q('[data-opt="mag"]');
    let seed = 5, noise = [], k = KF_N, timer = 0;
    const mkNoise = () => { const r = P.rng(seed); noise = Array.from({ length: KF_N + 1 }, () => [P.gauss(r), P.gauss(r)]); };
    mkNoise();
    const vm = FIG.view({ x0: 0, x1: 15.6, y0: 11.0, y1: 13.0, s: 42, pad: 12 });
    function render() {
      const sa = Math.pow(10, +ea.value), sz = +ez.value, truth = kfTruth(ec.checked), est = kfRun(truth, noise, sa, sz), mag = em.checked ? 5 : 1;
      q('[data-ro="a"]').textContent = sa.toFixed(sa < 0.1 ? 3 : 2); q('[data-ro="z"]').textContent = sz.toFixed(2) + ' m';
      // map
      let s = FIG.svgOpen(vm, 'Map strip: measured centroids, the estimate and its uncertainty circles.');
      s += '<rect x="0" y="0" width="' + f1(vm.W) + '" height="' + f1(vm.H) + '" rx="8" class="s-water"/>';
      s += FIG.line(vm, [[truth[0].x, 12], [truth[KF_N].x, 12]], '', ' style="stroke: var(--ink-3)" stroke-dasharray="5 4"');
      for (let i = 0; i <= k; i++) s += FIG.dot(vm, est[i].z, 2.4, '', ' style="fill: var(--perception)" fill-opacity="' + (i === k ? 1 : 0.55) + '"');
      s += FIG.line(vm, est.slice(0, k + 1).map(e => [e.x, e.y]), '', ' style="stroke: var(--decision)" stroke-width="2"');
      const e = est[k];
      if (e.prior) s += FIG.circle(vm, [e.prior.x, e.prior.y], Math.min(1.2, 2 * e.prior.s * mag), '', ' style="fill: var(--decision); fill-opacity: .08; stroke: var(--decision)" stroke-dasharray="3 3"');
      s += FIG.circle(vm, [e.x, e.y], Math.min(1.2, 2 * e.sx * mag), '', ' style="fill: var(--decision); fill-opacity: .25; stroke: var(--decision)" stroke-width="1.5"');

      D.beams.forEach(b => { const h = G.hvec(b.th); s += FIG.dot(v, [b.rho * h[0], b.rho * h[1]], 1.8, 'f-per'); });
      // safe-width bar under the gap
      s += '<rect x="' + f1(v.X(D.c - P.WS / 2, 3.72)) + '" y="' + f1(v.Y(0, 3.72) - 3) + '" width="' + f1(P.WS * v.s) + '" height="6" rx="2" style="fill: var(--vessel)"/>' + FIG.wtext(v, [D.c - P.WS / 2, 3.72], 'w\u209b = 0.80 m', 'lbl-s halo', 'end', -6, 4);

      lines.forEach(([nm, r, col, dash], i) => {
        s += FIG.line(v, arc(r, -11.25, 11.25), '', ' style="stroke: ' + col + '" stroke-width="' + (dash ? 2 : 3.2) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : ''));
        const h = G.hvec(11.25); s += FIG.wtext(v, [r * h[0], r * h[1]], nm, 'lbl-b halo', 'start', 6, 4 + (i === 1 && Math.abs(pl.min - pl.feas) < 0.6 ? 14 : 0) - (i === 0 && Math.abs(pl.max - pl.feas) < 0.6 ? 14 : 0), ' style="fill: ' + col + '"');

      s += FIG.dot(v, [0, 0], 3.2, 's-ink');

      q('[data-ro="g"]').textContent = gap.toFixed(2) + ' m';
      q('[data-ro="tab"]').innerHTML = lines.map(([nm, r]) => '<tr><td>' + nm.charAt(0).toUpperCase() + nm.slice(1) + '</td><td>' + r.toFixed(2) + ' m</td><td>' + P.closeness(r).toFixed(2) + '</td></tr>').join('');
      const det = pl.detail;
      q('[data-ro="levels"]').innerHTML = det.level < K.Rmax ? 'Feasibility pooling stops at ' + det.level.toFixed(2) + ' m: going outward through the returns\u2019 ranges, this is the first level at which the widest opening left, ' + det.opening.toFixed(2) + ' m, is no wider than 0.80 m.' : 'Feasibility pooling finds an opening wider than 0.80 m at every level, so it reports the farthest range.';
      const passable = pl.feas > 6;
      let vt = passable ? '<p><b>The gap is wide enough for the vessel</b>, so the honest answer is \u201copen as far as the wall\u201d. Feasibility pooling gives that, and max pooling happens to agree.' : '<p><b>The gap is narrower than the vessel needs</b>, so the honest answer is \u201cblocked at the panels\u201d. Feasibility pooling gives that, and so does min pooling; max pooling sees one long beam through the gap and wrongly reports the sector open to the wall.';

      vt += ' Feasibility pooling asks the question the policy needs answered: how far could the vessel actually go in this direction?</p>';
      q('[data-ro="verdict"]').innerHTML = vt;
    }
    on(offs, eg, 'input', render); on(offs, ep, 'change', render);
    render();
    APP.onCleanup(() => offs.forEach(f => f()));
  };
})();

(function () {

    const w = 660, h = 300;

    const v = FIG.view({ x0: -1.2, x1: 7.6, y0: -0.4, y1: 5.6, s: 40, pad: 10 });

<script>

(function () {
  'use strict';
  const { M, MD, T, AB, C, Cn, FIGN, H2, EQ, VERIFY, XS } = APP;

    n: 6, id: 's6', title: 'LiDAR perception', short: 'LiDAR perception', subsystem: 'perception',

    build() {

      let ss = P.kf1.init(0, P.SIGZ); const pr1 = P.kf1.predict(ss, 0.5, P.SIGA), up1 = P.kf1.update(pr1, 0, P.SIGZ);

      return '' +
        H2('pipeline', 'From laser returns to objects') +
        '<p>Imagine walking through a dark room with a torch that only tells you how far away each thing is, in 720 directions at once, twice a second. You would still have to work out which dots belong together, which belong to the walls you already know, and which ones are moving. That is the vessel\u2019s situation: its only view of the world is its own ' + T('lidar', 'LiDAR') + ', and everything it knows about the other vessel has to be built from range measurements.</p>' +
        '<p>Getting this right matters as much as the policy itself. The target\u2019s position, course and speed must be estimated before risk and encounter class can be assessed, and field studies of maritime tracking show that tracking quality depends strongly on the environment ' + C('helgesen2022') + '. Paper 2 used the LiDAR only for static obstacles ' + C('tran2026') + '; Paper 3 adds a full tracking pipeline. Its six steps run once per ' + T('scan') + ', every 0.5 s, and each is given below with its governing equation.</p>' +

        EQ({ label: 'Model', title: 'One scan', tex: '\\theta_j = j\\,\\Delta\\theta, \\quad j = 0, 1, \\dots, 719, \\qquad \\text{return } \\rho_j \\text{ kept only if } R_{\\min} \\le \\rho_j \\le R_{\\max}',
          words: 'beam j points j half-degrees clockwise from the bow and reports the distance to the first surface it meets, if that is between 1 and 16 m.',

            { k: 'dtheta', tex: '\\Delta\\theta', m: 'angle between neighboring beams', u: '\u00b0', v: '0.5 (0.00873 rad)', g: gS },
